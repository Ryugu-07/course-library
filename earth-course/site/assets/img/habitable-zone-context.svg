<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">宜居带只是边界条件的一部分</title><desc id="svg-desc">空间与过程示意把相对轨道照度、教学宜居带和大气/反馈条件链分开；轨道几何与带宽非按比例，宜居带本身不是表面状态观测或未来预测。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">宜居带只是边界条件的一部分</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">27 · 空间结构 | Habitable-zone context</text><rect x="38" y="82" width="610" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">轨道照度的教学背景</text><text x="630" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">相对几何 / not a scale model</text><circle cx="208" cy="292" r="42" fill="#f6d47a" stroke="#c58b20" stroke-width="2"></circle><circle cx="208" cy="292" r="18" fill="#f4b83f" stroke="#c58b20" stroke-width="1"></circle><text x="208" y="298" font-size="13" font-weight="800" text-anchor="middle" fill="#17324d">恒星</text><ellipse cx="208" cy="292" rx="112" ry="74" fill="none" stroke="#e3c36c" stroke-width="2"></ellipse><ellipse cx="208" cy="292" rx="182" ry="121" fill="none" stroke="#2784b8" stroke-width="2"></ellipse><ellipse cx="208" cy="292" rx="258" ry="172" fill="none" stroke="#c8a27a" stroke-width="2"></ellipse><path d="M 322 226 A 182 121 0 0 1 322 358" fill="none" stroke="#bfe2f2" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"></path><text x="348" y="184" font-size="14" font-weight="800" text-anchor="start" fill="#2784b8">教学宜居带</text><text x="348" y="204" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">仅表示一段照度条件</text><circle cx="290" cy="239" r="11" fill="#d65a4a" stroke="#ffffff" stroke-width="2"></circle><text x="306" y="244" font-size="12" font-weight="800" text-anchor="start" fill="#d65a4a">金星</text><circle cx="390" cy="292" r="11" fill="#4d8a63" stroke="#ffffff" stroke-width="2"></circle><text x="406" y="297" font-size="12" font-weight="800" text-anchor="start" fill="#4d8a63">地球</text><circle cx="466" cy="292" r="11" fill="#c8a27a" stroke="#ffffff" stroke-width="2"></circle><text x="482" y="297" font-size="12" font-weight="800" text-anchor="start" fill="#c8a27a">火星</text><line x1="88" y1="454" x2="314" y2="454" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><text x="88" y="438" font-size="12" font-weight="750" text-anchor="start" fill="#c58b20">相对照度</text><text x="314" y="471" font-size="16" font-weight="800" text-anchor="end" fill="#17324d">S ∝ d⁻²</text><text x="60" y="491" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">轨道线、带宽与行星点位是概念布局，距离和大小非按比例。</text><text x="360" y="503" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><line x1="398" y1="498" x2="426" y2="498" stroke="#c8a27a" stroke-width="4"></line><text x="436" y="501" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">轨道</text><line x1="480" y1="498" x2="508" y2="498" stroke="#2784b8" stroke-width="4"></line><text x="518" y="501" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">照度带</text><rect x="565" y="488" width="28" height="14" rx="3" fill="#4d8a63" stroke="none" stroke-width="1"></rect><text x="603" y="501" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">行星点</text><rect x="678" y="82" width="324" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="696" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">从照度到表面状态</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">条件链</text><rect x="708" y="132" width="264" height="62" rx="8" fill="#fff9e6" stroke="#c58b20" stroke-width="1"></rect><text x="840.0" y="158.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="840.0" dy="0">轨道边界</tspan><tspan x="840.0" dy="19">入射能量 / 反照率</tspan></text><line x1="840" y1="200" x2="840" y2="226" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><rect x="708" y="236" width="264" height="62" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="840.0" y="262.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="840.0" dy="0">大气边界</tspan><tspan x="840.0" dy="19">组成 / 云 / 光谱</tspan></text><line x1="840" y1="304" x2="840" y2="330" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="708" y="340" width="264" height="62" rx="8" fill="#eef6ed" stroke="#4d8a63" stroke-width="1"></rect><text x="840.0" y="366.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="840.0" dy="0">历史与反馈</tspan><tspan x="840.0" dy="19">水、碳、热惯性</tspan></text><text x="708" y="444" font-size="14" font-weight="800" text-anchor="start" fill="#b54238">同一宜居带 ≠ 同一表面温度</text><text x="708" y="470" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">需要观测/模型共同约束表面状态。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">轨道示意不是天体历表；宜居带与条件链用于拆分机制，不是宜居性判定或行星气候预报。</text></svg>
