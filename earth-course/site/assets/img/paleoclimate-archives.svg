chor="start" fill="#17324d">冰芯</text><text x="782" y="146" font-size="11.5" font-weight="500" text-anchor="start" fill="#17324d">气泡 / δ¹⁸O</text><text x="696" y="166" font-size="10.5" font-weight="500" text-anchor="start" fill="#5f7182">时间分辨率：季节–千年</text><rect x="656" y="191" width="322" height="53" rx="7" fill="#edf7ed" stroke="#4d8a63" stroke-width="1"></rect><rect x="670" y="203" width="12" height="29" rx="3" fill="#4d8a63" stroke="#4d8a63" stroke-width="1"></rect><text x="696" y="213" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">树轮</text><text x="782" y="213" font-size="11.5" font-weight="500" text-anchor="start" fill="#17324d">宽度 / 密度</text><text x="696" y="233" font-size="10.5" font-weight="500" text-anchor="start" fill="#5f7182">时间分辨率：年际–世纪</text><rect x="656" y="258" width="322" height="53" rx="7" fill="#fff0ec" stroke="#d65a4a" stroke-width="1"></rect><rect x="670" y="270" width="12" height="29" rx="3" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></rect><text x="696" y="280" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">珊瑚</text><text x="782" y="280" font-size="11.5" font-weight="500" text-anchor="start" fill="#17324d">同位素 / 密度</text><text x="696" y="300" font-size="10.5" font-weight="500" text-anchor="start" fill="#5f7182">时间分辨率：季节–世纪</text><rect x="656" y="325" width="322" height="53" rx="7" fill="#f7f0e9" stroke="#c8a27a" stroke-width="1"></rect><rect x="670" y="337" width="12" height="29" rx="3" fill="#c8a27a" stroke="#c8a27a" stroke-width="1"></rect><text x="696" y="347" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">沉积物</text><text x="782" y="347" font-size="11.5" font-weight="500" text-anchor="start" fill="#17324d">花粉 / 微化石</text><text x="696" y="367" font-size="10.5" font-weight="500" text-anchor="start" fill="#5f7182">时间分辨率：年–百万年</text><text x="656" y="414" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">证据边界</text><text x="656" y="438" font-size="14" font-wei