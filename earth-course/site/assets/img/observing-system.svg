</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">同一地球变量有不同观测支持尺度</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">21 · 空间结构 | Observing system</text><rect x="38" y="82" width="610" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">现场、卫星与再分析的空间拼接</text><text x="630" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">coverage is not identity</text><rect x="58" y="122" width="570" height="286" rx="7" fill="#bfe2f2" stroke="#a9bac8" stroke-width="1"></rect><line x1="153.0" y1="122" x2="153.0" y2="408" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="248.0" y1="122" x2="248.0" y2="408" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="343.0" y1="122" x2="343.0" y2="408" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="438.0" y1="122" x2="438.0" y2="408" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="533.0" y1="122" x2="533.0" y2="408" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="58" y1="360.33333333333337" x2="628" y2="360.33333333333337" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="58" y1="312.66666666666663" x2="628" y2="312.66666666666663" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="58" y1="265.0" x2="628" y2="265.0" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="58" y1="217.33333333333331" x2="628" y2="217.33333333333331" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="58" y1="169.66666666666666" x2="628" y2="169.66666666666666" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><polygon points="77.0,153.8 113.4,153.8 145.1,172.8 176.8,182.4 211.6,223.7 187.8,241.2 15