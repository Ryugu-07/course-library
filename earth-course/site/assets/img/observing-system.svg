="start" fill="#17324d">塔</text><circle cx="487" cy="246" r="8" fill="#4d8a63" stroke="#ffffff" stroke-width="2"></circle><text x="499" y="250" font-size="11" font-weight="750" text-anchor="start" fill="#17324d">浮标</text><circle cx="531" cy="344" r="8" fill="#2679a8" stroke="#ffffff" stroke-width="2"></circle><text x="543" y="348" font-size="11" font-weight="750" text-anchor="start" fill="#17324d">船</text><line x1="155" y1="226" x2="264" y2="281" stroke="#4d8a63" stroke-width="2"></line><line x1="264" y1="281" x2="487" y2="246" stroke="#4d8a63" stroke-width="2"></line><line x1="487" y1="246" x2="531" y2="344" stroke="#2679a8" stroke-width="2"></line><path d="M 210 388 C 320 410, 444 401, 555 378" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"></path><text x="250" y="399" font-size="11" font-weight="750" text-anchor="start" fill="#c58b20">插值 / 同化后的连续场</text><text x="62" y="430" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">地面点、卫星像元、轨道瞬时值与再分析网格不能直接当作同一种观测。</text><text x="62" y="466" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">支持尺度</text><line x1="94" y1="484" x2="572" y2="484" stroke="#a9bac8" stroke-width="2"></line><circle cx="94.0" cy="484" r="7" fill="#4d8a63" stroke="#ffffff" stroke-width="2"></circle><text x="94.0" y="509" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">点</text><line x1="105.0" y1="484" x2="242.33333333333334" y2="484" stroke="#4d8a63" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="253.33333333333334" cy="484" r="7" fill="#2679a8" stroke="#ffffff" stroke-width="2"></circle><text x="253.33333333333334" y="509" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">剖面</text><line x1="264.33333333333337" y1="484" x2="401.6666666666667" y2="484" stroke="#2679a8" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="412.6666666666667" cy="484" r="7" fill="#7666a8" stroke="#ffffff" stroke-width="2"></circle><text x="412.6666666666667" y="509" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">像元</text><line x1="423.6666666666667" y1="484" x2="561.0" y2="484" stroke="#7666a8" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="572.0" cy="484" r="7" fill="#c58b20" stroke="#ffffff" stroke-width="2"></circle><text x="572.0" y="509" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">网格</text><rect x="674" y="82" width="328" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="692" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">证据身份与覆盖</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">scale + coverage</text><rect x="698" y="126" width="280" height="60" rx="7" fill="#edf7ed" stroke="#4d8a63" stroke-width="1"></rect><rect x="712" y="139" width="12" height="34" rx="3" fill="#4d8a63" stroke="#4d8a63" stroke-width="1"></rect><text x="738" y="149" font-size="13.5" font-weight="800" text-anchor="start" fill="#17324d">现场站</text><text x="834" y="149" font-size="11" font-weight="500" text-anchor="start" fill="#17324d">点 / 剖面</text><text x="738" y="170" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">直接采样</text><rect x="698" y="202" width="280" height="60" rx="7" fill="#f1eff8" stroke="#7666a8" stroke-width="1"></rect><rect x="712" y="215" width="12" height="34" rx="3" fill="#7666a8" stroke="#7666a8" stroke-width="1"></rect><text x="738" y="225" font-size="13.5" font-weight="800" text-anchor="start" fill="#17324d">卫星</text><text x="834" y="225" font-size="11" font-weight="500" text-anchor="start" fill="#17324d">像元 / 条带</text><text x="738" y="246" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">辐亮度 → 反演</text><rect x="698" y="278" width="280" height="60" rx="7" fill="#faf5e6" stroke="#c58b20" stroke-width="1"></rect><rect x="712" y="291" width="12" height="34" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="738" y="301" font-size="13.5" font-weight="800" text-anchor="start" fill="#17324d">再分析</text><text x="834" y="301" font-size="11" font-weight="500" text-anchor="start" fill="#17324d">网格 / 连续</text><text x="738" y="322" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">模型 + 同化</text><text x="698" y="370" font-size="14" font-weight="800" text-anchor="start" fill="#d65a4a">覆盖率接近完整 ≠ 没有模型依赖</text><text x="698" y="398" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">缺测、代表性误差、定标偏差要分别记录。</text><rect x="752" y="438" width="226" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="766" y="458" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="766" y1="476" x2="794" y2="476" stroke="#4d8a63" stroke-width="4"></line><text x="804" y="479" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">直接观测</text><line x1="766" y1="495" x2="794" y2="495" stroke="#7666a8" stroke-width="4" stroke-dasharray="7 5"></line><text x="804" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">反演产品</text><line x1="766" y1="514" x2="794" y2="514" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="804" y="517" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">再分析 / 同化</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 21A：颜色区分证据链角色；支持尺度由观测足迹和处理窗口决定，不由图像清晰度决定。</text></svg>
