<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">板块带是危险性背景，不是风险预报</title><desc id="svg-desc">示意地图以简化板块活动带说明物理 hazard 的空间背景，并在旁边分开 exposure 与 vulnerability；地图投影、带宽、点位和距离均非按比例，也不构成风险或事件预报。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">板块带是危险性背景，不是风险预报</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">24 · 空间结构 | Hazard belts</text><rect x="38" y="82" width="622" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">全球板块带教学投影</text><text x="642" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">示意地图 / not navigation</text><rect x="56" y="116" width="586" height="346" rx="7" fill="#bfe2f2" stroke="#a9bac8" stroke-width="1"></rect><line x1="153.66666666666666" y1="116" x2="153.66666666666666" y2="462" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="251.33333333333331" y1="116" x2="251.33333333333331" y2="462" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="349.0" y1="116" x2="349.0" y2="462" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="446.66666666666663" y1="116" x2="446.66666666666663" y2="462" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="544.3333333333334" y1="116" x2="544.3333333333334" y2="462" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="56" y1="404.33333333333337" x2="642" y2="404.33333333333337" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="56" y1="346.66666666666663" x2="642" y2="346.66666666666663" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="56" y1="289.0" x2="642" y2="289.0" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="56" y1="231.33333333333331" x2="642" y2="231.33333333333331" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="56" y1="173.66666666666666" x2="642" y2="173.66666666666666" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><polygon points="75.5,154.4 113.0,154.4 145.5,177.5 178.1,189.0 213.9,239.0 189.5,260.2 156.9,242.9 137.4,202.5 88.6,181.4" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="215.5,265.9 241.6,273.6 270.9,304.4 262.7,342.8 238.3,394.7 222.0,358.2" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="329.5,150.6 417.4,150.6 489.0,167.9 563.9,192.9 609.4,177.5 635.5,208.3 586.7,273.6 529.7,281.3 476.0,250.6 422.2,223.6 388.1,229.4 360.4,208.3 332.7,219.8 309.9,179.4" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="319.7,221.7 368.5,217.9 417.4,265.9 401.1,356.3 371.8,356.3 342.5,279.4" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="531.3,310.1 599.7,312.1 593.2,365.9 537.8,356.3" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="264.4,131.4 313.2,139.1 300.2,171.7 270.9,173.7" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="423.9,314.0 432.0,319.8 428.8,337.1 420.6,331.3" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><text x="68" y="138" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">简化的活动带</text><polyline points="72.3,189.0 104.8,254.4 134.1,331.3 166.7,389.0 222.0,394.7 231.8,327.4 218.8,273.6 189.5,227.5" fill="none" stroke="#d65a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="292.0,164.1 303.4,231.3 316.4,298.6 324.6,362.0 332.7,413.9" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 5"></polyline><polyline points="332.7,221.7 394.6,216.0 462.9,221.7 519.9,227.5 576.9,221.7" fill="none" stroke="#c58b20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 5"></polyline><circle cx="104.83333333333333" cy="212.11111111111111" r="6" fill="#ffffff" stroke="#d65a4a" stroke-width="3"></circle><circle cx="156.92222222222222" cy="346.66666666666663" r="6" fill="#ffffff" stroke="#d65a4a" stroke-width="3"></circle><circle cx="580.1444444444445" cy="219.8" r="6" fill="#ffffff" stroke="#d65a4a" stroke-width="3"></circle><circle cx="397.83333333333337" cy="219.8" r="6" fill="#ffffff" stroke="#c58b20" stroke-width="3"></circle><circle cx="349.0" cy="346.66666666666663" r="6" fill="#ffffff" stroke="#2784b8" stroke-width="3"></circle><text x="86" y="482" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">简化板块带、震源/火山点位；大陆形状、带宽和距离非等比例。</text><text x="74" y="505" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><line x1="110" y1="500" x2="138" y2="500" stroke="#d65a4a" stroke-width="4"></line><text x="148" y="503" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">活动带</text><line x1="245" y1="500" x2="273" y2="500" stroke="#2784b8" stroke-width="4" stroke-dasharray="7 5"></line><text x="283" y="503" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">扩张带</text><line x1="365" y1="500" x2="393" y2="500" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="403" y="503" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">其他带</text><rect x="692" y="82" width="310" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="710" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">风险边界三本账</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">地图只画 hazard</text><rect x="716" y="134" width="262" height="68" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="847.0" y="163.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="847.0" dy="0">① Hazard</tspan><tspan x="847.0" dy="19">源区、传播、强度与频率</tspan></text><line x1="847" y1="207" x2="847" y2="232" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><rect x="716" y="240" width="262" height="68" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="847.0" y="269.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="847.0" dy="0">② Exposure</tspan><tspan x="847.0" dy="19">人口、建筑、港口、道路</tspan></text><line x1="847" y1="313" x2="847" y2="338" stroke="#7666a8" stroke-width="3" marker-end="url(#arrow-violet)"></line><rect x="716" y="346" width="262" height="68" rx="8" fill="#eef6ed" stroke="#4d8a63" stroke-width="1"></rect><text x="847.0" y="374.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="847.0" dy="0">③ Vulnerability</tspan><tspan x="847.0" dy="19">结构、预警、撤离与资源</tspan></text><text x="716" y="454" font-size="17" font-weight="800" text-anchor="start" fill="#17324d">R_toy = H × E × V</text><text x="716" y="478" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">同一危险带 ≠ 同一风险；不画发生日期。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">地图为示意性等距圆柱投影，不用于导航、选址或地震/火山发生预报；颜色表示物理活动带，不表示损失等级。</text></svg>
