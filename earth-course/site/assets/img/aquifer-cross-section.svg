troke-linejoin="round" marker-end="url(#arrow-forest)"></path><text x="874" y="248" font-size="11" font-weight="750" text-anchor="start" fill="#4d8a63">基流 / discharge</text><line x1="770" y1="187" x2="770" y2="343" stroke="#17324d" stroke-width="3"></line><path d="M 690 259 C 720 285, 746 298, 770 304 C 794 298, 822 284, 850 257" fill="none" stroke="#d65a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"></path><text x="770" y="180" font-size="11" font-weight="700" text-anchor="middle" fill="#17324d">井 / well</text><line x1="770" y1="338" x2="770" y2="292" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><text x="792" y="312" font-size="11" font-weight="750" text-anchor="start" fill="#d65a4a">抽水 W</text><text x="56" y="489" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">剖面、层厚、井影响范围与流线为示意；不用于井位或可采量设计。</text><rect x="38" y="526" width="964" height="44" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="556" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">水量账本</text><text x="210" y="555" font-size="17" font-weight="800" text-anchor="start" fill="#17324d">ΔS = G − W</text><text x="463" y="555" font-size="15" font-weight="750" text-anchor="start" fill="#5f7182">P = R + ET + G</text><text x="740" y="555" font-size="15" font-weight="750" text-anchor="start" fill="#5f7182">τ ≈ S/G</text><rect x="812" y="120" width="158" height="103" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="826" y="142" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="826" y1="164" x2="854" y2="164" stroke="#2784b8" stroke-width="4"></line><text x="864" y="167" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">补给</text><line x1="826" y1="187" x2="854" y2="187" stroke="#2679a8" stroke-width="4"></line><text x="864" y="190" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">流向</text><line x1="826" y1="210" x2="854" y2="210" stroke="#d65a4a" stroke-width="4"></line><text x="864" y="213" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">抽水</text></svg>
