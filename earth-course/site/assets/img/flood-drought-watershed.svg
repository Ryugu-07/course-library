<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">干旱记忆如何放大流域洪水级联</title><desc id="svg-desc">流域示意展示土壤储量低、集中降雨、径流路由和暴露节点之间的可能级联，并将有限观测点与状态分开；地形与网络非按比例，情景不构成洪水预报。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">干旱记忆如何放大流域洪水级联</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">25 · 空间结构 | Watershed cascade</text><rect x="38" y="82" width="610" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">流域状态与观测</text><text x="630" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">俯视示意 / not a forecast map</text><path d="M 72 198 C 160 148, 232 184, 310 145 C 410 96, 520 158, 616 126 L 616 466 L 72 466 Z" fill="#e1edcf" stroke="#82936f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"></path><path d="M 88 240 C 176 196, 250 230, 321 194 C 408 150, 500 214, 598 170" fill="none" stroke="#9ab08e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 108 286 C 192 248, 250 274, 329 238 C 414 204, 490 255, 577 218" fill="none" stroke="#9ab08e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 150 338 C 220 302, 276 323, 340 292 C 409 260, 466 307, 540 274" fill="none" stroke="#9ab08e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 207 390 C 260 364, 300 379, 350 353 C 404 328, 438 362, 486 340" fill="none" stroke="#9ab08e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="82.0,220.0 170.0,178.0 260.0,196.0 345.0,160.0 442.0,190.0 566.0,152.0 610.0,184.0" fill="none" stroke="#7666a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 5"></polyline><text x="90" y="211" font-size="11" font-weight="750" text-anchor="start" fill="#7666a8">分水岭</text><polyline points="150.0,226.0 235.0,270.0 321.0,318.0 420.0,372.0 522.0,420.0" fill="none" stroke="#2679a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="370.0,206.0 356.0,270.0 321.0,318.0" fill="none" stroke="#2679a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="526.0,220.0 468.0,282.0 420.0,372.0" fill="none" stroke="#2679a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline><line x1="486" y1="400" x2="548" y2="430" stroke="#2679a8" stroke-width="3" marker-end="url(#arrow-deep)"></line><circle cx="522" cy="420" r="7" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></circle><text x="540" y="447" font-size="12" font-weight="800" text-anchor="start" fill="#d65a4a">出口 Q</text><rect x="170" y="300" width="116" height="44" rx="6" fill="#fff4e8" stroke="#c58b20" stroke-width="1"></rect><text x="228" y="327" font-size="12" font-weight="750" text-anchor="middle" fill="#c58b20">土壤储量低</text><line x1="182" y1="264" x2="182" y2="294" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><line x1="228" y1="264" x2="228" y2="294" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><line x1="274" y1="264" x2="274" y2="294" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><text x="180" y="253" font-size="11" font-weight="750" text-anchor="start" fill="#2784b8">短时强降雨 P</text><path d="M 164 356 C 230 337, 278 346, 330 334" fill="none" stroke="#c58b20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5"></path><text x="162" y="374" font-size="11" font-weight="750" text-anchor="start" fill="#c58b20">低入渗 / 快响应</text><circle cx="122" cy="178" r="9" fill="#ffffff" stroke="#2784b8" stroke-width="3"></circle><circle cx="122" cy="178" r="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></circle><text x="136" y="183" font-size="11" font-weight="750" text-anchor="start" fill="#2784b8">雨量</text><circle cx="312" cy="235" r="9" fill="#ffffff" stroke="#4d8a63" stroke-width="3"></circle><circle cx="312" cy="235" r="3" fill="#4d8a63" stroke="#4d8a63" stroke-width="1"></circle><text x="326" y="240" font-size="11" font-weight="750" text-anchor="start" fill="#4d8a63">土壤</text><circle cx="493" cy="374" r="9" fill="#ffffff" stroke="#7666a8" stroke-width="3"></circle><circle cx="493" cy="374" r="3" fill="#7666a8" stroke="#7666a8" stroke-width="1"></circle><text x="507" y="379" font-size="11" font-weight="750" text-anchor="start" fill="#7666a8">河道</text><text x="60" y="489" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">分水岭、等高线、流线和传感器位置均为示意，不按比例。</text><text x="350" y="507" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><line x1="390" y1="502" x2="418" y2="502" stroke="#2784b8" stroke-width="4"></line><text x="428" y="505" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">降水</text><rect x="480" y="492" width="28" height="14" rx="3" fill="#c58b20" stroke="none" stroke-width="1"></rect><text x="518" y="505" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">状态</text><rect x="560" y="492" width="28" height="14" rx="3" fill="#7666a8" stroke="none" stroke-width="1"></rect><text x="598" y="505" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">观测点</text><rect x="678" y="82" width="324" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="696" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">级联账本</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">状态 → 通量 → 暴露</text><rect x="708" y="136" width="264" height="54" rx="8" fill="#fff4e8" stroke="#c58b20" stroke-width="1"></rect><text x="840.0" y="157.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="840.0" dy="0">旱期状态</tspan><tspan x="840.0" dy="19">S↓ · 土壤/水库余量</tspan></text><rect x="708" y="206" width="264" height="54" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="840.0" y="227.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="840.0" dy="0">强降雨输入</tspan><tspan x="840.0" dy="19">P↑ · 时间集中</tspan></text><rect x="708" y="276" width="264" height="54" rx="8" fill="#eaf5fb" stroke="#2679a8" stroke-width="1"></rect><text x="840.0" y="297.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="840.0" dy="0">径流路由</tspan><tspan x="840.0" dy="19">Q = cP + O</tspan></text><rect x="708" y="346" width="264" height="54" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="840.0" y="367.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="840.0" dy="0">暴露节点</tspan><tspan x="840.0" dy="19">道路 · 居民 · 取水口</tspan></text><line x1="840" y1="191" x2="840" y2="205" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><line x1="840" y1="261" x2="840" y2="275" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><line x1="840" y1="331" x2="840" y2="345" stroke="#2679a8" stroke-width="3" marker-end="url(#arrow-deep)"></line><line x1="694" y1="420" x2="986" y2="420" stroke="#b54238" stroke-width="2" stroke-dasharray="8 5"></line><text x="708" y="444" font-size="13" font-weight="800" text-anchor="start" fill="#b54238">影响边界：需要 E、V 与恢复时间</text><text x="708" y="472" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">级联方向 ≠ 某地洪水预警</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">这是合成流域情景；观测点是有限代理，状态估计不是事实真值，级联图也不是风险或洪水预报。</text></svg>
