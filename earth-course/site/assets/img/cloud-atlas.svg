</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">云型图谱</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">12 / spatial structure</text><rect x="28" y="86" width="640" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="46" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Vertical cloud atlas</text><text x="650" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">cloud shape is a visible proxy for process</text><rect x="58" y="127" width="586" height="336" rx="0" fill="#dff1f7" stroke="#a9bac8" stroke-width="1"></rect><line x1="120" y1="144" x2="120" y2="450" stroke="#5f7182" stroke-width="1.5"></line><line x1="120" y1="430" x2="630" y2="430" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 5" opacity="0.75"></line><text x="112" y="434" font-size="10.5" font-weight="500" text-anchor="end" fill="#5f7182">surface</text><line x1="120" y1="355" x2="630" y2="355" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 5" opacity="0.75"></line><text x="112" y="359" font-size="10.5" font-weight="500" text-anchor="end" fill="#5f7182">2 km</text><line x1="120" y1="270" x2="630" y2="270" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 5" opacity="0.75"></line><text x="112" y="274" font-size="10.5" font-weight="500" text-anchor="end" fill="#5f7182">6 km</text><line x1="120" y1="185" x2="630" y2="185" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 5" opacity="0.75"></line><text x="112" y="189" font-size="10.5" font-weight="500" text-anchor="end" fill="#5f7182">10 km</text><line x1="120" y1="145" x2="630" y2="145" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 5" opacity="0.75"></line><text x="112" y="149" font-size="10.5" font-weight="500" text-anchor="end" fill="#5f7182">tropopause</text><ellipse cx="170" cy="410.06" rx="49.559999999999995" ry="16.52" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></ellipse><circle cx="141.68" cy="401.8" r="17.7" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></circle><circle cx="170" cy="390" r="25.959999999999997" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></circle><circle cx="198.32" cy="401.8" r="18.88" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></circle><text x="122" y="429" font-size="12" font-weight="750" text-anchor="start" fill="#2679a8">stratus / 层云</text><ellipse cx="300" cy="350.3" rx="37.800000000000004" ry="12.6" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></ellipse><circle cx="278.4" cy="344.0" r="13.5" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></circle><circle cx="300" cy="335" r="19.8" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></circle><circle cx="321.6" cy="344.0" r="14.4" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></circle><text x="267" y="375" font-size="12" font-weight="750" text-anchor="start" fill="#2679a8">cumulus / 积云</text><ellipse cx="470" cy="308.85" rx="44.1" ry="14.700000000000001" fill="#f2fbfd" stroke="#7eafc4" stroke-width="1.5"></ellipse><circle cx="444.8" cy="301.5" r="15.75" fill="#f2fbfd" stroke="#7eafc4" stroke-width="1.5"></circle><circle cx="470" cy="291" r="23.1" fill="#f2fbfd" stroke="#7eafc4" stroke-width="1.5"></circle><circle cx="495.2" cy="301.5" r="16.8" fill="#f2fbfd" stroke="#7eafc4" stroke-width="1.5"></circle><text x="430" y="331" font-size="12" font-weight="750" text-anchor="start" fill="#2679a8">nimbostratus</text><ellipse cx="365" cy="239.24" rx="30.24" ry="10.08" fill="#f7fbfc" stroke="#7eafc4" stroke-width="1.5"></ellipse><circle cx="347.72" cy="234.2" r="10.799999999999999" fill="#f7fbfc" stroke="#7eafc4" stroke-width="1.5"></circle><circle cx="365" cy="227" r="15.84" fill="#f7fbfc" stroke="#7eafc4" stroke-width="1.5"></circle><circle cx="382.28" cy="234.2" r="11.52" fill="#f7fbfc" stroke="#7eafc4" stroke-width="1.5"></circle><path d="M332,250 C350,240 380,240 402,251" fill="none" stroke="#7666a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><line x1="343" y1="259" x2="338" y2="280" stroke="#2784b8" stroke-width="2"></line><line x1="360" y1="259" x2="355" y2="280" stroke="#2784b8" stroke-width="2"></line><line x1="377" y1="259" x2="372" y2="280" stroke="#2784b8" stroke-width="2"></line><line x1="394" y1="259" x2="389" y2="280" stroke="#2784b8" stroke-width="2"></line><text x="430" y="278" font-size="10.5" font-weight="500" text-anchor="start" fill="#2784b8">steady rain / snow</text><ellipse cx="550" cy="165.54" rx="26.04" ry="8.68" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></ellipse><circle cx="535.12" cy="161.2" r="9.3" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></circle><circle cx="550" cy="155" r="13.64" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></circle><circle cx="564.88" cy="161.2" r="9.92" fill="#ffffff" stroke="#7eafc4" stroke-width="1.5"></circle><path d="M508,164 C535,145 566,164 600,148" fill="none" stroke="#7666a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path><text x="493" y="132" font-size="12" font-weight="750" text-anchor="start" fill="#7666a8">cirrus / 卷云</text><ellipse cx="235" cy="289.94" rx="34.44" ry="11.479999999999999" fill="#eef8fa" stroke="#d65a4a" stroke-width="1.5"></ellipse><circle cx="215.32" cy="284.2" r="12.299999999999999" fill="#eef8fa" stroke="#d65a4a" stroke-width="1.5"></circle><circle cx="235" cy="276" r="18.04" fill="#eef8fa" stroke="#d65a4a" stroke-width="1.5"></circle><circle cx="254.68" cy="284.2" r="13.12" fill="#eef8fa" stroke="#d65a4a" stroke-width="1.5"></circle><path d="M215,299 C225,265 240,230 250,190 C258,160 269,145 276,132" fill="none" stroke="#d65a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><text x="110" y="202" font-size="12" font-weight="750" text-anchor="start" fill="#d65a4a">cumulonimbus / 积雨云</text><line x1="238" y1="306" x2="233" y2="352" stroke="#2784b8" stroke-width="2"></line><line x1="252" y1="306" x2="247" y2="352" stroke="#2784b8" stroke-width="2"></line><line x1="266" y1="306" x2="261" y2="352" stroke="#2784b8" stroke-width="2"></line><rect x="700" y="86" width="312" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="718" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Reading the forms</text><text x="994" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">approx. altitude</text><ellipse cx="726" cy="154" rx="17" ry="9" fill="#ffffff" stroke="#2784b8" stroke-width="1.5"></ellipse><text x="755" y="151" font-size="13.5" font-weight="750" text-anchor="start" fill="#17324d">Stratus</text><text x="755" y="170" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">layered, stable uplift</text><ellipse cx="726" cy="209" rx="17" ry="9" fill="#ffffff" stroke="#2784b8" stroke-width="1.5"></ellipse><text x="755" y="206" font-size="13.5" font-weight="750" text-anchor="start" fill="#17324d">Cumulus</text><text x="755" y="225" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">localized convection</text><ellipse cx="726" cy="264" rx="17" ry="9" fill="#eef8fa" stroke="#d65a4a" stroke-width="1.5"></ellipse><text x="755" y="261" font-size="13.5" font-weight="750" text-anchor="start" fill="#17324d">Cumulonimbus</text><text x="755" y="280" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">deep convection + heavy precip</text><ellipse cx="726" cy="319" rx="17" ry="9" fill="#f2fbfd" stroke="#2679a8" stroke-width="1.5"></ellipse><text x="755" y="316" font-size="13.5" font-weight="750" text-anchor="start" fill="#17324d">Nimbostratus</text><text x="755" y="335" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">broad, persistent precip</text><ellipse cx="726" cy="374" rx="17" ry="9" fill="#ffffff" stroke="#7666a8" stroke-width="1.5"></ellipse><text x="755" y="371" font-size="13.5" font-weight="750" text-anchor="start" fill="#17324d">Cirrus</text><text x="755" y="390" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">high ice crystals</text><text x="720" y="426" font-size="12" font-weight="700" text-anchor="start" fill="#17324d">Cloud presence is not the same as</text><text x="720" y="446" font-size="12" font-weight="700" text-anchor="start" fill="#17324d">precipitation reaching the ground.</text><rect x="40" y="520" width="28" height="14" rx="3" fill="#9edff2" stroke="none" stroke-width="1"></rect><text x="78" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">liquid / mixed cloud</text><rect x="235" y="520" width="28" height="14" rx="3" fill="#7666a8" stroke="none" stroke-width="1"></rect><text x="273" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">ice-rich cloud</text><line x1="405" y1="530" x2="433" y2="530" stroke="#2784b8" stroke-width="4"></line><text x="443" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">precipitation</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">Schematic altitude bands are not a sounding or an aviation product</text></svg>
