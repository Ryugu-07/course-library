<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Global surface currents: gyres, western boundary currents, and upwelling</title><desc id="svg-desc">A schematic equirectangular, non-navigation world map highlights subtropical gyres, warm western boundary currents, cool eastern boundary currents, coastal upwelling, and the Antarctic Circumpolar Current.</desc><defs>
