</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">模型层级随问题改变</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">20 · 空间结构 | Model hierarchy</text><rect x="38" y="82" width="566" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">从平均能量到耦合地球系统</text><text x="586" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">scope ≠ certainty</text><rect x="72" y="132" width="444" height="55" rx="8" fill="#ffffff" stroke="#2784b8" stroke-width="2"></rect><rect x="86" y="141" width="42" height="42" rx="4" fill="#ffffff" stroke="#2784b8" stroke-width="1.5"></rect><line x1="86" y1="162.0" x2="128" y2="162.0" stroke="#2784b8" stroke-width="1"></line><line x1="100.0" y1="141" x2="100.0" y2="183" stroke="#2784b8" stroke-width="1"></line><line x1="114.0" y1="141" x2="114.0" y2="183" stroke="#2784b8" stroke-width="1"></line><text x="144" y="158" font-size="14" font-weight="800" text-anchor="start" fill="#17324d">EBM  能量平衡模型</text><text x="144" y="180" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">全球 / 纬向平均</text><line x1="294.0" y1="192" x2="294.0" y2="211" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="92" y="218" width="424" height="60" rx="8" fill="#ffffff" stroke="#4d8a63" stroke-width="2"></rect><rect x="106" y="227" width="42" height="42" rx="4" fill="#ffffff" stroke="#4d8a63" stroke-width="1.5"></rect><line x1="106" y1="241.0" x2="148" y2="241.0" stroke="#4d8a63" stroke-width="1"></line><line x1="106" y1="255.0" x2="148" y2="255.0" stroke="#4d8a63" stroke-width="1"></line><line x1="116.5" y1="227" x2="116.5" y2="269" stroke="#4d8a63" stroke-width="1"></line><line x1="127.0" y1="227" x2="127.0" y2="269" stroke="#4d8a63" stroke-width="1"></line><line x1="137.5" y1="227" x2="137.5" y2="269" stroke="#4d8a63" stroke-width="1"></line><text x="164" y="244" font-size="14" font-weight="800" text-anchor="start" fill="#17324d">EMIC  中等复杂度</text><text x="164" y="266" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">输送 + 简化海洋</text><line x1="304.0" y1="283" x2="304.0" y2="299" stroke="#4d8a63" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="112" y="306" width="404" height="66" rx="8" fill="#ffffff" stroke="#d65a4a" stroke-width="2"></rect><rect x="126" y="315" width="42" height="42" rx="4" fill="#ffffff" stroke="#d65a4a" stroke-width="1.5"></rect><line x1="126" y1="325.5" x2="168" y2="325.5" stroke="#d65a4a" stroke-width="1"></line><line x1="126" y1="336.0" x2="168" y2="336.0" stroke="#d65a4a" stroke-width="1"></line><line x1="126" y1="346.5" x2="168" y2="346.5" stroke="#d65a4a" stroke-width="1"></line><line x1="134.4" y1="315" x2="134.4" y2="357" stroke="#d65a4a" stroke-width="1"></line><line x1="142.8" y1="315" x2="142.8" y2="357" stroke="#d65a4a" stroke-width="1"></line><line x1="151.2" y1="315" x2="151.2" y2="357" stroke="#d65a4a" stroke-width="1"></line><line x1="159.6" y1="315" x2="159.6" y2="357" stroke="#d65a4a" stroke-width="1"></line><text x="184" y="332" font-size="14" font-weight="800" text-anchor="start" fill="#17324d">GCM  三维环流模式</text><text x="184" y="354" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">动量、水、能量</text><line x1="314.0" y1="377" x2="314.0" y2="391" stroke="#d65a4a" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="132" y="398" width="384" height="72" rx="8" fill="#ffffff" stroke="#7666a8" stroke-width="2"></rect><rect x="146" y="407" width="42" height="42" rx="4" fill="#ffffff" stroke="#7666a8" stroke-width="1.5"></rect><line x1="146" y1="415.4" x2="188" y2="415.4" stroke="#7666a8" stroke-width="1"></line><line x1="146" y1="423.8" x2="188" y2="423.8" stroke="#7666a8" stroke-width="1"></line><line x1="146" y1="432.2" x2="188" y2="432.2" stroke="#7666a8" stroke-width="1"></line><line x1="146" y1="440.6" x2="188" y2="440.6" stroke="#7666a8" stroke-width="1"></line><line x1="153.0" y1="407" x2="153.0" y2="449" stroke="#7666a8" stroke-width="1"></line><line x1="160.0" y1="407" x2="160.0" y2="449" stroke="#7666a8" stroke-width="1"></line><line x1="167.0" y1="407" x2="167.0" y2="449" stroke="#7666a8" stroke-width="1"></line><line x1="174.0" y1="407" x2="174.0" y2="449" stroke="#7666a8" stroke-width="1"></line><line x1="181.0" y1="407" x2="181.0" y2="449" stroke="#7666a8" stroke-width="1"></line><text x="204" y="424" font-size="14" font-weight="800" text-anchor="start" fill="#17324d">ESM  地球系统模型</text><text x="204" y="446" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">碳、氮、生态耦合</text><text x="72" y="498" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">格点更多、过程更多、计算代价更高；未解析过程仍需参数化。</text><rect x="632" y="82" width="370" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="650" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">先问问题，再选层级</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">choice by question</text><text x="658" y="132" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">全球能量收支</text><line x1="842" y1="127" x2="886" y2="127" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="900" y="110" width="74" height="30" rx="15" fill="#2784b8" stroke="none" stroke-width="1"></rect><text x="937" y="130" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">EBM</text><line x1="658" y1="149" x2="974" y2="149" stroke="#dbe5ec" stroke-width="1"></line><text x="658" y="190" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">纬向输送 / 海陆差异</text><line x1="842" y1="185" x2="886" y2="185" stroke="#4d8a63" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="900" y="168" width="74" height="30" rx="15" fill="#4d8a63" stroke="none" stroke-width="1"></rect><text x="937" y="188" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">EMIC</text><line x1="658" y1="207" x2="974" y2="207" stroke="#dbe5ec" stroke-width="1"></line><text x="658" y="248" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">区域环流 / 极端</text><line x1="842" y1="243" x2="886" y2="243" stroke="#d65a4a" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="900" y="226" width="74" height="30" rx="15" fill="#d65a4a" stroke="none" stroke-width="1"></rect><text x="937" y="246" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">GCM</text><line x1="658" y1="265" x2="974" y2="265" stroke="#dbe5ec" stroke-width="1"></line><text x="658" y="306" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">碳—氮—植被反馈</text><line x1="842" y1="301" x2="886" y2="301" stroke="#7666a8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="900" y="284" width="74" height="30" rx="15" fill="#7666a8" stroke="none" stroke-width="1"></rect><text x="937" y="304" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">ESM</text><line x1="658" y1="323" x2="974" y2="323" stroke="#dbe5ec" stroke-width="1"></line><text x="658" y="384" font-size="16" font-weight="800" text-anchor="start" fill="#d65a4a">复杂度 ≠ 证据等级</text><text x="658" y="411" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">集合 spread、结构误差、初值和情景要分栏。</text><rect x="748" y="438" width="226" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="762" y="458" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><rect x="762" y="466" width="28" height="14" rx="3" fill="#7666a8" stroke="none" stroke-width="1"></rect><text x="800" y="479" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">模型层级 / scope</text><line x1="762" y1="495" x2="790" y2="495" stroke="#2784b8" stroke-width="4"></line><text x="800" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">可解析过程</text><line x1="762" y1="514" x2="790" y2="514" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="800" y="517" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">参数化 / 未解析</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 20A：阶梯表示能回答的问题范围和过程集合，不是从低到高的绝对准确度排名。</text></svg>
