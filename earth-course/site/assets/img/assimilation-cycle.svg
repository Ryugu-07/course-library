<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">数据同化的时间循环</title><desc id="svg-desc">教学示意展示模型先验、有限观测、创新和分析状态之间的循环；箭头方向表示信息与动力学关系，状态空间和不确定性均非按比例，分析场不是地球状态真值。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">数据同化的时间循环</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">22 · 过程机制 | Assimilation cycle</text><rect x="38" y="82" width="630" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">状态、观测与更新</text><text x="650" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">每一步都是条件化估计</text><rect x="276" y="108" width="170" height="62" rx="8" fill="#eef6ed" stroke="#4d8a63" stroke-width="1"></rect><text x="361.0" y="134.6" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="361.0" dy="0">分析状态 xᵃₜ</tspan><tspan x="361.0" dy="19">analysis field</tspan></text><rect x="463" y="222" width="148" height="72" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="537.0" y="252.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="537.0" dy="0">模型推进 Mₜ</tspan><tspan x="537.0" dy="19">xᵃₜ → xᶠₜ₊₁</tspan></text><rect x="276" y="394" width="170" height="62" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="361.0" y="420.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="361.0" dy="0">先验 xᶠₜ₊₁</tspan><tspan x="361.0" dy="19">forecast state</tspan></text><rect x="78" y="222" width="148" height="72" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="152.0" y="252.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="152.0" dy="0">观测 yₜ</tspan><tspan x="152.0" dy="19">有限采样 + ε</tspan></text><rect x="262" y="222" width="188" height="78" rx="8" fill="#fff9e6" stroke="#c58b20" stroke-width="1"></rect><text x="356.0" y="248.42" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="356.0" dy="0">创新与更新</tspan><tspan x="356.0" dy="17">d = y − Hxᶠ</tspan><tspan x="356.0" dy="17">xᵃ = xᶠ + Kd</tspan></text><path d="M 447 139 C 506 147, 530 183, 535 222" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><path d="M 537 294 C 535 352, 475 402, 444 423" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><line x1="360" y1="392" x2="360" y2="305" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><line x1="226" y1="258" x2="258" y2="258" stroke="#7666a8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-violet)"></line><line x1="356" y1="219" x2="356" y2="174" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><text x="472" y="186" font-size="11" font-weight="700" text-anchor="start" fill="#2784b8">动力学方向</text><text x="232" y="342" font-size="11" font-weight="700" text-anchor="start" fill="#7666a8">观测算子 H</text><text x="376" y="354" font-size="11" font-weight="700" text-anchor="start" fill="#d65a4a">过程误差 Q</text><text x="58" y="476" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">创新是观测与先验的差；K 由误差协方差决定，不是硬替换。</text><rect x="56" y="332" width="194" height="103" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="70" y="354" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="70" y1="376" x2="98" y2="376" stroke="#2784b8" stroke-width="4"></line><text x="108" y="379" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">模型 / 状态方向</text><line x1="70" y1="399" x2="98" y2="399" stroke="#7666a8" stroke-width="4" stroke-dasharray="7 5"></line><text x="108" y="402" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">观测进入</text><line x1="70" y1="422" x2="98" y2="422" stroke="#d65a4a" stroke-width="4"></line><text x="108" y="425" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">不确定性路径</text><rect x="694" y="82" width="308" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="712" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">四本证据账</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">教学变量</text><text x="716" y="128" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">同一状态的四种角色</text><rect x="716" y="146" width="264" height="42" rx="5" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><rect x="716" y="146" width="8" height="42" rx="4" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></rect><text x="736" y="164" font-size="12" font-weight="700" text-anchor="start" fill="#5f7182">模型推进后的先验</text><text x="964" y="173" font-size="14" font-weight="800" text-anchor="end" fill="#17324d">xᶠ, Pᶠ</text><rect x="716" y="198" width="264" height="42" rx="5" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><rect x="716" y="198" width="8" height="42" rx="4" fill="#7666a8" stroke="#7666a8" stroke-width="1"></rect><text x="736" y="216" font-size="12" font-weight="700" text-anchor="start" fill="#5f7182">传感器 / 遥感读数</text><text x="964" y="225" font-size="14" font-weight="800" text-anchor="end" fill="#17324d">y, R</text><rect x="716" y="250" width="264" height="42" rx="5" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><rect x="716" y="250" width="8" height="42" rx="4" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="736" y="268" font-size="12" font-weight="700" text-anchor="start" fill="#5f7182">创新与权重</text><text x="964" y="277" font-size="14" font-weight="800" text-anchor="end" fill="#17324d">d, K</text><rect x="716" y="302" width="264" height="42" rx="5" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><rect x="716" y="302" width="8" height="42" rx="4" fill="#4d8a63" stroke="#4d8a63" stroke-width="1"></rect><text x="736" y="320" font-size="12" font-weight="700" text-anchor="start" fill="#5f7182">更新后的分析</text><text x="964" y="329" font-size="14" font-weight="800" text-anchor="end" fill="#17324d">xᵃ, Pᵃ</text><rect x="716" y="366" width="264" height="66" rx="7" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="732" y="390" font-size="12" font-weight="800" text-anchor="start" fill="#d65a4a">边界提醒</text><text x="732" y="414" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">分析场 ≠ 真值；后验 ≠ 观测替身</text><text x="716" y="465" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">先验、观测、误差模型和更新规则必须可追溯。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">循环、箭头和状态空间为教学示意，布局与数量非按比例；合成场景不是实时预报。</text></svg>
