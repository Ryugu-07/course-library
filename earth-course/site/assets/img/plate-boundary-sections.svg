<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">三类边界如何改变地表</title><desc id="svg-desc">三联剖面示意把相对速度分解为法向与切向分量，说明张性、汇聚和转换边界的过程差异；剖面边界和深度非等比例。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">三类边界如何改变地表</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">04 · 过程机制 | Plate-boundary sections</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">边界类型是速度向量的投影</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">剖面示意 / sectional schematic</text><rect x="56" y="126" width="260" height="315" rx="8" fill="#fff0ec" stroke="#d65a4a" stroke-width="1"></rect><text x="74" y="155" font-size="17" font-weight="800" text-anchor="start" fill="#d65a4a">张性</text><text x="298" y="154" font-size="11" font-weight="500" text-anchor="end" fill="#5f7182">divergent</text><rect x="352" y="126" width="260" height="315" rx="8" fill="#f4f0fa" stroke="#7666a8" stroke-width="1"></rect><text x="370" y="155" font-size="17" font-weight="800" text-anchor="start" fill="#7666a8">汇聚</text><text x="594" y="154" font-size="11" font-weight="500" text-anchor="end" fill="#5f7182">convergent</text><rect x="648" y="126" width="260" height="315" rx="8" fill="#fff7e8" stroke="#c58b20" stroke-width="1"></rect><text x="666" y="155" font-size="17" font-weight="800" text-anchor="start" fill="#c58b20">转换</text><text x="890" y="154" font-size="11" font-weight="500" text-anchor="end" fill="#5f7182">transform</text><polygon points="74.0,260.0 175.0,242.0 184.0,405.0 74.0,405.0" fill="#d9e6c5" stroke="#82936f" stroke-width="1"></polygon><polygon points="298.0,260.0 197.0,242.0 188.0,405.0 298.0,405.0" fill="#d9e6c5" stroke="#82936f" stroke-width="1"></polygon><path d="M 175 242 C 182 269, 186 296, 186 405 L 197 405 C 197 295, 194 267, 197 242 Z" fill="#dc805f" stroke="#ad5c49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="175" y1="206" x2="126" y2="206" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><line x1="197" y1="206" x2="246" y2="206" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><text x="186" y="230" font-size="11" font-weight="700" text-anchor="middle" fill="#d65a4a">上涌 / upwelling</text><text x="186" y="421" font-size="14" font-weight="750" text-anchor="middle" fill="#d65a4a">vₙ &gt; 0</text><polygon points="370.0,258.0 470.0,245.0 442.0,405.0 370.0,405.0" fill="#d9e6c5" stroke="#82936f" stroke-width="1"></polygon><polygon points="594.0,258.0 494.0,245.0 526.0,405.0 594.0,405.0" fill="#e3c99c" stroke="#92765e" stroke-width="1"></polygon><path d="M 468 246 C 492 281, 497 326, 442 405" fill="none" stroke="#7666a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><line x1="424" y1="206" x2="477" y2="206" stroke="#7666a8" stroke-width="3" marker-end="url(#arrow-violet)"></line><line x1="540" y1="206" x2="487" y2="206" stroke="#7666a8" stroke-width="3" marker-end="url(#arrow-violet)"></line><text x="482" y="230" font-size="11" font-weight="700" text-anchor="middle" fill="#7666a8">俯冲 / subduction</text><text x="482" y="421" font-size="14" font-weight="750" text-anchor="middle" fill="#7666a8">vₙ &lt; 0</text><rect x="666" y="258" width="103" height="147" rx="0" fill="#d9e6c5" stroke="#82936f" stroke-width="1"></rect><rect x="787" y="258" width="103" height="147" rx="0" fill="#d9e6c5" stroke="#82936f" stroke-width="1"></rect><line x1="778" y1="247" x2="778" y2="418" stroke="#c58b20" stroke-width="4" stroke-dasharray="3 6"></line><line x1="722" y1="226" x2="722" y2="274" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><line x1="834" y1="274" x2="834" y2="226" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><text x="778" y="230" font-size="11" font-weight="700" text-anchor="middle" fill="#c58b20">走滑 / slip</text><text x="778" y="421" font-size="14" font-weight="750" text-anchor="middle" fill="#c58b20">vₛ ≠ 0</text><text x="68" y="474" font-size="14" font-weight="800" text-anchor="start" fill="#17324d">局部投影：dₙ = d cos φ，dₛ = d sin φ</text><text x="68" y="498" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">剖面、边界宽度与地幔流线均为示意；运动学不等于应力或灾害预报。</text><rect x="761" y="453" width="200" height="103" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="775" y="475" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="775" y1="497" x2="803" y2="497" stroke="#d65a4a" stroke-width="4"></line><text x="813" y="500" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">张性</text><line x1="775" y1="520" x2="803" y2="520" stroke="#7666a8" stroke-width="4"></line><text x="813" y="523" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">汇聚</text><line x1="775" y1="543" x2="803" y2="543" stroke="#c58b20" stroke-width="4"></line><text x="813" y="546" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">剪切</text></svg>
