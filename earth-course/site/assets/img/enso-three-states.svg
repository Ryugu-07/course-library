2="286" y2="262" stroke="#2784b8" stroke-width="2.2" marker-end="url(#arrow-cool)"></line><path d="M88,301 C158,292 228,270 282,255" fill="none" stroke="#7666a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><text x="185" y="306" font-size="10.5" font-weight="500" text-anchor="middle" fill="#7666a8">thermocline / 温跃层</text><line x1="48" y1="396" x2="322" y2="396" stroke="#dbe5ec" stroke-width="1"></line><text x="185" y="430" font-size="11.5" font-weight="700" text-anchor="middle" fill="#17324d">east-west contrast maintained</text><text x="185" y="454" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182">东西温差维持</text><rect x="363" y="86" width="314" height="424" rx="8" fill="#fbfdfe" stroke="#dbe5ec" stroke-width="1"></rect><text x="520" y="120" font-size="19" font-weight="800" text-anchor="middle" fill="#d65a4a">El Nino</text><text x="520" y="143" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182">暖事件 / warm anomaly</text><rect x="383" y="189" width="274" height="193" rx="0" fill="#bfe2f2" stroke="#2679a8" stroke-width="1"></rect><rect x="383" y="189" width="38" height="193" rx="0" fill="#d7e5c1" stroke="#82936f" stroke-width="1"></rect><rect x="619" y="189" width="38" height="193" rx="0" fill="#d7e5c1" stroke="#82936f" stroke-width="1"></rect><text x="402" y="208" font-size="11" font-weight="750" text-anchor="middle" fill="#82936f">W</text><text x="638" y="208" font-size="11" font-weight="750" text-anchor="middle" fill="#82936f">E</text><line x1="421" y1="227" x2="619" y2="227" stroke="#e9fcff" stroke-width="2"></line><polygon points="421.0,227.0 619.0,227.0 619.0,293.0 421.0,274.0" fill="#e9a39b" stroke="none" stroke-width="1" opacity="0.9"></polygon><line x1="589" y1="162" x2="508" y2="162" stroke="#d65a4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-warm)"></line><text x="520" y="177" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d65a4a">trades weakened</text><text x="568" y="262" font-size="11" font-weight="750" text-anchor="start" fill="#d65a4a">warm east</text><text x="565" y="356" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5f7182">upwelling weak</text><path d="M423,291 C483,303 553,325 617,316" fill="none" stroke="#7666a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><text x="520" y="306" font-size="10.5" font-weight="500" text-anchor="middle" fill="#7666a8">thermocline / 温跃层</text><line x1="383" y1="396" x2="657" y2="396" stroke="#dbe5ec" stroke-width="1"></line><text x="520" y="430" font-size="11.5" font-weight="700" text-anchor="middle" fill="#17324d">warm anomaly shifts east</text><text x="520" y="454" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182">暖异常向东，冷舌减弱</text><rect x="698" y="86" width="314" height="424" rx="8" fill="#fbfdfe" stroke="#dbe5ec" stroke-width="1"></rect><text x="855" y="120" font-size="19" font-weight="800" text-anchor="middle" fill="#2784b8">La Nina</text><text x="855" y="143" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182">冷事件 / cool anomaly</text><rect x="718" y="189" width="274" height="193" rx="0" fill="#bfe2f2" stroke="#2679a8" stroke-width="1"></rect><rect x="718" y="189" width="38" height="193" rx="0" fill="#d7e5c1" stroke="#82936f" stroke-width="1"></rect><rect x="954" y="189" width="38" height="193" rx="0" fill="#d7e5c1" stroke="#82936f" stroke-width="1"></rect><text x="737" y="208" font-size="11" font-weight="750" text-anchor="middle" fill="#82936f">W</text><text x="973" y="208" font-size="11" font-weight="750" text-anchor="middle" fill="#82936f">E</text><line x1="756" y1="227" x2="954" y2="227" stroke="#e9fcff" stroke-width="2"></line><polygon points="756.0,227.0 878.0,227.0 878.0,277.0 756.0,263.0" fill="#e9a39b" stroke="none" stroke-width="1" opacity="0.9"></polygon><polygon points="878.0,227.0 954.0,227.0 954.0,295.0 878.0,284.0" fill="#83c9e2" stroke="none" stroke-width="1" opacity="0.9"></polygon><line x1="944" y1="162" x2="784" y2="162" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><text x="855" y="177" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2784b8">trades strengthened</text><text x="806" y="262" font-size="11" font-weight="750" text-anchor="start" fill="#d65a4a">warm west</text><text x="924" y="356" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2784b8">upwelling strong</text><line x1="956" y1="311" x2="956" y2="259" stroke="#2784b8" stroke-width="2.5" marker-end="url(#arrow-cool)"></line><path d="M758,306 C823,291 888,263 952,242" fill="none" stroke="#7666a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><text x="855" y="306" font-size="10.5" font-weight="500" text-anchor="middle" fill="#7666a8">thermocline / 温跃层</text><line x1="718" y1="396" x2="992" y2="396" stroke="#dbe5ec" stroke-width="1"></line><text x="855" y="430" font-size="11.5" font-weight="700" text-anchor="middle" fill="#17324d">cold tongue and upwelling strengthen</text><text x="855" y="454" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182">冷舌与上升流增强</text><rect x="40" y="523" width="28" height="14" rx="3" fill="#d65a4a" stroke="none" stroke-width="1"></rect><text x="78" y="536" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">warm SST anomaly</text><rect x="245" y="523" width="28" height="14" rx="3" fill="#2784b8" stroke="none" stroke-width="1"></rect><text x="283" y="536" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">cool SST / upwelling</text><line x1="455" y1="533" x2="483" y2="533" stroke="#7666a8" stroke-width="4"></line><text x="493" y="536" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">thermocline</text><line x1="655" y1="533" x2="683" y2="533" stroke="#2679a8" stroke-width="4"></line><text x="693" y="536" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">trade-wind vector</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">SCHEMATIC / NON-NAVIGATION / equatorial section is not a navigation chart or a fixed forecast</text></svg>
