<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">卫星先测电磁信号，再反演地球变量</title><desc id="svg-desc">过程示意把可见光、近红外、热红外和微波雷达信号连接到反照率、植被、地表温度、土壤水分和结构等变量，并显式保留观测算子、反演先验和质量控制。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">卫星先测电磁信号，再反演地球变量</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">21 · 过程机制 | Remote-sensing spectrum</text><rect x="38" y="82" width="642" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">电磁谱与可观测变量</text><text x="662" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">radiance → retrieval</text><text x="72" y="126" font-size="11" font-weight="700" text-anchor="start" fill="#5f7182">波长增大 →</text><rect x="72" y="148" width="110" height="48" rx="5" fill="#7666a8" stroke="#ffffff" stroke-width="2"></rect><text x="127.0" y="178" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">γ / X</text><rect x="182" y="148" width="76" height="48" rx="5" fill="#2784b8" stroke="#ffffff" stroke-width="2"></rect><text x="220.0" y="178" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">UV</text><rect x="258" y="148" width="86" height="48" rx="5" fill="#4d8a63" stroke="#ffffff" stroke-width="2"></rect><text x="301.0" y="178" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">可见</text><rect x="344" y="148" width="105" height="48" rx="5" fill="#c58b20" stroke="#ffffff" stroke-width="2"></rect><text x="396.5" y="178" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">近红外</text><rect x="449" y="148" width="118" height="48" rx="5" fill="#d65a4a" stroke="#ffffff" stroke-width="2"></rect><text x="508.0" y="178" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">热红外</text><rect x="567" y="148" width="92" height="48" rx="5" fill="#2679a8" stroke="#ffffff" stroke-width="2"></rect><text x="613.0" y="178" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">微波 / 雷达</text><text x="72" y="220" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">同一传感器量可能对应多个状态变量；观测算子和先验决定反演。</text><line x1="138" y1="199" x2="138" y2="268" stroke="#4d8a63" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="86" y="274" width="164" height="64" rx="7" fill="#edf7ed" stroke="#4d8a63" stroke-width="1"></rect><text x="168.0" y="301.58" font-size="12" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="168.0" dy="0">可见 / 近红外</tspan><tspan x="168.0" dy="17">反照率 · 植被</tspan></text><line x1="348" y1="199" x2="348" y2="268" stroke="#d65a4a" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="296" y="274" width="164" height="64" rx="7" fill="#fff0ec" stroke="#d65a4a" stroke-width="1"></rect><text x="378.0" y="301.58" font-size="12" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="378.0" dy="0">热红外</tspan><tspan x="378.0" dy="17">地表温度</tspan></text><line x1="558" y1="199" x2="558" y2="268" stroke="#2679a8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="506" y="274" width="164" height="64" rx="7" fill="#eaf6fb" stroke="#2679a8" stroke-width="1"></rect><text x="588.0" y="301.58" font-size="12" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="588.0" dy="0">微波 / 雷达</tspan><tspan x="588.0" dy="17">土壤水分 · 降水 · 结构</tspan></text><text x="72" y="386" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">支持尺度链</text><line x1="106" y1="414" x2="612" y2="414" stroke="#a9bac8" stroke-width="2"></line><circle cx="106.0" cy="414" r="7" fill="#c58b20" stroke="#ffffff" stroke-width="2"></circle><text x="106.0" y="439" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">光子</text><line x1="117.0" y1="414" x2="263.66666666666663" y2="414" stroke="#c58b20" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="274.66666666666663" cy="414" r="7" fill="#4d8a63" stroke="#ffffff" stroke-width="2"></circle><text x="274.66666666666663" y="439" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">像元</text><line x1="285.66666666666663" y1="414" x2="432.33333333333326" y2="414" stroke="#4d8a63" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="443.3333333333333" cy="414" r="7" fill="#7666a8" stroke="#ffffff" stroke-width="2"></circle><text x="443.3333333333333" y="439" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">条带</text><line x1="454.3333333333333" y1="414" x2="601.0" y2="414" stroke="#7666a8" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="612.0" cy="414" r="7" fill="#2679a8" stroke="#ffffff" stroke-width="2"></circle><text x="612.0" y="439" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">网格</text><text x="62" y="488" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">波段标签是教学分类；云、视角、发射率、定标和算法版本都会进入误差。</text><rect x="708" y="82" width="294" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="726" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">观测方程的流水线</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">H(x) + ε</text><rect x="730" y="124" width="250" height="54" rx="7" fill="#f7f0e9" stroke="#c8a27a" stroke-width="1"></rect><text x="855.0" y="146.92" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="855.0" dy="0">传感器读数</tspan><tspan x="855.0" dy="17">y = radiance + ε</tspan></text><line x1="855" y1="183" x2="855" y2="202" stroke="#c8a27a" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="730" y="206" width="250" height="54" rx="7" fill="#eaf6fb" stroke="#2784b8" stroke-width="1"></rect><text x="855.0" y="228.92" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="855.0" dy="0">观测算子</tspan><tspan x="855.0" dy="17">y = H(x) + ε</tspan></text><line x1="855" y1="265" x2="855" y2="284" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="730" y="288" width="250" height="54" rx="7" fill="#f1eff8" stroke="#7666a8" stroke-width="1"></rect><text x="855.0" y="310.92" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="855.0" dy="0">反演变量</tspan><tspan x="855.0" dy="17">x̂ = R(y, 先验)</tspan></text><path d="M 855 348 C 855 365, 800 372, 760 385" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"></path><text x="730" y="390" font-size="11.5" font-weight="800" text-anchor="start" fill="#c58b20">质量控制：云掩膜 · 定标 · 验证</text><text x="730" y="420" font-size="14" font-weight="800" text-anchor="start" fill="#d65a4a">反演不是凭空增加信息</text><rect x="752" y="438" width="228" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="766" y="458" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="766" y1="476" x2="794" y2="476" stroke="#c8a27a" stroke-width="4"></line><text x="804" y="479" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">传感器信号</text><line x1="766" y1="495" x2="794" y2="495" stroke="#7666a8" stroke-width="4" stroke-dasharray="7 5"></line><text x="804" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">反演变量</text><line x1="766" y1="514" x2="794" y2="514" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="804" y="517" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">先验 / 质量控制</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 21B：电磁谱显示的是可测信号类别，地球变量要经过观测算子、反演和质量控制；虚线表示间接支持。</text></svg>
