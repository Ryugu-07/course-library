<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">风化前沿如何推进</title><desc id="svg-desc">过程示意展示水、二氧化碳和温度驱动矿物反应，生成次生矿物并由侵蚀与地下水输出；速率和前沿位置为教学代理。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">风化前沿如何推进</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">06 · 过程机制 | Soil-weathering front</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">反应、留存与侵蚀的竞争</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">物质通量 / material flux</text><rect x="68" y="150" width="244" height="238" rx="6" fill="#8a9c86" stroke="#5e735d" stroke-width="1"></rect><text x="190" y="210" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">新鲜基岩</text><text x="190" y="237" font-size="12" font-weight="500" text-anchor="middle" fill="#ffffff">primary minerals</text><rect x="68" y="310" width="244" height="78" rx="0" fill="#a87852" stroke="#79563f" stroke-width="1"></rect><text x="190" y="356" font-size="14" font-weight="750" text-anchor="middle" fill="#ffffff">反应前沿 / front</text><rect x="68" y="116" width="244" height="34" rx="6" fill="#b89971" stroke="#92765e" stroke-width="1"></rect><text x="190" y="139" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">土壤 / regolith</text><line x1="106" y1="100" x2="106" y2="144" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><text x="120" y="112" font-size="12" font-weight="700" text-anchor="start" fill="#2784b8">H₂O</text><line x1="170" y1="100" x2="170" y2="144" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><text x="183" y="112" font-size="12" font-weight="700" text-anchor="start" fill="#d65a4a">CO₂</text><line x1="238" y1="100" x2="238" y2="144" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><text x="251" y="112" font-size="12" font-weight="700" text-anchor="start" fill="#c58b20">T</text><line x1="327" y1="269" x2="400" y2="269" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><text x="363" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#d65a4a">溶解 / transform</text><rect x="407" y="214" width="190" height="110" rx="8" fill="#f1f6ea" stroke="#4d8a63" stroke-width="1"></rect><text x="502.0" y="253.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="502.0" dy="0">次生矿物</tspan><tspan x="502.0" dy="19">secondary minerals</tspan><tspan x="502.0" dy="19">+ 溶质</tspan></text><line x1="613" y1="246" x2="686" y2="246" stroke="#7666a8" stroke-width="3" marker-end="url(#arrow-violet)"></line><text x="649" y="225" font-size="11" font-weight="700" text-anchor="middle" fill="#7666a8">输出</text><rect x="693" y="214" width="190" height="110" rx="8" fill="#eef5fb" stroke="#7666a8" stroke-width="1"></rect><text x="788.0" y="253.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="788.0" dy="0">河流 / 地下水</tspan><tspan x="788.0" dy="19">solute export</tspan><tspan x="788.0" dy="19">Eₛₒᵢₗ</tspan></text><line x1="898" y1="269" x2="966" y2="269" stroke="#7666a8" stroke-width="3" marker-end="url(#arrow-violet)"></line><text x="932" y="296" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">外排</text><text x="68" y="430" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">反应速率代理</text><text x="68" y="456" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">Rᵥ = R₀ fᵥ exp[−Eₐ/Rg(1/T − 1/T₀)] fₐcᵢd</text><text x="68" y="483" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">库存：dH/dt = ηRᵥ − Eₛₒᵢₗ；反应更快不保证土壤更厚。</text><rect x="746" y="355" width="223" height="103" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="760" y="377" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="760" y1="399" x2="788" y2="399" stroke="#2784b8" stroke-width="4"></line><text x="798" y="402" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">反应物输入</text><line x1="760" y1="422" x2="788" y2="422" stroke="#d65a4a" stroke-width="4"></line><text x="798" y="425" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">化学生成</text><line x1="760" y1="445" x2="788" y2="445" stroke="#7666a8" stroke-width="4"></line><text x="798" y="448" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">侵蚀 / 外排</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">箭头为教学过程方向；反应前沿位置、层厚和输运路径非等比例。</text></svg>
