<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">波的路径如何留下影区</title><desc id="svg-desc">过程示意展示液态外核使 vS 近似为零、直达 S 波出现影区，再由多台站几何形成内部结构约束；射线不是实际地震层析追踪。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">波的路径如何留下影区</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">03 · 过程机制 | Seismic ray shadow</text><rect x="38" y="82" width="530" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">路径与观测</text><text x="550" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">示意球面 / conceptual geometry</text><circle cx="300" cy="300" r="158" fill="#f5f8fb" stroke="#17324d" stroke-width="2"></circle><circle cx="300" cy="300" r="86" fill="#f9e4df" stroke="#d65a4a" stroke-width="1.2" opacity="0.8"></circle><text x="300" y="305" font-size="16" font-weight="750" text-anchor="middle" fill="#d65a4a">液态外核</text><text x="300" y="328" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182">μ ≈ 0</text><circle cx="159" cy="270" r="6" fill="#17324d" stroke="#17324d" stroke-width="1"></circle><text x="145" y="250" font-size="12" font-weight="700" text-anchor="middle" fill="#17324d">震源</text><circle cx="441" cy="187" r="6" fill="#17324d" stroke="#17324d" stroke-width="1"></circle><circle cx="430" cy="421" r="6" fill="#17324d" stroke="#17324d" stroke-width="1"></circle><text x="472" y="186" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">台站 A</text><text x="462" y="425" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">台站 B</text><path d="M 164 268 C 222 220, 328 175, 435 187" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><text x="285" y="201" font-size="12" font-weight="700" text-anchor="start" fill="#d65a4a">P：折射后到达</text><path d="M 164 276 C 234 323, 362 358, 431 417" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"></path><text x="282" y="361" font-size="12" font-weight="700" text-anchor="start" fill="#2784b8">S：直达路径中断</text><path d="M 431 417 L 472 456" fill="none" stroke="#2784b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"></path><text x="472" y="470" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">缺失相位</text><text x="58" y="490" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">射线为概念路径；角距、层厚和影区边界非等比例。</text><rect x="600" y="82" width="402" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="618" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">从波型到内部约束</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">观测链 / inference chain</text><circle cx="632" cy="150" r="16" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></circle><text x="632" y="156" font-size="13" font-weight="800" text-anchor="middle" fill="#ffffff">1</text><rect x="662" y="122" width="296" height="56" rx="8" fill="#fff0ec" stroke="#d65a4a" stroke-width="1"></rect><text x="810.0" y="142.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="810.0" dy="0">介质</tspan><tspan x="810.0" dy="19">外核近似液态</tspan></text><line x1="632" y1="168" x2="632" y2="192" stroke="#a9bac8" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="632" cy="225" r="16" fill="#2784b8" stroke="#2784b8" stroke-width="1"></circle><text x="632" y="231" font-size="13" font-weight="800" text-anchor="middle" fill="#ffffff">2</text><rect x="662" y="197" width="296" height="56" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="810.0" y="217.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="810.0" dy="0">物理量</tspan><tspan x="810.0" dy="19">μ ≈ 0 → vS ≈ 0</tspan></text><line x1="632" y1="243" x2="632" y2="267" stroke="#a9bac8" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="632" cy="300" r="16" fill="#4d8a63" stroke="#4d8a63" stroke-width="1"></circle><text x="632" y="306" font-size="13" font-weight="800" text-anchor="middle" fill="#ffffff">3</text><rect x="662" y="272" width="296" height="56" rx="8" fill="#edf7ed" stroke="#4d8a63" stroke-width="1"></rect><text x="810.0" y="292.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="810.0" dy="0">观测</tspan><tspan x="810.0" dy="19">直达 S 波缺失</tspan></text><line x1="632" y1="318" x2="632" y2="342" stroke="#a9bac8" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="632" cy="375" r="16" fill="#7666a8" stroke="#7666a8" stroke-width="1"></circle><text x="632" y="381" font-size="13" font-weight="800" text-anchor="middle" fill="#ffffff">4</text><rect x="662" y="347" width="296" height="56" rx="8" fill="#f4f0fa" stroke="#7666a8" stroke-width="1"></rect><text x="810.0" y="367.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="810.0" dy="0">约束</tspan><tspan x="810.0" dy="19">影区几何限制界面</tspan></text><text x="630" y="440" font-size="16" font-weight="800" text-anchor="start" fill="#17324d">多台站 + 多震相</text><text x="630" y="467" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">才把单条路径的退化变成可检验模型。</text><rect x="771" y="426" width="199" height="80" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="785" y="448" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="785" y1="470" x2="813" y2="470" stroke="#d65a4a" stroke-width="4"></line><text x="823" y="473" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">P 波</text><line x1="785" y1="493" x2="813" y2="493" stroke="#2784b8" stroke-width="4" stroke-dasharray="7 5"></line><text x="823" y="496" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">S 波 / 缺失</text></svg>
