<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">流域数字孪生的可追溯架构</title><desc id="svg-desc">架构示意将情景输入、过程模型、状态估计、有限观测、更新诊断、影响接口和 provenance 分层；连接表示条件化信息流，分析场不是现实真值，系统不产生自动预报。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
