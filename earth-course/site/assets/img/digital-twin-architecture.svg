</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">流域数字孪生的可追溯架构</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">28 · 系统架构 | Digital twin</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">模型、数据、场景和证据分层</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">闭合 ≠ 正确</text><text x="64" y="124" font-size="13" font-weight="800" text-anchor="start" fill="#c58b20">输入与边界</text><text x="298" y="124" font-size="13" font-weight="800" text-anchor="start" fill="#4d8a63">过程与状态</text><text x="558" y="124" font-size="13" font-weight="800" text-anchor="start" fill="#2784b8">观测与更新</text><text x="800" y="124" font-size="13" font-weight="800" text-anchor="start" fill="#7666a8">影响与决策接口</text><rect x="64" y="154" width="188" height="76" rx="8" fill="#fff9e6" stroke="#c58b20" stroke-width="1"></rect><text x="158.0" y="187.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="158.0" dy="0">情景输入</tspan><tspan x="158.0" dy="19">P · ET · I · 参数组</tspan></text><line x1="260" y1="192" x2="302" y2="192" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><rect x="308" y="154" width="210" height="76" rx="8" fill="#eef6ed" stroke="#4d8a63" stroke-width="1"></rect><text x="413.0" y="187.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="413.0" dy="0">过程模型</tspan><tspan x="413.0" dy="19">守恒 · 通量 · 参数化</tspan></text><line x1="526" y1="192" x2="568" y2="192" stroke="#4d8a63" stroke-width="3" marker-end="url(#arrow-forest)"></line><rect x="574" y="154" width="206" height="76" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="677.0" y="187.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="677.0" dy="0">状态 / 分析场</tspan><tspan x="677.0" dy="19">S · Q · 估计区间</tspan></text><line x1="788" y1="192" x2="830" y2="192" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="836" y="154" width="136" height="76" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="904.0" y="186.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="904.0" dy="0">影响接口</tspan><tspan x="904.0" dy="19">H · E · V</tspan></text><rect x="64" y="286" width="188" height="76" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="158.0" y="319.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="158.0" dy="0">观测数据</tspan><tspan x="158.0" dy="19">雨量 · 水位 · 卫星</tspan></text><path d="M 260 324 C 350 270, 458 262, 568 232" fill="none" stroke="#7666a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"></path><text x="310" y="278" font-size="12" font-weight="800" text-anchor="start" fill="#7666a8">H + R</text><rect x="308" y="286" width="210" height="76" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="413.0" y="319.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="413.0" dy="0">证据更新</tspan><tspan x="413.0" dy="19">创新 · K · 拒绝规则</tspan></text><line x1="526" y1="324" x2="568" y2="324" stroke="#d65a4a" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow-warm)"></line><text x="540" y="310" font-size="11" font-weight="750" text-anchor="start" fill="#d65a4a">条件化</text><path d="M 676 286 C 676 257, 676 244, 676 232" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"></path><rect x="574" y="286" width="206" height="76" rx="8" fill="#f6f9fb" stroke="#a9bac8" stroke-width="1"></rect><text x="677.0" y="319.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="677.0" dy="0">诊断</tspan><tspan x="677.0" dy="19">守恒 · 创新 · 缺测</tspan></text><rect x="836" y="286" width="136" height="76" rx="8" fill="#fff4e8" stroke="#b54238" stroke-width="1"></rect><text x="904.0" y="318.58" font-size="12" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="904.0" dy="0">风险出口</tspan><tspan x="904.0" dy="19">不是损失预言</tspan></text><line x1="788" y1="324" x2="830" y2="324" stroke="#7666a8" stroke-width="3" marker-end="url(#arrow-violet)"></line><line x1="64" y1="406" x2="972" y2="406" stroke="#dbe5ec" stroke-width="1.5"></line><rect x="64" y="426" width="908" height="58" rx="7" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="84" y="451" font-size="13" font-weight="800" text-anchor="start" fill="#17324d">证据层 / provenance</text><text x="278" y="451" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">版本 · 时间戳 · 单位 · 随机种子 · 诊断 · 不确定性</text><text x="64" y="503" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><line x1="100" y1="498" x2="128" y2="498" stroke="#4d8a63" stroke-width="4"></line><text x="138" y="501" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">模型</text><line x1="200" y1="498" x2="228" y2="498" stroke="#7666a8" stroke-width="4" stroke-dasharray="7 5"></line><text x="238" y="501" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">观测</text><line x1="300" y1="498" x2="328" y2="498" stroke="#d65a4a" stroke-width="4" stroke-dasharray="7 5"></line><text x="338" y="501" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">推断</text><text x="420" y="503" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">场景是条件输入，分析场是估计，数据是有限采样；三者不可互换。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">架构层、连接和反馈是系统示意；不按真实流域尺寸绘制，闭合账本不等于真实预报能力。</text></svg>
