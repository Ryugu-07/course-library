<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">同一强迫会留下多层时间记忆</title><desc id="svg-desc">时间结构示意用对数式时间轴比较大气、陆地、混合层、深海和冰盖岩石的响应范围，并以一阶模型区分表面升温与海洋热摄取。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">同一强迫会留下多层时间记忆</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">19 · 时间结构 | Response timescales</text><rect x="38" y="82" width="624" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">从天气到地质的响应时间常数</text><text x="644" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">log-like teaching axis</text><line x1="110" y1="180" x2="600" y2="180" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"></line><line x1="110" y1="174" x2="110" y2="186" stroke="#17324d" stroke-width="1.5"></line><text x="110" y="201" font-size="11" font-weight="700" text-anchor="middle" fill="#5f7182">日</text><line x1="190" y1="174" x2="190" y2="186" stroke="#17324d" stroke-width="1.5"></line><text x="190" y="201" font-size="11" font-weight="700" text-anchor="middle" fill="#5f7182">年</text><line x1="290" y1="174" x2="290" y2="186" stroke="#17324d" stroke-width="1.5"></line><text x="290" y="201" font-size="11" font-weight="700" text-anchor="middle" fill="#5f7182">十年</text><line x1="400" y1="174" x2="400" y2="186" stroke="#17324d" stroke-width="1.5"></line><text x="400" y="201" font-size="11" font-weight="700" text-anchor="middle" fill="#5f7182">世纪</text><line x1="505" y1="174" x2="505" y2="186" stroke="#17324d" stroke-width="1.5"></line><text x="505" y="201" font-size="11" font-weight="700" text-anchor="middle" fill="#5f7182">千年</text><line x1="600" y1="174" x2="600" y2="186" stroke="#17324d" stroke-width="1.5"></line><text x="600" y="201" font-size="11" font-weight="700" text-anchor="middle" fill="#5f7182">百万年</text><text x="62" y="243" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">大气</text><rect x="110" y="228" width="65" height="21" rx="5" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.72"></rect><text x="184" y="243" font-size="10.5" font-weight="500" text-anchor="start" fill="#5f7182">日–月</text><text x="62" y="285" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">陆地 / 上层海</text><rect x="160" y="270" width="115" height="21" rx="5" fill="#4d8a63" stroke="none" stroke-width="1" opacity="0.72"></rect><text x="284" y="285" font-size="10.5" font-weight="500" text-anchor="start" fill="#5f7182">年–十年</text><text x="62" y="327" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">混合层</text><rect x="238" y="312" width="152" height="21" rx="5" fill="#2784b8" stroke="none" stroke-width="1" opacity="0.72"></rect><text x="399" y="327" font-size="10.5" font-weight="500" text-anchor="start" fill="#5f7182">十年–世纪</text><text x="62" y="369" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">深海</text><rect x="350" y="354" width="160" height="21" rx="5" fill="#2679a8" stroke="none" stroke-width="1" opacity="0.72"></rect><text x="519" y="369" font-size="10.5" font-weight="500" text-anchor="start" fill="#5f7182">世纪–千年</text><text x="62" y="411" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">冰盖 / 岩石</text><rect x="500" y="396" width="100" height="21" rx="5" fill="#7666a8" stroke="none" stroke-width="1" opacity="0.72"></rect><text x="609" y="411" font-size="10.5" font-weight="500" text-anchor="start" fill="#5f7182">千年–百万年</text><line x1="62" y1="456" x2="600" y2="456" stroke="#dbe5ec" stroke-width="1"></line><text x="62" y="482" font-size="12" font-weight="700" text-anchor="start" fill="#5f7182">时间窗决定你看到的是瞬态、过渡还是接近平衡。</text><text x="58" y="510" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">条带是时间常数范围的示意，不是任何单一模式或指标的估计。</text><rect x="684" y="82" width="318" height="470" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="702" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">一个一阶响应的两条曲线</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">ΔT + H</text><line x1="718" y1="366" x2="964" y2="366" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"></line><line x1="718" y1="366" x2="718" y2="174" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"></line><text x="964" y="387" font-size="11" font-weight="500" text-anchor="end" fill="#5f7182">时间 t</text><text x="708" y="172" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">响应</text><path d="M 730 350 C 754 315, 772 273, 804 244 C 841 211, 894 202, 950 198" fill="none" stroke="#d65a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 730 212 C 764 224, 800 244, 830 274 C 866 308, 915 337, 950 351" fill="none" stroke="#2784b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><text x="846" y="194" font-size="12" font-weight="800" text-anchor="start" fill="#d65a4a">ΔT(t) ↑</text><text x="846" y="341" font-size="12" font-weight="800" text-anchor="start" fill="#2784b8">H(t) ↓</text><line x1="804" y1="176" x2="804" y2="366" stroke="#c58b20" stroke-width="2" stroke-dasharray="7 5"></line><text x="804" y="165" font-size="11" font-weight="750" text-anchor="middle" fill="#c58b20">t ≈ τ</text><text x="708" y="420" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">ΔT = ΔT_eq(1 − e⁻ᵗ⧸ᵗᵃᵘ)</text><text x="708" y="447" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">t ≪ τ：热摄取多；t → ∞：趋近平衡</text><rect x="752" y="460" width="226" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="766" y="480" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="766" y1="498" x2="794" y2="498" stroke="#d65a4a" stroke-width="4"></line><text x="804" y="501" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">表面响应 ΔT</text><line x1="766" y1="517" x2="794" y2="517" stroke="#2784b8" stroke-width="4"></line><text x="804" y="520" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">热摄取 H</text><line x1="766" y1="536" x2="794" y2="536" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="804" y="539" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">特征时间 τ</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 19B：快响应先出现，慢响应持续重分配能量；快慢不是重要性排序，而是系统记忆的不同层。</text></svg>
