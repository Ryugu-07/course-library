<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Ocean overturning: a slow loop linking surface and deep water</title><desc id="svg-desc">A schematic meridional ocean section separates warm poleward surface flow, high-latitude dense-water formation, cold deep return flow, and interior mixing from the faster wind-driven surface layer.</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">海洋深层翻转</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">13 / process mechanism</text><rect x="28" y="86" width="660" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="46" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Meridional section</text><text x="670" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">surface heat route and deep density route</text><rect x="58" y="132" width="600" height="310" rx="0" fill="url(#ocean-depth)" stroke="#a9bac8" stroke-width="1"></rect><polygon points="58.0,132.0 176.0,132.0 192.0,166.0 175.0,212.0 190.0,250.0 178.0,442.0 58.0,442.0" fill="#d7e5c1" stroke="#82936f" stroke-width="1.3"></polygon><polygon points="550.0,132.0 658.0,132.0 658.0,442.0 548.0,442.0 530.0,365.0 548.0,288.0 526.0,218.0" fill="#d7e5c1" stroke="#82936f" stroke-width="1.3"></polygon><line x1="58" y1="192" x2="658" y2="192" stroke="#e9fcff" stroke-width="2"></line><text x="70" y="158" font-size="11" font-weight="700" text-anchor="start" fill="#82936f">high latitude</text><text x="560" y="158" font-size="11" font-weight="700" text-anchor="start" fill="#82936f">high latitude</text><path d="M175,184 C275,146 412,146 542,184" fill="none" stroke="#d65a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><text x="276" y="153" font-size="13" font-weight="750" text-anchor="start" fill="#d65a4a">warm surface flow</text><line x1="545" y1="194" x2="545" y2="360" stroke="#2784b8" stroke-width="4" marker-end="url(#arrow-cool)"></line><text x="554" y="286" font-size="12" font-weight="750" text-anchor="start" fill="#2784b8">dense water formation</text><path d="M540,392 C420,430 265,430 180,392" fill="none" stroke="#2679a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-deep)"></path><text x="286" y="423" font-size="13" font-weight="750" text-anchor="start" fill="#ffffff">cold deep return</text><line x1="178" y1="388" x2="178" y2="235" stroke="#4d8a63" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-forest)"></line><text x="82" y="282" font-size="11.5" font-weight="750" text-anchor="start" fill="#ffffff">mixing / upwelling</text><line x1="283" y1="195" x2="283" y2="242" stroke="#c58b20" stroke-width="2.5" marker-end="url(#arrow-gold)"></line><text x="294" y="224" font-size="11" font-weight="500" text-anchor="start" fill="#c58b20">wind / Ekman layer</text><rect x="720" y="86" width="292" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="738" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Two drivers</text><text x="994" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">keep drivers distinct</text><rect x="746" y="132" width="240" height="78" rx="7" fill="#fff8e9" stroke="#e6cf93" stroke-width="1"></rect><rect x="746" y="132" width="6" height="78" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="866.0" y="157" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">surface circulation</text><text x="866.0" y="179" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="866.0" dy="0">wind stress + pressure field</tspan><tspan x="866.0" dy="16">faster response</tspan></text><line x1="866" y1="211" x2="866" y2="242" stroke="#c58b20" stroke-width="2.3" marker-end="url(#arrow-gold)"></line><rect x="746" y="244" width="240" height="84" rx="7" fill="#eef7fb" stroke="#9edff2" stroke-width="1"></rect><rect x="746" y="244" width="6" height="84" rx="3" fill="#2679a8" stroke="#2679a8" stroke-width="1"></rect><text x="866.0" y="269" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">deep overturning</text><text x="866.0" y="291" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="866.0" dy="0">buoyancy + formation + mixing</tspan><tspan x="866.0" dy="16">longer memory</tspan></text><line x1="866" y1="329" x2="866" y2="360" stroke="#2679a8" stroke-width="2.3" marker-end="url(#arrow-deep)"></line><rect x="746" y="362" width="240" height="72" rx="7" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><rect x="746" y="362" width="6" height="72" rx="3" fill="#7666a8" stroke="#7666a8" stroke-width="1"></rect><text x="866.0" y="387" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">boundary conditions</text><text x="866.0" y="409" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="866.0" dy="0">basin shape, freshwater, ice, topography</tspan></text><text x="746" y="470" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">density is a state diagnostic, not a full transport forecast</text><line x1="42" y1="530" x2="70" y2="530" stroke="#d65a4a" stroke-width="4"></line><text x="80" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">warm surface</text><line x1="220" y1="530" x2="248" y2="530" stroke="#2679a8" stroke-width="4"></line><text x="258" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">cold deep</text><line x1="380" y1="530" x2="408" y2="530" stroke="#4d8a63" stroke-width="4" stroke-dasharray="7 5"></line><text x="418" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">mixing / inferred link</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">Meridional geometry and branch widths are schematic, not a section of the real ocean</text></svg>
