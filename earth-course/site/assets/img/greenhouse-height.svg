<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Greenhouse effect: the effective emission height</title><desc id="svg-desc">A vertical atmospheric column shows shortwave transmission, surface longwave emission, greenhouse-gas absorption and re-emission, and the effective emission height in a teaching model.</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">温室效应的高度机制</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">10 / process mechanism</text><rect x="28" y="86" width="600" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="46" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Radiative column</text><text x="610" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">one-dimensional teaching cross-section</text><rect x="62" y="130" width="532" height="330" rx="0" fill="url(#sky-to-space)" stroke="#a9bac8" stroke-width="1"></rect><text x="82" y="153" font-size="12" font-weight="750" text-anchor="start" fill="#ffffff">space</text><text x="82" y="442" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">surface</text><rect x="62" y="408" width="532" height="52" rx="0" fill="#d7e5c1" stroke="#82936f" stroke-width="1"></rect><text x="328" y="440" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d">surface emits LW after absorbing SW</text><line x1="200" y1="350" x2="200" y2="200" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><text x="116" y="330" font-size="12" font-weight="700" text-anchor="start" fill="#c58b20">SW in</text><line x1="330" y1="408" x2="330" y2="218" stroke="#d65a4a" stroke-width="4" marker-end="url(#arrow-warm)"></line><text x="342" y="324" font-size="12" font-weight="700" text-anchor="start" fill="#d65a4a">surface LW</text><rect x="162" y="236" width="340" height="48" rx="22" fill="#dbeef0" stroke="#4d8a63" stroke-width="1" opacity="0.95"></rect><text x="332" y="266" font-size="13" font-weight="750" text-anchor="middle" fill="#4d8a63">greenhouse gases absorb / re-emit LW</text><line x1="332" y1="235" x2="332" y2="164" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><line x1="332" y1="285" x2="332" y2="377" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><text x="350" y="185" font-size="11.5" font-weight="500" text-anchor="start" fill="#d65a4a">upward re-emission</text><text x="350" y="366" font-size="11.5" font-weight="500" text-anchor="start" fill="#d65a4a">downward re-emission</text><line x1="105" y1="205" x2="555" y2="205" stroke="#7666a8" stroke-width="2" stroke-dasharray="8 5"></line><text x="110" y="197" font-size="12" font-weight="700" text-anchor="start" fill="#7666a8">effective emission height</text><line x1="525" y1="188" x2="525" y2="164" stroke="#7666a8" stroke-width="2.3" marker-end="url(#arrow-violet)"></line><rect x="662" y="86" width="350" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="680" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Feedback chain</text><text x="994" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">hold boundaries in view</text><rect x="695" y="132" width="284" height="48" rx="7" fill="#eef7f3" stroke="#dbe5ec" stroke-width="1"></rect><rect x="695" y="132" width="6" height="48" rx="3" fill="#4d8a63" stroke="#4d8a63" stroke-width="1"></rect><text x="837.0" y="157" font-size="13.5" font-weight="750" text-anchor="middle" fill="#17324d">more GHG opacity</text><text x="837.0" y="179" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="837.0" dy="0">longwave optical depth increases</tspan></text><line x1="837" y1="181" x2="837" y2="194" stroke="#4d8a63" stroke-width="2.1" marker-end="url(#arrow-forest)"></line><rect x="695" y="197" width="284" height="48" rx="7" fill="#f0eef8" stroke="#dbe5ec" stroke-width="1"></rect><rect x="695" y="197" width="6" height="48" rx="3" fill="#7666a8" stroke="#7666a8" stroke-width="1"></rect><text x="837.0" y="222" font-size="13.5" font-weight="750" text-anchor="middle" fill="#17324d">emission height rises</text><text x="837.0" y="244" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="837.0" dy="0">the effective layer is higher</tspan></text><line x1="837" y1="246" x2="837" y2="259" stroke="#7666a8" stroke-width="2.1" marker-end="url(#arrow-violet)"></line><rect x="695" y="262" width="284" height="48" rx="7" fill="#eef7fb" stroke="#dbe5ec" stroke-width="1"></rect><rect x="695" y="262" width="6" height="48" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="837.0" y="287" font-size="13.5" font-weight="750" text-anchor="middle" fill="#17324d">higher layer is colder</text><text x="837.0" y="309" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="837.0" dy="0">in this simplified lapse-rate picture</tspan></text><line x1="837" y1="311" x2="837" y2="324" stroke="#2784b8" stroke-width="2.1" marker-end="url(#arrow-cool)"></line><rect x="695" y="327" width="284" height="48" rx="7" fill="#fff1ed" stroke="#dbe5ec" stroke-width="1"></rect><rect x="695" y="327" width="6" height="48" rx="3" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></rect><text x="837.0" y="352" font-size="13.5" font-weight="750" text-anchor="middle" fill="#17324d">outgoing LW is reduced</text><text x="837.0" y="374" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="837.0" dy="0">surface and lower atmosphere adjust</tspan></text><rect x="695" y="405" width="284" height="54" rx="7" fill="#fff8e9" stroke="#e6cf93" stroke-width="1"></rect><rect x="695" y="405" width="6" height="54" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="837.0" y="430" font-size="13.5" font-weight="750" text-anchor="middle" fill="#17324d">radiative balance is restored</text><text x="837.0" y="452" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="837.0" dy="0">absorbed SW = outgoing LW at the top boundary</tspan></text><line x1="42" y1="530" x2="70" y2="530" stroke="#c58b20" stroke-width="4"></line><text x="80" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">shortwave</text><line x1="180" y1="530" x2="208" y2="530" stroke="#d65a4a" stroke-width="4"></line><text x="218" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">longwave</text><line x1="315" y1="530" x2="343" y2="530" stroke="#7666a8" stroke-width="4" stroke-dasharray="7 5"></line><text x="353" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">emission height</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">This column explains a mechanism, not a direct temperature prediction</text></svg>
