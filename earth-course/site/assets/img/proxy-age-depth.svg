</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">从深度到年代，再到气候变量</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">17 · 过程机制 | Proxy and age model</text><rect x="38" y="82" width="624" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">沉积柱中的年龄—深度关系</text><text x="644" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">z → t(z) with uncertainty</text><rect x="82" y="142" width="112" height="286" rx="0" fill="#f7f0e9" stroke="#c8a27a" stroke-width="1.5"></rect><rect x="92" y="150" width="92" height="48" rx="0" fill="#e7cda8" stroke="#92765e" stroke-width="1"></rect><text x="138" y="178.0" font-size="11" font-weight="700" text-anchor="middle" fill="#17324d">表层</text><rect x="92" y="198" width="92" height="58" rx="0" fill="#d8b58c" stroke="#92765e" stroke-width="1"></rect><text x="138" y="231.0" font-size="11" font-weight="700" text-anchor="middle" fill="#17324d">粉砂</text><rect x="92" y="256" width="92" height="42" rx="0" fill="#788995" stroke="#92765e" stroke-width="1"></rect><text x="138" y="281.0" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">灰层</text><rect x="92" y="298" width="92" height="65" rx="0" fill="#b8c7d1" stroke="#92765e" stroke-width="1"></rect><text x="138" y="334.5" font-size="11" font-weight="700" text-anchor="middle" fill="#17324d">黏土</text><rect x="92" y="363" width="92" height="58" rx="0" fill="#b98962" stroke="#92765e" stroke-width="1"></rect><text x="138" y="396.0" font-size="11" font-weight="700" text-anchor="middle" fill="#17324d">深层</text><text x="138" y="446" font-size="12" font-weight="700" text-anchor="middle" fill="#5f7182">深度 z</text><line x1="222" y1="142" x2="222" y2="428" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"></line><text x="211" y="132" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">年轻</text><text x="211" y="446" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">更老</text><line x1="274" y1="428" x2="604" y2="428" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"></line><line x1="274" y1="428" x2="274" y2="142" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"></line><text x="604" y="450" font-size="12" font-weight="700" text-anchor="end" fill="#5f7182">年龄 t</text><text x="248" y="152" font-size="12" font-weight="700" text-anchor="end" fill="#5f7182">深度 z</text><polyline points="286.0,160.0 316.0,204.0 357.0,244.0 404.0,292.0 474.0,352.0 562.0,418.0" fill="none" stroke="#2784b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="292.0,160.0 330.0,204.0 374.0,244.0 422.0,292.0 496.0,352.0 578.0,418.0" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"></polyline><polyline points="280.0,160.0 304.0,204.0 340.0,244.0 386.0,292.0 452.0,352.0 546.0,418.0" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"></polyline><circle cx="316" cy="204" r="5" fill="#d65a4a" stroke="#ffffff" stroke-width="1.5"></circle><circle cx="357" cy="244" r="5" fill="#d65a4a" stroke="#ffffff" stroke-width="1.5"></circle><circle cx="404" cy="292" r="5" fill="#d65a4a" stroke="#ffffff" stroke-width="1.5"></circle><circle cx="474" cy="352" r="5" fill="#d65a4a" stroke="#ffffff" stroke-width="1.5"></circle><text x="452" y="205" font-size="12" font-weight="800" text-anchor="start" fill="#2784b8">t(z) 年龄模型</text><text x="456" y="224" font-size="11" font-weight="700" text-anchor="start" fill="#c58b20">金色带 = 年龄不确定度</text><text x="310" y="390" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">层计数 / 放射性定年 / 沉积速率</text><text x="58" y="500" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">年龄窗口沿水平轴展开；不能把 ±σₜ 当成温度振幅误差。</text><rect x="690" y="82" width="312" height="470" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="708" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">证据链的顺序</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">signal → calibrated variable</text><rect x="718" y="124" width="256" height="50" rx="7" fill="#fff0ec" stroke="#d65a4a" stroke-width="1"></rect><text x="846.0" y="144.92" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="846.0" dy="0">信号</tspan><tspan x="846.0" dy="17">x(z)</tspan></text><line x1="846" y1="177" x2="846" y2="188" stroke="#d65a4a" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="718" y="192" width="256" height="50" rx="7" fill="#eaf6fb" stroke="#2784b8" stroke-width="1"></rect><text x="846.0" y="212.92" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="846.0" dy="0">校准</tspan><tspan x="846.0" dy="17">ΔT = a x</tspan></text><line x1="846" y1="245" x2="846" y2="256" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="718" y="260" width="256" height="50" rx="7" fill="#faf5e6" stroke="#c58b20" stroke-width="1"></rect><text x="846.0" y="280.92" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="846.0" dy="0">年龄</tspan><tspan x="846.0" dy="17">t(z) ± σₜ</tspan></text><line x1="846" y1="313" x2="846" y2="324" stroke="#c58b20" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="718" y="328" width="256" height="50" rx="7" fill="#edf7ed" stroke="#4d8a63" stroke-width="1"></rect><text x="846.0" y="348.92" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="846.0" dy="0">重建</tspan><tspan x="846.0" dy="17">ΔT(t) + 区间</tspan></text><text x="718" y="410" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">误差单位要分开</text><text x="718" y="435" font-size="16" font-weight="800" text-anchor="start" fill="#17324d">σ_amp [°C]   ≠   σₜ [yr]</text><rect x="752" y="450" width="222" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="766" y="470" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="766" y1="488" x2="794" y2="488" stroke="#d65a4a" stroke-width="4"></line><text x="804" y="491" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">代理振幅</text><line x1="766" y1="507" x2="794" y2="507" stroke="#2784b8" stroke-width="4"></line><text x="804" y="510" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">校准 / 变量</text><line x1="766" y1="526" x2="794" y2="526" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="804" y="529" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">年龄不确定度</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 17B：年龄模型给出样品何时形成，校准关系给出信号与变量如何对应；二者不可合并成一个误差。</text></svg>
