rcle cx="382" cy="198" r="4" fill="#c8a27a" stroke="#c8a27a" stroke-width="1"></circle><text x="240" y="182" font-size="11" font-weight="750" text-anchor="start" fill="#c8a27a">气溶胶粒子</text><ellipse cx="282" cy="270" rx="64" ry="26" fill="#ffffff" stroke="#2784b8" stroke-width="2"></ellipse><ellipse cx="350" cy="258" rx="73" ry="31" fill="#ffffff" stroke="#2784b8" stroke-width="2"></ellipse><ellipse cx="430" cy="272" rx="70" ry="27" fill="#ffffff" stroke="#2784b8" stroke-width="2"></ellipse><ellipse cx="500" cy="260" rx="54" ry="24" fill="#ffffff" stroke="#2784b8" stroke-width="2"></ellipse><text x="388" y="311" font-size="12" font-weight="750" text-anchor="middle" fill="#2784b8">云层：滴谱、寿命、降水</text><line x1="300" y1="315" x2="295" y2="384" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><line x1="350" y1="315" x2="345" y2="384" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><line x1="400" y1="315" x2="395" y2="384" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><line x1="450" y1="315" x2="445" y2="384" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><line x1="338" y1="250" x2="278" y2="178" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><line x1="420" y1="247" x2="486" y2="176" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><text x="262" y="172" font-size="11" font-weight="800" text-anchor="start" fill="#2784b8">散射反射 ↑</text><text x="485" y="172" font-size="11" font-weight="800" text-anchor="start" fill="#2784b8">出射短波</text><line x1="546" y1="348" x2="546" y2="410" stroke="#d65a4a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-warm)"></line><text x="555" y="376" font-size="11" font-weight="750" text-anchor="middle" fill="#d65a4a" transform="rotate(90 555 376)">长波</text><text x="82" y="427" font-size="11" font-weight="700" text-anchor="start" fill="#17324d">地表短波到达量</text><text x="70" y="475" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">散射、吸收、云滴变化和降水的符号与强度依赖背景状态；全球平均冷却不是每处都成立。</text><rect x="672" y="82" width="330" height="480" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="690" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">从粒子到净效应</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">path boundaries</text><rect x="700" y="124" width="274" height="48" rx="7" fill="#eaf6fb" stroke="#2784b8" stroke-width="1"></rect><text x="837.0" y="144.25" font-size="12.5" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="837.0" dy="0">散射气溶胶</tspan><tspan x="837.0" dy="16">短波到达地表 ↓</tspan></text><line x1="837" y1="175" x2="837" y2="185" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="700" y="189" width="274" height="48" rx="7" fill="#fff0ec" stroke="#d65a4a" stroke-width="1"></rect><text x="837.0" y="209.25" font-size="12.5" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="837.0" dy="0">吸收性气溶胶</tspan><tspan x="837.0" dy="16">大气加热层改变</tspan></text><line x1="837" y1="240" x2="837" y2="250" stroke="#d65a4a" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="700" y="254" width="274" height="48" rx="7" fill="#faf5e6" stroke="#c58b20" stroke-width="1"></rect><text x="837.0" y="274.25" font-size="12.5" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="837.0" dy="0">云凝结核</tspan><tspan x="837.0" dy="16">滴数 / 反照率变化</tspan></text><line x1="837" y1="305" x2="837" y2="315" stroke="#c58b20" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="700" y="319" width="274" height="48" rx="7" fill="#f1eff8" stroke="#7666a8" stroke-width="1"></rect><text x="837.0" y="339.25" font-size="12.5" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="837.0" dy="0">云寿命与降水</tspan><tspan x="837.0" dy="16">方向依赖状态</tspan></text><text x="700" y="402" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">净项</text><text x="700" y="427" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">F_aer + F_cloud 需定义基准</text><text x="700" y="450" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">光学厚度 · 云型 · 湿度 · 垂直分布</text><rect x="748" y="468" width="226" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="762" y="488" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="762" y1="506" x2="790" y2="506" stroke="#2784b8" stroke-width="4"></line><text x="800" y="509" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">净向下减少 / 冷色</text><line x1="762" y1="525" x2="790" y2="525" stroke="#d65a4a" stroke-width="4"></line><text x="800" y="528" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">加热或长波路径</text><line x1="762" y1="544" x2="790" y2="544" stroke="#7666a8" stroke-width="4" stroke-dasharray="7 5"></line><text x="800" y="547" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">状态依赖 / 不确定</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 18B：虚线表示不能仅凭粒子数量确定的路径；辐射项仍须附参考状态、空间平均和时间窗。</text></svg>
