f" stroke-width="1"></rect><rect x="174" y="357" width="74" height="45" rx="0" fill="#2679a8" stroke="#ffffff" stroke-width="1"></rect><rect x="248" y="357" width="74" height="45" rx="0" fill="#2679a8" stroke="#ffffff" stroke-width="1"></rect><rect x="322" y="357" width="74" height="45" rx="0" fill="#2679a8" stroke="#ffffff" stroke-width="1"></rect><rect x="396" y="357" width="74" height="45" rx="0" fill="#2679a8" stroke="#ffffff" stroke-width="1"></rect><rect x="470" y="357" width="74" height="45" rx="0" fill="#2679a8" stroke="#ffffff" stroke-width="1"></rect><rect x="100" y="132" width="444" height="135" rx="0" fill="none" stroke="#2784b8" stroke-width="2"></rect><rect x="100" y="267" width="444" height="90" rx="0" fill="none" stroke="#2679a8" stroke-width="2"></rect><rect x="100" y="357" width="444" height="45" rx="0" fill="#d7e5c1" stroke="#4d8a63" stroke-width="2"></rect><text x="112" y="152" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">大气</text><text x="112" y="288" font-size="12" font-weight="750" text-anchor="start" fill="#ffffff">海洋</text><text x="112" y="384" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">陆地 / 海底</text><line x1="316" y1="150" x2="316" y2="218" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><line x1="316" y1="250" x2="316" y2="321" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><line x1="316" y1="345" x2="316" y2="420" stroke="#2679a8" stroke-width="3" marker-end="url(#arrow-deep)"></line><text x="395" y="185" font-size="11" font-weight="700" text-anchor="start" fill="#d65a4a">平流 / 辐射</text><text x="395" y="285" font-size="11" font-weight="700" text-anchor="start" fill="#2784b8">混合 / 热输送</text><text x="395" y="383" font-size="11" font-weight="700" text-anchor="start" fill="#4d8a63">碳 / 营养交换</text><path d="M 150 236 C 222 212, 299 229, 386 213" fill="none" stroke="#c58b20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"></path><path d="M 180 338 C 257 315, 328 340, 422 320" fill="none" stroke="#c58b20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"></path><text x="444" y="217" font-size="11" font-weight="750" text-anchor="start" fill="#c58b20">云、对流</text><text x="444" y="325" font-size="11" font-weight="750" text-anchor="start" fill="#c58b20">湍流、沉降</text><text x="100" y="444" font-size="12" font-weight="750" text-anchor="start" fill="#5f7182">网格平均状态</text><text x="100" y="469" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">ū, T̄, q̄  →  守恒推进</text><text x="58" y="510" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">格点和柱高是示意；一格内仍可能包含未解析的云、对流和地形。</text><rect x="670" y="82" width="332" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="688" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">分辨率的代价与边界</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">Δx and subgrid</text><text x="696" y="132" font-size="21" font-weight="850" text-anchor="start" fill="#17324d">N_cell ∝ Δx⁻³</text><text x="696" y="158" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">三维格点数量的教学量级关系</text><line x1="696" y1="178" x2="976" y2="178" stroke="#dbe5ec" stroke-width="1"></line><rect x="696" y="202" width="280" height="58" rx="7" fill="#eaf6fb" stroke="#2784b8" stroke-width="1"></rect><text x="836.0" y="226.92" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="836.0" dy="0">已解析</tspan><tspan x="836.0" dy="17">网格平均输送与收支</tspan></text><line x1="836" y1="265" x2="836" y2="284" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="696" y="288" width="280" height="58" rx="7" fill="#faf5e6" stroke="#c58b20" stroke-width="1"></rect><text x="836.0" y="312.92" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="836.0" dy="0">未解析</tspan><tspan x="836.0" dy="17">云 · 对流 · 湍流 · 地形</tspan></text><path d="M 836 351 C 836 372, 800 381, 758 390" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"></path><text x="696" y="393" font-size="13" font-weight="800" text-anchor="start" fill="#c58b20">参数化是受约束的子模型</text><text x="696" y="423" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">守恒残差、时间步长和边界条件仍要验证。</text><rect x="750" y="442" width="226" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="764" y="462" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="764" y1="480" x2="792" y2="480" stroke="#2784b8" stroke-width="4"></line><text x="802" y="483" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">解析输送</text><line x1="764" y1="499" x2="792" y2="499" stroke="#2679a8" stroke-width="4"></line><text x="802" y="502" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">热 / 水 / 碳路径</text><line x1="764" y1="518" x2="792" y2="518" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="802" y="521" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">亚网格参数化</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 20B：网格变细会移动解析边界并增加计算量，但不会自动消除参数化或结构误差。</text></svg>
