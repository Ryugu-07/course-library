</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">外部强迫沿不同路径进入能量收支</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">18 · 空间结构 | Forcing pathways</text><rect x="38" y="82" width="590" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">从排放源到全球辐射账本</text><text x="610" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">sign convention: downward +</text><rect x="60" y="184" width="546" height="58" rx="7" fill="#edf7fb" stroke="#2784b8" stroke-width="1"></rect><text x="82" y="208" font-size="14" font-weight="800" text-anchor="start" fill="#17324d">大气与地表快速调整层</text><text x="82" y="229" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">辐射传输、云、地表反照率和化学组成</text><rect x="60" y="258" width="546" height="200" rx="7" fill="#bfe2f2" stroke="#a9bac8" stroke-width="1"></rect><line x1="151.0" y1="258" x2="151.0" y2="458" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="242.0" y1="258" x2="242.0" y2="458" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="333.0" y1="258" x2="333.0" y2="458" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="424.0" y1="258" x2="424.0" y2="458" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="515.0" y1="258" x2="515.0" y2="458" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="60" y1="424.6666666666667" x2="606" y2="424.6666666666667" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="60" y1="391.3333333333333" x2="606" y2="391.3333333333333" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="60" y1="358.0" x2="606" y2="358.0" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="60" y1="324.66666666666663" x2="606" y2="324.66666666666663" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="60" y1="291.3333333333333" x2="606" y2="291.3333333333333" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><polygon points="78.2,280.2 113.1,280.2 143.4,293.6 173.8,300.2 207.1,329.1 184.4,341.3 154.0,331.3 135.8,308.0 90.3,295.8" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="208.6,344.7 232.9,349.1 260.2,366.9 252.6,389.1 229.9,419.1 214.7,398.0" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="314.8,278.0 396.7,278.0 463.4,288.0 533.2,302.4 575.7,293.6 599.9,311.3 554.4,349.1 501.4,353.6 451.3,335.8 401.2,320.2 369.4,323.6 343.6,311.3 317.8,318.0 296.6,294.7" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="305.7,319.1 351.2,316.9 396.7,344.7 381.5,396.9 354.2,396.9 326.9,352.4" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="502.9,370.2 566.6,371.3 560.5,402.4 508.9,396.9" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="254.1,266.9 299.6,271.3 287.5,290.2 260.2,291.3" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="402.8,372.4 410.4,375.8 407.3,385.8 399.7,382.4" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><text x="72" y="280" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">空间分布不同，不能只看全球合计</text><rect x="92" y="130" width="156" height="38" rx="7" fill="#ffffff" stroke="#d65a4a" stroke-width="2"></rect><text x="106" y="155" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">CO₂ / 长寿命</text><text x="233" y="156" font-size="18" font-weight="800" text-anchor="end" fill="#d65a4a">+</text><rect x="276" y="130" width="156" height="38" rx="7" fill="#ffffff" stroke="#2784b8" stroke-width="2"></rect><text x="290" y="155" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">气溶胶 / 区域</text><text x="417" y="156" font-size="18" font-weight="800" text-anchor="end" fill="#2784b8">−</text><rect x="460" y="130" width="126" height="38" rx="7" fill="#ffffff" stroke="#c58b20" stroke-width="2"></rect><text x="474" y="155" font-size="12" font-weight="750" text-anchor="start" fill="#17324d">太阳</text><text x="571" y="156" font-size="18" font-weight="800" text-anchor="end" fill="#c58b20">±</text><line x1="170" y1="168" x2="170" y2="180" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><line x1="354" y1="168" x2="354" y2="180" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><line x1="523" y1="168" x2="523" y2="180" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><path d="M 182 294 C 252 280, 320 282, 382 294" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><path d="M 440 332 C 493 328, 534 348, 562 374" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><text x="202" y="290" font-size="11" font-weight="700" text-anchor="start" fill="#d65a4a">全球混合（示意）</text><text x="438" y="370" font-size="11" font-weight="700" text-anchor="start" fill="#2784b8">区域 / 垂直分布</text><text x="66" y="490" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">几何表示覆盖与路径类别；源强、区域面积和全球平均不按图面比例。</text><rect x="650" y="82" width="352" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="668" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">强迫账本：输入先于响应</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">W/m²</text><text x="674" y="124" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">项</text><text x="904" y="124" font-size="13" font-weight="750" text-anchor="end" fill="#5f7182">符号</text><line x1="674" y1="136" x2="978" y2="136" stroke="#dbe5ec" stroke-width="1"></line><line x1="674" y1="158" x2="704" y2="158" stroke="#d65a4a" stroke-width="4"></line><text x="718" y="164" font-size="12.5" font-weight="700" text-anchor="start" fill="#17324d">CO₂ 直接项</text><text x="966" y="164" font-size="14" font-weight="800" text-anchor="end" fill="#d65a4a">+2.17</text><line x1="674" y1="179" x2="978" y2="179" stroke="#dbe5ec" stroke-width="1"></line><line x1="674" y1="201" x2="704" y2="201" stroke="#2784b8" stroke-width="4"></line><text x="718" y="207" font-size="12.5" font-weight="700" text-anchor="start" fill="#17324d">气溶胶直接项</text><text x="966" y="207" font-size="14" font-weight="800" text-anchor="end" fill="#2784b8">−0.40</text><line x1="674" y1="222" x2="978" y2="222" stroke="#dbe5ec" stroke-width="1"></line><line x1="674" y1="244" x2="704" y2="244" stroke="#2784b8" stroke-width="4" stroke-dasharray="7 5"></line><text x="718" y="250" font-size="12.5" font-weight="700" text-anchor="start" fill="#17324d">云快速调整</text><text x="966" y="250" font-size="14" font-weight="800" text-anchor="end" fill="#2784b8">−0.60</text><line x1="674" y1="265" x2="978" y2="265" stroke="#dbe5ec" stroke-width="1"></line><line x1="674" y1="287" x2="704" y2="287" stroke="#c58b20" stroke-width="4"></line><text x="718" y="293" font-size="12.5" font-weight="700" text-anchor="start" fill="#17324d">太阳 / 地表</text><text x="966" y="293" font-size="14" font-weight="800" text-anchor="end" fill="#c58b20">±</text><line x1="674" y1="308" x2="978" y2="308" stroke="#dbe5ec" stroke-width="1"></line><text x="674" y="356" font-size="16" font-weight="800" text-anchor="start" fill="#17324d">F_ERF = 直接项 + 快速调整</text><text x="674" y="378" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">约 +1.07（教学合计，尚未是温度）</text><line x1="710" y1="407" x2="774" y2="407" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><rect x="780" y="384" width="74" height="46" rx="7" fill="#fff0ec" stroke="#d65a4a" stroke-width="1"></rect><text x="817.0" y="403.58" font-size="12" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="817.0" dy="0">F</tspan><tspan x="817.0" dy="15">强迫</tspan></text><line x1="862" y1="407" x2="924" y2="407" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="930" y="384" width="48" height="46" rx="7" fill="#eaf6fb" stroke="#2784b8" stroke-width="1"></rect><text x="954.0" y="403.74" font-size="11" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="954.0" dy="0">N</tspan><tspan x="954.0" dy="14">收支</tspan></text><rect x="738" y="440" width="240" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="752" y="460" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="752" y1="478" x2="780" y2="478" stroke="#d65a4a" stroke-width="4"></line><text x="790" y="481" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">正：净向下辐射</text><line x1="752" y1="497" x2="780" y2="497" stroke="#2784b8" stroke-width="4"></line><text x="790" y="500" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">负：净向下辐射</text><line x1="752" y1="516" x2="780" y2="516" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="790" y="519" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">快速调整 / 定义依赖</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 18A：同一单位 W/m² 不代表同一寿命、区域分布或因果位置；强迫不是温度响应。</text></svg>
