<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">指纹回归：检测不等于归因</title><desc id="svg-desc">教学示意把合成异常序列、内部变率带和外部强迫指纹放在同一证据图中，并以向量投影说明检测与归因的区别；数值与几何均非真实观测。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
