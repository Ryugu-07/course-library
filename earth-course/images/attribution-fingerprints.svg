dth="4"></line><text x="286" y="488" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">指纹 x</text><rect x="380" y="475" width="28" height="14" rx="3" fill="#aebac4" stroke="none" stroke-width="1"></rect><text x="418" y="488" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">零假设带</text><rect x="596" y="82" width="406" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="614" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">从信号到系数</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">投影 + 区间</text><text x="622" y="126" font-size="14" font-weight="700" text-anchor="start" fill="#5f7182">向量空间中的一致度</text><line x1="668" y1="354" x2="928" y2="354" stroke="#dbe5ec" stroke-width="1.5"></line><line x1="724" y1="408" x2="724" y2="166" stroke="#dbe5ec" stroke-width="1.5"></line><line x1="724" y1="354" x2="880" y2="239" stroke="#d65a4a" stroke-width="4" marker-end="url(#arrow-warm)"></line><line x1="724" y1="354" x2="906" y2="316" stroke="#2784b8" stroke-width="4" marker-end="url(#arrow-cool)"></line><line x1="880" y1="239" x2="906" y2="316" stroke="#c58b20" stroke-width="2" stroke-dasharray="7 5"></line><text x="882" y="228" font-size="15" font-weight="800" text-anchor="start" fill="#d65a4a">y</text><text x="910" y="334" font-size="15" font-weight="800" text-anchor="start" fill="#2784b8">x</text><text x="800" y="333" font-size="16" font-weight="800" text-anchor="start" fill="#c58b20">ρ</text><text x="784" y="383" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182">投影长度 → β̂</text><rect x="622" y="142" width="160" height="66" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="702.0" y="170.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="702.0" dy="0">检测</tspan><tspan x="702.0" dy="19">信号超出零假设？</tspan></text><rect x="804" y="142" width="160" height="66" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="884.0" y="170.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="884.0" dy="0">归因</tspan><tspan x="884.0" dy="19">与指纹相容？</tspan></text><text x="622" y="454" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">β̂ = (xᵀy)/(xᵀx)</text><text x="622" y="480" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">ρ、Σ、时间窗与零假设共同限定解释。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">序列、向量和箭头为合成教学示意，不按观测时间或量值比例绘制；归因结果不提供事件预报。</text></svg>
