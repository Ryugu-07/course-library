</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">海岸沉积单元</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">09 / spatial structure</text><rect x="28" y="86" width="620" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="46" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Coastal planform</text><text x="630" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">source -&gt; pathway -&gt; storage -&gt; sink</text><rect x="48" y="127" width="580" height="354" rx="0" fill="#bfe2f2" stroke="#a9bac8" stroke-width="1"></rect><polygon points="48.0,127.0 240.0,127.0 267.0,170.0 246.0,215.0 282.0,261.0 247.0,308.0 268.0,362.0 236.0,481.0 48.0,481.0" fill="#d7e5c1" stroke="#82936f" stroke-width="1.5"></polygon><path d="M240,127 C267,170 246,215 282,261 C247,308 268,362 236,481" fill="none" stroke="#82936f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><polygon points="282.0,261.0 345.0,241.0 418.0,246.0 492.0,270.0 492.0,291.0 418.0,277.0 345.0,279.0" fill="#d8edf1" stroke="#2784b8" stroke-width="1.2"></polygon><text x="358" y="255" font-size="11" font-weight="700" text-anchor="start" fill="#2679a8">active profile / beach</text><path d="M82,180 C140,196 182,225 219,250 C244,267 262,264 285,260" fill="none" stroke="#2784b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><text x="90" y="170" font-size="12" font-weight="700" text-anchor="start" fill="#2784b8">river input</text><path d="M300,174 C360,154 420,164 475,190" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><path d="M300,350 C366,370 430,359 500,337" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><text x="386" y="154" font-size="12" font-weight="700" text-anchor="start" fill="#d65a4a">longshore drift</text><text x="411" y="382" font-size="11" font-weight="500" text-anchor="start" fill="#d65a4a">wave-driven path</text><path d="M315,438 C380,420 450,426 548,443" fill="none" stroke="#2679a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-deep)"></path><text x="420" y="464" font-size="11" font-weight="500" text-anchor="start" fill="#2679a8">offshore export / shelf</text><path d="M500,196 l28,18 l28,-18" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"></path><path d="M500,222 l28,18 l28,-18" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"></path><path d="M500,248 l28,18 l28,-18" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"></path><text x="72" y="450" font-size="12" font-weight="700" text-anchor="start" fill="#82936f">land</text><rect x="672" y="86" width="340" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="690" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Sediment-cell ledger</text><text x="994" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">boundary sets sign</text><rect x="702" y="132" width="280" height="54" rx="7" fill="#eef7fb" stroke="#dbe5ec" stroke-width="1"></rect><rect x="702" y="132" width="6" height="54" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="842.0" y="157" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">Qin</text><text x="842.0" y="179" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="842.0" dy="0">river and cliff input</tspan></text><rect x="702" y="202" width="280" height="54" rx="7" fill="#fff1ed" stroke="#dbe5ec" stroke-width="1"></rect><rect x="702" y="202" width="6" height="54" rx="3" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></rect><text x="842.0" y="227" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">Qalong</text><text x="842.0" y="249" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="842.0" dy="0">alongshore transfer</tspan></text><rect x="702" y="272" width="280" height="54" rx="7" fill="#fff8e9" stroke="#dbe5ec" stroke-width="1"></rect><rect x="702" y="272" width="6" height="54" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="842.0" y="297" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">Qs</text><text x="842.0" y="319" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="842.0" dy="0">beach / dune storage</tspan></text><rect x="702" y="342" width="280" height="54" rx="7" fill="#edf1fa" stroke="#dbe5ec" stroke-width="1"></rect><rect x="702" y="342" width="6" height="54" rx="3" fill="#2679a8" stroke="#2679a8" stroke-width="1"></rect><text x="842.0" y="367" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">Qout</text><text x="842.0" y="389" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="842.0" dy="0">shelf export or dredging</tspan></text><text x="702" y="430" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">dVs/dt = Qin - Qout + Qnour - Qdredge</text><text x="702" y="459" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">positive net storage can move a shoreline seaward</text><rect x="42" y="520" width="28" height="14" rx="3" fill="#bfe2f2" stroke="none" stroke-width="1"></rect><text x="80" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">water / wave field</text><rect x="235" y="520" width="28" height="14" rx="3" fill="#d7e5c1" stroke="none" stroke-width="1"></rect><text x="273" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">land</text><line x1="365" y1="530" x2="393" y2="530" stroke="#d65a4a" stroke-width="4"></line><text x="403" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">sediment transport</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">SCHEMATIC / NON-NAVIGATION / planform is a teaching boundary, not a coastal chart</text></svg>
