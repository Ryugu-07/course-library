<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">岩石循环连接地表与深部</title><desc id="svg-desc">景观剖面示意把抬升、风化、沉积、埋藏、熔融和火山作用放进同一空间；地形、地层和深度均非等比例。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">岩石循环连接地表与深部</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">05 · 空间结构 | Rock-cycle landscape</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">一个景观中的多种储库</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">地表—地下剖面示意 / landscape section</text><rect x="58" y="122" width="924" height="128" rx="0" fill="#eaf7fb" stroke="none" stroke-width="1"></rect><path d="M 58 282 L 160 216 L 250 268 L 350 198 L 430 279 L 568 224 L 690 293 L 805 244 L 982 286 L 982 430 L 58 430 Z" fill="#d7e5c1" stroke="#82936f" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path><polygon points="160.0,216.0 219.0,172.0 282.0,260.0 250.0,268.0" fill="#c8a27a" stroke="#92765e" stroke-width="1"></polygon><polygon points="690.0,293.0 805.0,244.0 982.0,286.0 982.0,430.0 690.0,430.0" fill="#d9c09b" stroke="#92765e" stroke-width="1"></polygon><path d="M 535 270 C 548 235, 573 208, 596 170 C 617 207, 641 236, 654 282 L 654 430 L 535 430 Z" fill="#dc805f" stroke="#ad5c49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 584 173 C 588 146, 595 136, 600 119 C 605 139, 614 148, 618 174" fill="none" stroke="#d65a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><text x="568" y="151" font-size="14" font-weight="800" text-anchor="start" fill="#d65a4a">火山</text><text x="564" y="168" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">magma</text><text x="105" y="317" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">山地 / 抬升</text><text x="741" y="333" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">沉积盆地</text><text x="741" y="351" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">sediment</text><text x="563" y="403" font-size="13" font-weight="750" text-anchor="start" fill="#ffffff">深部熔融区</text><text x="86" y="249" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">大气输入</text><path d="M 246 255 C 290 276, 328 294, 394 309" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><text x="280" y="281" font-size="11" font-weight="700" text-anchor="start" fill="#2784b8">风化</text><path d="M 413 315 C 500 322, 606 334, 726 335" fill="none" stroke="#c58b20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gold)"></path><text x="503" y="307" font-size="11" font-weight="700" text-anchor="start" fill="#c58b20">搬运 / transport</text><path d="M 765 355 C 711 395, 681 412, 641 415" fill="none" stroke="#7666a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-violet)"></path><text x="704" y="408" font-size="11" font-weight="700" text-anchor="start" fill="#7666a8">埋藏 / burial</text><path d="M 610 288 C 595 267, 597 241, 602 215" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><text x="620" y="254" font-size="11" font-weight="700" text-anchor="start" fill="#d65a4a">熔融</text><path d="M 630 175 C 660 213, 680 245, 711 276" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><text x="667" y="215" font-size="11" font-weight="700" text-anchor="start" fill="#d65a4a">火山作用</text><rect x="734" y="114" width="236" height="103" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="748" y="136" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><rect x="748" y="148" width="28" height="14" rx="3" fill="#c8a27a" stroke="none" stroke-width="1"></rect><text x="786" y="161" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">固体储库</text><line x1="748" y1="181" x2="776" y2="181" stroke="#c58b20" stroke-width="4"></line><text x="786" y="184" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">搬运通量</text><line x1="748" y1="204" x2="776" y2="204" stroke="#d65a4a" stroke-width="4"></line><text x="786" y="207" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">深部过程</text><text x="62" y="486" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">景观剖面为示意；地形起伏、地层厚度与地下深度非等比例。</text></svg>
