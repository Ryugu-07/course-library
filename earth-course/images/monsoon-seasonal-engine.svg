" x2="327" y2="163" stroke="#c58b20" stroke-width="2"></line><line x1="374" y1="250" x2="374" y2="304" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><text x="393" y="278" font-size="11" font-weight="700" text-anchor="start" fill="#c58b20">strong heating</text><circle cx="373" cy="296" r="21" fill="#fff1ed" stroke="#d65a4a" stroke-width="2"></circle><text x="373" y="301" font-size="16" font-weight="800" text-anchor="middle" fill="#d65a4a">L</text><line x1="120" y1="324" x2="310" y2="324" stroke="#2784b8" stroke-width="4" marker-end="url(#arrow-cool)"></line><text x="215" y="310" font-size="11.5" font-weight="750" text-anchor="middle" fill="#2784b8">moist onshore flow</text><line x1="373" y1="331" x2="373" y2="276" stroke="#d65a4a" stroke-width="2.8" marker-end="url(#arrow-warm)"></line><line x1="343" y1="291" x2="339" y2="308" stroke="#2784b8" stroke-width="2"></line><line x1="363" y1="291" x2="359" y2="308" stroke="#2784b8" stroke-width="2"></line><line x1="383" y1="291" x2="379" y2="308" stroke="#2784b8" stroke-width="2"></line><line x1="403" y1="291" x2="399" y2="308" stroke="#2784b8" stroke-width="2"></line><text x="373" y="271" font-size="11" font-weight="750" text-anchor="middle" fill="#2784b8">rising air + rain</text><text x="263" y="430" font-size="13" font-weight="750" text-anchor="middle" fill="#d65a4a">NH summer: ocean -&gt; land</text><text x="263" y="454" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182">land low pressure draws moisture inland</text><rect x="540" y="86" width="472" height="398" rx="8" fill="#fbfdfe" stroke="#dbe5ec" stroke-width="1"></rect><text x="776" y="120" font-size="19" font-weight="800" text-anchor="middle" fill="#2784b8">NH winter / 冬季</text><text x="776" y="143" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182">land-sea thermal contrast</text><rect x="560" y="186" width="432" height="210" rx="0" fill="#dff1f7" stroke="#a9bac8" stroke-width="1"></rect><rect x="560" y="336" width="200" height="60" rx="0" fill="#bfe2f2" stroke="#2679a8" stroke-width="1"></rect><polygon points="760.0,321.0 992.0,291.0 992.0,396.0 760.0,396.0" fill="#dbe7d2" stroke="#82936f" stroke-width="1.2"></polygon><line x1="560" y1="336" x2="992" y2="336" stroke="#2679a8" stroke-width="2"></line><text x="652" y="385" font-size="12" font-weight="750" text-anchor="middle" fill="#2679a8">ocean</text><text x="875" y="385" font-size="12" font-weight="750" text-anchor="middle" fill="#82936f">land</text><circle cx="645" cy="221" r="18" fill="#f8cf67" stroke="#c58b20" stroke-width="2"></circle><line x1="645" y1="195" x2="645" y2="181" stroke="#c58b20" stroke-width="2"></line><line x1="671" y1="195" x2="685" y2="181" stroke="#c58b20" stroke-width="2"></line><line x1="671" y1="221" x2="685" y2="221" stroke="#c58b20" stroke-width="2"></line><line x1="671" y1="247" x2="685" y2="261" stroke="#c58b20" stroke-width="2"></line><line x1="645" y1="247" x2="645" y2="261" stroke="#c58b20" stroke-width="2"></line><line x1="619" y1="247" x2="605" y2="261" stroke="#c58b20" stroke-width="2"></line><line x1="619" y1="221" x2="605" y2="221" stroke="#c58b20" stroke-width="2"></line><line x1="619" y1="195" x2="605" y2="181" stroke="#c58b20" stroke-width="2"></line><line x1="645" y1="251" x2="645" y2="293" stroke="#c58b20" stroke-width="2.2" marker-end="url(#arrow-gold)"></line><text x="675" y="276" font-size="11" font-weight="700" text-anchor="start" fill="#c58b20">weaker heating</text><circle cx="885" cy="296" r="21" fill="#eef7fb" stroke="#2784b8" stroke-width="2"></circle><text x="885" y="301" font-size="16" font-weight="800" text-anchor="middle" fill="#2784b8">H</text><line x1="822" y1="324" x2="632" y2="324" stroke="#2784b8" stroke-width="4" marker-end="url(#arrow-cool)"></line><text x="727" y="310" font-size="11.5" font-weight="750" text-anchor="middle" fill="#2784b8">dry offshore flow</text><line x1="885" y1="276" x2="885" y2="331" stroke="#2784b8" stroke-width="2.8" marker-end="url(#arrow-cool)"></line><text x="885" y="271" font-size="11" font-weight="750" text-anchor="middle" fill="#2784b8">subsidence / drier land</text><text x="775" y="430" font-size="13" font-weight="750" text-anchor="middle" fill="#2784b8">NH winter: land -&gt; ocean</text><text x="775" y="454" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182">cool land high pressure reverses the flow</text><text x="28" y="514" font-size="12.5" font-weight="750" text-anchor="start" fill="#c58b20">seasonal heating</text><line x1="140" y1="509" x2="250" y2="509" stroke="#c58b20" stroke-width="2.5" marker-end="url(#arrow-gold)"></line><rect x="255" y="486" width="170" height="48" rx="7" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><rect x="255" y="486" width="6" height="48" rx="3" fill="#7666a8" stroke="#7666a8" stroke-width="1"></rect><text x="340.0" y="511" font-size="13.5" font-weight="750" text-anchor="middle" fill="#17324d">pressure gradient</text><text x="340.0" y="533" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="340.0" dy="0">low / high contrast</tspan></text><line x1="430" y1="509" x2="540" y2="509" stroke="#7666a8" stroke-width="2.5" marker-end="url(#arrow-violet)"></line><rect x="545" y="486" width="170" height="48" rx="7" fill="#eef7fb" stroke="#9edff2" stroke-width="1"></rect><rect x="545" y="486" width="6" height="48" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="630.0" y="511" font-size="13.5" font-weight="750" text-anchor="middle" fill="#17324d">wind reversal</text><text x="630.0" y="533" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="630.0" dy="0">onshore / offshore</tspan></text><line x1="720" y1="509" x2="830" y2="509" stroke="#2784b8" stroke-width="2.5" marker-end="url(#arrow-cool)"></line><rect x="835" y="486" width="170" height="48" rx="7" fill="#fff1ed" stroke="#e5b1a9" stroke-width="1"></rect><rect x="835" y="486" width="6" height="48" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="920.0" y="511" font-size="13.5" font-weight="750" text-anchor="middle" fill="#17324d">rainfall shift</text><text x="920.0" y="533" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="920.0" dy="0">regional response</tspan></text><line x1="40" y1="560" x2="68" y2="560" stroke="#c58b20" stroke-width="4"></line><text x="78" y="563" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">heating / pressure</text><line x1="235" y1="560" x2="263" y2="560" stroke="#2784b8" stroke-width="4"></line><text x="273" y="563" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">moist onshore flow</text><line x1="455" y1="560" x2="483" y2="560" stroke="#2784b8" stroke-width="4"></line><text x="493" y="563" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">dry offshore flow</text><text x="1000" y="568" font-size="11" font-weight="500" text-anchor="end" fill="#5f7182">ENSO can modulate regional probability; it does not set one universal sign.</text></svg>
