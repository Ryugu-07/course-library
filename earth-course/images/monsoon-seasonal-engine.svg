<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Monsoon seasonal engine: a pressure-gradient reversal</title><desc id="svg-desc">A paired Northern Hemisphere summer and winter cross-section shows land-sea heating contrast, pressure reversal, wind reversal, rising or sinking air, and the resulting precipitation redistribution.</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
