<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Glacier mass balance: accumulation, flow, and ablation</title><desc id="svg-desc">A glacier cross-section shows the equilibrium line and mass-balance terms, with separate branches for the land-ice sea-level ledger and the surface-albedo energy ledger.</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">冰川质量平衡</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">08 / process mechanism</text><rect x="32" y="86" width="626" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="50" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Glacier cross-section</text><text x="640" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">mass in, mass out, and transport</text><rect x="55" y="128" width="580" height="320" rx="0" fill="#dff1f7" stroke="none" stroke-width="1"></rect><polygon points="55.0,447.0 110.0,385.0 170.0,300.0 230.0,235.0 285.0,274.0 365.0,330.0 450.0,376.0 540.0,416.0 635.0,447.0" fill="#c8a27a" stroke="#82936f" stroke-width="1.4"></polygon><path d="M108,385 C150,330 188,276 230,258 C285,235 320,303 367,332 C420,364 478,390 545,420 L585,447 L190,447 C160,427 130,407 108,385 Z" fill="#e9f8ff" stroke="#2784b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="78" y1="319" x2="608" y2="319" stroke="#7666a8" stroke-width="1.5" stroke-dasharray="7 5"></line><text x="82" y="313" font-size="11" font-weight="700" text-anchor="start" fill="#7666a8">equilibrium line / 平衡线</text><text x="120" y="205" font-size="15" font-weight="750" text-anchor="start" fill="#2784b8">积累区</text><text x="470" y="395" font-size="15" font-weight="750" text-anchor="start" fill="#d65a4a">消融区</text><line x1="160" y1="160" x2="198" y2="255" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><text x="106" y="154" font-size="12" font-weight="500" text-anchor="start" fill="#2784b8">snowfall + accumulation</text><line x1="312" y1="304" x2="410" y2="365" stroke="#2679a8" stroke-width="3" marker-end="url(#arrow-deep)"></line><text x="330" y="292" font-size="12" font-weight="500" text-anchor="start" fill="#2679a8">ice flow</text><line x1="468" y1="318" x2="500" y2="400" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><text x="495" y="332" font-size="12" font-weight="500" text-anchor="start" fill="#d65a4a">melt + runoff</text><line x1="570" y1="445" x2="615" y2="445" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><text x="515" y="470" font-size="12" font-weight="500" text-anchor="start" fill="#2784b8">outlet</text><text x="66" y="430" font-size="11" font-weight="500" text-anchor="start" fill="#82936f">bedrock</text><rect x="680" y="86" width="332" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="698" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Two ledgers</text><text x="994" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">same glacier, different questions</text><rect x="704" y="132" width="284" height="72" rx="7" fill="#eef7fb" stroke="#9edff2" stroke-width="1"></rect><rect x="704" y="132" width="6" height="72" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="846.0" y="157" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d">dM/dt = accumulation - ablation + flow</text><text x="846.0" y="179" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">mass budget; signs must be defined</tspan></text><line x1="846" y1="205" x2="846" y2="238" stroke="#2784b8" stroke-width="2.5" marker-end="url(#arrow-cool)"></line><rect x="704" y="240" width="284" height="82" rx="7" fill="#fff1ed" stroke="#e5b1a9" stroke-width="1"></rect><rect x="704" y="240" width="6" height="82" rx="3" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></rect><text x="846.0" y="265" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">land ice -&gt; sea-level ledger</text><text x="846.0" y="287" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">extra mass enters the ocean after melt</tspan></text><line x1="846" y1="323" x2="846" y2="356" stroke="#d65a4a" stroke-width="2.5" marker-end="url(#arrow-warm)"></line><rect x="704" y="358" width="284" height="82" rx="7" fill="#fff8e9" stroke="#e6cf93" stroke-width="1"></rect><rect x="704" y="358" width="6" height="82" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="846.0" y="383" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">snow / ice surface -&gt; albedo ledger</text><text x="846.0" y="405" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">brightness changes absorbed shortwave</tspan></text><text x="704" y="473" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">Floating sea ice is a different control volume.</text><line x1="38" y1="540" x2="66" y2="540" stroke="#2784b8" stroke-width="4"></line><text x="76" y="543" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">accumulation</text><line x1="210" y1="540" x2="238" y2="540" stroke="#2679a8" stroke-width="4"></line><text x="248" y="543" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">flow / transport</text><line x1="380" y1="540" x2="408" y2="540" stroke="#d65a4a" stroke-width="4"></line><text x="418" y="543" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">ablation / melt</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">A schematic budget: glacier geometry and rates are not observations or forecasts</text></svg>
