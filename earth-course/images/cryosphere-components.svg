</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">冰冻圈的四个储库</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">08 / spatial structure</text><rect x="28" y="88" width="500" height="372" rx="7" fill="#bfe2f2" stroke="#a9bac8" stroke-width="1"></rect><line x1="111.33333333333333" y1="88" x2="111.33333333333333" y2="460" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="194.66666666666666" y1="88" x2="194.66666666666666" y2="460" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="278.0" y1="88" x2="278.0" y2="460" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="361.3333333333333" y1="88" x2="361.3333333333333" y2="460" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="444.6666666666667" y1="88" x2="444.6666666666667" y2="460" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="28" y1="398.0" x2="528" y2="398.0" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="28" y1="336.0" x2="528" y2="336.0" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="28" y1="274.0" x2="528" y2="274.0" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="28" y1="212.0" x2="528" y2="212.0" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><line x1="28" y1="150.0" x2="528" y2="150.0" stroke="#ffffff" stroke-width="1" opacity="0.65"></line><polygon points="44.7,129.3 76.6,129.3 104.4,154.1 132.2,166.5 162.7,220.3 141.9,243.0 114.1,224.4 97.4,181.0 55.8,158.3" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="164.1,249.2 186.3,257.5 211.3,290.5 204.4,331.9 183.6,387.7 169.7,348.4" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="261.3,125.2 336.3,125.2 397.4,143.8 461.3,170.7 500.2,154.1 522.4,187.2 480.8,257.5 432.2,265.7 386.3,232.7 340.5,203.7 311.3,209.9 287.7,187.2 264.1,199.6 244.7,156.2" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="253.0,201.7 294.7,197.5 336.3,249.2 322.4,346.3 297.4,346.3 272.4,263.7" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="433.6,296.7 491.9,298.8 486.3,356.7 439.1,346.3" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="205.8,104.5 247.4,112.8 236.3,147.9 211.3,150.0" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><polygon points="341.9,300.9 348.8,307.1 346.1,325.7 339.1,319.5" fill="#d7e5c1" stroke="#82936f" stroke-width="0.8"></polygon><text x="40" y="110" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">Global cryosphere: schematic teaching map</text><circle cx="219.66666666666669" cy="125.2" r="8" fill="#9edff2" stroke="#2679a8" stroke-width="1.5"></circle><text x="230.66666666666669" y="129.2" font-size="11" font-weight="500" text-anchor="start" fill="#17324d">ice sheet</text><circle cx="298.8333333333333" cy="133.46666666666667" r="8" fill="#d8f5fb" stroke="#2679a8" stroke-width="1.5"></circle><text x="309.8333333333333" y="137.46666666666667" font-size="11" font-weight="500" text-anchor="start" fill="#17324d">sea ice</text><circle cx="397.44444444444446" cy="133.46666666666667" r="8" fill="#d8f5fb" stroke="#2679a8" stroke-width="1.5"></circle><text x="408.44444444444446" y="137.46666666666667" font-size="11" font-weight="500" text-anchor="start" fill="#17324d">sea ice</text><circle cx="391.88888888888886" cy="212.0" r="8" fill="#2784b8" stroke="#2679a8" stroke-width="1.5"></circle><text x="402.88888888888886" y="216.0" font-size="11" font-weight="500" text-anchor="start" fill="#17324d">glacier</text><circle cx="125.22222222222223" cy="170.66666666666666" r="8" fill="#ffffff" stroke="#2679a8" stroke-width="1.5"></circle><text x="136.22222222222223" y="174.66666666666666" font-size="11" font-weight="500" text-anchor="start" fill="#17324d">snow</text><circle cx="278.0" cy="422.8" r="8" fill="#9edff2" stroke="#2679a8" stroke-width="1.5"></circle><text x="289.0" y="426.8" font-size="11" font-weight="500" text-anchor="start" fill="#17324d">ice sheet</text><rect x="554" y="88" width="458" height="372" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="572" y="118" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Component key</text><text x="994" y="117" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">same substance, different control volume</text><rect x="575" y="130" width="18" height="48" rx="3" fill="#ffffff" stroke="#2679a8" stroke-width="1.2"></rect><text x="610" y="150" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">季节性积雪 / seasonal snow</text><text x="610" y="170" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">months to years | water stored near the surface</text><text x="972" y="151" font-size="11" font-weight="700" text-anchor="end" fill="#4d8a63">短时水文储库</text><rect x="575" y="208" width="18" height="48" rx="3" fill="#9edff2" stroke="#2679a8" stroke-width="1.2"></rect><text x="610" y="228" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">山地冰川 / mountain glacier</text><text x="610" y="248" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">accumulation, flow, ablation | runoff source</text><text x="972" y="229" font-size="11" font-weight="700" text-anchor="end" fill="#2784b8">陆地冰</text><rect x="575" y="286" width="18" height="48" rx="3" fill="#c9eef8" stroke="#2679a8" stroke-width="1.2"></rect><text x="610" y="306" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">冰盖与冰架 / ice sheet + shelf</text><text x="610" y="326" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">continental ice | long dynamical memory</text><text x="972" y="307" font-size="11" font-weight="700" text-anchor="end" fill="#2784b8">陆地冰 / floating edge</text><rect x="575" y="364" width="18" height="48" rx="3" fill="#d8f5fb" stroke="#2679a8" stroke-width="1.2"></rect><text x="610" y="384" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">海冰 / sea ice</text><text x="610" y="404" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">frozen seawater | drift, melt ponds, salt flux</text><text x="972" y="385" font-size="11" font-weight="700" text-anchor="end" fill="#4d8a63">浮冰</text><rect x="40" y="490" width="28" height="14" rx="3" fill="#d7e5c1" stroke="none" stroke-width="1"></rect><text x="78" y="503" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">land / ice-covered land</text><rect x="265" y="490" width="28" height="14" rx="3" fill="#bfe2f2" stroke="none" stroke-width="1"></rect><text x="303" y="503" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">ocean / floating ice context</text><rect x="520" y="490" width="28" height="14" rx="3" fill="#2679a8" stroke="none" stroke-width="1"></rect><text x="558" y="503" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">marker = teaching location</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">SCHEMATIC / NON-NAVIGATION / geometry and marker locations are not to scale</text></svg>
