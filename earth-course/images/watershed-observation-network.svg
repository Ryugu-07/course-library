432.0" fill="none" stroke="#2679a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="378.0,210.0 355.0,270.0 324.0,326.0" fill="none" stroke="#2679a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="548.0,214.0 490.0,282.0 430.0,386.0" fill="none" stroke="#2679a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline><circle cx="542" cy="432" r="7" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></circle><text x="558" y="438" font-size="12" font-weight="800" text-anchor="start" fill="#d65a4a">出口</text><circle cx="126" cy="174" r="9" fill="#ffffff" stroke="#2784b8" stroke-width="3"></circle><circle cx="126" cy="174" r="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></circle><text x="140" y="179" font-size="11" font-weight="750" text-anchor="start" fill="#2784b8">雨量站</text><circle cx="224" cy="262" r="9" fill="#ffffff" stroke="#4d8a63" stroke-width="3"></circle><circle cx="224" cy="262" r="3" fill="#4d8a63" stroke="#4d8a63" stroke-width="1"></circle><text x="238" y="267" font-size="11" font-weight="750" text-anchor="start" fill="#4d8a63">土壤湿度</text><circle cx="410" cy="382" r="9" fill="#ffffff" stroke="#7666a8" stroke-width="3"></circle><circle cx="410" cy="382" r="3" fill="#7666a8" stroke="#7666a8" stroke-width="1"></circle><text x="424" y="387" font-size="11" font-weight="750" text-anchor="start" fill="#7666a8">河道水位</text><circle cx="526" cy="306" r="9" fill="#ffffff" stroke="#c8a27a" stroke-width="3"></circle><circle cx="526" cy="306" r="3" fill="#c8a27a" stroke="#c8a27a" stroke-width="1"></circle><text x="540" y="311" font-size="11" font-weight="750" text-anchor="start" fill="#c8a27a">地下水井</text><ellipse cx="326" cy="238" rx="96" ry="24" fill="none" stroke="#c58b20" stroke-width="2"></ellipse><text x="326" y="232" font-size="11" font-weight="750" text-anchor="middle" fill="#c58b20">卫星过境 / 代理观测</text><path d="M 324 238 C 400 252, 472 286, 526 306" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"></path><text x="58" y="491" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">站点、卫星足迹、河网和分水岭为示意；空间覆盖与距离非按比例。</text><text x="352" y="507" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><rect x="390" y="492" width="28" height="14" rx="3" fill="#4d8a63" stroke="none" stroke-width="1"></rect><text x="428" y="505" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">现场</text><line x1="470" y1="502" x2="498" y2="502" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="508" y="505" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">遥感</text><line x1="560" y1="502" x2="588" y2="502" stroke="#2679a8" stroke-width="4"></line><text x="598" y="505" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">河网</text><rect x="684" y="82" width="318" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="702" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">观测算子账本</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">看见什么 ≠ 状态本身</text><text x="708" y="126" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">数据源</text><text x="850" y="126" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">约束对象</text><line x1="706" y1="138" x2="980" y2="138" stroke="#dbe5ec" stroke-width="1"></line><rect x="708" y="158" width="14" height="14" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="736" y="170" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">雨量站</text><text x="850" y="170" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">P_t</text><line x1="706" y1="189" x2="980" y2="189" stroke="#dbe5ec" stroke-width="1"></line><rect x="708" y="204" width="14" height="14" rx="3" fill="#4d8a63" stroke="#4d8a63" stroke-width="1"></rect><text x="736" y="216" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">土壤探头</text><text x="850" y="216" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">θ / S</text><line x1="706" y1="235" x2="980" y2="235" stroke="#dbe5ec" stroke-width="1"></line><rect x="708" y="250" width="14" height="14" rx="3" fill="#7666a8" stroke="#7666a8" stroke-width="1"></rect><text x="736" y="262" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">水位计</text><text x="850" y="262" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">H(Q)</text><line x1="706" y1="281" x2="980" y2="281" stroke="#dbe5ec" stroke-width="1"></line><rect x="708" y="296" width="14" height="14" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="736" y="308" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">卫星代理</text><text x="850" y="308" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">H(S) + ε</text><line x1="706" y1="327" x2="980" y2="327" stroke="#dbe5ec" stroke-width="1"></line><rect x="708" y="342" width="14" height="14" rx="3" fill="#c8a27a" stroke="#c8a27a" stroke-width="1"></rect><text x="736" y="354" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">地下水井</text><text x="850" y="354" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">h_g</text><line x1="706" y1="373" x2="980" y2="373" stroke="#dbe5ec" stroke-width="1"></line><rect x="708" y="404" width="272" height="62" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="844.0" y="429.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="844.0" dy="0">误差账本</tspan><tspan x="844.0" dy="19">仪器 · 代表性 · 缺测 · 同步</tspan></text><text x="708" y="492" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">代理观测约束状态，不把分析场变成真值。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">观测网是有限采样和观测算子示意；站点选择、流域范围与信号方向不用于实时监测或水文预报。</text></svg>
