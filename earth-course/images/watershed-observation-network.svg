<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">一条流域需要怎样的观测网</title><desc id="svg-desc">流域空间示意展示雨量站、土壤湿度、河道水位、地下水井和卫星代理观测如何覆盖不同状态；站点和足迹非按比例，观测只提供有限约束，不是状态真值或预报。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
