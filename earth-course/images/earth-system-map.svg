<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Earth system reservoirs, fluxes, and external forcing</title>
  <desc id="desc">A systems diagram connecting the Sun, atmosphere, ocean, cryosphere, land, biosphere, and deep Earth with energy, water, carbon, and rock fluxes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334b57"/>
    </marker>
    <style>
      .box{stroke:#24383f;stroke-width:2.5;rx:8}
      .title{font:700 24px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16272e;letter-spacing:0}
      .label{font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16272e;letter-spacing:0}
      .small{font:500 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334b57;letter-spacing:0}
      .flux{fill:none;stroke:#334b57;stroke-width:3;marker-end:url(#arrow)}
      .energy{stroke:#c66b14}.water{stroke:#28739a}.carbon{stroke:#39734d}.rock{stroke:#7b5d46}
      .legend{font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24383f;letter-spacing:0}
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">Earth is a coupled set of reservoirs and fluxes</text>

  <rect class="box" x="40" y="110" width="180" height="90" fill="#ffe3a8"/>
  <text x="130" y="148" text-anchor="middle" class="label">Sun</text>
  <text x="130" y="176" text-anchor="middle" class="small">shortwave input</text>

  <rect class="box" x="430" y="86" width="340" height="110" fill="#dcecf2"/>
  <text x="600" y="129" text-anchor="middle" class="label">Atmosphere</text>
  <text x="600" y="158" text-anchor="middle" class="small">air · clouds · aerosols · greenhouse gases</text>

  <rect class="box" x="245" y="300" width="260" height="120" fill="#cfe8f3"/>
  <text x="375" y="348" text-anchor="middle" class="label">Ocean</text>
  <text x="375" y="378" text-anchor="middle" class="small">heat · salt · dissolved carbon</text>

  <rect class="box" x="550" y="300" width="220" height="120" fill="#e5f0d5"/>
  <text x="660" y="348" text-anchor="middle" class="label">Land</text>
  <text x="660" y="378" text-anchor="middle" class="small">soil · rivers · weathering</text>

  <rect class="box" x="815" y="300" width="260" height="120" fill="#eef7fb"/>
  <text x="945" y="348" text-anchor="middle" class="label">Cryosphere</text>
  <text x="945" y="378" text-anchor="middle" class="small">snow · sea ice · glaciers · ice sheets</text>

  <rect class="box" x="470" y="500" width="250" height="100" fill="#d8ead4"/>
  <text x="595" y="540" text-anchor="middle" class="label">Biosphere</text>
  <text x="595" y="570" text-anchor="middle" class="small">life alters water, carbon, and nutrients</text>

  <rect class="box" x="795" y="500" width="280" height="100" fill="#eadfd6"/>
  <text x="935" y="540" text-anchor="middle" class="label">Deep Earth</text>
  <text x="935" y="570" text-anchor="middle" class="small">mantle · plates · slow carbon cycle</text>

  <rect class="box" x="920" y="86" width="240" height="110" fill="#eee8f5"/>
  <text x="1040" y="129" text-anchor="middle" class="label">Space</text>
  <text x="1040" y="158" text-anchor="middle" class="small">reflected SW + outgoing LW</text>

  <path class="flux energy" d="M220 155 C310 155 340 135 430 135"/>
  <path class="flux energy" d="M770 135 C830 135 860 135 920 135"/>
  <path class="flux energy" d="M548 196 C510 230 450 260 405 300"/>
  <path class="flux energy" d="M650 196 C660 230 660 260 660 300"/>
  <path class="flux water" d="M430 165 C350 215 330 245 340 300"/>
  <path class="flux water" d="M610 196 C590 235 600 265 625 300"/>
  <path class="flux water" d="M770 165 C850 215 900 250 925 300"/>
  <path class="flux water" d="M550 355 C520 355 535 355 505 355"/>
  <path class="flux carbon" d="M450 420 C475 465 520 490 555 500"/>
  <path class="flux carbon" d="M635 500 C660 465 670 450 670 420"/>
  <path class="flux carbon" d="M505 330 C520 275 540 225 570 196"/>
  <path class="flux carbon" d="M720 540 C745 540 770 540 795 540"/>
  <path class="flux rock" d="M915 500 C880 460 810 430 735 405"/>
  <path class="flux rock" d="M760 390 C800 455 850 485 895 500"/>
  <path class="flux water" d="M815 380 C795 380 790 380 770 380"/>

  <line x1="65" y1="646" x2="115" y2="646" class="flux energy"/>
  <text x="128" y="652" class="legend">energy</text>
  <line x1="250" y1="646" x2="300" y2="646" class="flux water"/>
  <text x="313" y="652" class="legend">water</text>
  <line x1="430" y1="646" x2="480" y2="646" class="flux carbon"/>
  <text x="493" y="652" class="legend">carbon / nutrients</text>
  <line x1="700" y1="646" x2="750" y2="646" class="flux rock"/>
  <text x="763" y="652" class="legend">rock / tectonic flux</text>
  <text x="1135" y="652" text-anchor="end" class="small">Arrow widths are conceptual, not proportional.</text>
</svg>
