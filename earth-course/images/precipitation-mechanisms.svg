.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">降水形成机制</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">12 / process mechanism</text><rect x="38" y="92" width="215" height="58" rx="7" fill="#eef7fb" stroke="#9edff2" stroke-width="1"></rect><rect x="38" y="92" width="6" height="58" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="145.5" y="117" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">lift / 抬升</text><text x="145.5" y="139" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="145.5" dy="0">expansion cooling</tspan></text><line x1="258" y1="121" x2="305" y2="121" stroke="#2784b8" stroke-width="2.5" marker-end="url(#arrow-cool)"></line><rect x="310" y="92" width="215" height="58" rx="7" fill="#f0eef8" stroke="#c8bee3" stroke-width="1"></rect><rect x="310" y="92" width="6" height="58" rx="3" fill="#7666a8" stroke="#7666a8" stroke-width="1"></rect><text x="417.5" y="117" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">saturation / 饱和</text><text x="417.5" y="139" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="417.5" dy="0">RH reaches 100 percent</tspan></text><line x1="530" y1="121" x2="575" y2="121" stroke="#7666a8" stroke-width="2.5" marker-end="url(#arrow-violet)"></line><rect x="580" y="92" width="215" height="58" rx="7" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><rect x="580" y="92" width="6" height="58" rx="3" fill="#2679a8" stroke="#2679a8" stroke-width="1"></rect><text x="687.5" y="117" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">cloud particles</text><text x="687.5" y="139" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="687.5" dy="0">droplets and/or crystals</tspan></text><line x1="800" y1="121" x2="845" y2="121" stroke="#2679a8" stroke-width="2.5" marker-end="url(#arrow-deep)"></line><rect x="850" y="92" width="150" height="58" rx="7" fill="#fff1ed" stroke="#e5b1a9" stroke-width="1"></rect><rect x="850" y="92" width="6" height="58" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="925.0" y="117" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">falling</text><text x="925.0" y="139" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="925.0" dy="0">hydrometeor</tspan></text><rect x="28" y="182" width="476" height="326" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="46" y="212" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Warm-rain path</text><text x="486" y="211" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">collision-coalescence</text><rect x="536" y="182" width="476" height="326" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="554" y="212" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Ice-phase path</text><text x="994" y="211" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">deposition, riming, aggregation</text><rect x="58" y="232" width="140" height="58" rx="7" fill="#eef7fb" stroke="#9edff2" stroke-width="1"></rect><rect x="58" y="232" width="6" height="58" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="128.0" y="257" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">cloud droplets</text><text x="128.0" y="279" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="128.0" dy="0">micron-scale</tspan></text><circle cx="92" cy="337" r="5" fill="#d8f3fa" stroke="#2784b8" stroke-width="1.2"></circle><circle cx="110" cy="349" r="6" fill="#d8f3fa" stroke="#2784b8" stroke-width="1.2"></circle><circle cx="128" cy="337" r="7" fill="#d8f3fa" stroke="#2784b8" stroke-width="1.2"></circle><circle cx="146" cy="349" r="5" fill="#d8f3fa" stroke="#2784b8" stroke-width="1.2"></circle><circle cx="164" cy="337" r="6" fill="#d8f3fa" stroke="#2784b8" stroke-width="1.2"></circle><line x1="200" y1="260" x2="256" y2="326" stroke="#2784b8" stroke-width="2.5" marker-end="url(#arrow-cool)"></line><rect x="260" y="303" width="140" height="58" rx="7" fill="#fff8e9" stroke="#e6cf93" stroke-width="1"></rect><rect x="260" y="303" width="6" height="58" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="330.0" y="328" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">collisions</text><text x="330.0" y="350" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="330.0" dy="0">some droplets grow</tspan></text><line x1="400" y1="333" x2="455" y2="333" stroke="#c58b20" stroke-width="2.5" marker-end="url(#arrow-gold)"></line><ellipse cx="456" cy="333" rx="15" ry="23" fill="#8fd0e2" stroke="#2679a8" stroke-width="1.5"></ellipse><line x1="456" y1="360" x2="456" y2="407" stroke="#2784b8" stroke-width="2.5" marker-end="url(#arrow-cool)"></line><text x="407" y="445" font-size="13" font-weight="750" text-anchor="start" fill="#2784b8">rain</text><text x="58" y="458" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">needs liquid water, uplift, and enough residence time</text><rect x="566" y="232" width="140" height="58" rx="7" fill="#f0eef8" stroke="#c8bee3" stroke-width="1"></rect><rect x="566" y="232" width="6" height="58" rx="3" fill="#7666a8" stroke="#7666a8" stroke-width="1"></rect><text x="636.0" y="257" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">ice crystals</text><text x="636.0" y="279" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="636.0" dy="0">cold cloud / mixed phase</tspan></text><polygon points="635.0,323.0 643.0,338.0 660.0,341.0 647.0,351.0 650.0,368.0 635.0,357.0 620.0,368.0 623.0,351.0 610.0,341.0 627.0,338.0" fill="#eef7fb" stroke="#7666a8" stroke-width="1.5"></polygon><line x1="706" y1="260" x2="755" y2="331" stroke="#7666a8" stroke-width="2.5" marker-end="url(#arrow-violet)"></line><rect x="752" y="303" width="140" height="58" rx="7" fill="#f0eef8" stroke="#c8bee3" stroke-width="1"></rect><rect x="752" y="303" width="6" height="58" rx="3" fill="#7666a8" stroke="#7666a8" stroke-width="1"></rect><text x="822.0" y="328" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">growth</text><text x="822.0" y="350" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="822.0" dy="0">deposition + riming</tspan></text><line x1="893" y1="333" x2="950" y2="333" stroke="#7666a8" stroke-width="2.5" marker-end="url(#arrow-violet)"></line><path d="M956,319 C970,304 985,319 978,335 C987,349 973,363 961,350 C947,360 938,345 948,333 C939,326 947,317 956,319 Z" fill="#e9f8ff" stroke="#7666a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><line x1="960" y1="357" x2="960" y2="407" stroke="#2784b8" stroke-width="2.5" marker-end="url(#arrow-cool)"></line><text x="915" y="445" font-size="12.5" font-weight="750" text-anchor="start" fill="#2784b8">snow / rain after melt</text><path d="M710,280 C740,245 795,245 820,276" fill="none" stroke="#7666a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"></path><text x="570" y="458" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">phase changes create a second route to large hydrometeors</text><line x1="42" y1="530" x2="70" y2="530" stroke="#2784b8" stroke-width="4"></line><text x="80" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">liquid-water path</text><line x1="235" y1="530" x2="263" y2="530" stroke="#7666a8" stroke-width="4"></line><text x="273" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">ice / mixed-phase path</text><line x1="465" y1="530" x2="493" y2="530" stroke="#5f7182" stroke-width="4" stroke-dasharray="7 5"></line><text x="503" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">conditional transition</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">A cloud can be present while conversion efficiency remains too small for surface precipitation</text></svg>
