<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">反事实世界如何进入极端事件归因</title><desc id="svg-desc">教学示意比较自然强迫反事实、全强迫模拟集合和有限观测事件窗口，并显示概率比与强度差；这些世界是条件情景，不是另一条真实历史，也不构成事件预报。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
