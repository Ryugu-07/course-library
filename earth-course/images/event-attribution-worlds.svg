</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">反事实世界如何进入极端事件归因</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">23 · 对照实验 | Counterfactual worlds</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">改变强迫，比较事件分布</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">不是把历史重演一遍</text><text x="64" y="126" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">同一事件定义：阈值、时长、区域和观测质量先固定</text><rect x="64" y="156" width="258" height="190" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="80" y="184" font-size="16" font-weight="800" text-anchor="start" fill="#17324d">自然强迫反事实</text><text x="80" y="207" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">control: N</text><rect x="370" y="156" width="258" height="190" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="386" y="184" font-size="16" font-weight="800" text-anchor="start" fill="#17324d">事实世界集合</text><text x="386" y="207" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">all forcings</text><rect x="676" y="156" width="258" height="190" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="692" y="184" font-size="16" font-weight="800" text-anchor="start" fill="#17324d">观测事件窗口</text><text x="692" y="207" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">observed y</text><rect x="93" y="288" width="18" height="32" rx="2" fill="#2784b8" stroke="none" stroke-width="1" opacity="0.66"></rect><rect x="122" y="266" width="18" height="54" rx="2" fill="#2784b8" stroke="none" stroke-width="1" opacity="0.66"></rect><rect x="151" y="238" width="18" height="82" rx="2" fill="#2784b8" stroke="none" stroke-width="1" opacity="0.66"></rect><rect x="180" y="216" width="18" height="104" rx="2" fill="#2784b8" stroke="none" stroke-width="1" opacity="0.66"></rect><rect x="209" y="232" width="18" height="88" rx="2" fill="#2784b8" stroke="none" stroke-width="1" opacity="0.66"></rect><rect x="238" y="262" width="18" height="58" rx="2" fill="#2784b8" stroke="none" stroke-width="1" opacity="0.66"></rect><rect x="267" y="286" width="18" height="34" rx="2" fill="#2784b8" stroke="none" stroke-width="1" opacity="0.66"></rect><rect x="399" y="298" width="18" height="22" rx="2" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.68"></rect><rect x="428" y="284" width="18" height="36" rx="2" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.68"></rect><rect x="457" y="262" width="18" height="58" rx="2" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.68"></rect><rect x="486" y="238" width="18" height="82" rx="2" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.68"></rect><rect x="515" y="208" width="18" height="112" rx="2" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.68"></rect><rect x="544" y="215" width="18" height="105" rx="2" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.68"></rect><rect x="573" y="248" width="18" height="72" rx="2" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.68"></rect><rect x="705" y="302" width="18" height="18" rx="2" fill="#7666a8" stroke="none" stroke-width="1" opacity="0.7"></rect><rect x="734" y="285" width="18" height="35" rx="2" fill="#7666a8" stroke="none" stroke-width="1" opacity="0.7"></rect><rect x="763" y="256" width="18" height="64" rx="2" fill="#7666a8" stroke="none" stroke-width="1" opacity="0.7"></rect><rect x="792" y="224" width="18" height="96" rx="2" fill="#7666a8" stroke="none" stroke-width="1" opacity="0.7"></rect><rect x="821" y="250" width="18" height="70" rx="2" fill="#7666a8" stroke="none" stroke-width="1" opacity="0.7"></rect><rect x="850" y="278" width="18" height="42" rx="2" fill="#7666a8" stroke="none" stroke-width="1" opacity="0.7"></rect><rect x="879" y="294" width="18" height="26" rx="2" fill="#7666a8" stroke="none" stroke-width="1" opacity="0.7"></rect><line x1="92" y1="320" x2="296" y2="320" stroke="#17324d" stroke-width="1.5"></line><text x="194" y="338" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">事件强度 I</text><line x1="398" y1="320" x2="602" y2="320" stroke="#17324d" stroke-width="1.5"></line><text x="500" y="338" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">事件强度 I</text><line x1="704" y1="320" x2="908" y2="320" stroke="#17324d" stroke-width="1.5"></line><text x="806" y="338" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">事件强度 I</text><line x1="322" y1="250" x2="360" y2="250" stroke="#c58b20" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow-gold)"></line><line x1="628" y1="250" x2="666" y2="250" stroke="#c58b20" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow-gold)"></line><text x="341" y="234" font-size="11" font-weight="750" text-anchor="middle" fill="#c58b20">对照</text><text x="647" y="234" font-size="11" font-weight="750" text-anchor="middle" fill="#c58b20">核验</text><rect x="130" y="376" width="230" height="70" rx="8" fill="#fff9e6" stroke="#c58b20" stroke-width="1"></rect><text x="245.0" y="405.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="245.0" dy="0">概率比</tspan><tspan x="245.0" dy="19">P(event | all) / P(event | N)</tspan></text><rect x="405" y="376" width="230" height="70" rx="8" fill="#fff9e6" stroke="#c58b20" stroke-width="1"></rect><text x="520.0" y="406.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="520.0" dy="0">强度差</tspan><tspan x="520.0" dy="19">ΔI = I_all − I_N</tspan></text><rect x="680" y="376" width="230" height="70" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="795.0" y="406.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="795.0" dy="0">证据门</tspan><tspan x="795.0" dy="19">观测 ≠ 反事实模拟</tspan></text><text x="64" y="486" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><rect x="100" y="471" width="28" height="14" rx="3" fill="#2784b8" stroke="none" stroke-width="1"></rect><text x="138" y="484" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">自然集合</text><rect x="235" y="471" width="28" height="14" rx="3" fill="#d65a4a" stroke="none" stroke-width="1"></rect><text x="273" y="484" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">全强迫集合</text><rect x="390" y="471" width="28" height="14" rx="3" fill="#7666a8" stroke="none" stroke-width="1"></rect><text x="428" y="484" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">观测窗口</text><text x="64" y="506" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">虚线仅表示对照推断；改变强迫并不自动排除其他机制。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">三个世界是情景/观测边界内的教学对象，分布、柱高和比较量非按真实概率比例；不是未来事件预报。</text></svg>
