ity="0.24"></rect><circle cx="224.25" cy="265.0" r="7" fill="#4d8a63" stroke="#ffffff" stroke-width="2"></circle><text x="235.25" y="269.0" font-size="11" font-weight="700" text-anchor="start" fill="#17324d">雨林</text><circle cx="374.6666666666667" cy="185.55555555555554" r="7" fill="#c58b20" stroke="#ffffff" stroke-width="2"></circle><text x="385.6666666666667" y="189.55555555555554" font-size="11" font-weight="700" text-anchor="start" fill="#17324d">温带</text><circle cx="501.3333333333333" cy="169.66666666666666" r="7" fill="#2679a8" stroke="#ffffff" stroke-width="2"></circle><text x="512.3333333333333" y="173.66666666666666" font-size="11" font-weight="700" text-anchor="start" fill="#17324d">针叶林</text><circle cx="382.5833333333333" cy="376.2222222222222" r="7" fill="#2784b8" stroke="#ffffff" stroke-width="2"></circle><text x="393.5833333333333" y="380.2222222222222" font-size="11" font-weight="700" text-anchor="start" fill="#17324d">冰雪</text><text x="64" y="430" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">群系边界随水分、温度、土壤、扰动和季节移动；地图非导航比例。</text><text x="64" y="462" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">证据支持尺度</text><line x1="92" y1="480" x2="562" y2="480" stroke="#a9bac8" stroke-width="2"></line><circle cx="92.0" cy="480" r="7" fill="#4d8a63" stroke="#ffffff" stroke-width="2"></circle><text x="92.0" y="505" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">叶片</text><line x1="103.0" y1="480" x2="237.66666666666666" y2="480" stroke="#4d8a63" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="248.66666666666666" cy="480" r="7" fill="#c58b20" stroke="#ffffff" stroke-width="2"></circle><text x="248.66666666666666" y="505" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">样地</text><line x1="259.66666666666663" y1="480" x2="394.3333333333333" y2="480" stroke="#c58b20" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="405.3333333333333" cy="480" r="7" fill="#2784b8" stroke="#ffffff" stroke-width="2"></circle><text x="405.3333333333333" y="505" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">通量塔</text><line x1="416.3333333333333" y1="480" x2="551.0" y2="480" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><circle cx="562.0" cy="480" r="7" fill="#7666a8" stroke="#ffffff" stroke-width="2"></circle><text x="562.0" y="505" font-size="11" font-weight="650" text-anchor="middle" fill="#5f7182">像元</text><rect x="674" y="82" width="328" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="692" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">群系的碳账本</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">limitation can move</text><rect x="696" y="128" width="284" height="62" rx="7" fill="#edf7ed" stroke="#4d8a63" stroke-width="1"></rect><rect x="708" y="142" width="12" height="34" rx="3" fill="#4d8a63" stroke="#4d8a63" stroke-width="1"></rect><text x="734" y="151" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">热带森林</text><text x="734" y="171" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">储存：生物量 C · 限制：光 / N / P</text><rect x="696" y="206" width="284" height="62" rx="7" fill="#faf5e6" stroke="#c58b20" stroke-width="1"></rect><rect x="708" y="220" width="12" height="34" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="734" y="229" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">温带草地</text><text x="734" y="249" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">储存：土壤 C · 限制：水分 / 火扰动</text><rect x="696" y="284" width="284" height="62" rx="7" fill="#eaf6fb" stroke="#2784b8" stroke-width="1"></rect><rect x="708" y="298" width="12" height="34" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="734" y="307" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">冻土苔原</text><text x="734" y="327" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">储存：土壤 C · 限制：解冻 / 呼吸</text><text x="696" y="382" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">最小资源门</text><text x="696" y="408" font-size="16" font-weight="800" text-anchor="start" fill="#17324d">GPP = GPPₘₐₓ · min(L, N, W)</text><text x="696" y="430" font-size="12" font-weight="750" text-anchor="start" fill="#d65a4a">生产力增加 ≠ 长期碳汇增加</text><rect x="752" y="444" width="228" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="766" y="464" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><rect x="766" y="472" width="28" height="14" rx="3" fill="#4d8a63" stroke="none" stroke-width="1"></rect><text x="804" y="485" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">群系 / 储库类别</text><rect x="766" y="491" width="28" height="14" rx="3" fill="#c58b20" stroke="none" stroke-width="1"></rect><text x="804" y="504" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">资源限制</text><line x1="766" y1="520" x2="794" y2="520" stroke="#7666a8" stroke-width="4"></line><text x="804" y="523" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">观测支持尺度</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 16A：群系带、碳库位置和观测尺度是概念层级；颜色不表示好坏或全球平均大小。</text></svg>
