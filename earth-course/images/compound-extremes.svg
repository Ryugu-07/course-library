.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">热、旱、洪如何形成复合压力</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">25 · 过程机制 | Compound extremes</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">边际 hazard + 耦合项</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">同一窗口或连续窗口</text><text x="64" y="126" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">合成时间窗 t₀ → t₁ → t₂</text><line x1="170" y1="146" x2="940" y2="146" stroke="#17324d" stroke-width="1.5" marker-end="arrow"></line><line x1="250" y1="138" x2="250" y2="459" stroke="#dbe5ec" stroke-width="1" stroke-dasharray="5 5"></line><text x="250" y="130" font-size="11" font-weight="700" text-anchor="middle" fill="#5f7182">t₀</text><line x1="515" y1="138" x2="515" y2="459" stroke="#dbe5ec" stroke-width="1" stroke-dasharray="5 5"></line><text x="515" y="130" font-size="11" font-weight="700" text-anchor="middle" fill="#5f7182">t₁</text><line x1="780" y1="138" x2="780" y2="459" stroke="#dbe5ec" stroke-width="1" stroke-dasharray="5 5"></line><text x="780" y="130" font-size="11" font-weight="700" text-anchor="middle" fill="#5f7182">t₂</text><text x="68" y="196" font-size="15" font-weight="800" text-anchor="start" fill="#d65a4a">热 h</text><text x="104" y="196" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">能量需求 / ET</text><rect x="202" y="163.0" width="210" height="45.0" rx="4" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.72"></rect><rect x="470" y="185.5" width="210" height="22.5" rx="4" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.72"></rect><rect x="735" y="190.0" width="210" height="18.0" rx="4" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.72"></rect><text x="68" y="270" font-size="15" font-weight="800" text-anchor="start" fill="#c58b20">旱 d</text><text x="104" y="270" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">土壤水 / 库存</text><rect x="202" y="262.5" width="210" height="19.5" rx="4" fill="#c58b20" stroke="none" stroke-width="1" opacity="0.72"></rect><rect x="470" y="241.0" width="210" height="41.0" rx="4" fill="#c58b20" stroke="none" stroke-width="1" opacity="0.72"></rect><rect x="735" y="238.5" width="210" height="43.5" rx="4" fill="#c58b20" stroke="none" stroke-width="1" opacity="0.72"></rect><text x="68" y="344" font-size="15" font-weight="800" text-anchor="start" fill="#2679a8">洪 f</text><text x="104" y="344" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">集中降雨 / 径流</text><rect x="202" y="346.5" width="210" height="9.5" rx="4" fill="#2679a8" stroke="none" stroke-width="1" opacity="0.72"></rect><rect x="470" y="344.0" width="210" height="12.0" rx="4" fill="#2679a8" stroke="none" stroke-width="1" opacity="0.72"></rect><rect x="735" y="321.0" width="210" height="35.0" rx="4" fill="#2679a8" stroke="none" stroke-width="1" opacity="0.72"></rect><text x="826" y="207" font-size="11" font-weight="700" text-anchor="start" fill="#d65a4a">高温</text><text x="826" y="281" font-size="11" font-weight="700" text-anchor="start" fill="#c58b20">水分亏缺</text><text x="826" y="355" font-size="11" font-weight="700" text-anchor="start" fill="#2679a8">强降雨 / 高径流</text><rect x="94" y="410" width="174" height="62" rx="8" fill="#f6f9fb" stroke="#a9bac8" stroke-width="1"></rect><text x="181.0" y="435.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="181.0" dy="0">边际压力</tspan><tspan x="181.0" dy="19">h, d, f ∈ [0, 1]</tspan></text><line x1="280" y1="441" x2="342" y2="441" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><rect x="348" y="410" width="174" height="62" rx="8" fill="#fff9e6" stroke="#c58b20" stroke-width="1"></rect><text x="435.0" y="435.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="435.0" dy="0">耦合门 κ</tspan><tspan x="435.0" dy="19">共同驱动 / 记忆</tspan></text><line x1="534" y1="441" x2="596" y2="441" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><rect x="602" y="410" width="174" height="62" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="689.0" y="435.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="689.0" dy="0">复合压力 C</tspan><tspan x="689.0" dy="19">max + κ·min</tspan></text><line x1="788" y1="441" x2="850" y2="441" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><rect x="856" y="410" width="114" height="62" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="913.0" y="435.58" font-size="12" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="913.0" dy="0">风险账</tspan><tspan x="913.0" dy="19">C × E × V</tspan></text><text x="64" y="503" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><rect x="100" y="488" width="28" height="14" rx="3" fill="#d65a4a" stroke="none" stroke-width="1"></rect><text x="138" y="501" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">热</text><rect x="170" y="488" width="28" height="14" rx="3" fill="#c58b20" stroke="none" stroke-width="1"></rect><text x="208" y="501" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">旱</text><rect x="240" y="488" width="28" height="14" rx="3" fill="#2679a8" stroke="none" stroke-width="1"></rect><text x="278" y="501" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">洪</text><text x="330" y="506" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">色带高度只是教学编码；耦合不是联合概率，情景不是下一季天气预报。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">时间窗、阈值、持续时间与空间范围是情景边界；条带、耦合门和风险边界均非按观测比例。</text></svg>
