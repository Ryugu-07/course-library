<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">地球内部的分层与尺度</title><desc id="svg-desc">球壳剖面示意展示地幔、液态外核与固态内核的概念分层，并以 P/S 波速度公式说明为何波型能够约束内部介质；几何非等比例。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">地球内部的分层与尺度</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">03 · 空间结构 | Interior cutaway</text><rect x="38" y="82" width="548" height="444" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">球壳剖面</text><text x="568" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">半径方向 / radial structure</text><defs><marker id="arrow-cool-local" marker-width="10" marker-height="10" ref-x="8" ref-y="3" orient="auto" marker-units="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"></path></marker><marker id="arrow-warm-local" marker-width="10" marker-height="10" ref-x="8" ref-y="3" orient="auto" marker-units="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"></path></marker></defs><circle cx="302" cy="303" r="173" fill="#eef5e8" stroke="#17324d" stroke-width="2"></circle><circle cx="302" cy="303" r="151" fill="#d7e5c1" stroke="#81936e" stroke-width="1.2"></circle><circle cx="302" cy="303" r="112" fill="#dc805f" stroke="#ad5c49" stroke-width="1.5"></circle><circle cx="302" cy="303" r="52" fill="#f0b53d" stroke="#b27c16" stroke-width="1.5"></circle><path d="M 302 303 L 475 303 A 173 173 0 0 0 388 153 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 302 303 L 414 303 A 112 112 0 0 0 358 206 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 302 303 L 354 303 A 52 52 0 0 0 328 258 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 302 303 L 475 303 A 173 173 0 0 0 388 153 Z" fill="none" stroke="#17324d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 302 303 L 414 303 A 112 112 0 0 0 358 206 Z" fill="none" stroke="#17324d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 302 303 L 354 303 A 52 52 0 0 0 328 258 Z" fill="none" stroke="#17324d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 157 350 C 224 252, 364 240, 452 277" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm-local)"></path><path d="M 157 340 C 171 324, 182 311, 191 303" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-cool-local)"></path><text x="198" y="273" font-size="13" font-weight="800" text-anchor="start" fill="#d65a4a">P</text><text x="156" y="374" font-size="11" font-weight="700" text-anchor="start" fill="#2784b8">S 波至外核边界</text><text x="424" y="214" font-size="15" font-weight="750" text-anchor="start" fill="#17324d">地幔</text><text x="424" y="233" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">mantle · μ &gt; 0</text><text x="358" y="353" font-size="15" font-weight="800" text-anchor="start" fill="#d65a4a">液态外核</text><text x="358" y="372" font-size="11" font-weight="700" text-anchor="start" fill="#d65a4a">outer core · liquid · μ ≈ 0</text><text x="321" y="306" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d">内核</text><text x="321" y="323" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">solid</text><text x="302" y="134" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182">地表 / surface</text><line x1="302" y1="145" x2="302" y2="173" stroke="#5f7182" stroke-width="1.5" stroke-dasharray="5 4"></line><line x1="136" y1="478" x2="258" y2="478" stroke="#17324d" stroke-width="2"></line><line x1="136" y1="473" x2="136" y2="483" stroke="#17324d" stroke-width="2"></line><line x1="258" y1="473" x2="258" y2="483" stroke="#17324d" stroke-width="2"></line><text x="197.0" y="498" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">示意半径刻度</text><text x="58" y="508" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">球体、层界和深度均为概念比例；不是地球真实剖面比例。</text><rect x="616" y="82" width="386" height="444" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="634" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">波型为何能区分介质</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">弹性参数 / elastic parameters</text><rect x="648" y="132" width="144" height="66" rx="8" fill="#fff0ec" stroke="#d65a4a" stroke-width="1"></rect><text x="720.0" y="157.0" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="720.0" dy="0">P 波</tspan><tspan x="720.0" dy="19">压缩 · vP</tspan></text><rect x="826" y="132" width="144" height="66" rx="8" fill="#eaf5fb" stroke="#2784b8" stroke-width="1"></rect><text x="898.0" y="157.0" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="898.0" dy="0">S 波</tspan><tspan x="898.0" dy="19">剪切 · vS</tspan></text><text x="648" y="239" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">vP = √((K + 4μ/3) / ρ)</text><text x="648" y="267" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">vS = √(μ / ρ)</text><line x1="648" y1="290" x2="970" y2="290" stroke="#dbe5ec" stroke-width="1"></line><text x="648" y="320" font-size="16" font-weight="800" text-anchor="start" fill="#d65a4a">外核：μ ≈ 0</text><text x="648" y="346" font-size="13" font-weight="500" text-anchor="start" fill="#5f7182">直达 S 波缺失，P 波仍可传播。</text><line x1="708" y1="373" x2="708" y2="411" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool-local)"></line><line x1="884" y1="373" x2="884" y2="411" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm-local)"></line><text x="708" y="430" font-size="13" font-weight="700" text-anchor="middle" fill="#2784b8">固体</text><text x="884" y="430" font-size="13" font-weight="700" text-anchor="middle" fill="#d65a4a">液体</text><rect x="739" y="450" width="231" height="80" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="753" y="472" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="753" y1="494" x2="781" y2="494" stroke="#d65a4a" stroke-width="4"></line><text x="791" y="497" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">P 波路径</text><line x1="753" y1="517" x2="781" y2="517" stroke="#2784b8" stroke-width="4" stroke-dasharray="7 5"></line><text x="791" y="520" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">S 波至外核边界</text></svg>
