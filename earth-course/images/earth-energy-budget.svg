<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Earth energy budget: geometry before arithmetic</title><desc id="svg-desc">A Sun-Earth-atmosphere schematic separates incoming shortwave, reflected shortwave, surface and atmospheric absorption, and outgoing longwave radiation; colors are ledger categories.</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">地球能量收支</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">10 / spatial structure</text><rect x="28" y="86" width="500" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="46" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Sun-Earth geometry</text><text x="510" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">space -&gt; atmosphere -&gt; surface</text><circle cx="95" cy="257" r="38" fill="#f8cf67" stroke="#c58b20" stroke-width="2"></circle><line x1="95" y1="211" x2="95" y2="197" stroke="#c58b20" stroke-width="2"></line><line x1="141" y1="211" x2="155" y2="197" stroke="#c58b20" stroke-width="2"></line><line x1="141" y1="257" x2="155" y2="257" stroke="#c58b20" stroke-width="2"></line><line x1="141" y1="303" x2="155" y2="317" stroke="#c58b20" stroke-width="2"></line><line x1="95" y1="303" x2="95" y2="317" stroke="#c58b20" stroke-width="2"></line><line x1="49" y1="303" x2="35" y2="317" stroke="#c58b20" stroke-width="2"></line><line x1="49" y1="257" x2="35" y2="257" stroke="#c58b20" stroke-width="2"></line><line x1="49" y1="211" x2="35" y2="197" stroke="#c58b20" stroke-width="2"></line><text x="52" y="329" font-size="12" font-weight="700" text-anchor="start" fill="#c58b20">incoming SW</text><line x1="137" y1="257" x2="178" y2="257" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><circle cx="310" cy="287" r="125" fill="#bfe2f2" stroke="#2679a8" stroke-width="2"></circle><path d="M185,289 C230,260 278,254 338,266 C384,275 422,266 434,248 L434,352 C380,374 310,380 255,358 C220,345 199,329 185,289 Z" fill="#d7e5c1" stroke="#82936f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path><ellipse cx="310" cy="287" rx="132" ry="130" fill="none" stroke="#72b4ca" stroke-width="2" opacity="0.7"></ellipse><line x1="198" y1="287" x2="422" y2="287" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.8"></line><text x="310" y="281" font-size="12" font-weight="700" text-anchor="middle" fill="#2679a8">equatorial band</text><text x="223" y="413" font-size="12" font-weight="500" text-anchor="start" fill="#17324d">surface absorbs and stores energy</text><rect x="180" y="135" width="260" height="36" rx="18" fill="#e6f4f7" stroke="#4d8a63" stroke-width="1"></rect><text x="310" y="158" font-size="14" font-weight="750" text-anchor="middle" fill="#4d8a63">atmosphere + clouds</text><line x1="260" y1="172" x2="260" y2="196" stroke="#2784b8" stroke-width="2.5" marker-end="url(#arrow-cool)"></line><line x1="360" y1="196" x2="360" y2="172" stroke="#d65a4a" stroke-width="2.5" marker-end="url(#arrow-warm)"></line><text x="370" y="194" font-size="11" font-weight="500" text-anchor="start" fill="#d65a4a">LW out</text><text x="145" y="228" font-size="11" font-weight="500" text-anchor="start" fill="#c58b20">solar angle</text><rect x="558" y="86" width="454" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="576" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Energy ledger</text><text x="994" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">categories are not the same as pathways</text><rect x="590" y="132" width="388" height="58" rx="7" fill="#fff8e9" stroke="#e6cf93" stroke-width="1"></rect><rect x="590" y="132" width="6" height="58" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="784.0" y="157" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">100 units incoming shortwave</text><text x="784.0" y="179" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="784.0" dy="0">top-of-atmosphere teaching normalization</tspan></text><line x1="784" y1="191" x2="784" y2="218" stroke="#c58b20" stroke-width="2.4" marker-end="url(#arrow-gold)"></line><rect x="590" y="220" width="180" height="70" rx="7" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><rect x="590" y="220" width="6" height="70" rx="3" fill="#5f7182" stroke="#5f7182" stroke-width="1"></rect><text x="680.0" y="245" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">reflected SW</text><text x="680.0" y="267" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="680.0" dy="0">clouds + bright surface</tspan></text><rect x="798" y="220" width="180" height="70" rx="7" fill="#eef7fb" stroke="#2784b8" stroke-width="1"></rect><rect x="798" y="220" width="6" height="70" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="888.0" y="245" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">absorbed SW</text><text x="888.0" y="267" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="888.0" dy="0">atmosphere + surface</tspan></text><line x1="784" y1="291" x2="784" y2="322" stroke="#2784b8" stroke-width="2.4" marker-end="url(#arrow-cool)"></line><rect x="590" y="326" width="388" height="68" rx="7" fill="#fff1ed" stroke="#e5b1a9" stroke-width="1"></rect><rect x="590" y="326" width="6" height="68" rx="3" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></rect><text x="784.0" y="351" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">outgoing longwave</text><text x="784.0" y="373" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="784.0" dy="0">the balanced system sends energy back to space</tspan></text><line x1="784" y1="395" x2="784" y2="425" stroke="#d65a4a" stroke-width="2.4" marker-end="url(#arrow-warm)"></line><text x="590" y="451" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">At equilibrium: absorbed SW ~= outgoing LW.</text><text x="590" y="476" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">The budget can close even while reservoirs warm.</text><rect x="40" y="520" width="28" height="14" rx="3" fill="#c58b20" stroke="none" stroke-width="1"></rect><text x="78" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">shortwave input / reflection</text><rect x="265" y="520" width="28" height="14" rx="3" fill="#2784b8" stroke="none" stroke-width="1"></rect><text x="303" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">absorption</text><rect x="430" y="520" width="28" height="14" rx="3" fill="#d65a4a" stroke="none" stroke-width="1"></rect><text x="468" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">longwave output</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">Spatial and ledger elements are schematic; the 100-unit split is a teaching normalization</text></svg>
