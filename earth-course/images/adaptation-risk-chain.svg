<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">适应改变风险链的哪个环节？</title><desc id="svg-desc">教学示意将 hazard、exposure、vulnerability、impact 和恢复时间分开，并标出适应杠杆及其条件上限；节点和箭头非按比例，残余影响不是具体损失预报。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">适应改变风险链的哪个环节？</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">26 · 选择结构 | Adaptation risk chain</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">从 hazard 到残余影响</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">作用点与上限</text><rect x="66" y="148" width="166" height="84" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="149.0" y="185.6" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="149.0" dy="0">Hazard</tspan><tspan x="149.0" dy="19">热 / 洪 / 旱</tspan></text><rect x="254" y="148" width="166" height="84" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="337.0" y="185.6" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="337.0" dy="0">Exposure</tspan><tspan x="337.0" dy="19">人口 / 设施</tspan></text><rect x="442" y="148" width="166" height="84" rx="8" fill="#eef6ed" stroke="#4d8a63" stroke-width="1"></rect><text x="525.0" y="185.6" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="525.0" dy="0">Vulnerability</tspan><tspan x="525.0" dy="19">结构 / 能力</tspan></text><rect x="630" y="148" width="166" height="84" rx="8" fill="#fff4e8" stroke="#b54238" stroke-width="1"></rect><text x="713.0" y="185.6" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="713.0" dy="0">Impact</tspan><tspan x="713.0" dy="19">健康 / 服务</tspan></text><line x1="232" y1="190" x2="250" y2="190" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><line x1="420" y1="190" x2="438" y2="190" stroke="#7666a8" stroke-width="3" marker-end="url(#arrow-violet)"></line><line x1="608" y1="190" x2="626" y2="190" stroke="#4d8a63" stroke-width="3" marker-end="url(#arrow-forest)"></line><text x="66" y="126" font-size="14" font-weight="800" text-anchor="start" fill="#17324d">基线风险链</text><text x="66" y="278" font-size="14" font-weight="800" text-anchor="start" fill="#2784b8">适应杠杆</text><rect x="66" y="304" width="166" height="70" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="149.0" y="333.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="149.0" dy="0">减暴露</tspan><tspan x="149.0" dy="19">分区 / 遮荫 / 退让</tspan></text><line x1="149" y1="300" x2="238" y2="238" stroke="#7666a8" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-violet)"></line><rect x="254" y="304" width="166" height="70" rx="8" fill="#f3f0fb" stroke="#4d8a63" stroke-width="1"></rect><text x="337.0" y="333.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="337.0" dy="0">降脆弱</tspan><tspan x="337.0" dy="19">加固 / 降温 / 预警</tspan></text><line x1="337" y1="300" x2="426" y2="238" stroke="#4d8a63" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-forest)"></line><rect x="442" y="304" width="166" height="70" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="525.0" y="333.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="525.0" dy="0">增恢复</tspan><tspan x="525.0" dy="19">备援 / 医疗 / 维护</tspan></text><line x1="525" y1="300" x2="614" y2="238" stroke="#2784b8" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-cool)"></line><rect x="630" y="304" width="166" height="70" rx="8" fill="#fff4e8" stroke="#b54238" stroke-width="1"></rect><text x="713.0" y="333.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="713.0" dy="0">残余影响</tspan><tspan x="713.0" dy="19">条件函数，不是零</tspan></text><line x1="796" y1="339" x2="862" y2="339" stroke="#b54238" stroke-width="3" marker-end="url(#arrow-danger)"></line><rect x="862" y="304" width="108" height="70" rx="8" fill="#f6f9fb" stroke="#a9bac8" stroke-width="1"></rect><text x="916.0" y="333.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="916.0" dy="0">恢复时间</tspan><tspan x="916.0" dy="19">τᵣ</tspan></text><line x1="66" y1="402" x2="970" y2="402" stroke="#dbe5ec" stroke-width="1.5"></line><text x="66" y="430" font-size="13" font-weight="800" text-anchor="start" fill="#c58b20">上限与副作用</text><text x="184" y="430" font-size="13" font-weight="500" text-anchor="start" fill="#5f7182">提前量 · 覆盖率 · 维护 · 公平 · 水/能/土地反馈</text><text x="66" y="490" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><rect x="104" y="475" width="28" height="14" rx="3" fill="#d65a4a" stroke="none" stroke-width="1"></rect><text x="142" y="488" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">hazard</text><line x1="202" y1="485" x2="230" y2="485" stroke="#2784b8" stroke-width="4" stroke-dasharray="7 5"></line><text x="240" y="488" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">适应路径</text><rect x="332" y="475" width="28" height="14" rx="3" fill="#b54238" stroke="none" stroke-width="1"></rect><text x="370" y="488" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">残余影响</text><text x="500" y="506" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">虚线是条件化作用路径；适应不保证降低 hazard，本图不计算具体损失。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">链条和节点是非比例教学示意；情景边界由输入、暴露、脆弱性与维护条件给出，不是未来风险预报。</text></svg>
