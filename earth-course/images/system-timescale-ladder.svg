<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">扰动如何穿过快库与慢库</title><desc id="svg-desc">过程示意展示输入脉冲经过不同驻留时间的快库和慢库时产生不同的指数响应；曲线不是观测时间序列。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">扰动如何穿过快库与慢库</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">01 · 过程机制 | Timescale ladder</text><rect x="38" y="82" width="964" height="246" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">同一输入，不同的系统记忆</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">一阶响应 / first-order response</text><text x="70" y="126" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">脉冲输入</text><path d="M 83 174 L 83 145 L 114 145 L 114 174" fill="none" stroke="#d65a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><text x="83" y="202" font-size="13" font-weight="500" text-anchor="middle" fill="#d65a4a">Fᵢₙ</text><line x1="121" y1="160" x2="186" y2="160" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><rect x="190" y="130" width="154" height="62" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="267.0" y="153.0" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="267.0" dy="0">快库</tspan><tspan x="267.0" dy="19">τ = 1 年</tspan></text><line x1="352" y1="160" x2="418" y2="160" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><rect x="424" y="130" width="154" height="62" rx="8" fill="#eaf5fb" stroke="#2784b8" stroke-width="1"></rect><text x="501.0" y="153.0" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="501.0" dy="0">慢库</tspan><tspan x="501.0" dy="19">τ = 20 年</tspan></text><line x1="586" y1="160" x2="650" y2="160" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="656" y="130" width="176" height="62" rx="8" fill="#f2f6fa" stroke="#a9bac8" stroke-width="1"></rect><text x="744.0" y="153.0" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="744.0" dy="0">输出</tspan><tspan x="744.0" dy="19">Fₒᵤₜ = kS</tspan></text><text x="92" y="239" font-size="13" font-weight="500" text-anchor="start" fill="#5f7182">响应剩余比例</text><line x1="185" y1="232" x2="904" y2="232" stroke="#dbe5ec" stroke-width="1.5"></line><path d="M 185 232 C 260 232, 285 240, 340 250 C 390 260, 420 266, 480 269 C 560 273, 630 274, 720 274" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 185 232 C 330 232, 420 234, 510 243 C 620 254, 710 263, 900 270" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><line x1="185" y1="276" x2="904" y2="276" stroke="#17324d" stroke-width="2" marker-end="arrow"></line><text x="185" y="298" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">t = 0</text><text x="545" y="298" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">t = τ</text><text x="904" y="298" font-size="11" font-weight="500" text-anchor="end" fill="#5f7182">时间 t</text><text x="545" y="257" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182">e⁻¹ ≈ 0.37</text><rect x="760" y="92" width="210" height="103" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="774" y="114" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="774" y1="136" x2="802" y2="136" stroke="#d65a4a" stroke-width="4"></line><text x="812" y="139" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">快库 / fast</text><line x1="774" y1="159" x2="802" y2="159" stroke="#2784b8" stroke-width="4"></line><text x="812" y="162" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">慢库 / slow</text><line x1="774" y1="182" x2="802" y2="182" stroke="#d65a4a" stroke-width="4"></line><text x="812" y="185" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">输入脉冲</text><rect x="38" y="350" width="964" height="162" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="380" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">时间尺度阶梯</text><text x="984" y="379" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">同一语法可迁移到水、碳与热</text><rect x="76" y="441" width="132" height="34" rx="6" fill="#d65a4a" stroke="#d65a4a" stroke-width="1" opacity="0.18"></rect><text x="142.0" y="457.0" font-size="16" font-weight="750" text-anchor="middle" fill="#17324d">日</text><text x="142.0" y="479.0" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">hours–days</text><rect x="220" y="421" width="132" height="54" rx="6" fill="#c58b20" stroke="#c58b20" stroke-width="1" opacity="0.18"></rect><text x="286.0" y="447.0" font-size="16" font-weight="750" text-anchor="middle" fill="#17324d">季节</text><text x="286.0" y="469.0" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">months</text><rect x="364" y="399" width="132" height="76" rx="6" fill="#4d8a63" stroke="#4d8a63" stroke-width="1" opacity="0.18"></rect><text x="430.0" y="436.0" font-size="16" font-weight="750" text-anchor="middle" fill="#17324d">年</text><text x="430.0" y="458.0" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">1 yr</text><rect x="508" y="377" width="132" height="98" rx="6" fill="#7666a8" stroke="#7666a8" stroke-width="1" opacity="0.18"></rect><text x="574.0" y="425.0" font-size="16" font-weight="750" text-anchor="middle" fill="#17324d">世纪</text><text x="574.0" y="447.0" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">10² yr</text><rect x="652" y="355" width="166" height="120" rx="6" fill="#2679a8" stroke="#2679a8" stroke-width="1" opacity="0.18"></rect><text x="735.0" y="414.0" font-size="16" font-weight="750" text-anchor="middle" fill="#17324d">百万年</text><text x="735.0" y="436.0" font-size="11" font-weight="500" text-anchor="middle" fill="#5f7182">Myr</text><text x="76" y="497" font-size="12" font-weight="700" text-anchor="start" fill="#d65a4a">快响应</text><text x="906" y="497" font-size="12" font-weight="700" text-anchor="end" fill="#2679a8">慢响应</text><text x="38" y="560" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">核心关系：τ = S/Fₒᵤₜ = 1/k；虚线表示模型中的输入脉冲或延迟路径。</text></svg>
