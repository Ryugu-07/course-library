<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">地层中的时间书签</title><desc id="svg-desc">空间剖面示意把地层叠覆关系与火山灰标志层放在一起；层厚、倾角、距离均非等比例，数值年龄必须依赖独立定年与校正。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">地层中的时间书签</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">02 · 空间结构 | Deep-time clock</text><rect x="38" y="82" width="596" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">连续沉积剖面</text><text x="616" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">相对顺序 / relative order</text><rect x="115" y="136" width="390" height="54" rx="0" fill="#e7cda8" stroke="#92765e" stroke-width="1.2"></rect><text x="133" y="168.0" font-size="14" font-weight="700" text-anchor="start" fill="#17324d">上部砂岩</text><text x="487" y="168.0" font-size="12" font-weight="700" text-anchor="end" fill="#ffffff">young</text><rect x="123" y="190" width="350" height="60" rx="0" fill="#b8c7d1" stroke="#92765e" stroke-width="1.2"></rect><text x="141" y="225.0" font-size="14" font-weight="700" text-anchor="start" fill="#17324d">页岩</text><rect x="115" y="250" width="370" height="48" rx="0" fill="#6d7f8d" stroke="#92765e" stroke-width="1.2"></rect><text x="133" y="279.0" font-size="14" font-weight="700" text-anchor="start" fill="#17324d">火山灰层</text><text x="467" y="279.0" font-size="12" font-weight="700" text-anchor="end" fill="#ffffff">marker bed</text><rect x="123" y="298" width="340" height="67" rx="0" fill="#d8b58c" stroke="#92765e" stroke-width="1.2"></rect><text x="141" y="336.5" font-size="14" font-weight="700" text-anchor="start" fill="#17324d">粉砂岩</text><rect x="115" y="365" width="400" height="72" rx="0" fill="#b98962" stroke="#92765e" stroke-width="1.2"></rect><text x="133" y="406.0" font-size="14" font-weight="700" text-anchor="start" fill="#17324d">砾岩</text><text x="497" y="406.0" font-size="12" font-weight="700" text-anchor="end" fill="#ffffff">old</text><line x1="78" y1="142" x2="78" y2="414" stroke="#17324d" stroke-width="2" marker-end="arrow"></line><text x="67" y="130" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182" transform="rotate(-90 67 130)">年轻 / young</text><text x="67" y="466" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182" transform="rotate(-90 67 466)">老 / old</text><line x1="506" y1="289" x2="567" y2="289" stroke="#c58b20" stroke-width="3" marker-end="arrow"></line><text x="569" y="284" font-size="12" font-weight="700" text-anchor="start" fill="#c58b20">可对比的标志层</text><text x="569" y="302" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">tephra marker</text><text x="56" y="494" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">剖面为示意；层厚、界面倾角和空间距离非等比例。</text><rect x="664" y="82" width="338" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="682" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">两类时间证据</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">先后 ≠ 数值年龄</text><rect x="696" y="132" width="274" height="68" rx="8" fill="#f6f0e8" stroke="#c8a27a" stroke-width="1"></rect><text x="833.0" y="158.0" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="833.0" dy="0">叠覆律</tspan><tspan x="833.0" dy="19">下部较老 · 上部较新</tspan></text><line x1="833" y1="211" x2="833" y2="241" stroke="#c8a27a" stroke-width="3" marker-end="url(#arrow-ink)"></line><rect x="696" y="246" width="274" height="74" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="833.0" y="275.0" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="833.0" dy="0">放射性时钟</tspan><tspan x="833.0" dy="19">f = N/N₀ · T₁/₂</tspan></text><line x1="833" y1="330" x2="833" y2="359" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="696" y="364" width="274" height="72" rx="8" fill="#f2f7ee" stroke="#4d8a63" stroke-width="1"></rect><text x="833.0" y="392.0" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="833.0" dy="0">交叉约束</tspan><tspan x="833.0" dy="19">t ± σₜ · 条件化年龄</tspan></text><text x="696" y="469" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">t = (T₁/₂ / ln 2) ln(1/f)</text><text x="696" y="490" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">f 需校正；封闭体系与误差模型不可省略。</text><rect x="710" y="516" width="246" height="80" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="724" y="538" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><rect x="724" y="550" width="28" height="14" rx="3" fill="#b98962" stroke="none" stroke-width="1"></rect><text x="762" y="563" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">相对层序色带</text><line x1="724" y1="583" x2="752" y2="583" stroke="#c58b20" stroke-width="4"></line><text x="762" y="586" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">标志层线</text></svg>
