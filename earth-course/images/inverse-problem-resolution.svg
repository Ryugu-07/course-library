<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">反问题的分辨率与信息方向</title><desc id="svg-desc">过程示意把正问题的状态到观测方向与反问题的观测到估计方向并列，并显示正则化和小奇异值方向；图中估计是条件化结果，不是分析场真值或预报。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">反问题的分辨率与信息方向</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">22 · 信息结构 | Inverse resolution</text><rect x="38" y="82" width="650" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">从隐藏状态到可见信号，再反向估计</text><text x="670" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">H 是信息瓶颈</text><text x="68" y="126" font-size="14" font-weight="800" text-anchor="start" fill="#2784b8">正问题：给定状态，生成观测</text><rect x="68" y="150" width="156" height="72" rx="8" fill="#eef6ed" stroke="#4d8a63" stroke-width="1"></rect><text x="146.0" y="181.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="146.0" dy="0">隐藏状态 x</tspan><tspan x="146.0" dy="19">土壤水 / 温度</tspan></text><line x1="230" y1="186" x2="308" y2="186" stroke="#4d8a63" stroke-width="3" marker-end="url(#arrow-forest)"></line><rect x="314" y="150" width="136" height="72" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="382.0" y="181.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="382.0" dy="0">观测算子 H</tspan><tspan x="382.0" dy="19">辐射 / 回波</tspan></text><line x1="456" y1="186" x2="534" y2="186" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="540" y="150" width="112" height="72" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="596.0" y="180.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="596.0" dy="0">信号 y</tspan><tspan x="596.0" dy="19">+ 噪声 ε</tspan></text><text x="68" y="286" font-size="14" font-weight="800" text-anchor="start" fill="#d65a4a">反问题：从观测回到估计</text><rect x="68" y="316" width="156" height="72" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="146.0" y="347.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="146.0" dy="0">信号 y</tspan><tspan x="146.0" dy="19">有限、带噪</tspan></text><line x1="230" y1="352" x2="308" y2="352" stroke="#d65a4a" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow-warm)"></line><rect x="314" y="316" width="136" height="72" rx="8" fill="#fff9e6" stroke="#c58b20" stroke-width="1"></rect><text x="382.0" y="347.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="382.0" dy="0">正则化</tspan><tspan x="382.0" dy="19">R⁻¹ + λL</tspan></text><line x1="456" y1="352" x2="534" y2="352" stroke="#d65a4a" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow-warm)"></line><rect x="540" y="316" width="112" height="72" rx="8" fill="#eef6ed" stroke="#4d8a63" stroke-width="1"></rect><text x="596.0" y="346.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="596.0" dy="0">估计 x̂</tspan><tspan x="596.0" dy="19">带区间</tspan></text><path d="M 382 388 C 375 421, 310 433, 262 413" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"></path><text x="68" y="426" font-size="12" font-weight="750" text-anchor="start" fill="#c58b20">小奇异值方向</text><text x="182" y="447" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">对噪声敏感；先验提供偏好，不凭空增加信息。</text><text x="68" y="479" font-size="17" font-weight="800" text-anchor="start" fill="#17324d">y = Hx + ε</text><text x="225" y="479" font-size="14" font-weight="700" text-anchor="start" fill="#5f7182">J(x) = ‖y − Hx‖² + λ‖L(x − xᵦ)‖²</text><text x="70" y="500" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><line x1="108" y1="495" x2="136" y2="495" stroke="#4d8a63" stroke-width="4"></line><text x="146" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">状态</text><line x1="230" y1="495" x2="258" y2="495" stroke="#2784b8" stroke-width="4"></line><text x="268" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">观测</text><line x1="350" y1="495" x2="378" y2="495" stroke="#d65a4a" stroke-width="4" stroke-dasharray="7 5"></line><text x="388" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">反向估计</text><rect x="714" y="82" width="288" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="732" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">可辨识性账本</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">分辨率不是像素数</text><text x="736" y="128" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">观测维数 m  &lt;  状态维数 n</text><text x="736" y="153" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">弱方向需要正则化或降维。</text><text x="736" y="188" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">奇异值 σᵢ</text><text x="736" y="223" font-size="12" font-weight="700" text-anchor="start" fill="#5f7182">强</text><rect x="780" y="207" width="184" height="22" rx="4" fill="#2784b8" stroke="#2784b8" stroke-width="1" opacity="0.82"></rect><text x="974" y="223" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">σ</text><text x="736" y="261" font-size="12" font-weight="700" text-anchor="start" fill="#5f7182">中</text><rect x="780" y="245" width="126" height="22" rx="4" fill="#4d8a63" stroke="#4d8a63" stroke-width="1" opacity="0.82"></rect><text x="916" y="261" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">σ</text><text x="736" y="299" font-size="12" font-weight="700" text-anchor="start" fill="#5f7182">弱</text><rect x="780" y="283" width="62" height="22" rx="4" fill="#c58b20" stroke="#c58b20" stroke-width="1" opacity="0.82"></rect><text x="852" y="299" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">σ</text><text x="736" y="337" font-size="12" font-weight="700" text-anchor="start" fill="#5f7182">近零</text><rect x="780" y="321" width="28" height="22" rx="4" fill="#d65a4a" stroke="#d65a4a" stroke-width="1" opacity="0.82"></rect><text x="818" y="337" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">σ</text><line x1="736" y1="375" x2="980" y2="375" stroke="#dbe5ec" stroke-width="1"></line><rect x="736" y="394" width="244" height="66" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="858.0" y="421.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="858.0" dy="0">证据边界</tspan><tspan x="858.0" dy="19">估计依赖 H、R、先验和尺度</tspan></text><text x="736" y="486" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">估计场是条件化分析，不是直接观测的真值。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">矩形、奇异值和箭头均为示意；合成观测只说明信息方向，不代表任何传感器产品。</text></svg>
