</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">从物理过程到灾害风险</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">24 · 过程机制 | Hazard processes</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">三类灾害的物理链</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">hazard 先于 risk</text><text x="64" y="124" font-size="13" font-weight="800" text-anchor="start" fill="#d65a4a">事件源</text><text x="335" y="124" font-size="13" font-weight="800" text-anchor="start" fill="#2784b8">传播 / 转换</text><text x="610" y="124" font-size="13" font-weight="800" text-anchor="start" fill="#7666a8">局地强度</text><text x="844" y="124" font-size="13" font-weight="800" text-anchor="start" fill="#17324d">社会账本</text><text x="68" y="188" font-size="16" font-weight="800" text-anchor="start" fill="#17324d">地震</text><rect x="146" y="154" width="150" height="68" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="221.0" y="182.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="221.0" dy="0">断层滑动</tspan><tspan x="221.0" dy="19">source</tspan></text><line x1="306" y1="188" x2="350" y2="188" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><rect x="356" y="154" width="194" height="68" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="453.0" y="182.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="453.0" dy="0">地震波</tspan><tspan x="453.0" dy="19">pathway</tspan></text><line x1="560" y1="188" x2="604" y2="188" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="610" y="154" width="170" height="68" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="695.0" y="182.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="695.0" dy="0">地面运动</tspan><tspan x="695.0" dy="19">local intensity</tspan></text><line x1="790" y1="188" x2="834" y2="188" stroke="#7666a8" stroke-width="3" marker-end="url(#arrow-violet)"></line><rect x="840" y="154" width="132" height="68" rx="8" fill="#f1f6fa" stroke="#a9bac8" stroke-width="1"></rect><text x="906.0" y="182.58" font-size="12" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="906.0" dy="0">建筑 / 人口</tspan><tspan x="906.0" dy="19">exposure</tspan></text><text x="68" y="278" font-size="16" font-weight="800" text-anchor="start" fill="#17324d">火山</text><rect x="146" y="244" width="150" height="68" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="221.0" y="272.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="221.0" dy="0">岩浆压力</tspan><tspan x="221.0" dy="19">source</tspan></text><line x1="306" y1="278" x2="350" y2="278" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><rect x="356" y="244" width="194" height="68" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="453.0" y="272.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="453.0" dy="0">灰 / 熔岩 / 碎屑流</tspan><tspan x="453.0" dy="19">pathway</tspan></text><line x1="560" y1="278" x2="604" y2="278" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="610" y="244" width="170" height="68" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="695.0" y="272.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="695.0" dy="0">落灰 / 冲击</tspan><tspan x="695.0" dy="19">local intensity</tspan></text><line x1="790" y1="278" x2="834" y2="278" stroke="#7666a8" stroke-width="3" marker-end="url(#arrow-violet)"></line><rect x="840" y="244" width="132" height="68" rx="8" fill="#f1f6fa" stroke="#a9bac8" stroke-width="1"></rect><text x="906.0" y="272.58" font-size="12" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="906.0" dy="0">基础设施</tspan><tspan x="906.0" dy="19">exposure</tspan></text><text x="68" y="368" font-size="16" font-weight="800" text-anchor="start" fill="#17324d">海啸</text><rect x="146" y="334" width="150" height="68" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="221.0" y="362.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="221.0" dy="0">海底位移</tspan><tspan x="221.0" dy="19">source</tspan></text><line x1="306" y1="368" x2="350" y2="368" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><rect x="356" y="334" width="194" height="68" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="453.0" y="362.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="453.0" dy="0">长波传播</tspan><tspan x="453.0" dy="19">pathway</tspan></text><line x1="560" y1="368" x2="604" y2="368" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="610" y="334" width="170" height="68" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="695.0" y="362.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="695.0" dy="0">沿岸淹没</tspan><tspan x="695.0" dy="19">local intensity</tspan></text><line x1="790" y1="368" x2="834" y2="368" stroke="#7666a8" stroke-width="3" marker-end="url(#arrow-violet)"></line><rect x="840" y="334" width="132" height="68" rx="8" fill="#f1f6fa" stroke="#a9bac8" stroke-width="1"></rect><text x="906.0" y="362.58" font-size="12" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="906.0" dy="0">社区 / 港口</tspan><tspan x="906.0" dy="19">exposure</tspan></text><line x1="824" y1="142" x2="824" y2="414" stroke="#b54238" stroke-width="2.5" stroke-dasharray="8 5"></line><text x="832" y="164" font-size="11" font-weight="800" text-anchor="start" fill="#b54238">物理 hazard | 社会风险</text><rect x="150" y="430" width="205" height="56" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="252.5" y="452.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="252.5" dy="0">H：概率 × 强度</tspan><tspan x="252.5" dy="19">不等于损失</tspan></text><rect x="394" y="430" width="205" height="56" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="496.5" y="452.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="496.5" dy="0">E：谁在路径上</tspan><tspan x="496.5" dy="19">单位必须明确</tspan></text><rect x="638" y="430" width="205" height="56" rx="8" fill="#eef6ed" stroke="#4d8a63" stroke-width="1"></rect><text x="740.5" y="452.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="740.5" dy="0">V：冲击到后果</tspan><tspan x="740.5" dy="19">能力会改变</tspan></text><text x="64" y="500" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><rect x="102" y="485" width="28" height="14" rx="3" fill="#d65a4a" stroke="none" stroke-width="1"></rect><text x="140" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">物理源</text><line x1="210" y1="495" x2="238" y2="495" stroke="#2784b8" stroke-width="4"></line><text x="248" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">传播</text><rect x="310" y="485" width="28" height="14" rx="3" fill="#7666a8" stroke="none" stroke-width="1"></rect><text x="348" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">社会层</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">三条链的形状和箭头是机制示意；事件概率、时间窗与空间尺度非按比例，hazard 图不是发生预报。</text></svg>
