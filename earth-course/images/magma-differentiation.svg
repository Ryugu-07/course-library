<text x="872" y="377" font-size="11" font-weight="500" text-anchor="middle" fill="#c58b20">残余熔体</text><text x="390" y="492" font-size="12" font-weight="500" text-anchor="middle" fill="#5f7182">元素库存：Xⱼ = Mⱼ cⱼ；质量守恒不等于所有元素等比例移动。</text><rect x="754" y="327" width="215" height="103" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="768" y="349" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><rect x="768" y="361" width="28" height="14" rx="3" fill="#d65a4a" stroke="none" stroke-width="1"></rect><text x="806" y="374" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">液相 L</text><rect x="768" y="384" width="28" height="14" rx="3" fill="#2784b8" stroke="none" stroke-width="1"></rect><text x="806" y="397" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">早期晶体</text><line x1="768" y1="417" x2="796" y2="417" stroke="#7666a8" stroke-width="4"></line><text x="806" y="420" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">组成趋势</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">箭头表示教学过程方向；分配系数、温压和混合等真实约束未按比例展开。</text></svg>
