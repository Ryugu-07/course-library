<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">部分熔融如何产生分异</title><desc id="svg-desc">过程示意展示源岩部分熔融、晶体分离和残余熔体成分变化；组成坐标与物相比例为教学示意，不是具体岩浆样品。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
