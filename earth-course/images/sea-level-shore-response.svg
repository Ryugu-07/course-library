</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">海平面与岸线响应</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">09 / process mechanism</text><rect x="28" y="86" width="626" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="46" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Profile response</text><text x="636" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">same coast, different budget terms</text><rect x="50" y="126" width="276" height="338" rx="7" fill="#fbfdfe" stroke="#dbe5ec" stroke-width="1"></rect><text x="66" y="152" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">A  sediment in &gt;= out</text><polygon points="66.0,438.0 66.0,300.0 205.0,298.0 308.0,235.0 308.0,438.0" fill="#d7e5c1" stroke="#82936f" stroke-width="1.2"></polygon><polygon points="66.0,300.0 205.0,300.0 308.0,342.0 308.0,438.0 66.0,438.0" fill="#bfe2f2" stroke="none" stroke-width="1"></polygon><line x1="66" y1="300" x2="308" y2="300" stroke="#2784b8" stroke-width="2"></line><text x="304" y="292" font-size="10.5" font-weight="500" text-anchor="end" fill="#2784b8">relative sea level</text><text x="70" y="454" font-size="11" font-weight="500" text-anchor="start" fill="#82936f">land</text><text x="256" y="454" font-size="11" font-weight="500" text-anchor="start" fill="#2679a8">shelf</text><line x1="138" y1="250" x2="201" y2="293" stroke="#c58b20" stroke-width="2.5" marker-end="url(#arrow-gold)"></line><text x="78" y="228" font-size="11" font-weight="700" text-anchor="start" fill="#c58b20">sediment supports beach</text><rect x="346" y="126" width="276" height="338" rx="7" fill="#fbfdfe" stroke="#dbe5ec" stroke-width="1"></rect><text x="362" y="152" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">B  RSL rises + sediment loss</text><polygon points="362.0,438.0 362.0,274.0 466.0,272.0 604.0,209.0 604.0,438.0" fill="#d7e5c1" stroke="#82936f" stroke-width="1.2"></polygon><polygon points="362.0,274.0 466.0,274.0 604.0,316.0 604.0,438.0 362.0,438.0" fill="#bfe2f2" stroke="none" stroke-width="1"></polygon><line x1="362" y1="274" x2="604" y2="274" stroke="#2784b8" stroke-width="2"></line><text x="600" y="266" font-size="10.5" font-weight="500" text-anchor="end" fill="#2784b8">relative sea level</text><text x="366" y="454" font-size="11" font-weight="500" text-anchor="start" fill="#82936f">land</text><text x="552" y="454" font-size="11" font-weight="500" text-anchor="start" fill="#2679a8">shelf</text><line x1="522" y1="200" x2="476" y2="262" stroke="#d65a4a" stroke-width="2.5" marker-end="url(#arrow-warm)"></line><text x="496" y="217" font-size="11" font-weight="700" text-anchor="start" fill="#d65a4a">shoreline retreat</text><rect x="680" y="86" width="332" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="698" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Causal chain</text><text x="994" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">shoreline is output</text><rect x="710" y="130" width="272" height="54" rx="7" fill="#eef7fb" stroke="#dbe5ec" stroke-width="1"></rect><rect x="710" y="130" width="6" height="54" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="846.0" y="155" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">relative sea level</text><text x="846.0" y="177" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">rise / fall</tspan></text><line x1="846" y1="185" x2="846" y2="200" stroke="#2784b8" stroke-width="2.2" marker-end="url(#arrow-cool)"></line><rect x="710" y="202" width="272" height="54" rx="7" fill="#fff1ed" stroke="#dbe5ec" stroke-width="1"></rect><rect x="710" y="202" width="6" height="54" rx="3" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></rect><text x="846.0" y="227" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">waves + tides</text><text x="846.0" y="249" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">stress and redistribution</tspan></text><line x1="846" y1="257" x2="846" y2="272" stroke="#d65a4a" stroke-width="2.2" marker-end="url(#arrow-warm)"></line><rect x="710" y="274" width="272" height="54" rx="7" fill="#fff8e9" stroke="#dbe5ec" stroke-width="1"></rect><rect x="710" y="274" width="6" height="54" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="846.0" y="299" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">sediment budget</text><text x="846.0" y="321" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">in - out + nourishment</tspan></text><line x1="846" y1="329" x2="846" y2="344" stroke="#c58b20" stroke-width="2.2" marker-end="url(#arrow-gold)"></line><rect x="710" y="346" width="272" height="54" rx="7" fill="#edf1fa" stroke="#dbe5ec" stroke-width="1"></rect><rect x="710" y="346" width="6" height="54" rx="3" fill="#2679a8" stroke="#2679a8" stroke-width="1"></rect><text x="846.0" y="371" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d">shoreline</text><text x="846.0" y="393" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">retreat / advance / rollover</tspan></text><text x="710" y="432" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">dS/dt ~= (1 / h*L) dVs/dt</text><text x="710" y="458" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">a transparent morphology proxy, not a universal law</text><line x1="42" y1="530" x2="70" y2="530" stroke="#2784b8" stroke-width="4"></line><text x="80" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">higher relative sea level</text><line x1="270" y1="530" x2="298" y2="530" stroke="#d65a4a" stroke-width="4"></line><text x="308" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">shoreline retreat</text><line x1="475" y1="530" x2="503" y2="530" stroke="#c58b20" stroke-width="4"></line><text x="513" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">sediment support</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">Profiles are schematic; local bathymetry, storms, engineering, and sediment supply matter</text></svg>
