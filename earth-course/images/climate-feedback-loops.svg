</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">反馈符号决定放大还是恢复</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">19 · 过程机制 | Climate feedback loops</text><rect x="38" y="82" width="624" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">围绕温度扰动的四条反馈路径</text><text x="644" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">sign before magnitude</text><circle cx="350" cy="310" r="66" fill="#f6f9fb" stroke="#17324d" stroke-width="2"></circle><text x="350" y="304" font-size="26" font-weight="850" text-anchor="middle" fill="#17324d">ΔT</text><text x="350" y="330" font-size="12" font-weight="700" text-anchor="middle" fill="#5f7182">气候状态</text><rect x="78" y="140" width="186" height="64" rx="7" fill="#eaf6fb" stroke="#2784b8" stroke-width="1"></rect><text x="171.0" y="167.75" font-size="12.5" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="171.0" dy="0">普朗克恢复</tspan><tspan x="171.0" dy="17">+T → OLR ↑ → N ↓</tspan></text><path d="M 300 280 C 252 236, 226 211, 190 204" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><path d="M 166 208 C 181 279, 230 326, 293 335" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><text x="95" y="226" font-size="11" font-weight="800" text-anchor="start" fill="#2784b8">负反馈 / 恢复</text><rect x="428" y="140" width="186" height="64" rx="7" fill="#fff0ec" stroke="#d65a4a" stroke-width="1"></rect><text x="521.0" y="167.75" font-size="12.5" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="521.0" dy="0">水汽</tspan><tspan x="521.0" dy="17">+T → WV ↑ → 温室效应 ↑</tspan></text><path d="M 405 280 C 452 238, 482 211, 520 204" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><path d="M 545 208 C 526 275, 480 326, 407 338" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><text x="488" y="226" font-size="11" font-weight="800" text-anchor="start" fill="#d65a4a">正反馈 / 放大</text><rect x="78" y="420" width="214" height="62" rx="7" fill="#fff0ec" stroke="#d65a4a" stroke-width="1"></rect><text x="185.0" y="446.75" font-size="12.5" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="185.0" dy="0">冰雪反照率</tspan><tspan x="185.0" dy="17">+T → 冰雪 ↓ → 吸收 ↑</tspan></text><path d="M 305 346 C 257 374, 230 405, 194 420" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><path d="M 198 417 C 247 443, 289 450, 324 365" fill="none" stroke="#d65a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-warm)"></path><text x="100" y="405" font-size="11" font-weight="800" text-anchor="start" fill="#d65a4a">暖色 = 净放大</text><rect x="428" y="420" width="186" height="62" rx="7" fill="#f7f0e9" stroke="#c58b20" stroke-width="1"></rect><text x="521.0" y="446.75" font-size="12.5" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="521.0" dy="0">云</tspan><tspan x="521.0" dy="17">短波 / 长波竞争</tspan></text><path d="M 405 350 C 458 382, 488 409, 521 420" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"></path><path d="M 529 417 C 493 452, 449 449, 386 365" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"></path><text x="476" y="405" font-size="11" font-weight="800" text-anchor="start" fill="#c58b20">符号依状态</text><rect x="684" y="82" width="318" height="470" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="702" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">把符号写进能量账本</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">IPCC λ vs r</text><text x="708" y="132" font-size="18" font-weight="800" text-anchor="start" fill="#17324d">N = F + λ_IPCC ΔT − H</text><text x="708" y="158" font-size="12" font-weight="750" text-anchor="start" fill="#2784b8">λ_IPCC &lt; 0：净辐射随变暖减少</text><line x1="708" y1="177" x2="978" y2="177" stroke="#dbe5ec" stroke-width="1"></line><text x="708" y="205" font-size="18" font-weight="800" text-anchor="start" fill="#17324d">r = −λ_IPCC &gt; 0</text><text x="708" y="231" font-size="14" font-weight="700" text-anchor="start" fill="#5f7182">r = r_P − f_WV − f_alb − f_cloud</text><text x="708" y="263" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">反馈项</text><text x="708" y="294" font-size="12" font-weight="700" text-anchor="start" fill="#17324d">普朗克</text><text x="788" y="294" font-size="11" font-weight="750" text-anchor="start" fill="#2784b8">恢复</text><rect x="860" y="281" width="86.4" height="13" rx="3" fill="#2784b8" stroke="none" stroke-width="1" opacity="0.75"></rect><text x="708" y="328" font-size="12" font-weight="700" text-anchor="start" fill="#17324d">水汽</text><text x="788" y="328" font-size="11" font-weight="750" text-anchor="start" fill="#d65a4a">放大</text><rect x="860" y="315" width="27.0" height="13" rx="3" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.75"></rect><text x="708" y="362" font-size="12" font-weight="700" text-anchor="start" fill="#17324d">冰雪</text><text x="788" y="362" font-size="11" font-weight="750" text-anchor="start" fill="#d65a4a">放大</text><rect x="860" y="349" width="8.1" height="13" rx="3" fill="#d65a4a" stroke="none" stroke-width="1" opacity="0.75"></rect><text x="708" y="396" font-size="12" font-weight="700" text-anchor="start" fill="#17324d">云</text><text x="788" y="396" font-size="11" font-weight="750" text-anchor="start" fill="#c58b20">依状态</text><rect x="860" y="383" width="13.5" height="13" rx="3" fill="#c58b20" stroke="none" stroke-width="1" opacity="0.75"></rect><text x="708" y="438" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">ΔT_eq = F / r；海洋热摄取 H 延迟到达平衡</text><rect x="762" y="456" width="216" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="776" y="476" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="776" y1="494" x2="804" y2="494" stroke="#2784b8" stroke-width="4"></line><text x="814" y="497" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">负反馈 / 恢复</text><line x1="776" y1="513" x2="804" y2="513" stroke="#d65a4a" stroke-width="4"></line><text x="814" y="516" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">正反馈 / 放大</text><line x1="776" y1="532" x2="804" y2="532" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="814" y="535" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">符号依状态</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 19A：同一颜色只承担符号或过程类别；云的符号必须随云型、基准和尺度一起报告。</text></svg>
