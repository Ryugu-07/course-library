 stroke-width="3" marker-end="url(#arrow-deep)"></line><text x="574" y="348" font-size="12" font-weight="700" text-anchor="start" fill="#2679a8">q</text><text x="56" y="489" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">剖面是示意；垂向深度与坡面长度、土层厚度非等比例。</text><rect x="686" y="82" width="316" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="704" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">临界带的耦合变量</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">可观测量 / observables</text><circle cx="720" cy="153" r="14" fill="#2784b8" stroke="#2784b8" stroke-width="1"></circle><text x="720" y="158" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">水</text><text x="750" y="151" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">H₂O · 入渗 / drainage</text><line x1="750" y1="165" x2="970" y2="165" stroke="#dbe5ec" stroke-width="1"></line><circle cx="720" cy="217" r="14" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></circle><text x="720" y="222" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">碳</text><text x="750" y="215" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">CO₂ · 酸度代理</text><line x1="750" y1="229" x2="970" y2="229" stroke="#dbe5ec" stroke-width="1"></line><circle cx="720" cy="281" r="14" fill="#c58b20" stroke="#c58b20" stroke-width="1"></circle><text x="720" y="286" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">热</text><text x="750" y="279" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">T · reaction rate</text><line x1="750" y1="293" x2="970" y2="293" stroke="#dbe5ec" stroke-width="1"></line><circle cx="720" cy="345" r="14" fill="#7666a8" stroke="#7666a8" stroke-width="1"></circle><text x="720" y="350" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">物质</text><text x="750" y="343" font-size="13" font-weight="70