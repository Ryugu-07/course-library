.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">三种大气：同一能量骨架，不同表面结果</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">27 · 对照实验 | Planetary climates</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">行星能量账本</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">教学参数 / not live observations</text><text x="64" y="124" font-size="13" font-weight="800" text-anchor="start" fill="#c58b20">短波入射</text><text x="798" y="124" font-size="13" font-weight="800" text-anchor="start" fill="#2784b8">长波逃逸</text><rect x="92" y="150" width="246" height="296" rx="8" fill="#f8e5c6" stroke="#d65a4a" stroke-width="1"></rect><text x="110" y="180" font-size="17" font-weight="800" text-anchor="start" fill="#17324d">金星样</text><text x="110" y="201" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">Venus-like</text><line x1="215" y1="213" x2="215" y2="235" stroke="#c58b20" stroke-width="4" marker-end="url(#arrow-gold)"></line><text x="215" y="228" font-size="11" font-weight="750" text-anchor="middle" fill="#c58b20">S(1−A)/4</text><rect x="124" y="244" width="182" height="44" rx="8" fill="#d65a4a" stroke="#d65a4a" stroke-width="1" opacity="0.28"></rect><text x="215" y="271" font-size="12" font-weight="750" text-anchor="middle" fill="#d65a4a">大气 / 云</text><circle cx="215" cy="332" r="45" fill="#d65a4a" stroke="#d65a4a" stroke-width="1" opacity="0.78"></circle><text x="215" y="337" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff">表面</text><path d="M 186 312 C 158 285, 154 245, 168 222" fill="none" stroke="#2784b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"></path><text x="176" y="219" font-size="11" font-weight="750" text-anchor="start" fill="#2784b8">IR ↑</text><text x="215" y="397" font-size="12" font-weight="700" text-anchor="middle" fill="#5f7182">s = 1.9 · A = 0.75</text><text x="215" y="420" font-size="12" font-weight="700" text-anchor="middle" fill="#d65a4a">G = 210 K</text><rect x="376" y="150" width="246" height="296" rx="8" fill="#dff1f7" stroke="#2784b8" stroke-width="1"></rect><text x="394" y="180" font-size="17" font-weight="800" text-anchor="start" fill="#17324d">地球样</text><text x="394" y="201" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">Earth-like</text><line x1="499" y1="213" x2="499" y2="235" stroke="#c58b20" stroke-width="4" marker-end="url(#arrow-gold)"></line><text x="499" y="228" font-size="11" font-weight="750" text-anchor="middle" fill="#c58b20">S(1−A)/4</text><rect x="408" y="244" width="182" height="25" rx="8" fill="#2784b8" stroke="#2784b8" stroke-width="1" opacity="0.28"></rect><text x="499" y="262" font-size="12" font-weight="750" text-anchor="middle" fill="#2784b8">大气 / 云</text><circle cx="499" cy="332" r="45" fill="#2784b8" stroke="#2784b8" stroke-width="1" opacity="0.78"></circle><text x="499" y="337" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff">表面</text><path d="M 470 312 C 442 285, 438 245, 452 222" fill="none" stroke="#2784b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"></path><text x="460" y="219" font-size="11" font-weight="750" text-anchor="start" fill="#2784b8">IR ↑</text><text x="499" y="397" font-size="12" font-weight="700" text-anchor="middle" fill="#5f7182">s = 1.0 · A = 0.30</text><text x="499" y="420" font-size="12" font-weight="700" text-anchor="middle" fill="#5f7182">G = 33 K</text><rect x="660" y="150" width="246" height="296" rx="8" fill="#f3ded1" stroke="#c8a27a" stroke-width="1"></rect><text x="678" y="180" font-size="17" font-weight="800" text-anchor="start" fill="#17324d">火星样</text><text x="678" y="201" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">Mars-like</text><line x1="783" y1="213" x2="783" y2="235" stroke="#c58b20" stroke-width="4" marker-end="url(#arrow-gold)"></line><text x="783" y="228" font-size="11" font-weight="750" text-anchor="middle" fill="#c58b20">S(1−A)/4</text><rect x="692" y="244" width="182" height="13" rx="8" fill="#c8a27a" stroke="#c8a27a" stroke-width="1" opacity="0.28"></rect><text x="783" y="262" font-size="12" font-weight="750" text-anchor="middle" fill="#c8a27a">大气 / 云</text><circle cx="783" cy="332" r="45" fill="#c8a27a" stroke="#c8a27a" stroke-width="1" opacity="0.78"></circle><text x="783" y="337" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff">表面</text><path d="M 754 312 C 726 285, 722 245, 736 222" fill="none" stroke="#2784b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"></path><text x="744" y="219" font-size="11" font-weight="750" text-anchor="start" fill="#2784b8">IR ↑</text><text x="783" y="397" font-size="12" font-weight="700" text-anchor="middle" fill="#5f7182">s = 0.43 · A = 0.25</text><text x="783" y="420" font-size="12" font-weight="700" text-anchor="middle" fill="#5f7182">G = 8 K</text><text x="64" y="481" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><line x1="100" y1="476" x2="128" y2="476" stroke="#c58b20" stroke-width="4"></line><text x="138" y="479" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">短波</text><line x1="190" y1="476" x2="218" y2="476" stroke="#2784b8" stroke-width="4" stroke-dasharray="7 5"></line><text x="228" y="479" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">长波</text><line x1="280" y1="476" x2="308" y2="476" stroke="#d65a4a" stroke-width="4"></line><text x="318" y="479" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">G</text><text x="394" y="482" font-size="17" font-weight="800" text-anchor="start" fill="#17324d">F_abs = sS₀(1−A)/4</text><text x="394" y="507" font-size="14" font-weight="750" text-anchor="start" fill="#5f7182">Tₑ = (F_abs/σ)¹ᐟ⁴；Tₛ = Tₑ + G</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">三列、气氛厚度、颜色和参数为机制对照示意；不按行星尺度或实测压强绘制，也不预测行星未来状态。</text></svg>
