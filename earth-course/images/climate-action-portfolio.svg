<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">减缓与适应：同一风险的双路径</title><desc id="svg-desc">过程示意把减缓放在累积排放到气候 hazard 的上游，把适应放在暴露与脆弱性到残余影响的下游；账本和路径为合成情景，非政策指令或风险预报。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">减缓与适应：同一风险的双路径</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">26 · 选择结构 | Climate action portfolio</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">两个作用点，两个账本</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">情景比较 / not a policy command</text><text x="66" y="126" font-size="13" font-weight="800" text-anchor="start" fill="#d65a4a">上游：累积排放与气候 hazard</text><text x="66" y="302" font-size="13" font-weight="800" text-anchor="start" fill="#2784b8">下游：暴露系统与残余影响</text><rect x="66" y="150" width="150" height="68" rx="8" fill="#fff4e8" stroke="#d65a4a" stroke-width="1"></rect><text x="141.0" y="179.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="141.0" dy="0">排放 E(t)</tspan><tspan x="141.0" dy="19">累积输入</tspan></text><line x1="226" y1="184" x2="282" y2="184" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><rect x="288" y="150" width="184" height="68" rx="8" fill="#fff9e6" stroke="#c58b20" stroke-width="1"></rect><text x="380.0" y="179.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="380.0" dy="0">减缓</tspan><tspan x="380.0" dy="19">减排 · 清除 · 预算</tspan></text><line x1="482" y1="184" x2="540" y2="184" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><rect x="546" y="150" width="174" height="68" rx="8" fill="#f6f9fb" stroke="#a9bac8" stroke-width="1"></rect><text x="633.0" y="179.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="633.0" dy="0">气候 hazard</tspan><tspan x="633.0" dy="19">强迫 → 响应</tspan></text><line x1="730" y1="184" x2="786" y2="184" stroke="#d65a4a" stroke-width="3" marker-end="url(#arrow-warm)"></line><rect x="792" y="150" width="176" height="68" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="880.0" y="178.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="880.0" dy="0">长期风险轨迹</tspan><tspan x="880.0" dy="19">受累积量影响</tspan></text><rect x="66" y="326" width="150" height="68" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="141.0" y="354.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="141.0" dy="0">暴露 E</tspan><tspan x="141.0" dy="19">谁 / 什么在路径上</tspan></text><line x1="226" y1="360" x2="282" y2="360" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="288" y="326" width="184" height="68" rx="8" fill="#eef6ed" stroke="#4d8a63" stroke-width="1"></rect><text x="380.0" y="355.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="380.0" dy="0">适应</tspan><tspan x="380.0" dy="19">预警 · 设计 · 恢复</tspan></text><line x1="482" y1="360" x2="540" y2="360" stroke="#4d8a63" stroke-width="3" marker-end="url(#arrow-forest)"></line><rect x="546" y="326" width="174" height="68" rx="8" fill="#eef5fb" stroke="#2784b8" stroke-width="1"></rect><text x="633.0" y="355.26" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="633.0" dy="0">残余脆弱性</tspan><tspan x="633.0" dy="19">V(1 − a)</tspan></text><line x1="730" y1="360" x2="786" y2="360" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><rect x="792" y="326" width="176" height="68" rx="8" fill="#f3f0fb" stroke="#7666a8" stroke-width="1"></rect><text x="880.0" y="354.92" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="880.0" dy="0">即时 / 局地风险</tspan><tspan x="880.0" dy="19">HEV(1 − a)</tspan></text><line x1="532" y1="128" x2="532" y2="430" stroke="#dbe5ec" stroke-width="1.5" stroke-dasharray="7 5"></line><text x="540" y="420" font-size="11" font-weight="700" text-anchor="start" fill="#5f7182">共享 hazard 接口</text><text x="66" y="456" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">减缓账本：B_rem = B₀ − (G − DT)</text><text x="438" y="456" font-size="14" font-weight="750" text-anchor="start" fill="#5f7182">适应账本：R_after = H × E × V × (1 − a)</text><text x="66" y="500" font-size="11" font-weight="750" text-anchor="start" fill="#5f7182">图例</text><line x1="102" y1="495" x2="130" y2="495" stroke="#d65a4a" stroke-width="4"></line><text x="140" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">减缓</text><line x1="190" y1="495" x2="218" y2="495" stroke="#2784b8" stroke-width="4"></line><text x="228" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">适应</text><rect x="278" y="485" width="28" height="14" rx="3" fill="#7666a8" stroke="none" stroke-width="1"></rect><text x="316" y="498" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">风险接口</text><text x="420" y="505" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">减缓和适应可互补，但不能把适应效果从碳预算中扣除。</text><text x="38" y="554" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">两条路径、箭头与账本边界是合成情景示意；不代表全球排放路径、政策处方或未来风险预测。</text></svg>
