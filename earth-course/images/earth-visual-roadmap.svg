f" stroke="none" stroke-width="1"></circle><text x="598" y="197" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff">02</text><text x="630" y="188" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">深部骨架</text><text x="630" y="207" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">深时 · 地震波 · 板块 · 岩石</text><line x1="598" y1="218" x2="598" y2="228" stroke="#a9bac8" stroke-width="2"></line><rect x="570" y="228" width="420" height="52" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1.5"></rect><circle cx="598" cy="254" r="18" fill="#4d8a63" stroke="none" stroke-width="1"></circle><text x="598" y="259" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff">03</text><text x="630" y="250" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">地表水文</text><text x="630" y="269" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">风化 · 流域 · 冰冻圈 · 海岸</text><line x1="598" y1="280" x2="598" y2="290" stroke="#a9bac8" stroke-width="2"></line><rect x="570" y="290" width="420" height="52" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1.5"></rect><circle cx="598" cy="316" r="18" fill="#2784b8" stroke="none" stroke-width="1"></circle><text x="598" y="321" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff">04</text><text x="630" y="312" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">气海热机</text><text x="630" y="331" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">辐射 · 环流 · 云雨 · 洋流 · ENSO</text><line x1="598" y1="342" x2="598" y2="352" stroke="#a9bac8" stroke-width="2"></line><rect x="570" y="352" width="420" height="52" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1.5"></rect><circle cx="598" cy="378" r="18" fill="#d65a4a" stroke="none" stroke-width="1"></circle><text x="598" y="383" font-size="11" font-weight="800" text-anchor="middle" fill="#ffffff">05</text><text x="630" y="374" font-size="15" font-weight="8