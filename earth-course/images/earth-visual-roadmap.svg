<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">地球系统与气候科学视觉路线图</title><desc id="svg-desc">左侧是地球圈层剖面和能量物质通量，右侧按系统账本、深部骨架、地表水文、气海热机、气候变化、模型证据、风险选择排列七条课程路径。所有几何均为教学示意而非比例图。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
