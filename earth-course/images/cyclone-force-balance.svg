<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Cyclone force balance: pressure gradient, Coriolis, and friction</title><desc id="svg-desc">A force-balance schematic compares Northern and Southern Hemisphere low-pressure flow, showing inward pressure-gradient force, hemisphere-dependent Coriolis deflection, and surface friction.</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">气旋的力平衡</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">11 / process mechanism</text><rect x="28" y="86" width="620" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="46" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Horizontal force diagram</text><text x="630" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">idealized near-surface low</text><circle cx="200" cy="296" r="74" fill="#eef7fb" stroke="#2784b8" stroke-width="1.5"></circle><circle cx="200" cy="296" r="20" fill="#ffffff" stroke="#d65a4a" stroke-width="2"></circle><text x="200" y="301" font-size="18" font-weight="800" text-anchor="middle" fill="#d65a4a">L</text><text x="200" y="204" font-size="12.5" font-weight="750" text-anchor="middle" fill="#17324d">NH: counterclockwise</text><line x1="92" y1="296" x2="172" y2="296" stroke="#c58b20" stroke-width="2.3" marker-end="url(#arrow-gold)"></line><line x1="308" y1="296" x2="228" y2="296" stroke="#c58b20" stroke-width="2.3" marker-end="url(#arrow-gold)"></line><line x1="200" y1="188" x2="200" y2="268" stroke="#c58b20" stroke-width="2.3" marker-end="url(#arrow-gold)"></line><line x1="200" y1="404" x2="200" y2="324" stroke="#c58b20" stroke-width="2.3" marker-end="url(#arrow-gold)"></line><path d="M258,248 C292,286 287,344 240,361" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><path d="M148,344 C112,306 118,250 164,230" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><text x="98" y="421" font-size="10.5" font-weight="500" text-anchor="start" fill="#c58b20">pressure gradient -&gt; inward</text><text x="98" y="439" font-size="10.5" font-weight="500" text-anchor="start" fill="#2784b8">Coriolis -&gt; deflection</text><circle cx="460" cy="296" r="74" fill="#eef7fb" stroke="#2784b8" stroke-width="1.5"></circle><circle cx="460" cy="296" r="20" fill="#ffffff" stroke="#d65a4a" stroke-width="2"></circle><text x="460" y="301" font-size="18" font-weight="800" text-anchor="middle" fill="#d65a4a">L</text><text x="460" y="204" font-size="12.5" font-weight="750" text-anchor="middle" fill="#17324d">SH: clockwise</text><line x1="352" y1="296" x2="432" y2="296" stroke="#c58b20" stroke-width="2.3" marker-end="url(#arrow-gold)"></line><line x1="568" y1="296" x2="488" y2="296" stroke="#c58b20" stroke-width="2.3" marker-end="url(#arrow-gold)"></line><line x1="460" y1="188" x2="460" y2="268" stroke="#c58b20" stroke-width="2.3" marker-end="url(#arrow-gold)"></line><line x1="460" y1="404" x2="460" y2="324" stroke="#c58b20" stroke-width="2.3" marker-end="url(#arrow-gold)"></line><path d="M402,248 C368,286 373,344 420,361" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><path d="M512,344 C548,306 542,250 496,230" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><text x="358" y="421" font-size="10.5" font-weight="500" text-anchor="start" fill="#c58b20">pressure gradient -&gt; inward</text><text x="358" y="439" font-size="10.5" font-weight="500" text-anchor="start" fill="#2784b8">Coriolis -&gt; deflection</text><path d="M125,440 C235,420 345,424 555,440" fill="none" stroke="#5f7182" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"></path><text x="340" y="464" font-size="11.5" font-weight="500" text-anchor="middle" fill="#5f7182">friction near surface slows and turns the wind inward</text><rect x="680" y="86" width="332" height="424" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="698" y="116" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">Vector ledger</text><text x="994" y="115" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">the terms change with scale</text><rect x="704" y="132" width="284" height="54" rx="7" fill="#fff8e9" stroke="#dbe5ec" stroke-width="1"></rect><rect x="704" y="132" width="6" height="54" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="846.0" y="157" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">-grad p</text><text x="846.0" y="179" font-size="11.2" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">pressure-gradient force</tspan></text><rect x="704" y="202" width="284" height="54" rx="7" fill="#eef7fb" stroke="#dbe5ec" stroke-width="1"></rect><rect x="704" y="202" width="6" height="54" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="846.0" y="227" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">-f k x u</text><text x="846.0" y="249" font-size="11.2" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">Coriolis deflection; sign flips by hemisphere</tspan></text><rect x="704" y="272" width="284" height="54" rx="7" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><rect x="704" y="272" width="6" height="54" rx="3" fill="#5f7182" stroke="#5f7182" stroke-width="1"></rect><text x="846.0" y="297" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">-r u</text><text x="846.0" y="319" font-size="11.2" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">surface friction / boundary layer</tspan></text><rect x="704" y="342" width="284" height="54" rx="7" fill="#fff1ed" stroke="#dbe5ec" stroke-width="1"></rect><rect x="704" y="342" width="6" height="54" rx="3" fill="#d65a4a" stroke="#d65a4a" stroke-width="1"></rect><text x="846.0" y="367" font-size="15" font-weight="750" text-anchor="middle" fill="#17324d">sum</text><text x="846.0" y="389" font-size="11.2" font-weight="500" text-anchor="middle" fill="#5f7182"><tspan x="846.0" dy="0">wind response is a balance, not one force</tspan></text><text x="704" y="431" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">gradient-wind balance</text><text x="704" y="456" font-size="11.5" font-weight="500" text-anchor="start" fill="#5f7182">away from the equator, with a boundary-layer caveat</text><line x1="40" y1="530" x2="68" y2="530" stroke="#c58b20" stroke-width="4"></line><text x="78" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">pressure gradient</text><line x1="225" y1="530" x2="253" y2="530" stroke="#2784b8" stroke-width="4"></line><text x="263" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">Coriolis response</text><line x1="415" y1="530" x2="443" y2="530" stroke="#5f7182" stroke-width="4" stroke-dasharray="7 5"></line><text x="453" y="533" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">frictional boundary</text><text x="28" y="575" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">The low-pressure spirals are schematic; real storms require thermodynamics and 3-D structure</text></svg>
