 text-anchor="start" fill="#17324d">G</text><text x="888" y="331" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">156 mm/yr</text><line x1="716" y1="378" x2="970" y2="378" stroke="#dbe5ec" stroke-width="1"></line><text x="716" y="410" font-size="17" font-weight="800" text-anchor="start" fill="#17324d">V = h × A × 1000</text><text x="716" y="439" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">1 mm × 1 km² = 1000 m³</text><rect x="793" y="461" width="177" height="80" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="807" y="483" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="807" y1="505" x2="835" y2="505" stroke="#2679a8" stroke-width="4"></line><text x="845" y="508" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">地表水</text><line x1="807" y1="528" x2="835" y2="528" stroke="#2784b8" stroke-width="4" stroke-dasharray="7 5"></line><text x="845" y="531" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">地下水</text></svg>
