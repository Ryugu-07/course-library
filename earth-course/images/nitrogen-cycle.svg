<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">氮循环把生物圈接上大气与水</title><desc id="svg-desc">过程示意展示 N₂、NH₄⁺、NO₃⁻ 和有机氮之间的固定、同化、矿化、硝化、反硝化与淋失；实线和虚线区分过程路径与推断输入。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">氮循环把生物圈接上大气与水</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">16 · 过程机制 | Nitrogen cycle</text><rect x="38" y="82" width="622" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">氮的形态转换与出口</text><text x="642" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">pools + fluxes</text><rect x="264" y="126" width="170" height="58" rx="7" fill="#eaf6fb" stroke="#2784b8" stroke-width="1"></rect><text x="349.0" y="150.94" font-size="16" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="349.0" dy="0">大气氮库</tspan><tspan x="349.0" dy="19">N₂</tspan></text><rect x="112" y="244" width="166" height="66" rx="7" fill="#edf7ed" stroke="#4d8a63" stroke-width="1"></rect><text x="195.0" y="272.26" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="195.0" dy="0">生物量</tspan><tspan x="195.0" dy="19">有机 N</tspan></text><rect x="300" y="372" width="180" height="66" rx="7" fill="#f7f0e9" stroke="#c8a27a" stroke-width="1"></rect><text x="390.0" y="400.26" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="390.0" dy="0">土壤有机质</tspan><tspan x="390.0" dy="19">有机 N</tspan></text><rect x="474" y="230" width="144" height="66" rx="7" fill="#f8f3df" stroke="#c58b20" stroke-width="1"></rect><text x="546.0" y="258.26" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="546.0" dy="0">铵态氮</tspan><tspan x="546.0" dy="19">NH₄⁺</tspan></text><rect x="486" y="372" width="132" height="66" rx="7" fill="#eaf6fb" stroke="#2679a8" stroke-width="1"></rect><text x="552.0" y="400.26" font-size="14" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="552.0" dy="0">硝态氮</tspan><tspan x="552.0" dy="19">NO₃⁻</tspan></text><rect x="104" y="414" width="146" height="54" rx="7" fill="#eaf6fb" stroke="#2679a8" stroke-width="1"></rect><text x="177.0" y="435.92" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="177.0" dy="0">河流 / 海洋</tspan><tspan x="177.0" dy="19">输出</tspan></text><path d="M 348 185 C 400 194, 456 208, 510 235" fill="none" stroke="#4d8a63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-forest)"></path><text x="407" y="204" font-size="12" font-weight="800" text-anchor="start" fill="#4d8a63">固氮</text><path d="M 474 264 C 408 240, 330 245, 278 273" fill="none" stroke="#4d8a63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-forest)"></path><text x="342" y="235" font-size="11" font-weight="700" text-anchor="start" fill="#4d8a63">同化</text><line x1="188" y1="310" x2="304" y2="380" stroke="#c8a27a" stroke-width="3" marker-end="url(#arrow-ink)"></line><text x="204" y="351" font-size="11" font-weight="700" text-anchor="start" fill="#c8a27a">凋落 / 矿化</text><path d="M 388 372 C 408 332, 447 300, 500 282" fill="none" stroke="#c58b20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gold)"></path><text x="417" y="342" font-size="11" font-weight="700" text-anchor="start" fill="#c58b20">矿化</text><line x1="545" y1="298" x2="545" y2="368" stroke="#2784b8" stroke-width="3" marker-end="url(#arrow-cool)"></line><text x="553" y="336" font-size="11" font-weight="700" text-anchor="start" fill="#2784b8">硝化</text><path d="M 487 388 C 430 343, 377 255, 356 184" fill="none" stroke="#7666a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-violet)"></path><text x="384" y="295" font-size="11" font-weight="700" text-anchor="start" fill="#7666a8">反硝化 → N₂</text><line x1="486" y1="418" x2="250" y2="438" stroke="#2679a8" stroke-width="3" marker-end="url(#arrow-deep)"></line><text x="342" y="430" font-size="11" font-weight="700" text-anchor="start" fill="#2679a8">淋失 / 输出</text><path d="M 356 184 C 293 220, 244 293, 212 372" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"></path><text x="246" y="234" font-size="11" font-weight="700" text-anchor="start" fill="#c58b20">沉降（推断）</text><text x="58" y="500" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">实线是转化或输送路径；虚线表示依赖沉降、未直接观测的外部输入。</text><rect x="684" y="82" width="318" height="456" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="702" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">氮如何限制碳固定</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">stoichiometry</text><text x="708" y="132" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">氮形态</text><text x="868" y="132" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">生态后果</text><line x1="708" y1="144" x2="978" y2="144" stroke="#dbe5ec" stroke-width="1"></line><rect x="708" y="158" width="18" height="18" rx="3" fill="#2784b8" stroke="#2784b8" stroke-width="1"></rect><text x="740" y="172" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">N₂</text><text x="868" y="172" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">大气惰性库</text><line x1="708" y1="188" x2="978" y2="188" stroke="#dbe5ec" stroke-width="1"></line><rect x="708" y="206" width="18" height="18" rx="3" fill="#c58b20" stroke="#c58b20" stroke-width="1"></rect><text x="740" y="220" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">NH₄⁺</text><text x="868" y="220" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">还原态底物</text><line x1="708" y1="236" x2="978" y2="236" stroke="#dbe5ec" stroke-width="1"></line><rect x="708" y="254" width="18" height="18" rx="3" fill="#2679a8" stroke="#2679a8" stroke-width="1"></rect><text x="740" y="268" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">NO₃⁻</text><text x="868" y="268" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">易淋失 / 反硝化</text><line x1="708" y1="284" x2="978" y2="284" stroke="#dbe5ec" stroke-width="1"></line><rect x="708" y="302" width="18" height="18" rx="3" fill="#4d8a63" stroke="#4d8a63" stroke-width="1"></rect><text x="740" y="316" font-size="14" font-weight="750" text-anchor="start" fill="#17324d">有机 N</text><text x="868" y="316" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">生物量与土壤</text><line x1="708" y1="332" x2="978" y2="332" stroke="#dbe5ec" stroke-width="1"></line><text x="708" y="374" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">化学计量桥</text><text x="708" y="400" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">固定 C 需要 N、P 和电子受体</text><text x="708" y="423" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">C:N:P 不是所有生态系统的全球常数。</text><rect x="740" y="442" width="240" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="754" y="462" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="754" y1="480" x2="782" y2="480" stroke="#4d8a63" stroke-width="4"></line><text x="792" y="483" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">生物转化</text><line x1="754" y1="499" x2="782" y2="499" stroke="#2784b8" stroke-width="4"></line><text x="792" y="502" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">化学 / 输送</text><line x1="754" y1="518" x2="782" y2="518" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="792" y="521" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">外部或不确定输入</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 16B：氮形态、转化和输出的符号是过程类别；箭头粗细不表示全球通量大小。</text></svg>
