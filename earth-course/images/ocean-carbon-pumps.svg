stroke-width="1.5"></circle><circle cx="342" cy="165" r="7" fill="#4d8a63" stroke="#ffffff" stroke-width="1.5"></circle><circle cx="365" cy="187" r="7" fill="#4d8a63" stroke="#ffffff" stroke-width="1.5"></circle><path d="M 330 194 C 322 238, 330 295, 354 342 C 366 367, 370 399, 378 437" fill="none" stroke="#4d8a63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-forest)"></path><text x="368" y="274" font-size="12" font-weight="800" text-anchor="start" fill="#4d8a63">生物泵</text><text x="368" y="291" font-size="11" font-weight="500" text-anchor="start" fill="#ffffff">颗粒有机碳 ↓</text><circle cx="365" cy="228" r="4" fill="#4d8a63" stroke="#ffffff" stroke-width="1"></circle><circle cx="373" cy="268" r="4" fill="#4d8a63" stroke="#ffffff" stroke-width="1"></circle><circle cx="381" cy="311" r="4" fill="#4d8a63" stroke="#ffffff" stroke-width="1"></circle><circle cx="373" cy="358" r="4" fill="#4d8a63" stroke="#ffffff" stroke-width="1"></circle><circle cx="381" cy="401" r="4" fill="#4d8a63" stroke="#ffffff" stroke-width="1"></circle><line x1="442" y1="180" x2="442" y2="239" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><line x1="442" y1="239" x2="442" y2="298" stroke="#c58b20" stroke-width="3" marker-end="url(#arrow-gold)"></line><text x="452" y="218" font-size="11" font-weight="700" text-anchor="start" fill="#ffffff">CO₂(aq)</text><text x="452" y="279" font-size="11" font-weight="700" text-anchor="start" fill="#ffffff">DIC / 碳酸盐</text><path d="M 470 442 C 480 372, 476 282, 462 210" fill="none" stroke="#2679a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-deep)"></path><text x="402" y="428" font-size="11" font-weight="700" text-anchor="start" fill="#ffffff">上涌 / 返回</text><rect x="584" y="82" width="418" height="490" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="602" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">三条路径，三种边界</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">pump ≠ sink forever</text><rect x="616" y="128" width="354" height="70" rx="7" fill="#eaf6fb" stroke="#2784b8" stroke-width="1"></rect><text x="793.0" y="150.42" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="793.0" dy="0">溶解度泵</tspan><tspan x="793.0" dy="17">CO₂(g) → CO₂(aq) → DIC</tspan><tspan x="793.0" dy="17">温度、盐度、混合层控制</tspan></text><line x1="793" y1="202" x2="793" y2="222" stroke="#2784b8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="616" y="226" width="354" height="70" rx="7" fill="#edf7ed" stroke="#4d8a63" stroke-width="1"></rect><text x="793.0" y="248.42" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="793.0" dy="0">生物泵</tspan><tspan x="793.0" dy="17">浮游植物 → 颗粒有机碳 ↓</tspan><tspan x="793.0" dy="17">生产、食物网和再矿化</tspan></text><line x1="793" y1="300" x2="793" y2="320" stroke="#4d8a63" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="616" y="324" width="354" height="70" rx="7" fill="#f7f0e9" stroke="#c58b20" stroke-width="1"></rect><text x="793.0" y="346.42" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="793.0" dy="0">碳酸盐缓冲</tspan><tspan x="793.0" dy="17">CO₂(aq) ⇌ HCO₃⁻ ⇌ CO₃²⁻</tspan><tspan x="793.0" dy="17">吸收伴随酸化代价</tspan></text><text x="616" y="430" font-size="13" font-weight="750" text-anchor="start" fill="#5f7182">时间窗口</text><text x="616" y="452" font-size="12" font-weight="700" text-anchor="start" fill="#17324d">海气交换：日–年   ·   生物输出：周–年</text><text x="616" y="473" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">深海再分配：十年–千年   ·   埋藏：更慢</text><rect x="748" y="478" width="222" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="762" y="498" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><line x1="762" y1="516" x2="790" y2="516" stroke="#2784b8" stroke-width="4"></line><text x="800" y="519" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">物理输送</text><line x1="762" y1="535" x2="790" y2="535" stroke="#4d8a63" stroke-width="4"></line><text x="800" y="538" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">生物转化</text><line x1="762" y1="554" x2="790" y2="554" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="800" y="557" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">延迟 / 边界依赖</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 15B：深海箭头表示再分配和时间延迟；虚线只用于边界依赖或难以直接观测的路径。</text></svg>
