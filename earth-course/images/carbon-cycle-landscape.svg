ght="700" text-anchor="middle" fill="#17324d">沉积 / 岩石慢库</text><path d="M 320 166 C 260 183, 175 167, 167 192" fill="none" stroke="#4d8a63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-forest)"></path><path d="M 350 166 C 390 190, 345 230, 353 262" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cool)"></path><path d="M 353 272 C 430 318, 578 294, 553 310" fill="none" stroke="#2679a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-deep)"></path><path d="M 545 305 C 470 287, 420 235, 386 177" fill="none" stroke="#c58b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"></path><text x="397" y="242" font-size="11" font-weight="700" text-anchor="start" fill="#c58b20">慢交换 / 延迟返回</text><rect x="58" y="408" width="160" height="82" rx="7" fill="#edf7ed" stroke="#4d8a63" stroke-width="1"></rect><text x="138.0" y="436.42" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="138.0" dy="0">快库</tspan><tspan x="138.0" dy="17">叶片 · 土壤</tspan><tspan x="138.0" dy="17">日–世纪</tspan></text><line x1="222" y1="449" x2="230" y2="449" stroke="#a9bac8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="232" y="408" width="160" height="82" rx="7" fill="#eaf6fb" stroke="#2679a8" stroke-width="1"></rect><text x="312.0" y="436.42" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="312.0" dy="0">中库</tspan><tspan x="312.0" dy="17">表层 · 深海</tspan><tspan x="312.0" dy="17">年–千年</tspan></text><line x1="396" y1="449" x2="404" y2="449" stroke="#a9bac8" stroke-width="2" marker-end="url(#arrow-small)"></line><rect x="406" y="408" width="160" height="82" rx="7" fill="#f7f0e9" stroke="#c8a27a" stroke-width="1"></rect><text x="486.0" y="436.42" font-size="13" font-weight="750" text-anchor="middle" fill="#17324d"><tspan x="486.0" dy="0">慢库</tspan><tspan x="486.0" dy="17">沉积 · 岩石</tspan><tspan x="486.0" dy="17">千年–百万年</tspan></text><rect x="632" y="82" width="370" height="452" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="650" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">同一份碳预算的两种语言</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">S = storage · F = flux</text><text x="654" y="124" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">储库 S</text><text x="844" y="124" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">示意容量</text><line x1="654" y1="136" x2="980" y2="136" stroke="#dbe5ec" stroke-width="1"></line><rect x="654" y="148" width="16" height="16" rx="3" fill="#dff1f7" stroke="#2784b8" stroke-width="1"></rect><text x="680" y="161" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">大气</text><text x="796" y="161" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">可交换</text><rect x="878" y="152" width="51.30434782608696" height="14" rx="3" fill="#dff1f7" stroke="#2784b8" stroke-width="1"></rect><line x1="654" y1="178" x2="980" y2="178" stroke="#dbe5ec" stroke-width="1"></line><rect x="654" y="193" width="16" height="16" rx="3" fill="#d7e5c1" stroke="#4d8a63" stroke-width="1"></rect><text x="680" y="206" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">陆地生物圈</text><text x="796" y="206" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">季节性</text><rect x="878" y="197" width="81.73913043478261" height="14" rx="3" fill="#d7e5c1" stroke="#4d8a63" stroke-width="1"></rect><line x1="654" y1="223" x2="980" y2="223" stroke="#dbe5ec" stroke-width="1"></line><rect x="654" y="238" width="16" height="16" rx="3" fill="#bfe2f2" stroke="#2679a8" stroke-width="1"></rect><text x="680" y="251" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">海洋无机碳</text><text x="796" y="251" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">缓冲</text><rect x="878" y="242" width="106.08695652173914" height="14" rx="3" fill="#bfe2f2" stroke="#2679a8" stroke-width="1"></rect><line x1="654" y1="268" x2="980" y2="268" stroke="#dbe5ec" stroke-width="1"></line><rect x="654" y="283" width="16" height="16" rx="3" fill="#c8a27a" stroke="#c58b20" stroke-width="1"></rect><text x="680" y="296" font-size="13" font-weight="700" text-anchor="start" fill="#17324d">沉积 / 岩石</text><text x="796" y="296" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">长期</text><rect x="878" y="287" width="132.17391304347828" height="14" rx="3" fill="#c8a27a" stroke="#c58b20" stroke-width="1"></rect><line x1="654" y1="313" x2="980" y2="313" stroke="#dbe5ec" stroke-width="1"></line><text x="654" y="358" font-size="13" font-weight="700" text-anchor="start" fill="#5f7182">守恒式</text><text x="654" y="385" font-size="18" font-weight="800" text-anchor="start" fill="#17324d">dS/dt = ΣFᵢₙ − ΣFₒᵤₜ</text><text x="654" y="407" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">箱子画储量；箭头画单位时间穿过边界的量。</text><rect x="765" y="420" width="220" height="87" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="779" y="440" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><rect x="779" y="448" width="28" height="14" rx="3" fill="#d7e5c1" stroke="none" stroke-width="1"></rect><text x="817" y="461" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">储库 / storage</text><line x1="779" y1="477" x2="807" y2="477" stroke="#2784b8" stroke-width="4"></line><text x="817" y="480" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">通量 / flux</text><line x1="779" y1="496" x2="807" y2="496" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="817" y="499" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">慢或延迟路径</text><text x="38" y="574" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">图 15A：地图和容量条只表达储库类别与相对连接；地理边界、面积、通量和数值均非比例。</text></svg>
