<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">碳库、通量与时间窗口</title><desc id="svg-desc">空间教学示意把大气、陆地生物圈、海洋无机碳和沉积岩石作为不同储库，并以实线通量和虚线慢交换连接；地图与容量条均非比例。</desc><defs>
