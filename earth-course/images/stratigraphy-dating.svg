<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">从地层关系到年龄区间</title><desc id="svg-desc">过程示意把相对地层排序与指数衰变模型汇合为带不确定度的年龄约束；曲线和数值为教学参数。</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324d"/></marker>
  <marker id="arrow-warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d65a4a"/></marker>
  <marker id="arrow-cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2784b8"/></marker>
  <marker id="arrow-forest" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4d8a63"/></marker>
  <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c58b20"/></marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7666a8"/></marker>
  <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b54238"/></marker>
  <marker id="arrow-deep" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2679a8"/></marker>
  <marker id="arrow-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="context-stroke"/></marker>
  <linearGradient id="sky-to-space" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dff1f7"/><stop offset="1" stop-color="#325372"/></linearGradient>
  <linearGradient id="ocean-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90d4ec"/><stop offset="1" stop-color="#185b83"/></linearGradient>
  <linearGradient id="crust-depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7e5c1"/><stop offset="1" stop-color="#b27a52"/></linearGradient>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324d" flood-opacity=".14"/></filter>
</defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0}
.caption{font-size:12px;fill:#5f7182}.label{font-size:14px;fill:#17324d;font-weight:650}.small{font-size:11px;fill:#5f7182}.title{font-size:24px;fill:#17324d;font-weight:800}.subtitle{font-size:13px;fill:#5f7182}
</style><rect x="0" y="0" width="1040" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="1"></rect><text x="28" y="40" font-size="24" font-weight="800" text-anchor="start" fill="#17324d">从地层关系到年龄区间</text><text x="1012" y="39" font-size="13" font-weight="500" text-anchor="end" fill="#5f7182">02 · 过程机制 | Stratigraphy + dating</text><rect x="38" y="82" width="964" height="430" rx="8" fill="#f6f9fb" stroke="#dbe5ec" stroke-width="1"></rect><text x="56" y="112" font-size="17" font-weight="750" text-anchor="start" fill="#17324d">两条证据链如何合流</text><text x="984" y="111" font-size="12" font-weight="500" text-anchor="end" fill="#5f7182">证据 → 模型 → 可检验结论</text><text x="78" y="129" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">A  相对顺序</text><rect x="80" y="154" width="220" height="244" rx="5" fill="#faf7f1" stroke="#c8a27a" stroke-width="1"></rect><rect x="94" y="166" width="192" height="48" rx="0" fill="#b98962" stroke="#92765e" stroke-width="1"></rect><text x="190" y="195.0" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d">下部</text><rect x="94" y="214" width="192" height="47" rx="0" fill="#d8b58c" stroke="#92765e" stroke-width="1"></rect><text x="190" y="242.5" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d">中下部</text><rect x="94" y="261" width="192" height="38" rx="0" fill="#6d7f8d" stroke="#92765e" stroke-width="1"></rect><text x="190" y="285.0" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">标志层</text><rect x="94" y="299" width="192" height="51" rx="0" fill="#b8c7d1" stroke="#92765e" stroke-width="1"></rect><text x="190" y="329.5" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d">中上部</text><rect x="94" y="350" width="192" height="60" rx="0" fill="#e7cda8" stroke="#92765e" stroke-width="1"></rect><text x="190" y="385.0" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d">上部</text><line x1="324" y1="272" x2="389" y2="272" stroke="#c8a27a" stroke-width="3" marker-end="url(#arrow-ink)"></line><rect x="392" y="236" width="158" height="72" rx="8" fill="#f6f0e8" stroke="#c8a27a" stroke-width="1"></rect><text x="471.0" y="264.0" font-size="15" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="471.0" dy="0">相对排序</tspan><tspan x="471.0" dy="19">A &lt; marker &lt; B</tspan></text><text x="78" y="432" font-size="15" font-weight="800" text-anchor="start" fill="#17324d">B  放射性衰变</text><line x1="98" y1="477" x2="300" y2="477" stroke="#17324d" stroke-width="2" marker-end="arrow"></line><line x1="98" y1="477" x2="98" y2="433" stroke="#17324d" stroke-width="2" marker-end="arrow"></line><path d="M 105 439 C 138 444, 160 454, 181 461 C 213 470, 251 474, 291 476" fill="none" stroke="#2784b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><line x1="188" y1="438" x2="188" y2="477" stroke="#c58b20" stroke-width="2" stroke-dasharray="6 4"></line><text x="188" y="429" font-size="12" font-weight="700" text-anchor="middle" fill="#c58b20">T₁/₂</text><text x="102" y="423" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">N/N₀</text><text x="300" y="492" font-size="11" font-weight="500" text-anchor="end" fill="#5f7182">时间 t</text><line x1="570" y1="272" x2="640" y2="272" stroke="#4d8a63" stroke-width="3" marker-end="url(#arrow-forest)"></line><rect x="644" y="226" width="198" height="88" rx="8" fill="#eef6ed" stroke="#4d8a63" stroke-width="1"></rect><text x="743.0" y="254.0" font-size="14" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="743.0" dy="0">年龄估计</tspan><tspan x="743.0" dy="19">t ± σₜ</tspan><tspan x="743.0" dy="19">f, λ, 标准</tspan></text><line x1="852" y1="272" x2="921" y2="272" stroke="#4d8a63" stroke-width="3" marker-end="url(#arrow-forest)"></line><rect x="868" y="226" width="108" height="88" rx="8" fill="#f1f6fa" stroke="#2784b8" stroke-width="1"></rect><text x="922.0" y="262.0" font-size="13" font-weight="700" text-anchor="middle" fill="#17324d"><tspan x="922.0" dy="0">可检验</tspan><tspan x="922.0" dy="19">对齐 / 复测</tspan></text><text x="392" y="361" font-size="13" font-weight="650" text-anchor="start" fill="#5f7182">关键不是更多小数位，而是独立证据是否相容。</text><text x="392" y="389" font-size="17" font-weight="800" text-anchor="start" fill="#17324d">σₜ ≈ σ_f / (λf)</text><text x="392" y="410" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">f 越小，比例误差对年龄的放大越明显。</text><rect x="670" y="392" width="282" height="103" rx="7" fill="#ffffff" stroke="#dbe5ec" stroke-width="1"></rect><text x="684" y="414" font-size="13" font-weight="750" text-anchor="start" fill="#17324d">图例</text><rect x="684" y="426" width="28" height="14" rx="3" fill="#b98962" stroke="none" stroke-width="1"></rect><text x="722" y="439" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">层序色带</text><line x1="684" y1="459" x2="712" y2="459" stroke="#2784b8" stroke-width="4"></line><text x="722" y="462" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">衰变曲线</text><line x1="684" y1="482" x2="712" y2="482" stroke="#c58b20" stroke-width="4" stroke-dasharray="7 5"></line><text x="722" y="485" font-size="12" font-weight="500" text-anchor="start" fill="#5f7182">半衰期标记</text><text x="38" y="552" font-size="11" font-weight="500" text-anchor="start" fill="#5f7182">示意剖面与曲线；层厚、时间分辨率和距离非等比例。虚线表示半衰期标记。</text></svg>
