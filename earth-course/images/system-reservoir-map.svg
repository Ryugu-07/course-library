<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">地球系统的储库与边界</title><desc id="svg-desc">教学示意地图把大气、海洋、陆地、冰雪和生物圈作为储库，并以方向性通量连接；地图边界与储库空间范围非等比例。</desc><defs>
