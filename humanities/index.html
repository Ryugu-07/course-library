<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文史哲分馆 · 课程资料库</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2630;
      --muted: #66717c;
      --line: #d7dde2;
      --surface: #ffffff;
      --canvas: #f4f6f7;
      --literature: #9d3d50;
      --history: #34705d;
      --philosophy: #315f91;
      --focus: #315f91;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
    }

    a { color: inherit; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .header-inner,
    main {
      width: min(960px, calc(100% - 40px));
      margin: 0 auto;
    }

    .header-inner { padding: 28px 0 30px; }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-bottom: 10px;
      padding: 8px 0;
      color: var(--focus);
      border-bottom: 1px solid color-mix(in srgb, var(--focus) 35%, transparent);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }

    .back-link:hover { border-bottom-color: currentColor; }

    .back-link:focus-visible,
    .course:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 28%, transparent);
      outline-offset: 4px;
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(30px, 4vw, 42px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .intro {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
    }

    main { padding: 34px 0 56px; }

    .disciplines {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px;
      margin-bottom: 42px;
    }

    .discipline {
      padding-top: 14px;
      border-top: 3px solid var(--discipline-color);
    }

    .discipline h2 {
      margin: 0 0 5px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .discipline p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .literature { --discipline-color: var(--literature); }
    .history { --discipline-color: var(--history); }
    .philosophy { --discipline-color: var(--philosophy); }

    .shelf-title {
      margin: 0 0 14px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .course {
      position: relative;
      display: grid;
      min-height: 190px;
      padding: 24px;
      overflow: hidden;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      text-decoration: none;
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    .course::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      content: "";
      background: var(--literature);
    }

    .course:hover {
      border-color: #aeb8c1;
      box-shadow: 0 8px 24px rgba(29, 38, 48, 0.09);
      transform: translateY(-2px);
    }

    .eyebrow {
      color: var(--literature);
      font-size: 13px;
      font-weight: 700;
    }

    .course h2 {
      margin: 5px 0 8px;
      font-size: 22px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .course p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .open {
      align-self: end;
      color: var(--literature);
      font-size: 14px;
      font-weight: 700;
    }

    footer {
      margin-top: 30px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 680px) {
      .header-inner,
      main { width: min(100% - 28px, 960px); }
      .disciplines { grid-template-columns: 1fr; gap: 18px; }
      .courses { grid-template-columns: 1fr; }
      .course { min-height: 170px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="back-link" href="../index.html">← 返回理工课程</a>
      <h1>文史哲</h1>
      <p class="intro">文学、历史与哲学的专题课程和阅读路径，在这里独立生长。</p>
    </div>
  </header>

  <main>
    <section class="disciplines" aria-label="分馆方向">
      <div class="discipline literature">
        <h2>文学</h2>
        <p>作家专题、作品细读与批评方法。</p>
      </div>
      <div class="discipline history">
        <h2>历史</h2>
        <p>时段、区域、制度与观念的多尺度叙事。</p>
      </div>
      <div class="discipline philosophy">
        <h2>哲学</h2>
        <p>原典、问题史与思想谱系。</p>
      </div>
    </section>

    <section aria-labelledby="courses-heading">
      <h2 class="shelf-title" id="courses-heading">专题课程</h2>
      <div class="courses">
        <!-- Add future humanities courses as sibling cards in this shelf. -->
        <a class="course" href="../wxb-course/site/index.html">
          <div>
            <span class="eyebrow">文学 · 作家专题</span>
            <h2>重读王小波</h2>
            <p>通过九章细读进入王小波的作品、思想、反讽文体、自由精神与文学位置。</p>
          </div>
          <span class="open">进入课程 →</span>
        </a>
      </div>
    </section>

    <footer>文史哲分馆 · 后续专题将沿文学、历史与哲学三条书架扩展</footer>
  </main>
</body>
</html>
