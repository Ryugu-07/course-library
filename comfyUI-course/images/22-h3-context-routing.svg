<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax H3 multimodal context routing</title>
  <desc id="desc">A role-assigned text, image, video, and audio context enters the H3 model and produces synchronized video and stereo audio.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#53616b"/>
    </marker>
    <style>
      .bg { fill: #faf8f3; }
      .panel { fill: #ffffff; stroke: #c8c3b8; stroke-width: 2; }
      .prompt { fill: #e8f1ee; stroke: #39725f; stroke-width: 2; }
      .identity { fill: #e7eef7; stroke: #436f9a; stroke-width: 2; }
      .motion { fill: #f8eadf; stroke: #a75b3c; stroke-width: 2; }
      .audio { fill: #f4edcf; stroke: #927524; stroke-width: 2; }
      .model { fill: #253c48; stroke: #172832; stroke-width: 2; }
      .video { fill: #dcebea; stroke: #39725f; stroke-width: 2; }
      .sound { fill: #f1e4cd; stroke: #927524; stroke-width: 2; }
      .line { fill: none; stroke: #53616b; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #8b949a; stroke-width: 2; stroke-dasharray: 7 7; }
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #25313a; }
      .label { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #25313a; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #53616b; }
      .modelText { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .modelSmall { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d7e3e8; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="55" y="52">Assign roles before adding references</text>
  <text class="small" x="55" y="80">Context labels locate the asset; prompt clauses define what the model should inherit.</text>

  <rect class="panel" x="40" y="112" width="345" height="458" rx="8"/>
  <text class="label" x="68" y="150">MULTIMODAL CONTEXT</text>

  <rect class="prompt" x="68" y="178" width="288" height="76" rx="8"/>
  <text class="label" x="92" y="208">TEXT CONTRACT</text>
  <text class="small" x="92" y="233">shot, timeline, roles, constraints</text>

  <rect class="identity" x="68" y="276" width="288" height="76" rx="8"/>
  <text class="label" x="92" y="306">PICTURE 1</text>
  <text class="small" x="92" y="331">identity + clothing only</text>

  <rect class="motion" x="68" y="374" width="288" height="76" rx="8"/>
  <text class="label" x="92" y="404">VIDEO 1</text>
  <text class="small" x="92" y="429">body motion + camera timing</text>

  <rect class="audio" x="68" y="472" width="288" height="76" rx="8"/>
  <text class="label" x="92" y="502">AUDIO 1</text>
  <text class="small" x="92" y="527">authorized voice + cadence</text>

  <path class="line" d="M385 341 H485"/>

  <rect class="model" x="485" y="205" width="290" height="270" rx="8"/>
  <text class="modelText" x="630" y="260" text-anchor="middle">H3 CONTEXT</text>
  <text class="modelText" x="630" y="292" text-anchor="middle">ENCODER</text>
  <path class="dash" d="M530 324 H730"/>
  <text class="modelSmall" x="630" y="354" text-anchor="middle">H3 Omni Transformer</text>
  <text class="modelSmall" x="630" y="384" text-anchor="middle">joint video + audio latents</text>
  <text class="modelSmall" x="630" y="432" text-anchor="middle">fl2va or ref2va weights</text>

  <path class="line" d="M775 294 H860"/>
  <path class="line" d="M775 390 H860"/>

  <rect class="video" x="860" y="218" width="285" height="135" rx="8"/>
  <text class="label" x="1002" y="260" text-anchor="middle">VIDEO VAE</text>
  <rect x="902" y="278" width="60" height="40" rx="4" fill="#ffffff" stroke="#39725f" stroke-width="2"/>
  <rect x="923" y="267" width="60" height="40" rx="4" fill="#ffffff" stroke="#39725f" stroke-width="2"/>
  <rect x="944" y="256" width="60" height="40" rx="4" fill="#ffffff" stroke="#39725f" stroke-width="2"/>
  <text class="small" x="1088" y="300" text-anchor="middle">24 fps</text>

  <rect class="sound" x="860" y="378" width="285" height="135" rx="8"/>
  <text class="label" x="1002" y="420" text-anchor="middle">AUDIO VAE</text>
  <path d="M900 465 C918 420 936 500 954 455 S990 420 1008 455 S1044 500 1062 455 S1098 420 1115 455" fill="none" stroke="#927524" stroke-width="4"/>
  <text class="small" x="1002" y="493" text-anchor="middle">native stereo</text>

  <path class="line" d="M1002 513 V566"/>
  <rect x="870" y="566" width="265" height="54" rx="8" fill="#ffffff" stroke="#53616b" stroke-width="2"/>
  <text class="label" x="1002" y="600" text-anchor="middle">SYNCHRONIZED MP4</text>
</svg>
