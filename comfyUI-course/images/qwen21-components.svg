<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" role="img" aria-labelledby="title desc">
<title id="title">Qwen-Image 2.1 的参考图双路条件</title><desc id="desc">文本进入Qwen3-VL。参考图分别进入Qwen3-VL和专用VAE。语义条件及参考latent汇入生成模型，采样latent经专用VAE解码后保存为RGBA PNG。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#34526f"/></marker></defs>
<rect width="480" height="760" rx="16" fill="#f5f8fc"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#17324d">
<text x="240" y="36" font-size="22" font-weight="700">参考图为什么要走两条路？</text>
<rect x="22" y="62" width="186" height="64" rx="10" fill="#e1edfa" stroke="#4070a0"/>
<text x="115" y="88" font-size="19">文本指令</text><text x="115" y="111" font-size="16">改什么 · 保留什么</text>
<rect x="270" y="62" width="188" height="64" rx="10" fill="#e0f2eb" stroke="#38826a"/>
<text x="364" y="88" font-size="19">参考图</text><text x="364" y="111" font-size="16">目标图 + 其他参考</text>
<g stroke="#34526f" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M115 126V202"/><path d="M342 126V155H174V202"/><path d="M386 126V202"/></g>
<text x="272" y="147" font-size="15">语义支路</text><text x="414" y="178" font-size="15">图像支路</text>
<rect x="22" y="206" width="212" height="90" rx="10" fill="#e1edfa" stroke="#4070a0"/>
<text x="128" y="236" font-size="21" font-weight="600">Qwen3-VL</text><text x="128" y="262" font-size="16">文本 / 视觉条件</text><text x="128" y="284" font-size="15">透明输入在此合成白底</text>
<rect x="264" y="206" width="194" height="90" rx="10" fill="#e0f2eb" stroke="#38826a"/>
<text x="361" y="236" font-size="21" font-weight="600">专用 VAE</text><text x="361" y="262" font-size="16">参考 latent</text><text x="361" y="284" font-size="15">此支路保留 RGBA</text>
<g stroke="#34526f" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M128 296V338H196V373"/><path d="M361 296V338H286V373"/></g>
<rect x="64" y="377" width="352" height="96" rx="12" fill="#f5e8d6" stroke="#a36c2f"/>
<text x="240" y="408" font-size="22" font-weight="600">7B 视觉生成组件</text><text x="240" y="435" font-size="17">接收条件 · 迭代采样 latent</text><text x="240" y="459" font-size="16">7B 不包括整套系统的所有权重</text>
<path d="M240 473V518" stroke="#34526f" stroke-width="2" marker-end="url(#a)"/>
<rect x="64" y="522" width="352" height="80" rx="12" fill="#e0f2eb" stroke="#38826a"/>
<text x="240" y="553" font-size="21">同一配套 VAE 解码</text><text x="240" y="580" font-size="17">latent → 图像颜色与 alpha</text>
<path d="M240 602V645" stroke="#34526f" stroke-width="2" marker-end="url(#a)"/>
<rect x="64" y="649" width="352" height="76" rx="12" fill="#e1edfa" stroke="#4070a0"/>
<text x="240" y="680" font-size="21">保存 PNG · 换底色验收</text><text x="240" y="707" font-size="17">有棋盘格 ≠ 有透明通道</text>
</g></svg>