<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">从物理量到可验证电气系统的课程地图</title>
  <desc id="desc">左侧展示传感器节点的信号链、电源树、保护和回流路径，右侧列出课程的六条证据线。</desc>
  <defs>
    <marker id="signal-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L0 6L9 3Z" fill="#1673a5"/></marker>
    <marker id="power-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L0 6L9 3Z" fill="#b75a19"/></marker>
    <marker id="return-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L0 6L9 3Z" fill="#5f6d77"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;letter-spacing:0;fill:#17324d}
      .title{font-size:25px;font-weight:800}.sub{font-size:13px;fill:#607282}.box-title{font-size:15px;font-weight:750}.box-sub{font-size:11.5px;fill:#607282}.tiny{font-size:9.5px;fill:#607282}.lane{font-size:14px;font-weight:750}.lane-sub{font-size:11px;fill:#607282}
    </style>
  </defs>
  <rect width="1040" height="600" fill="#fff"/>
  <text x="28" y="43" class="title">从物理量到可验证系统</text>
  <text x="1012" y="41" text-anchor="end" class="sub">EE · system roadmap</text>

  <rect x="28" y="70" width="674" height="482" rx="8" fill="#f6f9fb" stroke="#d7e2e9"/>
  <text x="48" y="103" class="box-title">Signal path</text>
  <text x="682" y="103" text-anchor="end" class="box-sub">measurand → evidence</text>

  <g>
    <rect x="50" y="138" width="108" height="78" rx="7" fill="#e8f2e5" stroke="#5d8a63"/>
    <text x="104" y="169" text-anchor="middle" class="box-title">World</text>
    <text x="104" y="190" text-anchor="middle" class="box-sub">T · RH · light</text>
    <rect x="182" y="138" width="108" height="78" rx="7" fill="#fff4df" stroke="#c58b20"/>
    <text x="236" y="169" text-anchor="middle" class="box-title">Sensor</text>
    <text x="236" y="190" text-anchor="middle" class="box-sub">transduction</text>
    <rect x="314" y="138" width="108" height="78" rx="7" fill="#f8ece7" stroke="#c36b45"/>
    <text x="368" y="169" text-anchor="middle" class="box-title">AFE</text>
    <text x="368" y="190" text-anchor="middle" class="box-sub">bias · gain · filter</text>
    <rect x="446" y="138" width="108" height="78" rx="7" fill="#e6f2f8" stroke="#287da9"/>
    <text x="500" y="169" text-anchor="middle" class="box-title">ADC / MCU</text>
    <text x="500" y="190" text-anchor="middle" class="box-sub">sample · compute</text>
    <rect x="578" y="138" width="102" height="78" rx="7" fill="#eeeafa" stroke="#7666a8"/>
    <text x="629" y="169" text-anchor="middle" class="box-title">Bus</text>
    <text x="629" y="190" text-anchor="middle" class="box-sub">log · transmit</text>
    <g stroke="#1673a5" stroke-width="3" fill="none" marker-end="url(#signal-arrow)">
      <path d="M158 177H179"/><path d="M290 177H311"/><path d="M422 177H443"/><path d="M554 177H575"/>
    </g>
  </g>

  <rect x="50" y="266" width="630" height="112" rx="7" fill="#fffaf0" stroke="#e1c58c"/>
  <text x="70" y="293" class="box-title">Power tree</text>
  <rect x="70" y="314" width="108" height="42" rx="6" fill="#fff" stroke="#b75a19"/>
  <text x="124" y="340" text-anchor="middle" class="tiny">current-limited source</text>
  <rect x="226" y="314" width="112" height="42" rx="6" fill="#fff" stroke="#b75a19"/>
  <text x="282" y="340" text-anchor="middle" class="tiny">protection + switch</text>
  <rect x="386" y="314" width="106" height="42" rx="6" fill="#fff" stroke="#b75a19"/>
  <text x="439" y="340" text-anchor="middle" class="tiny">regulation</text>
  <rect x="540" y="314" width="120" height="42" rx="6" fill="#fff" stroke="#b75a19"/>
  <text x="600" y="340" text-anchor="middle" class="tiny">load transient</text>
  <g stroke="#b75a19" stroke-width="3" fill="none" marker-end="url(#power-arrow)">
    <path d="M178 335H223"/><path d="M338 335H383"/><path d="M492 335H537"/>
  </g>
  <g stroke="#b75a19" stroke-width="2" fill="none" marker-end="url(#power-arrow)">
    <path d="M439 314V236H236V220"/><path d="M470 314V248H500V220"/><path d="M500 314V260H629V220"/>
  </g>

  <rect x="50" y="408" width="630" height="116" rx="7" fill="#f1f4f6" stroke="#cbd6dd"/>
  <text x="70" y="435" class="box-title">Return, layout and verification</text>
  <path d="M646 465H106" stroke="#5f6d77" stroke-width="4" fill="none" marker-end="url(#return-arrow)"/>
  <g fill="#fff" stroke="#9aabb7">
    <circle cx="606" cy="465" r="20"/><circle cx="480" cy="465" r="20"/><circle cx="354" cy="465" r="20"/><circle cx="228" cy="465" r="20"/><circle cx="102" cy="465" r="20"/>
  </g>
  <g text-anchor="middle" class="tiny">
    <text x="606" y="469">test</text><text x="480" y="469">timing</text><text x="354" y="469">EMC</text><text x="228" y="469">thermal</text><text x="102" y="469">safety</text>
  </g>
  <text x="365" y="508" text-anchor="middle" class="box-sub">a schematic is a claim; measurement closes the loop</text>

  <rect x="724" y="70" width="288" height="482" rx="8" fill="#f6f9fb" stroke="#d7e2e9"/>
  <text x="744" y="103" class="box-title">Six evidence lines</text>
  <g>
    <rect x="744" y="126" width="248" height="57" rx="6" fill="#eef7f0" stroke="#74a37d"/>
    <text x="762" y="150" class="lane">1 · Safety boundary</text><text x="762" y="169" class="lane-sub">voltage · current · stored energy</text>
    <rect x="744" y="193" width="248" height="57" rx="6" fill="#eef6fa" stroke="#6ca1bd"/>
    <text x="762" y="217" class="lane">2 · Circuit model</text><text x="762" y="236" class="lane-sub">KCL/KVL · operating point · transient</text>
    <rect x="744" y="260" width="248" height="57" rx="6" fill="#fff6e8" stroke="#d19d3d"/>
    <text x="762" y="284" class="lane">3 · Signal quality</text><text x="762" y="303" class="lane-sub">bandwidth · noise · sampling</text>
    <rect x="744" y="327" width="248" height="57" rx="6" fill="#f6edf9" stroke="#9a74aa"/>
    <text x="762" y="351" class="lane">4 · Interface margin</text><text x="762" y="370" class="lane-sub">levels · timing · calibration</text>
    <rect x="744" y="394" width="248" height="57" rx="6" fill="#faefe9" stroke="#c97856"/>
    <text x="762" y="418" class="lane">5 · Power integrity</text><text x="762" y="437" class="lane-sub">efficiency · decoupling · derating</text>
    <rect x="744" y="461" width="248" height="57" rx="6" fill="#edf1f3" stroke="#82929e"/>
    <text x="762" y="485" class="lane">6 · Delivery evidence</text><text x="762" y="504" class="lane-sub">PCB · DFT · bring-up · traceability</text>
  </g>
  <text x="28" y="580" class="sub">SCHEMATIC / low-voltage teaching system / arrows show dependency, not physical scale</text>
</svg>
