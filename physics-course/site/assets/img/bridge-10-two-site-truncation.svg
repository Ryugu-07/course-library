<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
<title id="title">两站点求解与截断的两个不同目标</title><desc id="desc">站二与三合并成十六维中心，按前两站和后两站重排为四乘四矩阵，奇异值分解后保留前r项。下方用能量轴表示g等于0.2时，求解从负3降到负3.0617，截断r等于1却升到负2.1468。丢弃权重控制态的距离，不保证能量下降。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627682"/></marker></defs>
<rect width="720" height="500" rx="8" fill="#faf9f5"/>
<g font-family="system-ui,sans-serif" fill="#25394a">
<text x="26" y="36" font-size="24">两站点：先按能量求解，再按态距离压缩</text>
<rect x="26" y="58" width="196" height="146" rx="8" fill="#e8f1f8"/>
<text x="124" y="84" text-anchor="middle" font-size="17">固定站 1、4 的完整基</text>
<line x1="47" y1="118" x2="200" y2="118" stroke="#627682" stroke-width="3"/>
<rect x="74" y="97" width="98" height="44" rx="6" fill="#fff" stroke="#286fa7"/>
<text x="124" y="124" text-anchor="middle" font-size="20">2　3</text>
<text x="124" y="166" text-anchor="middle" font-size="16">Θ 的 16 个分量</text>
<text x="124" y="188" text-anchor="middle" font-size="14">本例 H_eff = H</text>
<path d="M227 128H256" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="263" y="58" width="196" height="146" rx="8" fill="#eef4ee"/>
<text x="361" y="86" text-anchor="middle" font-size="17">重排，不改变物理态</text>
<text x="361" y="119" text-anchor="middle" font-size="22">M = U Σ V†</text>
<text x="361" y="151" text-anchor="middle" font-size="16">行：(站 1，站 2)</text>
<text x="361" y="179" text-anchor="middle" font-size="16">列：(站 3，站 4)</text>
<path d="M464 128H491" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="499" y="58" width="195" height="146" rx="8" fill="#f7e9e5"/>
<text x="596" y="86" text-anchor="middle" font-size="17">保留 r 项并归一化</text>
<text x="596" y="119" text-anchor="middle" font-size="19">A = U_r</text>
<text x="596" y="150" text-anchor="middle" font-size="19">B = Σ_r V_r† / √q</text>
<text x="596" y="182" text-anchor="middle" font-size="15">左正交，中心移到右侧</text>
<rect x="26" y="221" width="668" height="241" rx="8" fill="#fff" stroke="#c9d1d8"/>
<text x="46" y="249" font-size="18">同一次更新，分开记录三个能量（g=0.2，r=1）</text>
<path d="M88 275V418H654" stroke="#627682" fill="none"/>
<text x="72" y="292" text-anchor="end" font-size="12">−2.0</text>
<text x="72" y="404" text-anchor="end" font-size="12">−3.0</text>
<line x1="88" y1="400" x2="654" y2="400" stroke="#ddd" stroke-dasharray="4 4"/>
<path d="M164 400L352 407L566 305" fill="none" stroke="#627682" stroke-width="2.5"/>
<circle cx="164" cy="400" r="6" fill="#286fa7"/><circle cx="352" cy="407" r="6" fill="#237d68"/><circle cx="566" cy="305" r="6" fill="#a64b35"/>
<text x="164" y="383" text-anchor="middle" font-size="16">−3</text>
<text x="352" y="383" text-anchor="middle" font-size="16">−3.061735</text>
<text x="566" y="287" text-anchor="middle" font-size="16">−2.146759</text>
<text x="164" y="442" text-anchor="middle" font-size="15">初态 |+⟩⁴</text>
<text x="352" y="442" text-anchor="middle" font-size="15">未截断最优态</text>
<text x="566" y="442" text-anchor="middle" font-size="15">归一化截断态</text>
<text x="360" y="485" text-anchor="middle" font-size="16">ε 控制本次态压缩误差；截断后必须重新核验能量与残差。</text>
</g></svg>
