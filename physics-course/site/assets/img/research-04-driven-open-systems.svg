<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-labelledby="title"><title id="title">非平衡固定点仍有发射</title><rect width="440" height="440" fill="#faf8f1"/><g font-family="system-ui, sans-serif"><text x="220" y="35" text-anchor="middle" font-size="24" fill="#263448">非平衡固定点仍有发射</text><path d="M120 115 H320" stroke="#c65c3d" stroke-width="4" fill="none" /><text x="350" y="123" text-anchor="middle" font-size="20" fill="#263448">|e〉</text><path d="M120 286 H320" stroke="#497ec5" stroke-width="4" fill="none" /><text x="350" y="294" text-anchor="middle" font-size="20" fill="#263448">|g〉</text><path d="M160 267 V134" stroke="#497ec5" stroke-width="4" fill="none" /><path d="M149 147 L160 132 L171 147 M149 253 L160 268 L171 253" stroke="#497ec5" stroke-width="3" fill="none" /><text x="97" y="197" text-anchor="middle" font-size="20" fill="#263448">Ω</text><path d="M280 134 Q365 201 280 268" stroke="#c65c3d" stroke-width="4" fill="none" /><path d="M280 250 L280 270 L298 264" stroke="#c65c3d" stroke-width="3" fill="none" /><text x="339" y="211" text-anchor="middle" font-size="20" fill="#263448">γ</text><text x="220" y="335" text-anchor="middle" font-size="20" fill="#263448">驱动与发射持续平衡</text><text x="220" y="372" text-anchor="middle" font-size="20" fill="#263448">Ω/γ=1，Δ=0：pₑ=1/3</text><text x="220" y="411" text-anchor="middle" font-size="20" fill="#263448">纯度=7/9；不是纯叠加态</text></g></svg>
