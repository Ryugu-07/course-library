<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-labelledby="title"><title id="title">虚拟双占据降低单重态</title><rect width="440" height="440" fill="#faf8f1"/><g font-family="system-ui, sans-serif"><text x="220" y="35" text-anchor="middle" font-size="24" fill="#263448">虚拟双占据降低单重态</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#497ec5"/></marker></defs><text x="110" y="86" text-anchor="middle" font-size="20" fill="#263448">低能单重态</text><text x="330" y="86" text-anchor="middle" font-size="20" fill="#263448">双占据组合</text><circle cx="65" cy="145" r="24" fill="#e0eaf5" stroke="#497ec5" stroke-width="3"/><circle cx="155" cy="145" r="24" fill="#e0eaf5" stroke="#497ec5" stroke-width="3"/><circle cx="285" cy="145" r="24" fill="#e0eaf5" stroke="#497ec5" stroke-width="3"/><circle cx="375" cy="145" r="24" fill="#e0eaf5" stroke="#497ec5" stroke-width="3"/><text x="65" y="152" text-anchor="middle" font-size="20" fill="#263448">↑</text><text x="155" y="152" text-anchor="middle" font-size="20" fill="#263448">↓</text><text x="285" y="152" text-anchor="middle" font-size="20" fill="#263448">↑↓</text><text x="375" y="152" text-anchor="middle" font-size="20" fill="#263448">0</text><path d="M188 145 H251" stroke="#497ec5" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="220" y="126" text-anchor="middle" font-size="20" fill="#263448">−2t</text><path d="M65 240 H175" stroke="#497ec5" stroke-width="3" fill="none" /><text x="60" y="272" text-anchor="middle" font-size="20" fill="#263448">E = 0</text><path d="M265 215 H385" stroke="#c65c3d" stroke-width="3" fill="none" /><text x="325" y="247" text-anchor="middle" font-size="20" fill="#263448">E = U</text><path d="M65 315 H175" stroke="#20876c" stroke-width="3" fill="none" /><text x="280" y="311" text-anchor="middle" font-size="20" fill="#263448">混合后 E₋ &lt; 0</text><path d="M120 245 V303" stroke="#20876c" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="220" y="370" text-anchor="middle" font-size="20" fill="#263448">高能振幅 ∼ t/U</text><text x="220" y="405" text-anchor="middle" font-size="20" fill="#263448">低能修正 ∼ −4t²/U</text><text x="110" y="195" text-anchor="middle" font-size="20" fill="#263448">叠加态 |S〉</text><text x="330" y="195" text-anchor="middle" font-size="20" fill="#263448">叠加态 |D₊〉</text></g></svg>
