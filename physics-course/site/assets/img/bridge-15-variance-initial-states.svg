<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="title desc"><title id="title">全链方差、局部投影与初态诊断</title><desc id="desc">最终MPS进入三个独立收缩：范数N、H的一阶矩、H平方的二阶矩。H平方连接两层MPO，不插入局部投影。归一化后求方差；再用多初态能量和奇偶比较分辨本征态与基态。两站点奇态能量负一方差零，却高于负根号五基态。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#51616b"/></marker></defs><rect width="860" height="520" rx="10" fill="#f8f8f3"/>
<g font-family="system-ui,sans-serif" fill="#243746"><text x="26" y="38" font-size="24">把诊断移到最终保存的整条链</text><text x="26" y="66" font-size="15">局部残差只看块基支撑；SVD之后重新量全链H²、H、范数</text>
<rect x="272" y="88" width="316" height="52" rx="8" fill="#e8f1f5" stroke="#45778b"/><text x="430" y="120" text-anchor="middle" font-size="20">同一个最终MPS |ψ〉</text>
<g stroke="#51616b" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M430 142V155H155V177"/><path d="M430 142V177"/><path d="M430 142V155H705V177"/></g>
<g fill="#eaf0df" stroke="#728142"><rect x="28" y="183" width="254" height="80" rx="8"/><rect x="303" y="183" width="254" height="80" rx="8"/><rect x="578" y="183" width="254" height="80" rx="8"/></g>
<g text-anchor="middle"><g font-size="20"><text x="155" y="213">〈ψ|I|ψ〉= N</text><text x="430" y="213">〈ψ|H|ψ〉</text><text x="705" y="213">〈ψ|H²|ψ〉</text></g><g font-size="14"><text x="155" y="240">真实范数，不能默认为1</text><text x="430" y="240">一层MPO，算符键维3</text><text x="705" y="240">两层MPO，直接键维9</text></g></g>
<g stroke="#51616b" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M155 265V286H430V302"/><path d="M430 265V302"/><path d="M705 265V286H430V302"/></g>
<rect x="158" y="309" width="544" height="64" rx="8" fill="#e8f1f5" stroke="#45778b"/><text x="430" y="335" text-anchor="middle" font-size="20">V = 〈H²〉 − E² = ‖(H−E)ψ‖² / N</text><text x="430" y="358" text-anchor="middle" font-size="14">接近零时要检查相减消失的有效数字；小负数不是负物理方差</text>
<rect x="28" y="397" width="384" height="94" rx="8" fill="#f8ece3" stroke="#b06c42"/><rect x="440" y="397" width="392" height="94" rx="8" fill="#fff2d2" stroke="#b4a052"/>
<text x="48" y="423" font-size="18">不能省掉的全链方向</text><text x="48" y="449" font-size="15">W†H²W − H_eff² ⪰ 0：投影会漏项</text><text x="48" y="475" font-size="14">方差还要配合 χ、轮数、初态、〈P〉</text>
<text x="460" y="423" font-size="18">零方差激发态：L=2，g=1</text><text x="460" y="449" font-size="15">(|01〉+|10〉)/√2：E=−1，V=0</text><text x="460" y="475" font-size="14">基态E₀=−√5；奇扇区看不到偶基态</text>
</g></svg>
