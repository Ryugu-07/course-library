<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 555" role="img" aria-labelledby="title desc"><title id="title">干空气测量到月资料的可追溯链</title><desc id="desc">上半部分按采样干燥、标准气体定标、背景筛选、日月聚合四步排列。下半部分以2020年7月真实值414.58ppm对照假设3%湿度下402.1426ppm，区分真实资料与机制换算。最后说明没有原始ring-down波形，不能据月趋势单独反推源和汇。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376482"/></marker></defs><rect width="1080" height="555" rx="16" fill="#f5f8fa"/><g font-family="system-ui,sans-serif" fill="#203c51"><text x="32" y="44" font-size="25" font-weight="700">414.58 ppm：从物理测量到可分析的月平均</text><rect x="28" y="82" width="235" height="141" rx="12" fill="white" stroke="#a6bccb"/><text x="45" y="119" font-size="20" font-weight="600">1. 采样与干燥</text><text x="45" y="161" font-size="17">确认干空气分母</text><text x="45" y="197" font-size="16">温度、压力、气路</text><path d="M267 151H286" stroke="#376482" stroke-width="2" marker-end="url(#a)"/><rect x="291" y="82" width="235" height="141" rx="12" fill="white" stroke="#a6bccb"/><text x="308" y="119" font-size="20" font-weight="600">2. 定标与独立检验</text><text x="308" y="161" font-size="17">标准气体给响应关系</text><text x="308" y="197" font-size="16">2019年起使用CRDS</text><path d="M530 151H549" stroke="#376482" stroke-width="2" marker-end="url(#a)"/><rect x="554" y="82" width="235" height="141" rx="12" fill="white" stroke="#a6bccb"/><text x="571" y="119" font-size="20" font-weight="600">3. 背景空气选择</text><text x="571" y="161" font-size="17">排查局地影响与状态</text><text x="571" y="197" font-size="16">小时级标记并非丢失</text><path d="M793 151H812" stroke="#376482" stroke-width="2" marker-end="url(#a)"/><rect x="817" y="82" width="235" height="141" rx="12" fill="white" stroke="#a6bccb"/><text x="834" y="119" font-size="20" font-weight="600">4. 日／月聚合</text><text x="834" y="161" font-size="17">有效天数与月均unc</text><text x="834" y="197" font-size="16">不是未经处理的信号</text><rect x="28" y="250" width="494" height="181" rx="12" fill="#e6f1f7"/><text x="48" y="286" font-size="21" font-weight="600">真实月资料：2020年7月</text><text x="48" y="326" font-size="24">干空气 CO₂ = 414.58 ppm</text><text x="48" y="363" font-size="18">有效天数30；日均标准差0.57 ppm</text><text x="48" y="401" font-size="18">月平均不确定度0.20 ppm</text><rect x="549" y="250" width="503" height="181" rx="12" fill="#fff0dc"/><text x="568" y="286" font-size="21" font-weight="600">机制换算：假设水汽3%</text><text x="568" y="326" font-size="23">湿值 = 414.58 × 0.97</text><text x="568" y="362" font-size="23">= 402.1426 ppm</text><text x="568" y="402" font-size="17" fill="#91502c">该湿度是课堂假设，不是当月真实记录</text><text x="39" y="477" font-size="19">月表 → 数学趋势模型；官方unc、模型残差、斜率标准误分开解释</text><text x="39" y="514" font-size="18" fill="#91502c">没有原始衰荡波形；只有站点净变化，也无法单独识别全球源和汇</text><text x="39" y="542" font-size="15">数据：NOAA GML固定2026-08-05快照；本图不是NOAA官方产品。</text></g></svg>