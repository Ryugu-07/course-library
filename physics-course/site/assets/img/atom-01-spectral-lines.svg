<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">氢的 Coulomb 能级与两条真空谱线</title><desc id="desc">纵坐标是电子相对自由电子的能量，以电子伏特计。箭头从 n=2 到 1 和 n=3 到 2；模型包含质子约化质量，未包含精细和辐射修正。</desc>
<style>text{font-family:system-ui,sans-serif;fill:#292722;font-size:14px} .small{font-size:13px}.level{stroke:#315f9d;stroke-width:2.5}.grid{stroke:#d7d0c2;stroke-width:1}</style><rect width="800" height="460" fill="#faf7ef"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#9b6a12"/></marker></defs>
<text x="34" y="32" style="font-size:20px;font-weight:650">氢原子：从能级间隔读谱线</text>
<text x="34" y="55" class="small">含有限质子质量的非相对论 Coulomb 模型；波长均为真空值</text>
<line x1="80" y1="78.0" x2="450" y2="78.0" class="grid"/>
<text x="68" y="83.0" text-anchor="end">0</text>
<line x1="80" y1="121.14285714285714" x2="450" y2="121.14285714285714" class="grid"/>
<text x="68" y="126.14285714285714" text-anchor="end">-2</text>
<line x1="80" y1="164.28571428571428" x2="450" y2="164.28571428571428" class="grid"/>
<text x="68" y="169.28571428571428" text-anchor="end">-4</text>
<line x1="80" y1="207.42857142857142" x2="450" y2="207.42857142857142" class="grid"/>
<text x="68" y="212.42857142857142" text-anchor="end">-6</text>
<line x1="80" y1="250.57142857142856" x2="450" y2="250.57142857142856" class="grid"/>
<text x="68" y="255.57142857142856" text-anchor="end">-8</text>
<line x1="80" y1="293.7142857142857" x2="450" y2="293.7142857142857" class="grid"/>
<text x="68" y="298.7142857142857" text-anchor="end">-10</text>
<line x1="80" y1="336.85714285714283" x2="450" y2="336.85714285714283" class="grid"/>
<text x="68" y="341.85714285714283" text-anchor="end">-12</text>
<line x1="80" y1="380.0" x2="450" y2="380.0" class="grid"/>
<text x="68" y="385.0" text-anchor="end">-14</text>
<line x1="80" y1="78" x2="80" y2="380" stroke="#292722"/>
<text x="34" y="242" transform="rotate(-90 34 242)">E / eV</text>
<line x1="114" y1="371.3344824153343" x2="426" y2="371.3344824153343" class="level"/>
<text x="442" y="376.3344824153343" >n=1</text>
<line x1="114" y1="151.3336206038336" x2="426" y2="151.3336206038336" class="level"/>
<text x="442" y="156.3336206038336" >n=2</text>
<line x1="114" y1="110.59272026837048" x2="426" y2="110.59272026837048" class="level"/>
<text x="442" y="115.59272026837048" >n=3</text>
<line x1="202" y1="154.3336206038336" x2="202" y2="367.3344824153343" stroke="#9b6a12" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="345" y1="113.59272026837048" x2="345" y2="147.3336206038336" stroke="#9b6a12" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500" y="95" >自由电子阈值 E=0</text>
<text x="500" y="139" style="font-weight:650">Lyman α：2p → 1s</text>
<text x="500" y="164" >ΔE = 10.198715 eV</text>
<text x="500" y="189" >λ = 121.568 nm</text>
<text x="500" y="239" style="font-weight:650">Balmer Hα：3p → 2s</text>
<text x="500" y="264" >ΔE = 1.888651 eV</text>
<text x="500" y="289" >λ = 656.470 nm</text>
<text x="500" y="339" class="small">高激发层间距更小，光子能量更低。</text>
<text x="500" y="363" class="small">图只标 n=1、2、3；更高能级趋近 0。</text>
<text x="34" y="416" class="small">箭头选择合法的 p→s 通道；同一 n 层还有此图未展开的轨道与自旋态。</text>
<text x="34" y="441" class="small">能量轴是真实线性比例；小修正须另用放大尺度，不能靠随意拉开能级表示。</text>
</svg>
