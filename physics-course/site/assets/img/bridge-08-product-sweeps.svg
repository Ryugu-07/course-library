<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">四站乘积 MPS 往返扫描</title><desc id="desc">开放链只有三条键；顺序从一到四再从四到一，每次局部求解使用最新邻居。转向处重复端点，记录整个乘积态能量并比较精确基准。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="24" fill="#25394a" text-anchor="start">一轮扫描：每一步都使用最新邻居</text><rect x="55" y="100" width="70" height="70" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="90" y="144" font-size="27" fill="#286fa7" text-anchor="middle">1</text><path d="M130 135L190 135" fill="none" stroke="#25394a" stroke-width="3" stroke-dasharray=""/><rect x="195" y="100" width="70" height="70" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="230" y="144" font-size="27" fill="#286fa7" text-anchor="middle">2</text><path d="M270 135L330 135" fill="none" stroke="#25394a" stroke-width="3" stroke-dasharray=""/><rect x="335" y="100" width="70" height="70" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="370" y="144" font-size="27" fill="#286fa7" text-anchor="middle">3</text><path d="M410 135L470 135" fill="none" stroke="#25394a" stroke-width="3" stroke-dasharray=""/><rect x="475" y="100" width="70" height="70" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="510" y="144" font-size="27" fill="#286fa7" text-anchor="middle">4</text><path d="M75 82L525 82" fill="none" stroke="#237d68" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="300" y="68" font-size="19" fill="#237d68" text-anchor="middle">向右：1 → 2 → 3 → 4</text><path d="M525 190L75 190" fill="none" stroke="#a64b35" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="300" y="223" font-size="19" fill="#a64b35" text-anchor="middle">向左：4 → 3 → 2 → 1</text><text x="300" y="266" font-size="21" fill="#25394a" text-anchor="middle">邻居 x → bⱼ → 最低局部态 → 新的 xⱼ、zⱼ</text><text x="300" y="310" font-size="22" fill="#286fa7" text-anchor="middle">完整能量 E = −Σ xⱼxⱼ₊₁ − gΣ zⱼ</text><text x="300" y="356" font-size="21" fill="#a64b35" text-anchor="middle">χ = 1，无纠缠；能量不升 ≠ 全局最优。</text></g></svg>
