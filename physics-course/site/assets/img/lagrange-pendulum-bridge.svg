<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 423" role="img" aria-labelledby="title desc">
<title id="title">理想单摆的广义坐标</title><desc id="desc">θ 从竖直向下量起。y轴向上。重力向下，允许位移沿圆周切线，与杆垂直。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="560" height="423" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="28" y="35" font-size="23" fill="#243746" text-anchor="start">约束 x²+y²=l² → 一个角度 θ</text><path d="M125,80L245,80" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray=""/><path d="M185,80L185,325" fill="none" stroke="#89939b" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M185,80L311.3738292428817,253.9386537906137" fill="none" stroke="#27689b" stroke-width="2.5" stroke-dasharray=""/><path d="M185 142 A62 62 0 0 0 221.44 130.16" fill="none" stroke="#a46615" stroke-width="3"/><circle cx="311.3738292428817" cy="253.9386537906137" r="12" fill="#27689b"/><path d="M311.3738292428817,253.9386537906137L311.3738292428817,348.93865379061367" fill="none" stroke="#a46615" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M311.3738292428817,253.9386537906137L388.2304437085017,198.09905482282875" fill="none" stroke="#27689b" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="208" y="139" font-size="24" fill="#a46615" text-anchor="start">θ</text><text x="246" y="168" font-size="25" fill="#27689b" text-anchor="start">l</text><text x="330" y="332" font-size="23" fill="#a46615" text-anchor="start">mg</text><text x="385" y="187" font-size="21" fill="#27689b" text-anchor="start">允许位移</text><text x="328" y="263" font-size="21" fill="#243746" text-anchor="start">m</text><text x="95" y="322" font-size="18" fill="#243746" text-anchor="start">竖直向下</text><path d="M52,126L108,126" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M52,126L52,74" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="111" y="135" font-size="18" fill="#243746" text-anchor="start">x</text><text x="42" y="67" font-size="18" fill="#243746" text-anchor="start">y</text><text x="28" y="397" font-size="23" fill="#243746" text-anchor="start">x=l sinθ，y=−l cosθ</text></g></svg>
