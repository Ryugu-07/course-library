<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">两能级相关与响应谱</title><desc id="desc">正负频率的相关权重都是非负数，响应谱由占据差乘以正负两条delta峰构成。箭头表示谱线面积而非有限峰高。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="24" fill="#25394a" text-anchor="start">相关谱取和，响应谱取占据差</text><path d="M65 140L535 140" fill="none" stroke="#25394a" stroke-width="3" stroke-dasharray=""/><text x="550" y="147" font-size="22" fill="#25394a" text-anchor="start">ω</text><path d="M170 140L170 80" fill="none" stroke="#237d68" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="170" y="170" font-size="21" fill="#237d68" text-anchor="middle">−ω₀</text><path d="M430 140L430 80" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="430" y="170" font-size="21" fill="#286fa7" text-anchor="middle">+ω₀</text><text x="170" y="66" font-size="21" fill="#237d68" text-anchor="middle">2πq²pₑ</text><text x="430" y="66" font-size="21" fill="#286fa7" text-anchor="middle">2πq²pɡ</text><text x="25" y="207" font-size="21" fill="#25394a" text-anchor="start">上：无序相关 S，两个权重均非负</text><path d="M65 275L535 275" fill="none" stroke="#25394a" stroke-width="3" stroke-dasharray=""/><path d="M170 275L170 321" fill="none" stroke="#a64b35" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M430 275L430 229" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="300" y="355" font-size="22" fill="#25394a" text-anchor="middle">下：χ″ 的两条谱线符号相反</text></g></svg>
