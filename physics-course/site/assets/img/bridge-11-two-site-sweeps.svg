<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
<title id="title">两站点往返扫描与真正传递的态</title><desc id="desc">一轮依次访问五个中心块。每一步从当前接受态重建块基，求解和截断后比较能量，接受时传递新态，拒绝时传递旧态。底部说明键维一时能量停滞而完整残差仍非零。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627682"/></marker></defs>
<rect width="720" height="500" rx="8" fill="#faf9f5"/>
<g font-family="system-ui,sans-serif" fill="#25394a">
<text x="26" y="36" font-size="24">扫描传递的是接受态，不是一串最低能量</text>
<text x="28" y="69" font-size="16">一轮五次尝试；数字表示当前两个中心站</text>
<g fill="#e8f1f8" stroke="#286fa7"><rect x="28" y="84" width="108" height="47" rx="6"/><rect x="167" y="84" width="108" height="47" rx="6"/><rect x="306" y="84" width="108" height="47" rx="6"/><rect x="445" y="84" width="108" height="47" rx="6"/><rect x="584" y="84" width="108" height="47" rx="6"/></g>
<g text-anchor="middle" font-size="21"><text x="82" y="115">1–2</text><text x="221" y="115">2–3</text><text x="360" y="115">3–4</text><text x="499" y="115">2–3</text><text x="638" y="115">1–2</text></g>
<g stroke="#627682" stroke-width="2" marker-end="url(#arrow)"><path d="M139 108H161"/><path d="M278 108H300"/><path d="M417 108H439"/><path d="M556 108H578"/></g>
<rect x="28" y="152" width="664" height="226" rx="8" fill="#fff" stroke="#c9d1d8"/>
<text x="46" y="179" font-size="18">每一次访问，都重新确认搜索空间</text>
<g fill="#eef4ee" stroke="#237d68"><rect x="46" y="197" width="173" height="65" rx="6"/><rect x="271" y="197" width="173" height="65" rx="6"/><rect x="496" y="197" width="176" height="65" rx="6"/></g>
<g text-anchor="middle" font-size="16"><text x="132" y="221">当前态 → L、R、W</text><text x="132" y="247">核验投影误差 ≈ 0</text><text x="357" y="222">解 W†HW，再截断</text><text x="357" y="247">重算候选能量</text><text x="584" y="222">候选是否升能？</text><text x="584" y="247">开启拒绝规则时</text></g>
<g fill="none" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"><path d="M223 229H264"/><path d="M448 229H489"/><path d="M551 266V282H309V302"/><path d="M617 266V302"/></g>
<rect x="213" y="307" width="198" height="45" rx="6" fill="#e8f1f8" stroke="#286fa7"/><rect x="478" y="307" width="194" height="45" rx="6" fill="#f7e9e5" stroke="#a64b35"/>
<text x="312" y="334" text-anchor="middle" font-size="16">不升能：传递候选态</text><text x="575" y="334" text-anchor="middle" font-size="16">升能：仍传递旧态</text>
<text x="46" y="370" font-size="14">下一键的环境，必须从这次真正传递的态重建。</text>
<rect x="28" y="398" width="664" height="70" rx="8" fill="#fff2cc"/>
<text x="46" y="423" font-size="17">g=1、χ=1、开启拒绝：第4步后能量停在 −4.385966</text>
<text x="46" y="450" font-size="17">完整残差仍为 0.880679；停滞不等于找到基态。</text>
<text x="360" y="489" text-anchor="middle" font-size="13" fill="#66727c">四站验证模型保存完整16维态；长链需正交中心与缓存环境实现。</text>
</g></svg>
