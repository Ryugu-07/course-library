<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
<title id="title">用四个质点实现真实惯量</title><desc id="desc">四个质量均为二分之一的质点位于正负根号三倍u和正负v。u与v正交，主惯量分别为一和三，垂直平面的主惯量为四。</desc>
<rect width="820" height="430" rx="12" fill="#f7f4eb"/>
<g font-family="system-ui, sans-serif" fill="#252c35">
<text x="28" y="36" font-size="21" font-weight="700">从非负质量出发，惯量才有物理实现</text>
<g stroke="#b6b7b5" stroke-width="1.5"><path d="M55 235H393M225 400V66"/><path d="M87.2 372.8L362.8 97.2" stroke="#2367a1" stroke-width="2"/><path d="M119 129L331 341" stroke="#ad5f24" stroke-width="2"/></g>
<text x="398" y="240" font-size="16">x</text><text x="230" y="76" font-size="16">y</text>
<text x="354" y="87" font-size="18" fill="#2367a1">u · I₁ = 1</text><text x="307" y="365" font-size="18" fill="#ad5f24">v · I₂ = 3</text>
<path d="M133.14 326.86L316.86 143.14M171.97 181.97L278.03 288.03" stroke="#555e67" stroke-width="5"/>
<g fill="#2367a1" stroke="#fff" stroke-width="2"><circle cx="133.14" cy="326.86" r="13"/><circle cx="316.86" cy="143.14" r="13"/></g>
<g fill="#ad5f24" stroke="#fff" stroke-width="2"><circle cx="171.97" cy="181.97" r="13"/><circle cx="278.03" cy="288.03" r="13"/></g>
<circle cx="225" cy="235" r="5" fill="#252c35"/>
<g font-size="17"><text x="326" y="136">√3 u</text><text x="71" y="349">−√3 u</text><text x="145" y="161">−v</text><text x="294" y="290">v</text><text x="205" y="261">O</text></g>
<g transform="translate(450 95)" font-size="19"><text y="0" font-weight="700">每个质点：m = 1/2</text><text y="39">沿 u 的两点，到 v 轴距离 √3</text><text y="70">沿 v 的两点，到 u 轴距离 1</text><text y="117" fill="#2367a1">I₁ = 2 × (1/2) × 1² = 1</text><text y="153" fill="#ad5f24">I₂ = 2 × (1/2) × (√3)² = 3</text><text y="189">I₃ = I₁ + I₂ = 4</text><text y="232" font-size="17">z 轴垂直纸面；连接杆忽略质量。</text><text y="262" font-size="17">长度、质量采用选定的统一单位。</text></g>
<text x="28" y="412" font-size="16">三角约束：I₁ + I₂ − I₃ = 2 ∫ z² dm ≥ 0；平面模型恰好取等号。</text>
</g></svg>