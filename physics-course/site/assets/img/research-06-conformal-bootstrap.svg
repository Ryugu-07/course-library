<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-labelledby="title"><title id="title">两条展开路线必须相容</title><rect width="440" height="440" fill="#faf8f1"/><g font-family="system-ui, sans-serif"><text x="220" y="35" text-anchor="middle" font-size="24" fill="#263448">两条展开路线必须相容</text><circle cx="60" cy="130" r="7" fill="#263448" stroke="#263448" stroke-width="3"/><text x="60" y="165" text-anchor="middle" font-size="20" fill="#263448">0</text><circle cx="165" cy="130" r="7" fill="#263448" stroke="#263448" stroke-width="3"/><text x="165" y="165" text-anchor="middle" font-size="20" fill="#263448">z</text><circle cx="275" cy="130" r="7" fill="#263448" stroke="#263448" stroke-width="3"/><text x="275" y="165" text-anchor="middle" font-size="20" fill="#263448">1</text><circle cx="380" cy="130" r="7" fill="#263448" stroke="#263448" stroke-width="3"/><text x="380" y="165" text-anchor="middle" font-size="20" fill="#263448">∞</text><text x="220" y="68" text-anchor="middle" font-size="20" fill="#263448">先在近邻对展开</text><circle cx="60" cy="280" r="7" fill="#263448" stroke="#263448" stroke-width="3"/><text x="60" y="315" text-anchor="middle" font-size="20" fill="#263448">0</text><circle cx="165" cy="280" r="7" fill="#263448" stroke="#263448" stroke-width="3"/><text x="165" y="315" text-anchor="middle" font-size="20" fill="#263448">z</text><circle cx="275" cy="280" r="7" fill="#263448" stroke="#263448" stroke-width="3"/><text x="275" y="315" text-anchor="middle" font-size="20" fill="#263448">1</text><circle cx="380" cy="280" r="7" fill="#263448" stroke="#263448" stroke-width="3"/><text x="380" y="315" text-anchor="middle" font-size="20" fill="#263448">∞</text><text x="220" y="185" text-anchor="middle" font-size="20" fill="#263448">换通道再展开</text><path d="M60 123 Q112 62 165 123 M275 123 Q328 62 380 123" stroke="#497ec5" stroke-width="3" fill="none" /><path d="M165 273 Q220 211 275 273 M60 275 Q220 122 380 275" stroke="#c65c3d" stroke-width="3" fill="none" /><text x="220" y="365" text-anchor="middle" font-size="20" fill="#263448">同一四点关联函数</text><text x="220" y="404" text-anchor="middle" font-size="20" fill="#263448">运动学幂也必须转换</text></g></svg>
