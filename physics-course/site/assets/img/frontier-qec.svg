<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 439" role="img" aria-labelledby="title desc"><title id="title">纠错检测事件的时空图</title><desc id="desc">三列为校验位置，三行为连续轮次。横向与纵向配对分别示意数据故障与读出故障的解释，不是完整表面码布局。</desc><rect width="440" height="439" rx="12" fill="#faf8f1"/><g font-family="system-ui,sans-serif"><text x="24" y="35" font-size="24" text-anchor="start" fill="#263746">校验也会错：读时间历史</text><path d="M100 100L100 310" stroke="#bac4cb" stroke-width="2" stroke-dasharray="4 5" fill="none"/><text x="100" y="77" font-size="20" text-anchor="middle" fill="#263746">j−1</text><path d="M220 100L220 310" stroke="#bac4cb" stroke-width="2" stroke-dasharray="4 5" fill="none"/><text x="220" y="77" font-size="20" text-anchor="middle" fill="#263746">j</text><path d="M340 100L340 310" stroke="#bac4cb" stroke-width="2" stroke-dasharray="4 5" fill="none"/><text x="340" y="77" font-size="20" text-anchor="middle" fill="#263746">j+1</text><path d="M85 110L358 110" stroke="#bac4cb" stroke-width="2" stroke-dasharray="4 5" fill="none"/><text x="37" y="116" font-size="20" text-anchor="start" fill="#263746">t₁</text><path d="M85 210L358 210" stroke="#bac4cb" stroke-width="2" stroke-dasharray="4 5" fill="none"/><text x="37" y="216" font-size="20" text-anchor="start" fill="#263746">t₂</text><path d="M85 310L358 310" stroke="#bac4cb" stroke-width="2" stroke-dasharray="4 5" fill="none"/><text x="37" y="316" font-size="20" text-anchor="start" fill="#263746">t₃</text><path d="M100 210L220 210" stroke="#a66d23" stroke-width="5" stroke-dasharray="" fill="none"/><path d="M340 110L340 210" stroke="#276d9c" stroke-width="5" stroke-dasharray="" fill="none"/><circle cx="100" cy="210" r="9" fill="#faf8f1" stroke="#263746" stroke-width="3"/><circle cx="220" cy="210" r="9" fill="#faf8f1" stroke="#263746" stroke-width="3"/><circle cx="340" cy="110" r="9" fill="#faf8f1" stroke="#263746" stroke-width="3"/><circle cx="340" cy="210" r="9" fill="#faf8f1" stroke="#263746" stroke-width="3"/><text x="24" y="354" font-size="20" text-anchor="start" fill="#263746">圆点：综合变化的检测事件</text><text x="24" y="386" font-size="20" text-anchor="start" fill="#915d18">横线：数据故障候选</text><text x="24" y="416" font-size="20" text-anchor="start" fill="#276d9c">竖线：读出故障候选</text></g></svg>
