<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">完全正性与 Bell 输入</title><desc id="desc">一个 Bell 对的系统端经过待检验映射，参考端不动。联合输出的负本征值揭示单系统正性无法发现的问题。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="25" fill="#25394a" text-anchor="start">把局部操作放进纠缠输入中检验</text><rect x="25" y="75" width="135" height="90" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="92" y="114" font-size="23" fill="#286fa7" text-anchor="middle">Bell 对</text><text x="92" y="147" font-size="24" fill="#286fa7" text-anchor="middle">|Ω〉</text><path d="M163 95L235 95" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M163 150L425 150" fill="none" stroke="#237d68" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="238" y="68" width="135" height="55" rx="12" fill="white" stroke="#a64b35" stroke-width="2"/><text x="305" y="103" font-size="20" fill="#a64b35" text-anchor="middle">Φ 只作用 S</text><path d="M375 95L425 95" fill="none" stroke="#a64b35" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="430" y="70" width="145" height="110" rx="12" fill="white" stroke="#25394a" stroke-width="2"/><text x="502" y="107" font-size="22" fill="#25394a" text-anchor="middle">联合输出 J</text><text x="502" y="149" font-size="21" fill="#25394a" text-anchor="middle">检查 J ≥ 0</text><text x="285" y="183" font-size="20" fill="#237d68" text-anchor="middle">R 保持不动</text><text x="25" y="233" font-size="23" fill="#25394a" text-anchor="start">转置：单比特测试全通过</text><text x="25" y="272" font-size="23" fill="#25394a" text-anchor="start">但 J = F/2，在反对称方向：</text><text x="300" y="316" font-size="27" fill="#a64b35" text-anchor="middle">〈ψ⁻|J|ψ⁻〉 = −1/2</text><text x="25" y="361" font-size="21" fill="#25394a" text-anchor="start">负测量概率否决了“这是一个通道”。</text></g></svg>
