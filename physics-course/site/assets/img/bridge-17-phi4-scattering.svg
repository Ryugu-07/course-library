<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">单圈散射的三次核对</title><desc id="desc">左侧两个可交换内部线形成泡图因子二分之一；中间三个通道减去同一离壳参考值；底部参数区间的负对数部分在阈值以上打开，对应两粒子相空间。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315783"/></marker></defs>
<rect width="1080" height="560" rx="18" fill="#f5f8fc"/>
<g font-family="system-ui, sans-serif" fill="#18324d"><text x="36" y="42" font-size="25" font-weight="700">单圈散射：先数图，再减法，最后核对概率</text>
<rect x="28" y="64" width="390" height="238" rx="14" fill="white" stroke="#bbcddd"/><text x="48" y="96" font-size="20" font-weight="600">① 同一泡图的两条内部线</text>
<g fill="none" stroke="#315783" stroke-width="3"><path d="M60 130L140 174L60 218M328 130L248 174L328 218"/><path d="M140 174C152 112 236 112 248 174M140 174C152 236 236 236 248 174"/></g>
<circle cx="140" cy="174" r="5" fill="#ba5637"/><circle cx="248" cy="174" r="5" fill="#ba5637"/>
<text x="183" y="120" font-size="17">k</text><text x="174" y="235" font-size="17">k + p</text><text x="58" y="273" font-size="17">交换内部线不产生新图 → 因子 1/2</text>
<rect x="438" y="64" width="614" height="238" rx="14" fill="white" stroke="#bbcddd"/><text x="458" y="96" font-size="20" font-weight="600">② 三个通道使用同一个参数定义</text>
<text x="464" y="138" font-size="19">s 泡 + t 泡 + u 泡 − 耦合反项</text><path d="M738 152L738 181" stroke="#315783" stroke-width="2" marker-end="url(#arrow)"/>
<text x="468" y="212" font-size="20">λ² / (32π²) × Σ [ L(−μ²) − L(q) ]</text>
<text x="465" y="251" font-size="17">q = s, t, u；发散与积分尺度κ相消</text><text x="465" y="278" font-size="17" fill="#92482e">减法点离壳：s = t = u = −μ²，非物理碰撞点</text>
<rect x="28" y="320" width="1024" height="211" rx="14" fill="white" stroke="#bbcddd"/><text x="48" y="353" font-size="20" font-weight="600">③ 阈值以上，对数的负值区间就是虚部的来源</text>
<text x="53" y="389" font-size="17">示例 r = s/m² = 8</text><line x1="74" y1="422" x2="614" y2="422" stroke="#667c90" stroke-width="3"/>
<line x1="153.08" y1="422" x2="534.92" y2="422" stroke="#cb683b" stroke-width="10"/>
<g font-size="17" text-anchor="middle"><text x="74" y="453">0</text><text x="153" y="454">x₋</text><text x="535" y="454">x₊</text><text x="614" y="453">1</text><text x="344" y="405" fill="#92482e">log(负数 − i0) 的虚部 = −π</text><text x="344" y="493">区间长度 β = √(1 − 4/r) = 1/√2</text></g>
<path d="M643 424L685 424" stroke="#315783" stroke-width="2" marker-end="url(#arrow)"/>
<text x="713" y="400" font-size="20">2 Im M = λ²β / (16π)</text><text x="713" y="437" font-size="19">= (1/2!) × β/(8π) × λ²</text><text x="713" y="475" font-size="17">相同末态计数 × 两体相空间</text><text x="713" y="504" font-size="17" fill="#92482e">此处的1/2!与图因子来源不同</text></g></svg>