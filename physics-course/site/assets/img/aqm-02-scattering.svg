<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="Scattering">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #444; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #c8d1dc; stroke-width: 2; rx: 8; }
      .soft { fill: #f8fafc; stroke: #d8e0e8; stroke-width: 2; rx: 8; }
      .accent { fill: #a03d3d; stroke: #a03d3d; }
      .line { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #777; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title">Scattering</text>
<rect x="48" y="88" width="1004" height="486" fill="#f5dddd" opacity="0.42" rx="18"/>
  <path d="M 120.0 320.0 L 470.0 320.0" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="540.0" cy="320.0" r="38.0" fill="#fff" stroke="#a03d3d" stroke-width="2"/>
  <text x="540.0" y="320.0" class="label" text-anchor="middle" dominant-baseline="middle">V</text>
  <path d="M 575 310 C 690 220 805 175 930 150" stroke="#a03d3d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 575 330 C 700 385 810 430 930 455" stroke="#a03d3d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="220.0" y="290.0" class="small" text-anchor="middle" dominant-baseline="middle">incident wave</text>
  <text x="815.0" y="245.0" class="small" text-anchor="middle" dominant-baseline="middle">scattered wave</text>
</svg>
