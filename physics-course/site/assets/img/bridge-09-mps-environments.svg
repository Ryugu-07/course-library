<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
<title id="title">环境把四站链变成八维中心问题</title><desc id="desc">站1是两维左块，站2为中心，站3到4组成两维右块。每侧传来范数G、内部能量K和边界算符C，中心使用五项有效Hamiltonian，局部与完整残差分别检查。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#567485"/></marker></defs>
<rect width="720" height="470" rx="12" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#273f50">
<text x="28" y="40" font-size="25">环境矩阵：保留块内信息与跨块作用</text>
<rect x="28" y="64" width="155" height="137" rx="9" fill="#e9f0f5"/><rect x="226" y="64" width="155" height="137" rx="9" fill="#faeadf"/><rect x="424" y="64" width="268" height="137" rx="9" fill="#e9f0f5"/>
<text x="104" y="92" text-anchor="middle" font-size="17">左块 ℓ = 0,1</text><text x="304" y="92" text-anchor="middle" font-size="17">中心 s = 0,1</text><text x="558" y="92" text-anchor="middle" font-size="17">右块 r = 0,1</text>
<path d="M138 130H270M338 130H463M531 130H600" stroke="#567485" stroke-width="3"/>
<g fill="#fff" stroke="#567485"><rect x="72" y="107" width="66" height="46" rx="6"/><rect x="270" y="107" width="68" height="46" rx="6"/><rect x="465" y="107" width="66" height="46" rx="6"/><rect x="600" y="107" width="66" height="46" rx="6"/></g>
<g font-size="22" text-anchor="middle"><text x="105" y="138">1</text><text x="304" y="138">2</text><text x="498" y="138">3</text><text x="633" y="138">4</text></g>
<text x="199" y="123" font-size="14">χ=2</text><text x="397" y="123" font-size="14">χ=2</text><text x="561" y="123" font-size="14">χ=2</text>
<text x="105" y="183" text-anchor="middle" font-size="15">|0⟩、|1⟩</text><text x="304" y="183" text-anchor="middle" font-size="15">a 的 2×2×2 个分量</text><text x="558" y="183" text-anchor="middle" font-size="14">R₀=c|00⟩+s|11⟩，R₁=|01⟩</text>
<path d="M105 201V224M558 201V224" stroke="#567485" stroke-width="2" marker-end="url(#a)"/>
<rect x="28" y="230" width="225" height="89" rx="7" fill="#fff" stroke="#567485"/><rect x="403" y="230" width="289" height="89" rx="7" fill="#fff" stroke="#567485"/>
<text x="44" y="257" font-size="17">G_L = I，K_L = −gZ</text><text x="44" y="287" font-size="17">C_L = X：靠中心的算符</text>
<text x="419" y="254" font-size="16">G_R = I，C_R = sin α · X</text><text x="419" y="281" font-size="15">K_R = diag(−sin 2α−2g cos 2α, 0)</text><text x="419" y="306" font-size="13">从站4向站3递推，也可直接取矩阵元</text>
<path d="M140 319L260 348M548 319L458 348" stroke="#567485" stroke-width="2" marker-end="url(#a)"/>
<rect x="176" y="355" width="368" height="65" rx="7" fill="#fff" stroke="#a45c41"/>
<text x="360" y="380" text-anchor="middle" font-size="18">N = I₈，H_eff 为五种能量项之和</text><text x="360" y="407" text-anchor="middle" font-size="16">解 8 维中心 → 放回 16 维物理态核验</text>
<text x="360" y="452" text-anchor="middle" font-size="16" fill="#914d3a">投影后的残差为零，不保证子空间外的残差也为零。</text>
</g></svg>