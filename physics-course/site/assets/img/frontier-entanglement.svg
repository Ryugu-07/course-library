<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 447" role="img" aria-labelledby="title desc"><title id="title">Schmidt通道与截断权重</title><desc id="desc">两个Schmidt权重为四分之三和四分之一。只保留第一通道，归一化截断态的重叠平方为四分之三。</desc><rect width="440" height="447" rx="12" fill="#faf8f1"/><g font-family="system-ui,sans-serif"><text x="24" y="36" font-size="24" text-anchor="start" fill="#263746">切口的谱与截断</text><rect x="25" y="82" width="150" height="178" rx="8" fill="#e2edf3"/><rect x="265" y="82" width="150" height="178" rx="8" fill="#eee6d2"/><text x="100" y="112" font-size="22" text-anchor="middle" fill="#263746">子系统 A</text><text x="340" y="112" font-size="22" text-anchor="middle" fill="#263746">子系统 B</text><path d="M220 65L220 280" stroke="#758491" stroke-width="2" stroke-dasharray="6 5" fill="none"/><text x="220" y="65" font-size="20" text-anchor="middle" fill="#263746">切口</text><path d="M130 155L310 155" stroke="#276d9c" stroke-width="4" stroke-dasharray="" fill="none"/><text x="74" y="162" font-size="22" text-anchor="middle" fill="#263746">|0⟩</text><text x="365" y="162" font-size="22" text-anchor="middle" fill="#263746">|0⟩</text><text x="220" y="140" font-size="20" text-anchor="middle" fill="#276d9c">p₁ = ¾</text><path d="M130 230L310 230" stroke="#a16b22" stroke-width="4" stroke-dasharray="" fill="none"/><text x="74" y="237" font-size="22" text-anchor="middle" fill="#263746">|1⟩</text><text x="365" y="237" font-size="22" text-anchor="middle" fill="#263746">|1⟩</text><text x="220" y="215" font-size="20" text-anchor="middle" fill="#a16b22">p₂ = ¼</text><text x="24" y="315" font-size="22" text-anchor="start" fill="#263746">保留第一条：F² = ¾</text><rect x="25" y="337" width="292.5" height="25" fill="#276d9c"/><rect x="317.5" y="337" width="97.5" height="25" fill="#e0c296"/><text x="25" y="394" font-size="20" text-anchor="start" fill="#263746">保留权重 ¾；丢弃权重 ¼</text><text x="25" y="423" font-size="20" text-anchor="start" fill="#263746">连接表示分解通道，不是粒子流</text></g></svg>
