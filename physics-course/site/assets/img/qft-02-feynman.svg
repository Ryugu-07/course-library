<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="Feynman">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #444; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #c8d1dc; stroke-width: 2; rx: 8; }
      .soft { fill: #f8fafc; stroke: #d8e0e8; stroke-width: 2; rx: 8; }
      .accent { fill: #a03d3d; stroke: #a03d3d; }
      .line { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #777; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title">Feynman</text>
<rect x="48" y="88" width="1004" height="486" fill="#f5dddd" opacity="0.40" rx="18"/>
  <path d="M 220.0 170.0 L 470.0 300.0" stroke="#a03d3d" stroke-width="2" fill="none"/>
  <path d="M 220.0 430.0 L 470.0 300.0" stroke="#a03d3d" stroke-width="2" fill="none"/>
  <path d="M 470 300 C 530 260 570 340 630 300" stroke="#555" stroke-width="2.4" fill="none"/>
  <path d="M 630.0 300.0 L 880.0 170.0" stroke="#a03d3d" stroke-width="2" fill="none"/>
  <path d="M 630.0 300.0 L 880.0 430.0" stroke="#a03d3d" stroke-width="2" fill="none"/>
  <text x="205.0" y="160.0" class="label" text-anchor="middle" dominant-baseline="middle">e-</text>
  <text x="205.0" y="440.0" class="label" text-anchor="middle" dominant-baseline="middle">e+</text>
  <text x="550.0" y="246.0" class="small" text-anchor="middle" dominant-baseline="middle">gamma*</text>
  <text x="900.0" y="160.0" class="label" text-anchor="middle" dominant-baseline="middle">mu-</text>
  <text x="900.0" y="440.0" class="label" text-anchor="middle" dominant-baseline="middle">mu+</text>
</svg>
