<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">同一正规化下作减法</title><desc id="desc">两个积分中的共同紫外对数相消，留下与外动量和参考点有关的有限差。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="24" fill="#25394a" text-anchor="start">共同发散相消，有限差留下</text><rect x="25" y="67" width="550" height="66" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="45" y="108" font-size="21" fill="#286fa7" text-anchor="start">BΛ(Q)  =  公共 log Λ  +  有限项(Q)</text><text x="300" y="165" font-size="21" fill="#25394a" text-anchor="middle">减去同一截断处的参考值</text><rect x="25" y="187" width="550" height="66" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="45" y="229" font-size="21" fill="#a64b35" text-anchor="start">BΛ(Q₀) = 公共 log Λ + 有限项(Q₀)</text><path d="M300 261L300 296" fill="none" stroke="#25394a" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="300" y="328" font-size="21" fill="#237d68" text-anchor="middle">BR(Q;Q₀)：参考点为零，其他点未必为零</text><text x="25" y="365" font-size="21" fill="#25394a" text-anchor="start">Λ → ∞ 时，保持 Q、Q₀、m 固定。</text></g></svg>
