<svg xmlns="http://www.w3.org/2000/svg" width="840" height="570" viewBox="0 0 840 570" role="img" aria-labelledby="title desc">
<title id="title">从范数正性到连续谱排除</title><desc id="desc">后裔范数保证OPE系数非负。对crossing作用同一个泛函，恒等项为8，所有h大于等于4的块值由解析下界保证为正，所以它们不能相加为零。网格只是独立核验，不能替代连续域证明。</desc>
<rect width="840" height="570" rx="18" fill="#f8f5ee"/>
<style>text{font-family:system-ui,sans-serif;fill:#233347;font-size:20px}.head{font-size:25px;font-weight:600}.small{font-size:18px}</style>
<text x="30" y="44" class="head">正性怎样排除“所有非恒等初级都 h≥4”？</text>
<rect x="30" y="72" width="370" height="94" rx="12" fill="#dcebf1"/><rect x="440" y="72" width="370" height="94" rx="12" fill="#e4ead7"/>
<text x="50" y="107">后裔范数 n!(2h)ₙ &gt; 0</text><text x="50" y="143" class="small">左右矩阵元共轭 → pₕ=|λ|²≥0</text>
<text x="460" y="107">一个初级 + 全部后裔</text><text x="460" y="143" class="small">gₕ(z)=zʰ ₂F₁(h,h;2h;z)</text>
<path d="M420 178V210m-8-12 8 12 8-12" stroke="#526b81" fill="none" stroke-width="3"/>
<rect x="30" y="224" width="780" height="86" rx="12" fill="#e6e5f1"/>
<text x="55" y="257">Crossing：F_id + Σ pₕ Fₕ = 0</text><text x="55" y="291" class="small">同一个泛函：α(F)=F‴(1/2) − 4F′(1/2)</text>
<path d="M420 322V350m-8-12 8 12 8-12" stroke="#526b81" fill="none" stroke-width="3"/>
<rect x="30" y="364" width="780" height="110" rx="12" fill="#f2dccb"/>
<text x="55" y="400">恒等项 8 &gt; 0；全部 h≥4：α(Fₕ)/gₕ ≥ 正的多项式</text><text x="55" y="440">8 + 非负项之和 ≠ 0 → 谱隙假设矛盾</text>
<text x="35" y="518" class="small">连续半轴由解析不等式覆盖；无限谱需可逐项求导的收敛条件。</text><text x="35" y="551" class="small">有限网格用于核验公式；没有给出最优谱隙或三维临界指数。</text>
</svg>