<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">两套规范同一个曲率</title><desc id="desc">南北两个局部本征态相差相位exp(i phi)，联络相差负dphi，曲率相同。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="24" fill="#25394a" text-anchor="start">局部相位不同，曲率仍然相同</text><rect x="25" y="80" width="260" height="150" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><rect x="315" y="80" width="260" height="150" rx="12" fill="white" stroke="#237d68" stroke-width="2"/><text x="155" y="115" font-size="23" fill="#286fa7" text-anchor="middle">北侧规范</text><text x="445" y="115" font-size="23" fill="#237d68" text-anchor="middle">南侧规范</text><text x="155" y="162" font-size="20" fill="#286fa7" text-anchor="middle">Aφ = (1−cos θ)/2</text><text x="445" y="162" font-size="19" fill="#237d68" text-anchor="middle">Aφ = −(1+cos θ)/2</text><text x="155" y="206" font-size="20" fill="#286fa7" text-anchor="middle">北极可用</text><text x="445" y="206" font-size="20" fill="#237d68" text-anchor="middle">南极可用</text><text x="300" y="269" font-size="23" fill="#25394a" text-anchor="middle">uS = eⁱᵠ uN；AS = AN − dφ</text><text x="300" y="315" font-size="26" fill="#a64b35" text-anchor="middle">Fθφ = sin θ / 2</text><text x="25" y="358" font-size="20" fill="#25394a" text-anchor="start">下能级；A=i⟨u|du⟩；取向 dθ∧dφ。</text></g></svg>
