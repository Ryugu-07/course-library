<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">更新中心后，只延长一侧有效环境</title><desc id="desc">六站链先更新第三和第四站，再向右更新第四和第五站。左环境L2和右环境R5在本次中心之外；下一步用新的第三站张量建立L3，并复用R6。</desc><rect width="900" height="620" rx="20" fill="#f6f8fc"/><style>text{font-family:system-ui,sans-serif;fill:#243348}.small{font-size:18px}.label{font-size:22px;font-weight:600}</style>
<text x="36" y="46" class="label" text-anchor="start">从站 3、4 → 站 4、5：缓存依赖哪些张量？</text>
<text x="36" y="100" class="label" text-anchor="start">本次：L₂ + 中心(3,4) + R₅</text>
<path d="M90 155H810" stroke="#64748b" stroke-width="4"/>
<rect x="59" y="126" width="62" height="58" rx="9" fill="#c9dfef" stroke="#526579"/>
<text x="90" y="163" class="label" text-anchor="middle">1</text>
<rect x="203" y="126" width="62" height="58" rx="9" fill="#c9dfef" stroke="#526579"/>
<text x="234" y="163" class="label" text-anchor="middle">2</text>
<rect x="347" y="126" width="62" height="58" rx="9" fill="#f4c27b" stroke="#526579"/>
<text x="378" y="163" class="label" text-anchor="middle">3</text>
<rect x="491" y="126" width="62" height="58" rx="9" fill="#f4c27b" stroke="#526579"/>
<text x="522" y="163" class="label" text-anchor="middle">4</text>
<rect x="635" y="126" width="62" height="58" rx="9" fill="#c5e4d5" stroke="#526579"/>
<text x="666" y="163" class="label" text-anchor="middle">5</text>
<rect x="779" y="126" width="62" height="58" rx="9" fill="#c5e4d5" stroke="#526579"/>
<text x="810" y="163" class="label" text-anchor="middle">6</text>
<text x="162" y="222" class="small" text-anchor="middle">有效左前缀</text>
<text x="738" y="222" class="small" text-anchor="middle">有效右后缀</text>
<text x="36" y="305" class="label" text-anchor="start">下一次：新 L₃ + 中心(4,5) + R₆</text>
<path d="M90 360H810" stroke="#64748b" stroke-width="4"/>
<rect x="59" y="331" width="62" height="58" rx="9" fill="#c9dfef" stroke="#526579"/>
<text x="90" y="368" class="label" text-anchor="middle">1</text>
<rect x="203" y="331" width="62" height="58" rx="9" fill="#c9dfef" stroke="#526579"/>
<text x="234" y="368" class="label" text-anchor="middle">2</text>
<rect x="347" y="331" width="62" height="58" rx="9" fill="#c9dfef" stroke="#526579"/>
<text x="378" y="368" class="label" text-anchor="middle">3</text>
<rect x="491" y="331" width="62" height="58" rx="9" fill="#f4c27b" stroke="#526579"/>
<text x="522" y="368" class="label" text-anchor="middle">4</text>
<rect x="635" y="331" width="62" height="58" rx="9" fill="#f4c27b" stroke="#526579"/>
<text x="666" y="368" class="label" text-anchor="middle">5</text>
<rect x="779" y="331" width="62" height="58" rx="9" fill="#c5e4d5" stroke="#526579"/>
<text x="810" y="368" class="label" text-anchor="middle">6</text>
<text x="234" y="427" class="small" text-anchor="middle">新增左前缀</text>
<text x="810" y="427" class="small" text-anchor="middle">复用远端后缀</text>
<path d="M350 236V278l-8-12m8 12 8-12" fill="none" stroke="#497ec5" stroke-width="3"/>
<text x="380" y="263" class="small" text-anchor="start">只接入新的站 3：L₃ = grow(L₂, A₃)</text>
<rect x="30" y="465" width="840" height="125" rx="12" fill="#e7edf5"/>
<text x="50" y="496" class="small" text-anchor="start">旧 L₃ 包含旧站 3，必须更新；R₆ 只含未动过的站 6。</text>
<text x="50" y="532" class="small" text-anchor="start">Σ 随中心向右传递，留下的站 3 保持左正交。</text>
<text x="50" y="568" class="small" text-anchor="start">两轮 L=8：缓存 8+28=36 次；每步重建 28×6=168 次。</text>
</svg>