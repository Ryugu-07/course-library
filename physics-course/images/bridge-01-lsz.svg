<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">外腿截肢</title><desc id="desc">四条外腿各带传播子，截肢后仅剩负i乘lambda，约化振幅为负lambda。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="25" fill="#25394a" text-anchor="start">外腿传播 × 相互作用核</text><path d="M45 105L150 170" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray=""/><path d="M45 235L150 170" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray=""/><path d="M260 105L150 170" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray=""/><path d="M260 235L150 170" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray=""/><circle cx="150" cy="170" r="9" fill="#a64b35"/><text x="150" y="280" font-size="19" fill="#286fa7" text-anchor="middle">每腿 i/(p²−m²+i0)</text><path d="M295 170L400 170" fill="none" stroke="#25394a" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="350" y="140" font-size="20" fill="#25394a" text-anchor="middle">截四腿</text><circle cx="475" cy="170" r="13" fill="#a64b35"/><text x="475" y="230" font-size="32" fill="#a64b35" text-anchor="middle">−iλ</text><text x="475" y="278" font-size="24" fill="#a64b35" text-anchor="middle">iM = −iλ</text><text x="25" y="325" font-size="22" fill="#25394a" text-anchor="start">乘逆传播子，再取壳上极点系数。</text><text x="25" y="359" font-size="20" fill="#25394a" text-anchor="start">树级 Z=1；公共动量守恒 δ 已提出。</text></g></svg>
