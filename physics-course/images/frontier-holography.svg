<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 439" role="img" aria-labelledby="title desc"><title id="title">静态AdS3区间的极值曲线</title><desc id="desc">边界区间A与体内半圆测地线围出空间区域ΣA。量子修正需要将面积项与体场熵相加后求驻值，再比较允许解。</desc><rect width="440" height="439" rx="12" fill="#faf8f1"/><g font-family="system-ui,sans-serif"><text x="24" y="36" font-size="24" text-anchor="start" fill="#263746">边界区间与纠缠楔切片</text><path d="M70 115 A150 150 0 0 0 370 115 Z" fill="#dfedf2"/><path d="M25 115L415 115" stroke="#8495a0" stroke-width="2" stroke-dasharray="" fill="none"/><path d="M70 115L370 115" stroke="#a16b22" stroke-width="5" stroke-dasharray="" fill="none"/><path d="M70 115 A150 150 0 0 0 370 115" stroke="#276d9c" stroke-width="4" fill="none"/><text x="220" y="87" font-size="20" text-anchor="middle" fill="#263746">边界区间 A，长度 ℓ</text><text x="220" y="155" font-size="20" text-anchor="middle" fill="#263746">ΣA：空间区域</text><text x="220" y="205" font-size="20" text-anchor="middle" fill="#263746">z 向体内增大 ↓</text><text x="310" y="270" font-size="20" text-anchor="start" fill="#276d9c">曲面 γA</text><text x="24" y="313" font-size="20" text-anchor="start" fill="#263746">经典：比较合格曲面的面积</text><text x="24" y="347" font-size="22" text-anchor="start" fill="#263746">量子：面积项 + 体场熵</text><text x="24" y="381" font-size="22" text-anchor="start" fill="#263746">先满足 δSgen = 0</text><text x="24" y="415" font-size="20" text-anchor="start" fill="#263746">再在允许驻值解中选较小者</text></g></svg>
