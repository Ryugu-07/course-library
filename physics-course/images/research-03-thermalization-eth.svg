<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-labelledby="title"><title id="title">退相位允许再次复现</title><rect width="440" height="440" fill="#faf8f1"/><g font-family="system-ui, sans-serif"><text x="220" y="35" text-anchor="middle" font-size="24" fill="#263448">退相位允许再次复现</text><text x="220" y="80" text-anchor="middle" font-size="20" fill="#263448">E/Eref = (0, 1, 2)；τ = π/2</text><circle cx="80" cy="172" r="51" fill="#faf8f1" stroke="#cbd4de" stroke-width="3"/><path d="M38 172 H122 M80 130 V214" stroke="#cbd4de" stroke-width="1" fill="none" /><path d="M80 172 L123.0 172.0" stroke="#497ec5" stroke-width="4" fill="none" /><circle cx="123.0" cy="172.0" r="5" fill="#497ec5" stroke="#497ec5" stroke-width="3"/><text x="80" y="254" text-anchor="middle" font-size="20" fill="#263448">1</text><circle cx="220" cy="172" r="51" fill="#faf8f1" stroke="#cbd4de" stroke-width="3"/><path d="M178 172 H262 M220 130 V214" stroke="#cbd4de" stroke-width="1" fill="none" /><path d="M220 172 L220.0 215.0" stroke="#497ec5" stroke-width="4" fill="none" /><circle cx="220.0" cy="215.0" r="5" fill="#497ec5" stroke="#497ec5" stroke-width="3"/><text x="220" y="254" text-anchor="middle" font-size="20" fill="#263448">−i</text><circle cx="360" cy="172" r="51" fill="#faf8f1" stroke="#cbd4de" stroke-width="3"/><path d="M318 172 H402 M360 130 V214" stroke="#cbd4de" stroke-width="1" fill="none" /><path d="M360 172 L317.0 172.0" stroke="#497ec5" stroke-width="4" fill="none" /><circle cx="317.0" cy="172.0" r="5" fill="#497ec5" stroke="#497ec5" stroke-width="3"/><text x="360" y="254" text-anchor="middle" font-size="20" fill="#263448">−1</text><text x="220" y="301" text-anchor="middle" font-size="20" fill="#263448">概率含两两相位差</text><text x="220" y="340" text-anchor="middle" font-size="20" fill="#263448">平均抑制非零频率</text><text x="220" y="380" text-anchor="middle" font-size="20" fill="#263448">τ = 2π：三相位再次重合</text><text x="220" y="417" text-anchor="middle" font-size="20" fill="#263448">全态纯度始终为 1</text></g></svg>
