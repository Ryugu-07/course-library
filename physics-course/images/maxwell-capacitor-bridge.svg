<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" role="img" aria-labelledby="title desc">
<title id="title">电容充电的两张跨面</title><desc id="desc">上图平面穿导线，下图曲面绕过左极板进入间隙，两面的边界是同一曲线C。传导与位移项之和相同。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="560" height="580" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="24" y="34" font-size="23" fill="#243746" text-anchor="start">同一边界 C，两种跨面</text><g transform="translate(0 0)"><ellipse cx="200" cy="135" rx="20" ry="50" fill="#d9e8f2"/><path d="M55,135L390,135" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray=""/><path d="M465,135L522,135" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray=""/><path d="M390,79L390,191" fill="none" stroke="#27689b" stroke-width="2.5" stroke-dasharray=""/><path d="M465,79L465,191" fill="none" stroke="#27689b" stroke-width="2.5" stroke-dasharray=""/><path d="M75,115L126,115" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="80" y="98" font-size="21" fill="#243746" text-anchor="start">I</text><ellipse cx="200" cy="135" rx="20" ry="50" fill="none" stroke="#27689b" stroke-width="3"/><text x="170" y="72" font-size="23" fill="#27689b" text-anchor="start">C</text><text x="400" y="110" font-size="20" fill="#27689b" text-anchor="start">+</text><text x="444" y="110" font-size="20" fill="#27689b" text-anchor="start">−</text><path d="M403,157L451,157" fill="none" stroke="#a46615" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="424" y="185" font-size="19" fill="#a46615" text-anchor="start">E</text><text x="25" y="222" font-size="21" fill="#243746" text-anchor="start">S₁：穿过导线，传导电流 I</text></g><g transform="translate(0 260)"><path d="M200 85C255 42 378 42 425 85Q456 135 425 185C378 228 255 228 200 185Q220 135 200 85Z" fill="#f1dfb9" fill-opacity=".55" stroke="#a46615" stroke-width="2" stroke-dasharray="6 5"/><path d="M55,135L390,135" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray=""/><path d="M465,135L522,135" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray=""/><path d="M390,79L390,191" fill="none" stroke="#27689b" stroke-width="2.5" stroke-dasharray=""/><path d="M465,79L465,191" fill="none" stroke="#27689b" stroke-width="2.5" stroke-dasharray=""/><path d="M75,115L126,115" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="80" y="98" font-size="21" fill="#243746" text-anchor="start">I</text><ellipse cx="200" cy="135" rx="20" ry="50" fill="none" stroke="#27689b" stroke-width="3"/><text x="170" y="72" font-size="23" fill="#27689b" text-anchor="start">C</text><text x="400" y="110" font-size="20" fill="#27689b" text-anchor="start">+</text><text x="444" y="110" font-size="20" fill="#27689b" text-anchor="start">−</text><path d="M403,157L451,157" fill="none" stroke="#a46615" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="424" y="185" font-size="19" fill="#a46615" text-anchor="start">E</text><text x="25" y="244" font-size="21" fill="#243746" text-anchor="start">S₂：板间传导 0；位移项 Iᵈ=I</text></g><text x="24" y="554" font-size="21" fill="#243746" text-anchor="start">曲面形状示意；忽略边缘场与漏电</text></g></svg>
