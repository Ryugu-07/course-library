<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" role="img" aria-labelledby="title desc">
<title id="title">MPO 作用接口与局部 Krylov 求解</title><desc id="desc">左环境、两个 MPO 张量和右环境共同定义 H 对中心向量的作用。重复作用并两遍完全再正交得到 Q，用 Q 转置 H Q 求 Ritz 态，再显式核验局部残差。SVD 压缩和环境移动另行完成；局部零残差不保证完整链基态。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#466175"/></marker></defs>
<rect width="860" height="530" rx="12" fill="#f8f8f3"/>
<g font-family="system-ui,sans-serif" fill="#243746"><text x="28" y="40" font-size="25">不存 H 的整张表，仍要核验 H 的真实作用</text>
<text x="28" y="70" font-size="15">指标：算符键 a,b,c；态键 λ,ρ；每站同时有输出 s 与输入 t</text>
<g fill="#e8f1f5" stroke="#467a95"><rect x="28" y="100" width="156" height="75" rx="8"/><rect x="220" y="100" width="174" height="75" rx="8"/><rect x="430" y="100" width="174" height="75" rx="8"/><rect x="640" y="100" width="192" height="75" rx="8"/></g>
<g font-size="20" text-anchor="middle"><text x="106" y="131">左环境 E_L[a]</text><text x="307" y="131">W_j[a,b]</text><text x="517" y="131">W_{j+1}[b,c]</text><text x="736" y="131">右环境 E_R[c]</text></g>
<g font-size="14" text-anchor="middle"><text x="106" y="155">bra / ket 两份态键</text><text x="307" y="155">局部输出 / 输入</text><text x="517" y="155">局部输出 / 输入</text><text x="736" y="155">bra / ket 两份态键</text></g>
<g stroke="#466175" stroke-width="2" marker-end="url(#a)"><path d="M184 138H216"/><path d="M394 138H426"/><path d="M604 138H636"/><path d="M430 177V205"/></g>
<rect x="214" y="210" width="432" height="62" rx="8" fill="#eef2df" stroke="#6f7d35"/><text x="430" y="236" text-anchor="middle" font-size="19">Θ → H_eff Θ：只收缩非零算符路径</text><text x="430" y="258" text-anchor="middle" font-size="14">不生成 D×D 局部矩阵；仍有环境与收缩成本</text>
<path d="M430 274V291H152V301" stroke="#466175" stroke-width="2" marker-end="url(#a)"/>
<rect x="28" y="310" width="249" height="87" rx="8" fill="#e8f1f5" stroke="#467a95"/><rect x="306" y="310" width="248" height="87" rx="8" fill="#e8f1f5" stroke="#467a95"/><rect x="583" y="310" width="249" height="87" rx="8" fill="#f8ece3" stroke="#b26b3f"/>
<g font-size="19" text-anchor="middle"><text x="152" y="338">Krylov 基 Q</text><text x="430" y="338">小矩阵 B = QᵀHQ</text><text x="707" y="338">重新作用 H 核验</text></g>
<g font-size="14" text-anchor="middle"><text x="152" y="364">从旧中心开始；两遍再正交</text><text x="152" y="384">保存 Q 与 HQ，约 O(DK)</text><text x="430" y="364">保留完整 K×K 投影</text><text x="430" y="384">最低 Ritz 向量 v = Qy</text><text x="707" y="364">r = ‖Hv − λv‖₂</text><text x="707" y="384">局部空间，且在 SVD 之前</text></g>
<g stroke="#466175" stroke-width="2" marker-end="url(#a)"><path d="M277 354H302"/><path d="M554 354H579"/><path d="M707 399V428"/></g>
<rect x="28" y="436" width="804" height="66" rx="8" fill="#fff2cf" stroke="#bba566"/><text x="430" y="461" text-anchor="middle" font-size="17">然后：SVD 丢弃权重 → 移动正交中心 → 延长一侧环境</text><text x="430" y="485" text-anchor="middle" font-size="15">r = 0 也可能是激发态；局部残差、压缩误差、全链方差须分别检查</text>
</g></svg>
