<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">One Grover iteration as two reflections</title>
  <desc id="desc">For eight basis states with one marked item, the oracle flips the marked amplitude and diffusion reflects every amplitude about their mean, amplifying the marked state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#59616c"/>
    </marker>
    <style>
      .title{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242a}
      .head{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242a}
      .label{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242a}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4f5864}
      .mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#20242a}
      .panel{fill:#f8fafc;stroke:#ccd4de;stroke-width:2}
      .axis{stroke:#7a828c;stroke-width:1.6}
      .bar{fill:#7e8793}
      .marked{fill:#a03d3d}
      .amplified{fill:#39734d}
      .mean{stroke:#9b6a12;stroke-width:2;stroke-dasharray:6 5}
      .flow{fill:none;stroke:#59616c;stroke-width:2.2;marker-end:url(#arrow)}
      .curve{fill:none;stroke:#39734d;stroke-width:4}
      .guide{fill:none;stroke:#9aa3ae;stroke-width:1.5;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1100" height="650" fill="#fff"/>
  <text x="48" y="48" class="title">Grover amplification: flip a phase, then reflect about the mean</text>

  <rect x="48" y="82" width="296" height="330" rx="8" class="panel"/>
  <text x="70" y="113" class="head">1  Uniform state</text>
  <text x="70" y="137" class="small">N = 8, one marked basis state</text>
  <path d="M72 316H320" class="axis"/>
  <rect x="82" y="222" width="20" height="94" class="bar"/><rect x="112" y="222" width="20" height="94" class="bar"/>
  <rect x="142" y="222" width="20" height="94" class="bar"/><rect x="172" y="222" width="20" height="94" class="bar"/>
  <rect x="202" y="222" width="20" height="94" class="bar"/><rect x="232" y="222" width="20" height="94" class="marked"/>
  <rect x="262" y="222" width="20" height="94" class="bar"/><rect x="292" y="222" width="20" height="94" class="bar"/>
  <text x="242" y="340" text-anchor="middle" class="label">marked</text>
  <text x="196" y="382" text-anchor="middle" class="mono">a_i = 1 / sqrt(8)</text>

  <path d="M359 247H405" class="flow"/>
  <text x="382" y="223" text-anchor="middle" class="label">oracle</text>
  <text x="382" y="272" text-anchor="middle" class="small">phase flip</text>

  <rect x="420" y="82" width="260" height="330" rx="8" class="panel"/>
  <text x="442" y="113" class="head">2  Signed amplitudes</text>
  <text x="442" y="137" class="small">Only the marked sign changes</text>
  <path d="M444 267H656" class="axis"/>
  <rect x="450" y="190" width="18" height="77" class="bar"/><rect x="476" y="190" width="18" height="77" class="bar"/>
  <rect x="502" y="190" width="18" height="77" class="bar"/><rect x="528" y="190" width="18" height="77" class="bar"/>
  <rect x="554" y="190" width="18" height="77" class="bar"/><rect x="580" y="267" width="18" height="77" class="marked"/>
  <rect x="606" y="190" width="18" height="77" class="bar"/><rect x="632" y="190" width="18" height="77" class="bar"/>
  <path d="M444 209H656" class="mean"/>
  <text x="650" y="202" text-anchor="end" class="small">mean</text>
  <text x="550" y="382" text-anchor="middle" class="mono">O: a_w -> -a_w</text>

  <path d="M695 247H741" class="flow"/>
  <text x="718" y="223" text-anchor="middle" class="label">diffuse</text>
  <text x="718" y="272" text-anchor="middle" class="small">reflect</text>

  <rect x="756" y="82" width="296" height="330" rx="8" class="panel"/>
  <text x="778" y="113" class="head">3  Marked state grows</text>
  <text x="778" y="137" class="small">Every bar reflects about the mean</text>
  <path d="M780 316H1028" class="axis"/>
  <rect x="790" y="285" width="20" height="31" class="bar"/><rect x="820" y="285" width="20" height="31" class="bar"/>
  <rect x="850" y="285" width="20" height="31" class="bar"/><rect x="880" y="285" width="20" height="31" class="bar"/>
  <rect x="910" y="285" width="20" height="31" class="bar"/><rect x="940" y="164" width="20" height="152" class="amplified"/>
  <rect x="970" y="285" width="20" height="31" class="bar"/><rect x="1000" y="285" width="20" height="31" class="bar"/>
  <text x="950" y="340" text-anchor="middle" class="label">marked</text>
  <text x="904" y="382" text-anchor="middle" class="mono">D: a_i -> 2 mean(a) - a_i</text>

  <rect x="48" y="440" width="1004" height="164" rx="8" class="panel"/>
  <text x="72" y="473" class="head">The invariant two-dimensional plane</text>
  <path d="M152 574H416" class="axis"/><path d="M152 574V486" class="axis"/>
  <text x="424" y="580" class="small">|bad&gt;</text><text x="137" y="481" text-anchor="end" class="small">|good&gt;</text>
  <path d="M152 574L378 533" class="guide"/><path d="M152 574L338 489" class="curve"/>
  <path d="M374 533Q360 507 338 489" class="flow"/>
  <text x="369" y="523" class="small">2 theta</text>
  <text x="381" y="548" class="small">|s&gt;</text><text x="342" y="483" class="small">G|s&gt;</text>
  <text x="505" y="510" class="mono">sin^2(theta) = M / N</text>
  <text x="505" y="542" class="mono">p_k = sin^2((2k + 1) theta)</text>
  <text x="505" y="574" class="small">More iterations are not always better: after the peak, success probability falls.</text>
</svg>
