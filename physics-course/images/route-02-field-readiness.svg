<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc">
<title id="title">关联函数到振幅的四份计算账本</title><desc id="desc">先检查外腿与外态归一化，再用同一截断作减法，改变减法点时匹配耦合，最后保留内部交换极点并辨认接触项的自由。四站使用明确区分的教学模型，不拼成一个完整物理振幅。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#627682"/></marker></defs>
<rect width="720" height="510" rx="8" fill="#faf9f5"/>
<g font-family="system-ui,sans-serif" fill="#25394a">
<text x="28" y="38" font-size="24">每消去一项，都要说明保留了什么</text>
<g fill="#fff" stroke="#c9d1d8"><rect x="28" y="63" width="664" height="80" rx="8"/><rect x="28" y="163" width="664" height="80" rx="8"/><rect x="28" y="263" width="664" height="80" rx="8"/><rect x="28" y="363" width="664" height="80" rx="8"/></g>
<g font-size="18" font-weight="600" fill="#245f8d"><text x="48" y="91">1　外腿账本</text><text x="48" y="191">2　截断账本</text><text x="48" y="291">3　参数账本</text><text x="48" y="391">4　内部极点账本</text></g>
<g font-size="16"><text x="48" y="123">完整传播子截肢 → iM = Z² Γ_amp</text><text x="48" y="223">同一 Λ：BΛ(Q) − BΛ(Q₀) → BR</text><text x="48" y="323">换 Q₀ → 换 g；重新截到同一阶</text><text x="48" y="423">交换极点留数相同 ≠ 接触项相同</text></g>
<g font-size="15" fill="#8d3f2e"><text x="442" y="94">检查：留数是否重复乘？</text><text x="442" y="120">模平方还不是截面。</text><text x="442" y="194">检查：两项截断相同吗？</text><text x="442" y="220">错配可留下有限常数。</text><text x="442" y="294">检查：保留到几阶？</text><text x="442" y="320">高阶差不等于低阶矛盾。</text><text x="442" y="394">检查：只让一个通道奇异？</text><text x="442" y="420">有限局域项仍需额外输入。</text></g>
<g stroke="#627682" stroke-width="2" marker-end="url(#arr)"><path d="M82 146V158"/><path d="M82 246V258"/><path d="M82 346V358"/></g>
<rect x="28" y="461" width="664" height="33" rx="6" fill="#fff2cc"/>
<text x="360" y="483" text-anchor="middle" font-size="14">箭头表示训练顺序；有质量欧氏泡图与无质量树级模型须分别记账。</text>
</g></svg>