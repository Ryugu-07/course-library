<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">Ising 奇偶扇区与完整谱</title><desc id="desc">周期自旋链分成两个守恒奇偶扇区，Jordan–Wigner 字符串让两块采用不同费米子边界条件。完整谱必须合并两个扇区，不能直接取一条单准粒子能量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="25" fill="#25394a" text-anchor="start">周期自旋 ≠ 所有费米子都周期</text><rect x="170" y="65" width="260" height="55" rx="12" fill="white" stroke="#25394a" stroke-width="2"/><text x="300" y="101" font-size="23" fill="#25394a" text-anchor="middle">P = ∏ σᶻ，先分扇区</text><path d="M230 123L150 158" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M370 123L450 158" fill="none" stroke="#a64b35" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="25" y="160" width="260" height="106" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><rect x="315" y="160" width="260" height="106" rx="12" fill="white" stroke="#a64b35" stroke-width="2"/><text x="155" y="192" font-size="24" fill="#286fa7" text-anchor="middle">偶 P = +1</text><text x="155" y="224" font-size="19" fill="#286fa7" text-anchor="middle">反周期：k = (2m+1)π/L</text><text x="155" y="253" font-size="19" fill="#286fa7" text-anchor="middle">最低同扇区激发：两粒子</text><text x="445" y="192" font-size="24" fill="#a64b35" text-anchor="middle">奇 P = −1</text><text x="445" y="224" font-size="20" fill="#a64b35" text-anchor="middle">周期：k = 2mπ/L</text><text x="445" y="253" font-size="20" fill="#a64b35" text-anchor="middle">检查 0、π 模的占据</text><path d="M155 269L270 305" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M445 269L330 305" fill="none" stroke="#a64b35" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="300" y="337" font-size="24" fill="#25394a" text-anchor="middle">合并全部能级，再取 E₁ − E₀</text><text x="300" y="370" font-size="20" fill="#237d68" text-anchor="middle">保留简并重数；测量还需检查矩阵元。</text></g></svg>
