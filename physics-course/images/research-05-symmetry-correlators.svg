<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" role="img" aria-labelledby="title"><title id="title">旋转约束两方向涨落</title><rect width="440" height="460" fill="#faf8f1"/><g font-family="system-ui, sans-serif"><text x="220" y="35" text-anchor="middle" font-size="24" fill="#263448">旋转约束两方向涨落</text><text x="110" y="85" text-anchor="middle" font-size="20" fill="#263448">a = 0</text><text x="330" y="85" text-anchor="middle" font-size="20" fill="#263448">a = 1/2</text><path d="M20 196 H200 M110 100 V295" stroke="#cbd4de" stroke-width="1" fill="none" /><path d="M240 196 H420 M330 100 V295" stroke="#cbd4de" stroke-width="1" fill="none" /><circle cx="110" cy="196" r="65" fill="none" stroke="#497ec5" stroke-width="3"/><ellipse cx="330" cy="196" rx="53.0722777603022" ry="91.92388155425117" fill="none" stroke="#c65c3d" stroke-width="3"/><text x="110" y="315" text-anchor="middle" font-size="20" fill="#263448">Cx = Cy</text><text x="330" y="315" text-anchor="middle" font-size="20" fill="#263448">Cx &lt; Cy</text><text x="220" y="363" text-anchor="middle" font-size="20" fill="#263448">δO = x² − y²</text><text x="220" y="397" text-anchor="middle" font-size="20" fill="#263448">〈δO〉=〈O δS〉</text><text x="220" y="432" text-anchor="middle" font-size="20" fill="#263448">非圆形需要显式破缺项</text></g></svg>
