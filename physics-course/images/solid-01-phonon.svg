<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">双原子链真实声子色散</title><desc id="desc">近邻弹簧常数C，原胞长a，质量比m2/m1等于2。频率单位为根号C除m1。区中心声学支0、光学支根号3；区界分别为1和根号2。</desc><rect width="800" height="440" fill="#faf7ef"/><style>text{font-family:system-ui,sans-serif;font-size:14px;fill:#292722}.grid{stroke:#d7d0c2;stroke-width:1}.a{fill:none;stroke:#315f9d;stroke-width:3}.o{fill:none;stroke:#b64335;stroke-width:3}</style>
<text x="34" y="32" style="font-size:20px;font-weight:650">双原子链：两支来自同一个动力学矩阵</text>
<text x="34" y="58" >m₂/m₁=2；相邻弹簧均为 C；a 是含两个原子的原胞长</text>
