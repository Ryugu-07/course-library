<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc"><title id="title">从单条轨道到一束轨道的计数</title><desc id="desc">左图为默认排斥库仑轨道，最近接距离三点五四一飞米。右侧说明冲量参数通过散射角映射变为微分截面。</desc><rect width="820" height="360" rx="12" fill="#f7f4eb"/><g font-family="system-ui,sans-serif" fill="#252c35"><text x="25" y="35" font-size="21" font-weight="700">同一个映射，回答“往哪走”和“有多少”</text><g transform="translate(20 47) scale(1.25)"><path d="M 207.40 194.00 L 208.35 187.88 L 209.15 182.63 L 209.84 178.06 L 210.44 174.05 L 210.96 170.48 L 211.42 167.29 L 211.83 164.41 L 212.19 161.79 L 212.51 159.40 L 212.80 157.20 L 213.06 155.17 L 213.29 153.28 L 213.51 151.51 L 213.70 149.85 L 213.88 148.30 L 214.04 146.82 L 214.18 145.43 L 214.31 144.10 L 214.43 142.83 L 214.54 141.61 L 214.64 140.44 L 214.73 139.31 L 214.82 138.22 L 214.89 137.17 L 214.96 136.14 L 215.02 135.14 L 215.07 134.17 L 215.12 133.21 L 215.16 132.27 L 215.19 131.35 L 215.22 130.44 L 215.24 129.54 L 215.26 128.65 L 215.27 127.76 L 215.28 126.88 L 215.29 126.00 L 215.28 125.12 L 215.27 124.24 L 215.26 123.35 L 215.24 122.46 L 215.22 121.56 L 215.19 120.65 L 215.16 119.73 L 215.12 118.79 L 215.07 117.83 L 215.02 116.86 L 214.96 115.86 L 214.89 114.83 L 214.82 113.78 L 214.73 112.69 L 214.64 111.56 L 214.54 110.39 L 214.43 109.17 L 214.31 107.90 L 214.18 106.57 L 214.04 105.18 L 213.88 103.70 L 213.70 102.15 L 213.51 100.49 L 213.29 98.72 L 213.06 96.83 L 212.80 94.80 L 212.51 92.60 L 212.19 90.21 L 211.83 87.59 L 211.42 84.71 L 210.96 81.52 L 210.44 77.95 L 209.84 73.94 L 209.15 69.37 L 208.35 64.12 L 207.40 58.00" fill="none" stroke="#2367a1" stroke-width="2.5"/><path d="M245 126H215.285" stroke="#b64335" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="245" cy="126" r="5" fill="#9b6a12"/><circle cx="215.285" cy="126" r="4" fill="#b64335"/><text x="252" y="132" font-size="13">散射中心</text><text x="210.285" y="112" font-size="13" text-anchor="end">r_min = 3.541 fm</text><text x="36" y="215" font-size="13">轨道局部，x / y 使用同一比例</text></g><g transform="translate(445 85)" font-size="19"><text y="0">E = 2 MeV，κ = 2 MeV fm</text><text y="39" fill="#2367a1">b = 3 fm → χ = 18.925°</text><text y="78">b = a cot(χ/2)，a = κ/(2E)</text><text y="125">环带面积：2πb |db|</text><text y="161">立体角：2π sin χ |dχ|</text><text y="207" fill="#b64335">两者之比 → dσ/dΩ</text></g><text x="25" y="346" font-size="16">b 是远处入射直线到中心的垂直距离；图中的 r_min 是实际最近接距离，两者不同。</text></g></svg>