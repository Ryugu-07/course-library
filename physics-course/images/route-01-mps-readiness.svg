<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-labelledby="title desc"><title id="title">扫描可信之前，先分清三种操作</title><desc id="desc">表示、坐标、优化三项记录依次进入扫描报告；截断改变状态，规范变换保持状态，局部更新改变能量但不保证全局最优。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#576879"/></marker></defs><rect width="680" height="480" rx="12" fill="#faf9f5"/><g font-family="system-ui,sans-serif"><text x="28" y="40" font-size="25" fill="#25394a">扫描可信之前，先分清三种操作</text><path d="M340 155V187" fill="none" stroke="#576879" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 284V316" fill="none" stroke="#576879" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="65" width="560" height="90" rx="8" fill="#fff" stroke="#667f94"/><text x="76" y="93" font-size="18" font-weight="600" fill="#34596f">① 表示：Schmidt → 选择 χ → 截断</text><text x="76" y="119" font-size="15" fill="#25394a">记录 pᵢ = σᵢ² 与丢弃权重；归一化前后误差不同</text><rect x="60" y="194" width="560" height="90" rx="8" fill="#fff" stroke="#667f94"/><text x="76" y="222" font-size="18" font-weight="600" fill="#34596f">② 坐标：ψ = Wa → N = W†W → 正交化</text><text x="76" y="248" font-size="15" fill="#25394a">可逆换坐标保持物理态；普通本征题需 N = I</text><rect x="60" y="323" width="560" height="90" rx="8" fill="#fff" stroke="#667f94"/><text x="76" y="351" font-size="18" font-weight="600" fill="#34596f">③ 优化：更新 → 往返 → 比较不同初态</text><text x="76" y="377" font-size="15" fill="#25394a">记录完整能量和残差；只查一种扰动方向会漏掉下降方向</text><text x="340" y="455" text-anchor="middle" font-size="15" fill="#8d493b">表示容量、数值坐标与优化结果，应分别提供证据。</text></g></svg>