<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">有限脉冲的两条振幅路径</title><desc id="desc">余弦驱动分成正负频率分量，两条复振幅先相加，再求模平方，不能将两个概率先相加。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="25" fill="#25394a" text-anchor="start">先叠加振幅，再取模平方</text><rect x="25" y="80" width="260" height="95" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><rect x="315" y="80" width="260" height="95" rx="12" fill="white" stroke="#237d68" stroke-width="2"/><text x="155" y="119" font-size="24" fill="#286fa7" text-anchor="middle">G(ω₀−ω,T)</text><text x="155" y="152" font-size="21" fill="#286fa7" text-anchor="middle">近共振项</text><text x="445" y="119" font-size="24" fill="#237d68" text-anchor="middle">G(ω₀+ω,T)</text><text x="445" y="152" font-size="21" fill="#237d68" text-anchor="middle">反旋转项</text><path d="M155 178L280 227" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M445 178L320 227" fill="none" stroke="#237d68" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="300" y="270" font-size="25" fill="#25394a" text-anchor="middle">J = (G₋ + G₊) / 2</text><text x="300" y="315" font-size="24" fill="#a64b35" text-anchor="middle">P⁽²⁾ = a² |Oₘ₀|² |J|² / ℏ²</text><text x="25" y="360" font-size="20" fill="#25394a" text-anchor="start">短脉冲保留两项；P⁽²⁾ 不再小时检查微扰。</text></g></svg>
