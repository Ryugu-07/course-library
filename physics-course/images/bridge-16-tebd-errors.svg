<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-labelledby="title desc"><title id="title">复MPS的时间分裂与截断误差</title><desc id="desc">同一60度乘积初态分成精确演化、完整波函数Strang和实际复MPS三条路径。MPS每步先半步Z再逐键XX与SVD再半步Z，并无截断移回中心；与Strang的差由累计截断态距离控制，Strang与精确演化的差另由时间分裂界控制，浮点认证未包含。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#51616b"/></marker></defs>
<rect width="860" height="540" rx="10" fill="#f8f8f3"/><g font-family="system-ui,sans-serif" fill="#243746"><text x="28" y="38" font-size="25">同一初态，三条可逐时刻对照的路径</text><text x="28" y="66" font-size="15">实时间必须保留复相位；小链完整态只做参照，不参与MPS更新</text>
<rect x="28" y="91" width="804" height="51" rx="7" fill="#e8f1f5" stroke="#48798e"/><text x="430" y="123" text-anchor="middle" font-size="20">ψ₀：每站 cos(π/6)|0〉 + sin(π/6)|1〉</text>
<g stroke="#51616b" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M155 144V174"/><path d="M430 144V174"/><path d="M705 144V174"/></g>
<g fill="#edf2e1" stroke="#75834b"><rect x="28" y="180" width="254" height="100" rx="7"/><rect x="303" y="180" width="254" height="100" rx="7"/><rect x="578" y="180" width="254" height="100" rx="7"/></g>
<g text-anchor="middle"><g font-size="19"><text x="155" y="209">完整H的演化参照</text><text x="430" y="209">完整态Strang路径</text><text x="705" y="209">实际复MPS路径</text></g><g font-size="14"><text x="155" y="238">exp(−iTH) ψ₀</text><text x="155" y="263">小系统谱分解，仍含舍入</text><text x="430" y="238">Z半步 → XX → Z半步</text><text x="430" y="263">相同门序列，无SVD压缩</text><text x="705" y="238">每个XX门后真实SVD</text><text x="705" y="263">中心随门右移，再移回</text></g></g>
<rect x="28" y="306" width="804" height="82" rx="7" fill="#fff" stroke="#b7c4ca"/><text x="430" y="332" text-anchor="middle" font-size="18">局部门：cos(h) I + i sin(h) XX</text><text x="430" y="357" text-anchor="middle" font-size="15">正交块基 → 复SVD → 丢弃权重 ε → 归一化截断距离 δ</text><text x="430" y="379" text-anchor="middle" font-size="13">δ = sqrt[2ε / (1 + sqrt(1−ε))]；不是把 ε 直接当成态距离</text>
<rect x="28" y="408" width="384" height="86" rx="7" fill="#f7e9e2" stroke="#b46d43"/><rect x="440" y="408" width="392" height="86" rx="7" fill="#e8f1f5" stroke="#48798e"/>
<text x="47" y="433" font-size="18">分裂路径差：Strang vs H</text><text x="47" y="459" font-size="14">保守界 T h² (gL+L−1)³ / 3</text><text x="47" y="481" font-size="13">可能大到没有精度判别力；如实显示</text>
<text x="459" y="433" font-size="18">压缩路径差：MPS vs Strang</text><text x="459" y="459" font-size="14">精确酉门不放大旧误差 → 累加 Σδ</text><text x="459" y="481" font-size="13">Σε不是此界；浮点认证另行处理</text>
<text x="430" y="524" text-anchor="middle" font-size="14" fill="#805522">两项合成用三角不等式；能量近似守恒不等于动力学正确</text></g></svg>
