<title id="title">相同分支数，不同的长度极限</title><desc id="desc">标准Cantor与fat Cantor都每次将每个区间分成两段，但前者剩余长度趋零、后者趋于二分之一。下方点列是有限阶段的长度，极限由公式和测度连续性证明。</desc><rect width="960" height="680" fill="#fbfaf7"/><g font-family="system-ui,sans-serif" fill="#27313d" font-size="14">
