<title id="title">首次达到之后反射：终点事件与路径事件</title>
<desc id="desc">左图的人为折线在时间0.35首次达到阈值1；之后关于水平线1反射，终点从0.4变成1.6。右图显示标准布朗运动阈值1的终点尾概率及其两倍的最大值越界概率。</desc>
