<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
<title id="title">从单方面改进到概率空间中的 Nash 均衡</title>
<desc id="desc">左边囚徒困境四条箭头只改变一位玩家的动作，终点为双方背叛。右边协调博弈有两个角点均衡和精确三分之一的内点混合均衡。</desc>
<rect width="1100" height="850" fill="#f8fafc"/>
<style>text{font-family:Arial,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#172b45;font-size:17px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#2867a1" stroke-width="1.5"/></marker></defs>
<text x="40" y="47" text-anchor="start" style="font-size:27px;fill:#172b45">均衡检查的是“谁能独自改进”，不是“哪格总收益最大”</text>
<text x="40" y="85" text-anchor="start" style="font-size:17px;fill:#172b45">收益对先行后列；各自只比较自己的收益。p=P(R₀)，q=P(C₀)。</text>
<line x1="562" y1="125" x2="562" y2="745" stroke="#b9c9d9" stroke-width="1"/>
<text x="40" y="138" text-anchor="start" style="font-size:21px;fill:#172b45">A. 囚徒困境：沿箭头单方面改进</text>
<text x="218" y="192" text-anchor="middle" style="font-size:16px;fill:#172b45">C₀ 合作</text>
<text x="423" y="192" text-anchor="middle" style="font-size:16px;fill:#172b45">C₁ 背叛</text>
<text x="45" y="266" text-anchor="start" style="font-size:16px;fill:#172b45">R0</text>
<text x="45" y="294" text-anchor="start" style="font-size:16px;fill:#172b45">合作</text>
<rect x="145" y="210" width="146" height="130" rx="7" fill="#fff0d8" stroke="#b9c9d9" stroke-width="1"/>
<text x="218" y="261" text-anchor="middle" style="font-size:24px;fill:#172b45">(3, 3)</text>
<text x="218" y="298" text-anchor="middle" style="font-size:14px;fill:#172b45">收益和 6</text>
<metadata data-payoff="0,0" data-u="3" data-v="3"/>
<rect x="350" y="210" width="146" height="130" rx="7" fill="#e8eff7" stroke="#b9c9d9" stroke-width="1"/>
<text x="423" y="261" text-anchor="middle" style="font-size:24px;fill:#172b45">(0, 5)</text>
<text x="423" y="298" text-anchor="middle" style="font-size:14px;fill:#172b45">可单方面改进</text>
<metadata data-payoff="0,1" data-u="0" data-v="5"/>
<text x="45" y="486" text-anchor="start" style="font-size:16px;fill:#172b45">R1</text>
<text x="45" y="514" text-anchor="start" style="font-size:16px;fill:#172b45">背叛</text>
<rect x="145" y="430" width="146" height="130" rx="7" fill="#e8eff7" stroke="#b9c9d9" stroke-width="1"/>
<text x="218" y="481" text-anchor="middle" style="font-size:24px;fill:#172b45">(5, 0)</text>
<text x="218" y="518" text-anchor="middle" style="font-size:14px;fill:#172b45">可单方面改进</text>
<metadata data-payoff="1,0" data-u="5" data-v="0"/>
<rect x="350" y="430" width="146" height="130" rx="7" fill="#e7f1ed" stroke="#247e5d" stroke-width="3"/>
<text x="423" y="481" text-anchor="middle" style="font-size:24px;fill:#172b45">(1, 1)</text>
<text x="423" y="518" text-anchor="middle" style="font-size:14px;fill:#172b45">唯一纯均衡</text>
<metadata data-payoff="1,1" data-u="1" data-v="1"/>
<line x1="218" y1="353" x2="218" y2="414" stroke="#2867a1" stroke-width="3" marker-end="url(#arrow)"/>
<text x="228" y="389" text-anchor="start" style="font-size:14px;fill:#172b45">行 +2</text>
<line x1="423" y1="353" x2="423" y2="414" stroke="#2867a1" stroke-width="3" marker-end="url(#arrow)"/>
<text x="433" y="389" text-anchor="start" style="font-size:14px;fill:#172b45">行 +1</text>
<line x1="302" y1="275" x2="337" y2="275" stroke="#2867a1" stroke-width="3" marker-end="url(#arrow)"/>
<text x="320" y="261" text-anchor="middle" style="font-size:13px;fill:#172b45">列 +2</text>
<line x1="302" y1="495" x2="337" y2="495" stroke="#2867a1" stroke-width="3" marker-end="url(#arrow)"/>
<text x="320" y="481" text-anchor="middle" style="font-size:13px;fill:#172b45">列 +1</text>
<text x="45" y="615" text-anchor="start" style="font-size:16px;fill:#172b45">绿色格：(1,1)，两人都无法独自增加收益。</text>
<text x="45" y="653" text-anchor="start" style="font-size:16px;fill:#172b45">金色格：(3,3)，两人一起改变会更好。</text>
<text x="45" y="704" text-anchor="start" style="font-size:15px;fill:#172b45">箭头每次只改一个动作；不是时间演化模型。</text>
<text x="610" y="138" text-anchor="start" style="font-size:21px;fill:#172b45">B. 协调博弈：纯格之外还有内点</text>
<text x="610" y="174" text-anchor="start" style="font-size:16px;fill:#172b45">收益：(4,4)、(0,0)、(0,0)、(2,2)</text>
<line x1="670" y1="210" x2="670" y2="570" stroke="#b9c9d9" stroke-width="1"/>
<line x1="670" y1="570" x2="1030" y2="570" stroke="#b9c9d9" stroke-width="1"/>
<text x="670" y="599" text-anchor="middle" style="font-size:14px;fill:#172b45">0</text>
<text x="653" y="575" text-anchor="end" style="font-size:14px;fill:#172b45">0</text>
<line x1="790.0" y1="210" x2="790.0" y2="570" stroke="#b9c9d9" stroke-width="1"/>
<line x1="670" y1="450.0" x2="1030" y2="450.0" stroke="#b9c9d9" stroke-width="1"/>
<text x="790.0" y="599" text-anchor="middle" style="font-size:14px;fill:#172b45">1/3</text>
<text x="653" y="455.0" text-anchor="end" style="font-size:14px;fill:#172b45">1/3</text>
<line x1="910.0" y1="210" x2="910.0" y2="570" stroke="#b9c9d9" stroke-width="1"/>
<line x1="670" y1="330.0" x2="1030" y2="330.0" stroke="#b9c9d9" stroke-width="1"/>
<text x="910.0" y="599" text-anchor="middle" style="font-size:14px;fill:#172b45">2/3</text>
<text x="653" y="335.0" text-anchor="end" style="font-size:14px;fill:#172b45">2/3</text>
<line x1="1030" y1="210" x2="1030" y2="570" stroke="#b9c9d9" stroke-width="1"/>
<line x1="670" y1="210" x2="1030" y2="210" stroke="#b9c9d9" stroke-width="1"/>
<text x="1030" y="599" text-anchor="middle" style="font-size:14px;fill:#172b45">1</text>
<text x="653" y="215" text-anchor="end" style="font-size:14px;fill:#172b45">1</text>
<text x="1050" y="605" text-anchor="start" style="font-size:19px;fill:#172b45">p</text>
<text x="628" y="217" text-anchor="start" style="font-size:19px;fill:#172b45">q</text>
<circle cx="670" cy="570" r="7" fill="#247e5d" data-equilibrium="0,0"/>
<text x="690" y="550" text-anchor="start" style="font-size:15px;fill:#172b45">纯均衡 R₁C₁</text>
<circle cx="1030" cy="210" r="7" fill="#247e5d" data-equilibrium="1,1"/>
<text x="1013" y="241" text-anchor="end" style="font-size:15px;fill:#172b45">纯均衡 R₀C₀</text>
<circle cx="790.0" cy="450.0" r="7" fill="#247e5d" data-equilibrium="0.3333333333333333,0.3333333333333333"/>
<text x="807" y="441" text-anchor="start" style="font-size:16px;fill:#172b45">混合均衡</text>
<text x="807" y="468" text-anchor="start" style="font-size:16px;fill:#172b45">(1/3, 1/3)</text>
<text x="610" y="646" text-anchor="start" style="font-size:16px;fill:#172b45">内点处：4q = 2(1−q)，故 q=1/3。</text>
<text x="610" y="682" text-anchor="start" style="font-size:16px;fill:#172b45">列玩家同理给出 p=1/3；每人得 4/3。</text>
<text x="610" y="718" text-anchor="start" style="font-size:15px;fill:#172b45">坐标 0 表示确定选第二个动作，不是“不参加”。</text>
<line x1="40" y1="760" x2="1060" y2="760" stroke="#b9c9d9" stroke-width="1"/>
<text x="40" y="800" text-anchor="start" style="font-size:18px;fill:#172b45">学习顺序：读收益 → 固定对手找最佳回应 → 求全部交集 → 用单方面可增加收益复核。</text>
</svg>
