<text x="735" y="137" font-size="21" text-anchor="start" fill="#243344">搜索结果与验证账本</text>
<text x="735" y="178" font-size="18" text-anchor="start" fill="#243344">蓝实线：容量上限 728</text>
<text x="735" y="348" font-size="18" text-anchor="start" fill="#243344">紫虚线：容量上限 2184</text>
<text x="735" y="212" font-size="17" text-anchor="start" fill="#243344">训练 RMSE：0.2889 人</text>
<text x="735" y="246" font-size="17" text-anchor="start" fill="#243344">留出 RMSE：28.94 人</text>
<text x="735" y="280" font-size="17" text-anchor="start" fill="#243344">t=17 预测：687.44 人</text>
<text x="735" y="314" font-size="16" text-anchor="start" fill="#9b4a2c">最优候选触及容量上限</text>
<text x="735" y="382" font-size="17" text-anchor="start" fill="#243344">训练 RMSE：0.0084 人</text>
<text x="735" y="416" font-size="17" text-anchor="start" fill="#243344">留出 RMSE：113.13 人</text>
<text x="735" y="450" font-size="17" text-anchor="start" fill="#243344">t=17 预测：1576.96 人</text>
<text x="735" y="484" font-size="16" text-anchor="start" fill="#9b4a2c">最优候选触及容量上限</text>
<text x="80" y="563" font-size="18" text-anchor="start" fill="#243344">绿点：训练 3 点；金点：留出 7 点；t&gt;9 没有观测真值。</text>
<text x="80" y="600" font-size="18" text-anchor="start" fill="#243344">红虚线分训练与留出，灰虚线分观测与未来；搜索范围不是统计置信区间。</text>
<text x="80" y="633" font-size="16" text-anchor="start" fill="#52616e">数据为人为选定的教学例子；更小的训练误差不能单独证明容量被识别。</text>
