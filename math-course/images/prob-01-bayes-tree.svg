<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="Bayes Tree">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #444; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #c8d1dc; stroke-width: 2; rx: 8; }
      .soft { fill: #f8fafc; stroke: #d8e0e8; stroke-width: 2; rx: 8; }
      .accent { fill: #3f5ca6; stroke: #3f5ca6; }
      .line { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #777; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title">Bayes Tree</text>
<rect x="48" y="88" width="1004" height="486" fill="#e3e9f7" opacity="0.42" rx="18"/>
  <path d="M 550.0 170.0 L 355.0 240.0" stroke="#9aa6b2" stroke-width="2" fill="none"/>
  <path d="M 550.0 170.0 L 745.0 240.0" stroke="#9aa6b2" stroke-width="2" fill="none"/>
  <path d="M 355.0 300.0 L 250.0 395.0" stroke="#9aa6b2" stroke-width="2" fill="none"/>
  <path d="M 355.0 300.0 L 460.0 395.0" stroke="#9aa6b2" stroke-width="2" fill="none"/>
  <path d="M 745.0 300.0 L 640.0 395.0" stroke="#9aa6b2" stroke-width="2" fill="none"/>
  <path d="M 745.0 300.0 L 850.0 395.0" stroke="#9aa6b2" stroke-width="2" fill="none"/>
  <circle cx="550.0" cy="140.0" r="34.0" fill="#fff" stroke="#3f5ca6" stroke-width="2"/>
  <text x="550.0" y="140.0" class="label" text-anchor="middle" dominant-baseline="middle">Bayes</text>
  <circle cx="355.0" cy="270.0" r="34.0" fill="#fff" stroke="#c8d1dc" stroke-width="2"/>
  <text x="355.0" y="270.0" class="label" text-anchor="middle" dominant-baseline="middle">left</text>
  <circle cx="745.0" cy="270.0" r="34.0" fill="#fff" stroke="#c8d1dc" stroke-width="2"/>
  <text x="745.0" y="270.0" class="label" text-anchor="middle" dominant-baseline="middle">right</text>
  <circle cx="250.0" cy="425.0" r="34.0" fill="#fff" stroke="#c8d1dc" stroke-width="2"/>
  <text x="250.0" y="425.0" class="label" text-anchor="middle" dominant-baseline="middle">case A</text>
  <circle cx="460.0" cy="425.0" r="34.0" fill="#fff" stroke="#c8d1dc" stroke-width="2"/>
  <text x="460.0" y="425.0" class="label" text-anchor="middle" dominant-baseline="middle">case B</text>
  <circle cx="640.0" cy="425.0" r="34.0" fill="#fff" stroke="#c8d1dc" stroke-width="2"/>
  <text x="640.0" y="425.0" class="label" text-anchor="middle" dominant-baseline="middle">case C</text>
  <circle cx="850.0" cy="425.0" r="34.0" fill="#fff" stroke="#c8d1dc" stroke-width="2"/>
  <text x="850.0" y="425.0" class="label" text-anchor="middle" dominant-baseline="middle">case D</text>
</svg>
