<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Noisy channel and binary symmetric channel</title>
  <desc id="desc">A message is encoded into input X, passed through a noisy transition law p of y given x, and decoded from output Y. A binary symmetric channel shows direct transitions with probability one minus epsilon and flips with probability epsilon.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#44505d"/>
    </marker>
    <style>
      .title,.heading,.label,.small,.tiny{font-family:Arial}.title{font-size:28px;font-weight:700;fill:#18212b}.heading{font-size:18px;font-weight:700;fill:#18212b}.label{font-size:16px;font-weight:600;fill:#18212b}.small{font-size:14px;font-weight:500;fill:#44505d}.tiny{font-size:13px;font-weight:600;fill:#44505d}.noise{font-family:Arial;font-size:13px;font-weight:600;fill:#b64335}.panel{fill:#f7f9fb;stroke:#cbd5df;stroke-width:2}.box{fill:#fff;stroke:#315f9d;stroke-width:2}.channel{fill:#fff8e6;stroke:#9b6a12;stroke-width:2.4}.node{fill:#fff;stroke:#315f9d;stroke-width:2.3}.pipe{fill:none;stroke:#44505d;stroke-width:2.2;marker-end:url(#arrow)}.direct{fill:none;stroke:#39734d;stroke-width:3;marker-end:url(#arrow)}.flip{fill:none;stroke:#b64335;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="650" fill="#fff"/>
  <text x="48" y="48" class="title">Noisy channel: separate the input, law, and output</text>
  <rect x="48" y="76" width="1004" height="170" rx="8" class="panel"/>
  <text x="72" y="106" class="heading">Communication pipeline</text>
  <rect x="78" y="135" width="135" height="62" rx="6" class="box"/><text x="145" y="167" text-anchor="middle" dominant-baseline="middle" class="label">message</text>
  <path d="M213 166 H266" class="pipe"/>
  <rect x="274" y="135" width="135" height="62" rx="6" class="box"/><text x="341" y="158" text-anchor="middle" class="label">encoder</text><text x="341" y="181" text-anchor="middle" class="small">chooses X</text>
  <path d="M409 166 H462" class="pipe"/>
  <rect x="470" y="123" width="198" height="86" rx="6" class="channel"/><text x="569" y="155" text-anchor="middle" class="label">noisy channel</text><text x="569" y="183" text-anchor="middle" class="small">transition law p(y | x)</text>
  <path d="M668 166 H721" class="pipe"/>
  <rect x="729" y="135" width="135" height="62" rx="6" class="box"/><text x="796" y="158" text-anchor="middle" class="label">decoder</text><text x="796" y="181" text-anchor="middle" class="small">observes Y</text>
  <path d="M864 166 H917" class="pipe"/>
  <rect x="925" y="135" width="97" height="62" rx="6" class="box"/><text x="973" y="158" text-anchor="middle" class="label">estimate</text><text x="973" y="181" text-anchor="middle" class="small">message</text>
  <rect x="48" y="270" width="650" height="332" rx="8" class="panel"/>
  <text x="72" y="304" class="heading">Binary symmetric channel (BSC)</text>
  <text x="198" y="340" text-anchor="middle" class="tiny">INPUT X, q = P(X=1)</text><text x="548" y="340" text-anchor="middle" class="tiny">OUTPUT Y</text>
  <circle cx="198" cy="405" r="32" class="node"/><circle cx="198" cy="530" r="32" class="node"/><circle cx="548" cy="405" r="32" class="node"/><circle cx="548" cy="530" r="32" class="node"/>
  <text x="198" y="405" text-anchor="middle" dominant-baseline="middle" class="label">0</text><text x="198" y="530" text-anchor="middle" dominant-baseline="middle" class="label">1</text><text x="548" y="405" text-anchor="middle" dominant-baseline="middle" class="label">0</text><text x="548" y="530" text-anchor="middle" dominant-baseline="middle" class="label">1</text>
  <path d="M230 405 H508" class="direct"/><path d="M230 530 H508" class="direct"/><path d="M226 422 C330 450 416 486 516 516" class="flip"/><path d="M226 513 C330 485 416 449 516 419" class="flip"/>
  <rect x="323" y="380" width="92" height="24" rx="4" fill="#f7f9fb"/><text x="369" y="397" text-anchor="middle" class="tiny">1 - epsilon</text>
  <rect x="323" y="535" width="92" height="24" rx="4" fill="#f7f9fb"/><text x="369" y="552" text-anchor="middle" class="tiny">1 - epsilon</text>
  <text x="357" y="457" text-anchor="middle" class="noise">epsilon</text><text x="390" y="495" text-anchor="middle" class="noise">epsilon</text>
  <text x="72" y="581" class="small">Solid: transmitted unchanged. Dashed: bit flipped by noise.</text>
  <rect x="724" y="270" width="328" height="332" rx="8" class="panel"/>
  <text x="748" y="304" class="heading">Two separate optimizations</text>
  <text x="748" y="354" class="small">Current input performance</text><text x="748" y="386" class="label">I(X;Y) = H(Y) - h2(epsilon)</text>
  <line x1="748" y1="414" x2="1028" y2="414" stroke="#cbd5df" stroke-width="2"/>
  <text x="748" y="454" class="small">Channel capacity</text><text x="748" y="486" class="label">C = max_q I(X;Y)</text>
  <text x="748" y="548" class="small">For a BSC, q = 1/2 reaches</text><text x="748" y="577" class="label">C = 1 - h2(epsilon)</text>
</svg>
