<text x="505" y="379" font-size="16">I₄=(√3+√2+1)/4 ≈ 1.036566</text>
<text x="70" y="444" font-size="16">简单函数 s(x)=¼ Σⱼ₌₁⁴ 1_{f(x)≥j/4}，处处位于 f 下方。</text>
<text x="70" y="480" font-size="15">除最高点外，误差 f−s &lt; 1/4；在最高点误差为0，所以积分误差 ≤ 2/4。</text>
<text x="70" y="521" font-size="15">真实积分 ∫₀² x(2−x)dx = 4/3。把层高改成1/8、1/16，误差预算继续缩小。</text>
