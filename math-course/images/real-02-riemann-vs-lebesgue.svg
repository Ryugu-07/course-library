<title id="title">水平分层怎样成为简单函数积分</title><desc id="desc">函数f等于x乘2减x，定义域零到二。每层高四分之一，只在f至少为j除4的超水平集上计入该层。各层宽度依次为根号三、根号二、一、零，积分下和约为1.036566。</desc><rect width="960" height="570" fill="#fbfaf7"/><g font-family="system-ui,sans-serif" fill="#29313c" font-size="15">
<text x="35" y="36" font-size="22" font-weight="650">“按值域分层”怎样变成可复算的面积</text>
<text x="70" y="82" font-size="17">f(x)=x(2−x)，0≤x≤2</text>
