<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Bipartite matching reduced to a unit-capacity flow network</title>
  <desc id="desc">The source connects to every left vertex, bipartite edges point from the left set to the right set, and every right vertex connects to the sink. All capacities are one. Two green source-to-sink paths encode a matching of size two.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#667482"/></marker>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#39734d"/></marker>
    <style>
      .title,.heading,.label,.small,.tiny{font-family:Arial}.title{font-size:28px;font-weight:700;fill:#18212b}.heading{font-size:18px;font-weight:700;fill:#18212b}.label{font-size:16px;font-weight:700;fill:#18212b}.small{font-size:14px;font-weight:500;fill:#44505d}.tiny{font-size:13px;font-weight:600;fill:#44505d}.panel{fill:#f7f9fb;stroke:#cbd5df;stroke-width:2}.source{fill:#fff8e6;stroke:#9b6a12;stroke-width:2.5}.left{fill:#e7f0fb;stroke:#315f9d;stroke-width:2.5}.right{fill:#e8f5ec;stroke:#39734d;stroke-width:2.5}.edge{fill:none;stroke:#667482;stroke-width:2.2;marker-end:url(#arrow)}.flow{fill:none;stroke:#39734d;stroke-width:5;marker-end:url(#arrow-flow)}
    </style>
  </defs>
  <rect width="1100" height="650" fill="#fff"/>
  <text x="48" y="48" class="title">Bipartite matching = integer flow through unit capacities</text>
  <rect x="48" y="76" width="1004" height="526" rx="8" class="panel"/>
  <text x="90" y="115" class="heading">Every directed edge has capacity c = 1</text>
  <text x="330" y="152" text-anchor="middle" class="small">LEFT SET X</text><text x="650" y="152" text-anchor="middle" class="small">RIGHT SET Y</text>

  <path id="edge-s-L1" d="M158 325 L300 222" class="flow"/><path id="edge-s-L2" d="M158 325 L300 428" class="flow"/>
  <path id="edge-L1-R1" d="M360 220 H620" class="flow"/><path id="edge-L1-R2" d="M360 226 C455 270 520 330 622 414" class="edge"/>
  <path id="edge-L2-R1" d="M360 414 C455 330 520 270 622 226" class="edge"/><path id="edge-L2-R2" d="M360 430 H620" class="flow"/>
  <path id="edge-R1-t" d="M680 220 L872 314" class="flow"/><path id="edge-R2-t" d="M680 430 L872 336" class="flow"/>

  <circle cx="130" cy="325" r="30" class="source"/><circle cx="330" cy="220" r="30" class="left"/><circle cx="330" cy="430" r="30" class="left"/><circle cx="650" cy="220" r="30" class="right"/><circle cx="650" cy="430" r="30" class="right"/><circle cx="900" cy="325" r="30" class="source"/>
  <text x="130" y="325" text-anchor="middle" dominant-baseline="middle" class="label">s</text><text x="330" y="220" text-anchor="middle" dominant-baseline="middle" class="label">L1</text><text x="330" y="430" text-anchor="middle" dominant-baseline="middle" class="label">L2</text><text x="650" y="220" text-anchor="middle" dominant-baseline="middle" class="label">R1</text><text x="650" y="430" text-anchor="middle" dominant-baseline="middle" class="label">R2</text><text x="900" y="325" text-anchor="middle" dominant-baseline="middle" class="label">t</text>
  <text x="130" y="375" text-anchor="middle" class="small">source</text><text x="900" y="375" text-anchor="middle" class="small">sink</text>

  <line x1="90" y1="520" x2="150" y2="520" class="flow"/><text x="170" y="525" class="small">flow 1: matched edges L1-R1 and L2-R2</text>
  <line x1="90" y1="558" x2="150" y2="558" class="edge"/><text x="170" y="563" class="small">unused legal bipartite edge</text>
  <rect x="724" y="500" width="272" height="70" rx="6" fill="#fff" stroke="#39734d" stroke-width="2"/>
  <text x="860" y="528" text-anchor="middle" class="small">flow value = 2</text><text x="860" y="554" text-anchor="middle" class="label">matching size = 2</text>
</svg>
