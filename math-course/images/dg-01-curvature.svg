<text x="343" y="509.0" class="small" text-anchor="start">C</text>
<line x1="330" y1="660" x2="425.2" y2="660" stroke="#203447" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="330" y1="660" x2="330" y2="564.8" stroke="#203447" stroke-width="2" marker-end="url(#arrow)"/>
<text x="433.2" y="648" class="small" text-anchor="start">T</text>
<text x="344" y="564.8" class="small" text-anchor="start">N</text>
<text x="76" y="246" class="small" text-anchor="start">蓝：y=x²</text>
<text x="76" y="277" class="small" text-anchor="start">金：x²+(y−1/2)²=1/4</text>
<text x="370" y="558" class="small" text-anchor="start">R=1/2</text>
<text x="650" y="163" class="label" text-anchor="start">二阶接触怎样核对？</text>
<text x="650" y="208" class="small" text-anchor="start">圆的下半支：c(x)=1/2−√(1/4−x²)</text>
<text x="650" y="268" class="small" text-anchor="start">值</text>
<text x="746" y="268" class="small" text-anchor="start">f(0)=0</text>
<text x="932" y="268" class="small" text-anchor="start">c(0)=0</text>
<text x="650" y="318" class="small" text-anchor="start">一阶</text>
<text x="746" y="318" class="small" text-anchor="start">f′(0)=0</text>
<text x="932" y="318" class="small" text-anchor="start">c′(0)=0</text>
<text x="650" y="368" class="small" text-anchor="start">二阶</text>
<text x="746" y="368" class="small" text-anchor="start">f″(0)=2</text>
<text x="932" y="368" class="small" text-anchor="start">c″(0)=2</text>
<text x="650" y="442" class="label" text-anchor="start">c(x)=x²+x⁴+O(x⁶)</text>
<text x="650" y="480" class="small" text-anchor="start">二阶相同，不表示在一段区间上相等。</text>
<text x="650" y="535" class="small" text-anchor="start">x</text>
<text x="752" y="535" class="small" text-anchor="start">抛物线 x²</text>
<text x="934" y="535" class="small" text-anchor="start">圆下半支 c(x)</text>
<text x="650" y="575" class="small" text-anchor="start">0.1</text>
<text x="752" y="575" class="small" text-anchor="start">0.010000</text>
<text x="934" y="575" class="small" text-anchor="start">0.010102</text>
<text x="650" y="614" class="small" text-anchor="start">0.2</text>
<text x="752" y="614" class="small" text-anchor="start">0.040000</text>
<text x="934" y="614" class="small" text-anchor="start">0.041742</text>
<text x="650" y="653" class="small" text-anchor="start">0.3</text>
<text x="752" y="653" class="small" text-anchor="start">0.090000</text>
<text x="934" y="653" class="small" text-anchor="start">0.100000</text>
<text x="30" y="778" class="small" text-anchor="start">圆心沿主法向移动 R；半径取正。若 κ=0，不能用 R=1/κ 制造一个有限密切圆。</text>
<text x="30" y="817" class="small" text-anchor="start">这里因抛物线与圆的对称性，三阶项也相同，差别从四阶开始；一般密切圆只要求二阶吻合。</text>
<text x="30" y="856" class="small" text-anchor="start">密切圆描述一点附近的几何，不是把整段曲线拟合成一个圆。</text>
</svg>
