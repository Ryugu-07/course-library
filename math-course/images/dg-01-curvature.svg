<text x="30" y="47" class="title" text-anchor="start">密切圆：同一点、同一切向、同样的二阶弯曲</text>
<text x="30" y="88" class="small" text-anchor="start">抛物线 y=x² 在 O=(0,0) 处：κ=2，R=1/κ=1/2，C=O+RN=(0,1/2)。</text>
