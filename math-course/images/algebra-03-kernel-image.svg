<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">核在输入空间，像在输出空间</title><desc id="desc">投影P经过左下剪切l等于二分之一和右上剪切r等于负二分之一，秩保持一，核由竖直方向转到二分之一、一，像由水平方向转到一、二分之一。</desc><rect width="800" height="440" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#172554"><text x="24" y="30" font-size="21" font-weight="700">左右乘保秩，但核与像的方向可以改变</text><text x="24" y="57" font-size="15">P=diag(1,0)，l=1/2，r=−1/2；橙虚线：原来的子空间，紫实线：变换后</text><text x="24" y="89" font-size="18" font-weight="700">定义域：核方向由 R⁻¹ 拉回</text><text x="124" y="361.0" text-anchor="middle" font-size="14">-1</text><text x="73.0" y="307" text-anchor="end" font-size="14">-1</text><text x="200" y="361.0" text-anchor="middle" font-size="14">0</text><text x="73.0" y="231" text-anchor="end" font-size="14">0</text><text x="276" y="361.0" text-anchor="middle" font-size="14">1</text><text x="73.0" y="155" text-anchor="end" font-size="14">1</text><path d="M86.0 226H314.0M200 340.0V112.0" stroke="#64748b" fill="none"/><path d="M200 340.0L200 112.0" stroke="#b45309" stroke-width="3" stroke-dasharray="5 4"/><path d="M143.0 340.0L257.0 112.0" stroke="#7c3aed" stroke-width="3" stroke-dasharray="none"/><circle cx="238.0" cy="150" r="5" fill="#7c3aed"/><text x="24" y="392" font-size="16">ker P=span{(0,1)} → span{(1/2,1)}</text><text x="424" y="89" font-size="18" font-weight="700">陪域：像方向由 L 推动</text><text x="524" y="361.0" text-anchor="middle" font-size="14">-1</text><text x="473.0" y="307" text-anchor="end" font-size="14">-1</text><text x="600" y="361.0" text-anchor="middle" font-size="14">0</text><text x="473.0" y="231" text-anchor="end" font-size="14">0</text><text x="676" y="361.0" text-anchor="middle" font-size="14">1</text><text x="473.0" y="155" text-anchor="end" font-size="14">1</text><path d="M486.0 226H714.0M600 340.0V112.0" stroke="#64748b" fill="none"/><path d="M486.0 226L714.0 226" stroke="#b45309" stroke-width="3" stroke-dasharray="5 4"/><path d="M486.0 283.0L714.0 169.0" stroke="#7c3aed" stroke-width="3" stroke-dasharray="none"/><circle cx="676" cy="188.0" r="5" fill="#7c3aed"/><text x="424" y="392" font-size="16">Im P=span{(1,0)} → span{(1,1/2)}</text><text x="24" y="426" font-size="15">两边维数都未改变：核维数 1，像维数 1；它们分别属于输入和输出空间。</text><text x="324" y="232" font-family="system-ui" font-size="14">x₁</text><text x="210" y="107" font-family="system-ui" font-size="14">x₂</text><text x="724" y="232" font-family="system-ui" font-size="14">y₁</text><text x="610" y="107" font-family="system-ui" font-size="14">y₂</text></g></svg>