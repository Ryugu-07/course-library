<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc">
<title id="title">信息账本的三种读法</title><desc id="desc">上面用相同线性刻度比较默认信道互信息；中间用对数刻度显示近随机信道的极小非零信息；下面用独立噪声说明充分压缩不必恢复原始数据。</desc>
<rect width="1100" height="830" fill="#faf8f3"/><g font-family="Arial, PingFang SC, sans-serif" fill="#243344">
<text x="35" y="42" font-size="26" fill="#243344" text-anchor="start">信息保留多少？先确认对象与刻度</text>
<text x="65" y="92" font-size="21" fill="#243344" text-anchor="start">1. 默认信道：η=0.1，ρ=0.2，总翻转概率 τ=0.26</text>
<text x="65" y="150" font-size="18" fill="#243344" text-anchor="start">I(X;Y)</text>
<rect data-default="0" data-value="0.53100440641071878" x="200" y="127" width="318.60264384643125" height="31" fill="#315f9d"/>
<text x="533.6026438464312" y="150" font-size="18" fill="#315f9d" text-anchor="start">0.531004 bit</text>
<text x="65" y="222" font-size="18" fill="#243344" text-anchor="start">I(X;Z)</text>
<rect data-default="1" data-value="0.1732536275073821" x="200" y="199" width="103.95217650442926" height="31" fill="#986717"/>
<text x="318.95217650442925" y="222" font-size="18" fill="#986717" text-anchor="start">0.173254 bit</text>
<line x1="200" y1="255" x2="800" y2="255" stroke="#bdc7ce"/>
<line x1="200" y1="249" x2="200" y2="261" stroke="#bdc7ce"/>
<text x="200" y="282" font-size="15" fill="#243344" text-anchor="middle">0</text>
<line x1="350.0" y1="249" x2="350.0" y2="261" stroke="#bdc7ce"/>
<text x="350.0" y="282" font-size="15" fill="#243344" text-anchor="middle">0.25</text>
<line x1="500.0" y1="249" x2="500.0" y2="261" stroke="#bdc7ce"/>
<text x="500.0" y="282" font-size="15" fill="#243344" text-anchor="middle">0.5</text>
<line x1="650.0" y1="249" x2="650.0" y2="261" stroke="#bdc7ce"/>
<text x="650.0" y="282" font-size="15" fill="#243344" text-anchor="middle">0.75</text>
<line x1="800" y1="249" x2="800" y2="261" stroke="#bdc7ce"/>
<text x="800" y="282" font-size="15" fill="#243344" text-anchor="middle">1</text>
<text x="950" y="282" font-size="16" fill="#243344" text-anchor="end">线性刻度（bits）</text>
<line x1="35" y1="308" x2="1065" y2="308" stroke="#bdc7ce"/>
<text x="65" y="350" font-size="21" fill="#243344" text-anchor="start">2. 近随机信道：η=ρ=0.4999，信息仍非零</text>
<text x="65" y="386" font-size="17" fill="#243344" text-anchor="start">偏差从 2×10⁻⁴ 变为 4×10⁻⁸；互信息在小偏差时近似与偏差平方成正比。</text>
<line x1="200.0" y1="426" x2="200.0" y2="515" stroke="#bdc7ce"/>
<text x="200.0" y="541" font-size="15" fill="#243344" text-anchor="middle">10^-16</text>
<line x1="362.5" y1="426" x2="362.5" y2="515" stroke="#bdc7ce"/>
<text x="362.5" y="541" font-size="15" fill="#243344" text-anchor="middle">10^-12</text>
<line x1="525.0" y1="426" x2="525.0" y2="515" stroke="#bdc7ce"/>
<text x="525.0" y="541" font-size="15" fill="#243344" text-anchor="middle">10^-8</text>
<line x1="687.5" y1="426" x2="687.5" y2="515" stroke="#bdc7ce"/>
<text x="687.5" y="541" font-size="15" fill="#243344" text-anchor="middle">10^-4</text>
<line x1="850.0" y1="426" x2="850.0" y2="515" stroke="#bdc7ce"/>
<text x="850.0" y="541" font-size="15" fill="#243344" text-anchor="middle">10^0</text>
<circle data-rare="0" data-value="2.885390101013861e-08" cx="543.69580933651196" cy="446" r="7" fill="#315f9d"/>
<text x="65" y="451" font-size="18" fill="#315f9d" text-anchor="start">I(X;Y)</text>
<text x="558.695809336512" y="451" font-size="17" fill="#315f9d" text-anchor="start">2.885390e-08 bit</text>
<circle data-rare="1" data-value="1.1541560327111711e-15" cx="243.15449636658894" cy="493" r="7" fill="#986717"/>
<text x="65" y="498" font-size="18" fill="#986717" text-anchor="start">I(X;Z)</text>
<text x="258.15449636658894" y="498" font-size="17" fill="#986717" text-anchor="start">1.154156e-15 bit</text>
<text x="1020" y="577" font-size="16" fill="#243344" text-anchor="end">对数刻度（bits）；零没有有限的对数坐标</text>
<line x1="35" y1="602" x2="1065" y2="602" stroke="#bdc7ce"/>
<text x="65" y="643" font-size="21" fill="#243344" text-anchor="start">3. 充分压缩：Y=(X,W) → Z=X，X 与 W 是独立均匀比特</text>
<text x="65" y="688" font-size="19" fill="#243344" text-anchor="start">原始观测有两个比特：目标 X + 无关噪声 W</text>
<text x="65" y="730" font-size="23" fill="#315f9d" text-anchor="start">I(X;Y)=1 bit  →  I(X;Z)=1 bit</text>
<text x="65" y="776" font-size="19" fill="#243344" text-anchor="start">H(Y|Z)=1 bit：无法恢复 W，但关于 X 的信息全部保留。</text>
</g></svg>
