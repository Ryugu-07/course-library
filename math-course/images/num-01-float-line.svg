<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="float-title float-desc">
<title id="float-title">浮点间距随数值尺度变化</title>
<desc id="float-desc">三位二进制有效精度的正正常数，1到2间距0.25，2到4间距0.5。下方面板显示binary64在1左右间距1比2，并标注正中取偶。</desc>
<rect width="1100" height="720" fill="#faf8f0"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,sans-serif;fill:#20364b}.title{font-size:26px;font-weight:700}.label{font-size:18px}.small{font-size:15px}</style>
<text x="35" y="48" class="title" text-anchor="start">浮点数不是均匀铺满数轴的实数</text>
<text x="35" y="84" class="small" text-anchor="start">上：三位二进制有效精度 p=3 的简化正常数模型；点的位置按实际数值计算。</text>
<rect x="130" y="120" width="270" height="125" fill="#3c64a4" fill-opacity=".07"/>
<rect x="400" y="120" width="540" height="125" fill="#ad762b" fill-opacity=".07"/>
<line x1="95" y1="190" x2="995" y2="190" stroke="#58758e" stroke-width="2" />
<circle data-float-value="1.0" cx="130.0" cy="190" r="6" fill="#3c64a4"/>
<text x="130.0" y="224" class="label" text-anchor="middle">1</text>
<circle data-float-value="1.25" cx="197.5" cy="190" r="6" fill="#3c64a4"/>
<text x="197.5" y="224" class="label" text-anchor="middle">1.25</text>
<circle data-float-value="1.5" cx="265.0" cy="190" r="6" fill="#3c64a4"/>
<text x="265.0" y="224" class="label" text-anchor="middle">1.5</text>
<circle data-float-value="1.75" cx="332.5" cy="190" r="6" fill="#3c64a4"/>
<text x="332.5" y="224" class="label" text-anchor="middle">1.75</text>
<circle data-float-value="2.0" cx="400.0" cy="190" r="6" fill="#3c64a4"/>
<text x="400.0" y="224" class="label" text-anchor="middle">2</text>
<circle data-float-value="2.5" cx="535.0" cy="190" r="6" fill="#3c64a4"/>
<text x="535.0" y="224" class="label" text-anchor="middle">2.5</text>
<circle data-float-value="3.0" cx="670.0" cy="190" r="6" fill="#3c64a4"/>
<text x="670.0" y="224" class="label" text-anchor="middle">3</text>
<circle data-float-value="3.5" cx="805.0" cy="190" r="6" fill="#3c64a4"/>
<text x="805.0" y="224" class="label" text-anchor="middle">3.5</text>
<circle data-float-value="4.0" cx="940.0" cy="190" r="6" fill="#3c64a4"/>
<text x="940.0" y="224" class="label" text-anchor="middle">4</text>
<text x="265" y="148" class="label" text-anchor="middle">[1, 2)：间距 1/4</text>
<text x="670" y="148" class="label" text-anchor="middle">[2, 4)：间距 1/2</text>
<line x1="163.75" y1="265" x2="163.75" y2="195" stroke="#b44435" stroke-width="2" stroke-dasharray="4 3"/>
<text x="35" y="290" class="small" text-anchor="start">1.125 恰在 1 与 1.25 的正中；保留 3 位尾数时，正中取偶选 1.00₂ = 1。</text>
<text x="35" y="321" class="small" text-anchor="start">“偶”指保留尾数的最低二进制位为 0，不是十进制数值为偶数。</text>
<line x1="35" y1="350" x2="1065" y2="350" stroke="#d2cbb8" stroke-width="1" />
<text x="35" y="393" class="label" text-anchor="start">下：binary64 在 1 附近单独放大</text>
<text x="35" y="425" class="small" text-anchor="start">横轴以 1 为中心，单位为 2⁻⁵³；仍按相同单位等比例定位。</text>
<line x1="235" y1="494" x2="960" y2="494" stroke="#58758e" stroke-width="2" />
<circle data-binary-offset="-1" cx="360" cy="494" r="7" fill="#3c64a4"/>
<text x="360" y="529" class="label" text-anchor="middle">1 − 2⁻⁵³</text>
<circle data-binary-offset="0" cx="480" cy="494" r="7" fill="#3c64a4"/>
<text x="480" y="529" class="label" text-anchor="middle">1</text>
<circle data-binary-offset="2" cx="720" cy="494" r="7" fill="#3c64a4"/>
<text x="720" y="529" class="label" text-anchor="middle">1 + 2⁻⁵²</text>
<line x1="360" y1="465" x2="480" y2="465" stroke="#3c64a4" stroke-width="2" />
<line x1="480" y1="465" x2="720" y2="465" stroke="#ad762b" stroke-width="2" />
<text x="420" y="452" class="small" text-anchor="middle">2⁻⁵³</text>
<text x="600" y="452" class="small" text-anchor="middle">2⁻⁵²</text>
<text x="35" y="578" class="small" text-anchor="start">εmach = 2⁻⁵²：1 到右邻点的距离。u = 2⁻⁵³：最近舍入的标准相对误差界。</text>
<text x="35" y="616" class="small" text-anchor="start">标准相对模型需要无溢出、正常数等条件；非正常数以固定间距逐渐靠近 0。</text>
<text x="35" y="655" class="small" text-anchor="start">上图是便于数清点的 p=3 模型；下图才是 binary64。两图不共用缩放尺度。</text>
</svg>
