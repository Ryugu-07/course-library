<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
<title id="title">三种 Markov 链：正概率转移、互通类与初态</title>
<desc id="desc">三行依次为二状态非周期链、二状态互换链和三状态吸收链。箭头标记真实一步概率，右侧给出相同矩阵的精确分布公式。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#315f9d"/></marker></defs>
<rect width="1100" height="820" fill="#faf8f3"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#243344">
<text x="36" y="38" font-size="25" fill="#243344" text-anchor="start">相同的矩阵，逐项核对结构与长期行为</text>
<text x="36" y="68" font-size="17" fill="#52616e" text-anchor="start">状态编号从 0 开始；蓝箭头标出全部正概率转移；绿色外框标出闭类。</text>
<line x1="32" y1="90" x2="1068" y2="90" stroke="#ccd2d6"/>
<line x1="32" y1="323" x2="1068" y2="323" stroke="#ccd2d6"/>
<line x1="32" y1="544" x2="1068" y2="544" stroke="#ccd2d6"/>
<g data-preset="mixing">
<text x="36" y="122" font-size="20" fill="#243344" text-anchor="start">A · 不可约，非周期</text>
<rect x="68" y="143" width="344" height="124" rx="48" fill="none" stroke="#39734d" stroke-width="2"/>
<circle cx="150" cy="204" r="28" fill="#fff" stroke="#315f9d" stroke-width="2"/>
<text x="150" y="211" font-size="22" fill="#243344" text-anchor="middle">0</text>
<circle cx="330" cy="204" r="28" fill="#fff" stroke="#315f9d" stroke-width="2"/>
<text x="330" y="211" font-size="22" fill="#243344" text-anchor="middle">1</text>
<path d="M178 191 Q240 151 301 191" fill="none" stroke="#315f9d" stroke-width="2.5" marker-end="url(#arrow)" data-from="0" data-to="1" data-probability="0.2"/>
<text x="240" y="161" font-size="18" fill="#315f9d" text-anchor="middle">0.2</text>
<path d="M302 218 Q240 258 179 218" fill="none" stroke="#315f9d" stroke-width="2.5" marker-end="url(#arrow)" data-from="1" data-to="0" data-probability="0.3"/>
<text x="240" y="256" font-size="18" fill="#315f9d" text-anchor="middle">0.3</text>
<path d="M129 185 C72 115 67 271 126 226" fill="none" stroke="#315f9d" stroke-width="2.5" marker-end="url(#arrow)" data-from="0" data-to="0" data-probability="0.8"/>
<text x="78" y="206" font-size="18" fill="#315f9d" text-anchor="middle">0.8</text>
<path d="M351 225 C412 285 414 118 354 183" fill="none" stroke="#315f9d" stroke-width="2.5" marker-end="url(#arrow)" data-from="1" data-to="1" data-probability="0.7"/>
<text x="402" y="206" font-size="18" fill="#315f9d" text-anchor="middle">0.7</text>
<text x="36" y="298" font-size="17" fill="#39734d" text-anchor="start">一个闭互通类 {0,1}；自环 ⇒ d=1</text>
<text x="480" y="155" font-size="20" fill="#243344" text-anchor="start">π = (0.6, 0.4)；特征值 1 与 0.5</text>
<text x="480" y="191" font-size="18" fill="#243344" text-anchor="start">δ₀ Pⁿ = (0.6 + 0.4·2⁻ⁿ, 0.4 − 0.4·2⁻ⁿ)</text>
<text x="480" y="226" font-size="18" fill="#243344" text-anchor="start">TV：从 δ₀ 出发为 0.4·2⁻ⁿ；从 δ₁ 为 0.6·2⁻ⁿ</text>
<text x="480" y="261" font-size="18" fill="#243344" text-anchor="start">从 π 出发：每一步都仍是 π，TV = 0</text>
<text x="480" y="295" font-size="17" fill="#52616e" text-anchor="start">有限 + 不可约 + 非周期 ⇒ 任意初态趋向唯一 π</text>
</g><g data-preset="periodic">
<text x="36" y="354" font-size="20" fill="#243344" text-anchor="start">B · 不可约，周期为 2</text>
<rect x="80" y="375" width="320" height="108" rx="46" fill="none" stroke="#39734d" stroke-width="2"/>
<circle cx="150" cy="430" r="28" fill="#fff" stroke="#315f9d" stroke-width="2"/>
<text x="150" y="437" font-size="22" fill="#243344" text-anchor="middle">0</text>
<circle cx="330" cy="430" r="28" fill="#fff" stroke="#315f9d" stroke-width="2"/>
<text x="330" y="437" font-size="22" fill="#243344" text-anchor="middle">1</text>
<path d="M178 417 Q240 377 301 417" fill="none" stroke="#315f9d" stroke-width="2.5" marker-end="url(#arrow)" data-from="0" data-to="1" data-probability="1"/>
<text x="240" y="387" font-size="18" fill="#315f9d" text-anchor="middle">1</text>
<path d="M302 444 Q240 484 179 444" fill="none" stroke="#315f9d" stroke-width="2.5" marker-end="url(#arrow)" data-from="1" data-to="0" data-probability="1"/>
<text x="240" y="482" font-size="18" fill="#315f9d" text-anchor="middle">1</text>
<text x="36" y="520" font-size="17" fill="#39734d" text-anchor="start">一个闭互通类；只能在偶数正步数返回</text>
<text x="480" y="389" font-size="20" fill="#243344" text-anchor="start">π = (1/2, 1/2)；特征值 1 与 −1</text>
<text x="480" y="425" font-size="18" fill="#243344" text-anchor="start">δ₀ P²ᵏ = δ₀；δ₀ P²ᵏ⁺¹ = δ₁</text>
<text x="480" y="460" font-size="18" fill="#243344" text-anchor="start">从点质量出发 TV = 1/2，一直不衰减</text>
<text x="480" y="495" font-size="18" fill="#243344" text-anchor="start">从 π 出发仍然平稳；周期不等于所有初态都振荡</text>
<text x="480" y="525" font-size="17" fill="#52616e" text-anchor="start">前 M 步分布的 Cesàro 平均仍趋向 π</text>
</g><g data-preset="reducible">
<text x="36" y="575" font-size="20" fill="#243344" text-anchor="start">C · 可约，两个吸收闭类</text>
<circle cx="140" cy="656" r="34" fill="none" stroke="#39734d" stroke-width="2"/>
<circle cx="140" cy="656" r="28" fill="#fff" stroke="#315f9d" stroke-width="2"/>
<text x="140" y="663" font-size="22" fill="#243344" text-anchor="middle">0</text>
<circle cx="340" cy="656" r="34" fill="none" stroke="#39734d" stroke-width="2"/>
<circle cx="340" cy="656" r="28" fill="#fff" stroke="#315f9d" stroke-width="2"/>
<text x="340" y="663" font-size="22" fill="#243344" text-anchor="middle">1</text>
<circle cx="240" cy="752" r="28" fill="#fff" stroke="#315f9d" stroke-width="2"/>
<text x="240" y="759" font-size="22" fill="#243344" text-anchor="middle">2</text>
<path d="M119 637 C56 570 57 722 116 678" fill="none" stroke="#315f9d" stroke-width="2.5" marker-end="url(#arrow)" data-from="0" data-to="0" data-probability="1"/>
<text x="66" y="655" font-size="18" fill="#315f9d" text-anchor="middle">1</text>
<path d="M361 677 C424 741 426 571 364 635" fill="none" stroke="#315f9d" stroke-width="2.5" marker-end="url(#arrow)" data-from="1" data-to="1" data-probability="1"/>
<text x="413" y="655" font-size="18" fill="#315f9d" text-anchor="middle">1</text>
<path d="M219 733 L164 679" fill="none" stroke="#315f9d" stroke-width="2.5" marker-end="url(#arrow)" data-from="2" data-to="0" data-probability="0.5"/>
<text x="179" y="718" font-size="18" fill="#315f9d" text-anchor="middle">1/2</text>
<path d="M261 733 L316 679" fill="none" stroke="#315f9d" stroke-width="2.5" marker-end="url(#arrow)" data-from="2" data-to="1" data-probability="0.5"/>
<text x="303" y="718" font-size="18" fill="#315f9d" text-anchor="middle">1/2</text>
<text x="36" y="801" font-size="17" fill="#39734d" text-anchor="start">{0}、{1}：正常返；{2}：瞬过，无正时间返回</text>
<text x="480" y="612" font-size="20" fill="#243344" text-anchor="start">πₐ = (a, 1−a, 0)，0 ≤ a ≤ 1</text>
<text x="480" y="649" font-size="18" fill="#243344" text-anchor="start">δ₀、δ₁ 各自永远留在自己的吸收类</text>
<text x="480" y="686" font-size="18" fill="#243344" text-anchor="start">δ₂ Pⁿ = (1/2, 1/2, 0)，n ≥ 1</text>
<text x="480" y="723" font-size="18" fill="#243344" text-anchor="start">实验选 π₁/₂ 作参照；其他 πₐ 也都平稳</text>
<text x="480" y="760" font-size="18" fill="#243344" text-anchor="start">TV 到某个所选 π 不趋 0，不代表分布没有极限</text>
<text x="480" y="797" font-size="17" fill="#52616e" text-anchor="start">先辨闭类，再问初始质量流向哪里</text>
</g></g></svg>
