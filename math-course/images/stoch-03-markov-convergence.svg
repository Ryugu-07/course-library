<text x="30" y="35" font-size="25" text-anchor="start" fill="#243344">逐步分布与平均分布：把两种收敛画在同一坐标上</text>
<text x="30" y="68" font-size="18" text-anchor="start" fill="#243344">统一从 δ₀ 出发；绿线在时刻 t 使用 M=t+1 项平均。三图的时间和 TV 尺度相同。</text>
