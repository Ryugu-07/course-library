<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc"><title id="title">同一向量，两组坐标</title><desc id="desc">在标准坐标中，b1等于一一，b2等于二零；p等于三二，是两倍b1加半倍b2。p的标准坐标为三二，B坐标为二、二分之一。</desc><rect width="700" height="420" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#172554"><text x="24" y="31" font-size="22" font-weight="700">换基改变记录，目标 p 没有移动</text><text x="24" y="57" font-size="15">左图始终使用标准坐标，所有坐标单位采用同一像素比例。</text><path d="M70 325V115" stroke="#e2e8f0"/><text x="70" y="348" text-anchor="middle" font-size="14">0</text><path d="M140 325V115" stroke="#e2e8f0"/><text x="140" y="348" text-anchor="middle" font-size="14">1</text><path d="M210 325V115" stroke="#e2e8f0"/><text x="210" y="348" text-anchor="middle" font-size="14">2</text><path d="M280 325V115" stroke="#e2e8f0"/><text x="280" y="348" text-anchor="middle" font-size="14">3</text><path d="M350 325V115" stroke="#e2e8f0"/><text x="350" y="348" text-anchor="middle" font-size="14">4</text><path d="M70 325H350" stroke="#e2e8f0"/><text x="57" y="330" text-anchor="end" font-size="14">0</text><path d="M70 255H350" stroke="#e2e8f0"/><text x="57" y="260" text-anchor="end" font-size="14">1</text><path d="M70 185H350" stroke="#e2e8f0"/><text x="57" y="190" text-anchor="end" font-size="14">2</text><path d="M70 115H350" stroke="#e2e8f0"/><text x="57" y="120" text-anchor="end" font-size="14">3</text><path d="M64 325H370M70 331V101" stroke="#334155" fill="none"/><text x="370" y="345" font-size="15">x</text><text x="63" y="92" font-size="15">y</text><path d="M70 325L140 255" stroke="#1d4ed8" stroke-width="3"/><circle cx="140" cy="255" r="5" fill="#1d4ed8"/><path d="M70 325L210 325" stroke="#b45309" stroke-width="3"/><circle cx="210" cy="325" r="5" fill="#b45309"/><path d="M70 325L210 185L280 185" stroke="#15803d" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/><circle cx="280" cy="185" r="6" fill="#be123c"/><text x="131" y="280" font-size="15">b₁</text><text x="219" y="315" font-size="15">b₂</text><text x="290" y="177" font-size="16" font-weight="700">p=(3,2)</text><text x="420" y="123" font-size="18" font-weight="700">同一个 p 的记录</text><text x="420" y="161" font-size="16">标准基：(3, 2)</text><text x="420" y="199" font-size="16">B=(b₁,b₂)：(2, 1/2)</text><text x="420" y="249" font-size="16">p=2b₁+(1/2)b₂</text><text x="420" y="282" font-size="15">绿虚线：先到 (2,2)</text><text x="420" y="309" font-size="15">再加 (1,0)，抵达 p</text><text x="24" y="390" font-size="16">系数依赖基；把基向量第二列加倍，第二个系数减半，目标仍然不动。</text></g></svg>