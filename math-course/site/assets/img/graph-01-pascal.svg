<text x="565" y="623" text-anchor="start" style="font-size:20px">从 6 个不同对象中选 2 个：</text>
<text x="565" y="668" text-anchor="start" style="font-size:17px">不含指定对象：从其余 5 个选 2 个 → 10</text>
<text x="565" y="707" text-anchor="start" style="font-size:17px">包含指定对象：再从其余 5 个选 1 个 → 5</text>
<text x="565" y="758" text-anchor="start" style="font-size:24px">总计 10 + 5 = 15</text>
<text x="565" y="802" text-anchor="start" style="font-size:17px">每个二元子集恰好落入其中一类。</text>
<text x="45" y="906" text-anchor="start" style="font-size:17px">系数的数值要与对象对上：空组合、空序列各算 1 种；这一初值使递推从金额 0 开始。</text>
