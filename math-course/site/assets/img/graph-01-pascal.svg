<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="940" viewBox="0 0 1100 940" role="img" aria-labelledby="title desc">
<title id="title">计数先声明顺序：四组硬币组合、九条投币序列与Pascal分类</title>
<desc id="desc">金额5的数量组合分别对应1、4、3、1条有序投币序列。下方Pascal三角形显示按是否含指定元素分类，六选二等于五选一加五选二，即五加十等于十五。</desc>
<rect width="1100" height="940" fill="#f8fafc"/>
<style>text{font-family:Arial,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#172b45;font-size:17px}.small{font-size:15px}</style>
<text x="40" y="45" text-anchor="start" style="font-size:29px">同样凑 5 分：换顺序，算不算新方案？</text>
<text x="40" y="79" text-anchor="start" style="font-size:17px">面额 1、2、5，无限供应；同面额硬币不可区分。</text>
<text x="50" y="126" text-anchor="start" style="font-size:21px">A. 不计顺序：4 组数量</text>
<text x="590" y="126" text-anchor="start" style="font-size:21px">B. 计顺序：9 条完整序列</text>
