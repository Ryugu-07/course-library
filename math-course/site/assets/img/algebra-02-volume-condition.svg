t-size="14">1</text><text x="475" y="324" text-anchor="middle" font-size="14">0</text><text x="565.0" y="324" text-anchor="middle" font-size="14">0.5</text><text x="655" y="324" text-anchor="middle" font-size="14">1</text><text x="679" y="323" font-size="15">x</text><text x="470" y="97" font-size="15">y</text><text x="424" y="360" font-size="17">det=1/4；σ=(1, 0.25)；κ₂=4</text></g></svg>