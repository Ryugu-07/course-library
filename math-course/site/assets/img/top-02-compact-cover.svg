<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">有限子覆盖和永远存在的漏点</title>
<desc id="desc">上半部为闭区间的七个相对开邻域，半径十三除以六十；蓝色的U1、U3、U5已覆盖，灰色成员可以删去。下半部为开区间覆盖的四个有限子族，每行标出不属于该子族并集的点一除以二N。</desc>
<rect width="1200" height="1100" fill="#faf8f1"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203447}.title{font-size:25px;font-weight:700}.label{font-size:19px}.small{font-size:17px}</style>
<text x="35" y="45" class="title" text-anchor="start">有限子覆盖：删去哪些，仍能覆盖每一个点？</text>
<text x="35" y="86" class="small" text-anchor="start">X=[0,1]；m=6，r=26/120=13/60；Uⱼ=(j/6−r,j/6+r)∩[0,1]。</text>
<text x="35" y="118" class="small" text-anchor="start">实心端点包含，空心端点排除；蓝色 U₁、U₃、U₅ 已覆盖，灰色四个成员可删。</text>
<line x1="150.000000000" y1="168" x2="1140.000000000" y2="168" stroke="#203447" stroke-width="2" />
<circle cx="150.000000000" cy="168" r="5" fill="#203447" stroke="#203447" stroke-width="2" />
<text x="150.0" y="150" class="small" text-anchor="middle">0</text>
<circle cx="315.000000000" cy="168" r="5" fill="#203447" stroke="#203447" stroke-width="2" />
<text x="315.0" y="150" class="small" text-anchor="middle">1/6</text>
<circle cx="480.000000000" cy="168" r="5" fill="#203447" stroke="#203447" stroke-width="2" />
<text x="480.0" y="150" class="small" text-anchor="middle">2/6</text>
<circle cx="645.000000000" cy="168" r="5" fill="#203447" stroke="#203447" stroke-width="2" />
<text x="645.0" y="150" class="small" text-anchor="middle">3/6</text>
<circle cx="810.000000000" cy="168" r="5" fill="#203447" stroke="#203447" stroke-width="2" />
<text x="810.0" y="150" class="small" text-anchor="middle">4/6</text>
<circle cx="975.000000000" cy="168" r="5" fill="#203447" stroke="#203447" stroke-width="2" />
<text x="975.0" y="150" class="small" text-anchor="middle">5/6</text>
<circle cx="1140.000000000" cy="168" r="5" fill="#203447" stroke="#203447" stroke-width="2" />
<text x="1140.0" y="150" class="small" text-anchor="middle">1</text>
<text x="115" y="228" class="small" text-anchor="end">U0</text>
<line x1="150.000000000" y1="222" x2="364.500000000" y2="222" stroke="#9da7ab" stroke-width="2" data-cover-j="0"/>
<circle cx="150.000000000" cy="222" r="5" fill="#9da7ab" stroke="#9da7ab" stroke-width="2" data-left-j="0"/>
<circle cx="364.500000000" cy="222" r="5" fill="#faf8f1" stroke="#9da7ab" stroke-width="2" data-right-j="0"/>
<text x="115" y="271" class="small" text-anchor="end">U1</text>
<line x1="150.000000000" y1="265" x2="529.500000000" y2="265" stroke="#5278a5" stroke-width="5" data-cover-j="1"/>
<circle cx="150.000000000" cy="265" r="5" fill="#5278a5" stroke="#5278a5" stroke-width="2" data-left-j="1"/>
<circle cx="529.500000000" cy="265" r="5" fill="#faf8f1" stroke="#5278a5" stroke-width="2" data-right-j="1"/>
<text x="115" y="314" class="small" text-anchor="end">U2</text>
<line x1="265.500000000" y1="308" x2="694.500000000" y2="308" stroke="#9da7ab" stroke-width="2" data-cover-j="2"/>
<circle cx="265.500000000" cy="308" r="5" fill="#faf8f1" stroke="#9da7ab" stroke-width="2" data-left-j="2"/>
<circle cx="694.500000000" cy="308" r="5" fill="#faf8f1" stroke="#9da7ab" stroke-width="2" data-right-j="2"/>
<text x="115" y="357" class="small" text-anchor="end">U3</text>
<line x1="430.500000000" y1="351" x2="859.500000000" y2="351" stroke="#5278a5" stroke-width="5" data-cover-j="3"/>
<circle cx="430.500000000" cy="351" r="5" fill="#faf8f1" stroke="#5278a5" stroke-width="2" data-left-j="3"/>
<circle cx="859.500000000" cy="351" r="5" fill="#faf8f1" stroke="#5278a5" stroke-width="2" data-right-j="3"/>
<text x="115" y="400" class="small" text-anchor="end">U4</text>
<line x1="595.500000000" y1="394" x2="1024.500000000" y2="394" stroke="#9da7ab" stroke-width="2" data-cover-j="4"/>
<circle cx="595.500000000" cy="394" r="5" fill="#faf8f1" stroke="#9da7ab" stroke-width="2" data-left-j="4"/>
<circle cx="1024.500000000" cy="394" r="5" fill="#faf8f1" stroke="#9da7ab" stroke-width="2" data-right-j="4"/>
<text x="115" y="443" class="small" text-anchor="end">U5</text>
<line x1="760.500000000" y1="437" x2="1140.000000000" y2="437" stroke="#5278a5" stroke-width="5" data-cover-j="5"/>
<circle cx="760.500000000" cy="437" r="5" fill="#faf8f1" stroke="#5278a5" stroke-width="2" data-left-j="5"/>
<circle cx="1140.000000000" cy="437" r="5" fill="#5278a5" stroke="#5278a5" stroke-width="2" data-right-j="5"/>
<text x="115" y="486" class="small" text-anchor="end">U6</text>
<line x1="925.500000000" y1="480" x2="1140.000000000" y2="480" stroke="#9da7ab" stroke-width="2" data-cover-j="6"/>
<circle cx="925.500000000" cy="480" r="5" fill="#faf8f1" stroke="#9da7ab" stroke-width="2" data-left-j="6"/>
<circle cx="1140.000000000" cy="480" r="5" fill="#9da7ab" stroke="#9da7ab" stroke-width="2" data-right-j="6"/>
<text x="35" y="534" class="small" text-anchor="start">这只是给定有限覆盖的删减实例。[0,1] 对任意开覆盖都能抽有限，另由 Heine–Borel 证明。</text>
<text x="35" y="565" class="small" text-anchor="start">半径若改为 r=1/12（k=10），相邻开区间在被排除的端点处相接，仍然有漏点。</text>
<line x1="35.000000000" y1="605" x2="1165.000000000" y2="605" stroke="#c3cace" stroke-width="1" />
<text x="35" y="651" class="title" text-anchor="start">非紧致：有限子族再大，仍能写出一个漏点</text>
<text x="35" y="691" class="small" text-anchor="start">X=(0,1)；Uₙ=(1/n,1)，n≥2。每行是 U₂,…,U_N 的并 (1/N,1)。</text>
<text x="112" y="756" class="small" text-anchor="end">N=2</text>
<line x1="150.000000000" y1="750" x2="1140.000000000" y2="750" stroke="#d2d7d9" stroke-width="2" />
<line x1="645.000000000" y1="750" x2="1140.000000000" y2="750" stroke="#3b846c" stroke-width="5" data-open-N="2"/>
<circle cx="645.000000000" cy="750" r="5" fill="#faf8f1" stroke="#3b846c" stroke-width="2" />
<circle cx="1140.000000000" cy="750" r="5" fill="#faf8f1" stroke="#3b846c" stroke-width="2" />
<circle cx="397.500000000" cy="750" r="5" fill="#b34e3d" stroke="#b34e3d" stroke-width="2" data-witness-N="2"/>
<text x="397.5" y="778" class="small" text-anchor="middle">1/4</text>
<text x="645.0" y="736" class="small" text-anchor="middle">1/2</text>
<text x="112" y="823" class="small" text-anchor="end">N=4</text>
<line x1="150.000000000" y1="817" x2="1140.000000000" y2="817" stroke="#d2d7d9" stroke-width="2" />
<line x1="397.500000000" y1="817" x2="1140.000000000" y2="817" stroke="#3b846c" stroke-width="5" data-open-N="4"/>
<circle cx="397.500000000" cy="817" r="5" fill="#faf8f1" stroke="#3b846c" stroke-width="2" />
<circle cx="1140.000000000" cy="817" r="5" fill="#faf8f1" stroke="#3b846c" stroke-width="2" />
<circle cx="273.750000000" cy="817" r="5" fill="#b34e3d" stroke="#b34e3d" stroke-width="2" data-witness-N="4"/>
<text x="273.75" y="845" class="small" text-anchor="middle">1/8</text>
<text x="397.5" y="803" class="small" text-anchor="middle">1/4</text>
<text x="112" y="890" class="small" text-anchor="end">N=8</text>
<line x1="150.000000000" y1="884" x2="1140.000000000" y2="884" stroke="#d2d7d9" stroke-width="2" />
<line x1="273.750000000" y1="884" x2="1140.000000000" y2="884" stroke="#3b846c" stroke-width="5" data-open-N="8"/>
<circle cx="273.750000000" cy="884" r="5" fill="#faf8f1" stroke="#3b846c" stroke-width="2" />
<circle cx="1140.000000000" cy="884" r="5" fill="#faf8f1" stroke="#3b846c" stroke-width="2" />
<circle cx="211.875000000" cy="884" r="5" fill="#b34e3d" stroke="#b34e3d" stroke-width="2" data-witness-N="8"/>
<text x="211.875" y="912" class="small" text-anchor="middle">1/16</text>
<text x="273.75" y="870" class="small" text-anchor="middle">1/8</text>
<text x="112" y="957" class="small" text-anchor="end">N=16</text>
<line x1="150.000000000" y1="951" x2="1140.000000000" y2="951" stroke="#d2d7d9" stroke-width="2" />
<line x1="211.875000000" y1="951" x2="1140.000000000" y2="951" stroke="#3b846c" stroke-width="5" data-open-N="16"/>
<circle cx="211.875000000" cy="951" r="5" fill="#faf8f1" stroke="#3b846c" stroke-width="2" />
<circle cx="1140.000000000" cy="951" r="5" fill="#faf8f1" stroke="#3b846c" stroke-width="2" />
<circle cx="180.937500000" cy="951" r="5" fill="#b34e3d" stroke="#b34e3d" stroke-width="2" data-witness-N="16"/>
<text x="180.9375" y="979" class="small" text-anchor="middle">1/32</text>
<text x="211.875" y="937" class="small" text-anchor="middle">1/16</text>
<text x="35" y="1017" class="small" text-anchor="start">红点 x=1/(2N) 属于 (0,1)，但小于每个已选成员的左端点；因此它不在有限并中。</text>
<text x="35" y="1052" class="small" text-anchor="start">任意有限子族都有最大指标 N。原来的无限族覆盖全部 (0,1)，却没有有限子覆盖。</text>
</svg>
