<text x="600" y="376" font-size="16" text-anchor="end" fill="#243344">分割段数 n（对数刻度）</text>
<text x="700" y="145" font-size="20" text-anchor="start" fill="#243344">E[Qₙ]=1；Var(Qₙ)=2/n</text>
<text x="700" y="190" font-size="17" text-anchor="start" fill="#243344">标准差 √(2/n)，不是路径误差上界。</text>
<text x="700" y="235" font-size="17" text-anchor="start" fill="#243344">网格趋零 ⇒ Qₙ 在 L² 中趋于 1。</text>
<text x="700" y="280" font-size="17" text-anchor="start" fill="#243344">每个有限 n 的 Qₙ 仍是随机变量。</text>
<line x1="35" y1="400" x2="1065" y2="400" stroke="#c8d0d7" stroke-width="1.5"/>
<text x="65" y="445" font-size="21" text-anchor="start" fill="#243344">2. 四个教学增量：0.5，−0.25，0.75，−0.5</text>
<text x="65" y="482" font-size="17" text-anchor="start" fill="#243344">给定的有限序列；连线用于核算，不宣称是完整 Brownian 路径。</text>
