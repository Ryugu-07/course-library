<text x="225" y="665" font-size="14" text-anchor="middle" fill="#243344">1</text>
<circle data-index="2" data-value="0.25" cx="350" cy="610.0" r="5" fill="#315f9d"/>
<text x="350" y="665" font-size="14" text-anchor="middle" fill="#243344">2</text>
<circle data-index="3" data-value="1" cx="475" cy="520" r="5" fill="#315f9d"/>
<text x="475" y="665" font-size="14" text-anchor="middle" fill="#243344">3</text>
<circle data-index="4" data-value="0.5" cx="600" cy="580.0" r="5" fill="#315f9d"/>
<text x="600" y="665" font-size="14" text-anchor="middle" fill="#243344">4</text>
<text x="600" y="697" font-size="16" text-anchor="end" fill="#243344">节点编号（T=1）</text>
<text x="700" y="526" font-size="18" text-anchor="start" fill="#243344">终点 B=0.5；平方和 Q=1.125</text>
<text x="700" y="569" font-size="18" text-anchor="start" fill="#243344">左端和 (B²−Q)/2 = −0.4375</text>
<text x="700" y="612" font-size="18" text-anchor="start" fill="#243344">梯形和 B²/2 = 0.125</text>
<text x="700" y="655" font-size="18" text-anchor="start" fill="#243344">Itô 目标 (B²−T)/2 = −0.375</text>
<text x="65" y="756" font-size="19" text-anchor="start" fill="#243344">左端和 − Itô 目标 = −(Q−T)/2 = −0.0625；误差来自有限网格的二次变差。</text>
