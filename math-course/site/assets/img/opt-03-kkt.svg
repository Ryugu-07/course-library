<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">三角形投影的 KKT 几何</title>
<desc id="desc">等比例坐标中的可行域为 x,y 非负且 x+y 不大于 3。目标 q=(2.7,2.3)，最优点 (1.7,1.3)，梯度为 (-1,-1)，资源乘子为 1。负梯度指向可行域外，属于活动边的外法锥。</desc>
<defs>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64335"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315f9d"/></marker>
<clipPath id="plot"><rect x="110" y="120" width="490" height="420"/></clipPath>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242a}.title{font-size:27px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:16px}.math{font-size:19px;font-family:Georgia,"Times New Roman",serif}.grid{stroke:#d5dce4;stroke-width:1}</style>
</defs>
<rect width="1100" height="650" fill="#fff"/>
<text x="48" y="52" class="title">KKT：用活动约束的外法向抵消目标梯度</text>
<rect x="48" y="86" width="600" height="510" rx="8" fill="#f8fafc" stroke="#c8d1dc"/>
<g class="grid"><path d="M220 130V530M320 130V530M420 130V530M520 130V530M120 430H570M120 330H570M120 230H570M120 130H570"/></g>
<path d="M120 120V530H580" fill="none" stroke="#69717c" stroke-width="2"/>
<path d="M120 530L120 230L420 530Z" fill="#dce8f7" stroke="#315f9d" stroke-width="3"/>
<g clip-path="url(#plot)" fill="none" stroke="#8d96a2" stroke-width="1.6"><circle cx="390" cy="300" r="141.4213562373"/><circle cx="390" cy="300" r="190"/></g>
<g class="small" text-anchor="middle"><text x="120" y="553">0</text><text x="220" y="553">1</text><text x="320" y="553">2</text><text x="420" y="553">3</text><text x="520" y="553">4</text></g>
<g class="small" text-anchor="end"><text x="108" y="435">1</text><text x="108" y="335">2</text><text x="108" y="235">3</text><text x="108" y="135">4</text></g>
<text x="585" y="548" class="small">x</text><text x="100" y="112" class="small">y</text>
<text x="163" y="475" class="label">可行域</text><text x="152" y="300" class="small">x+y≤3</text>
<line x1="290" y1="400" x2="190" y2="500" stroke="#b64335" stroke-width="3" marker-end="url(#red)"/>
<line x1="290" y1="400" x2="390" y2="300" stroke="#315f9d" stroke-width="3" marker-end="url(#blue)"/>
<circle cx="390" cy="300" r="6" fill="#b64335"/><circle cx="290" cy="400" r="7" fill="#20242a" stroke="#fff" stroke-width="2"/>
<text x="402" y="291" class="small">q=(2.7,2.3)</text><text x="302" y="427" class="small">z*=(1.7,1.3)</text>
<text x="220" y="508" class="math">∇f=(-1,-1)</text><text x="372" y="358" class="math">−∇f=(1,1)</text>
<text x="85" y="580" class="small">坐标等比例；圆是 f(z)=½‖z−q‖² 的等高线。</text>
<rect x="675" y="86" width="380" height="510" rx="8" fill="#fff" stroke="#c8d1dc"/>
<text x="700" y="126" class="label">本例的四组条件</text>
<text x="700" y="173" class="math">∇f + λₓ(-1,0) + λᵧ(0,-1)</text><text x="700" y="205" class="math">　　 + λᴿ(1,1) = 0</text>
<text x="700" y="252" class="small">原始可行：z* 位于三角形边上。</text>
<text x="700" y="297" class="small">对偶可行：(λₓ,λᵧ,λᴿ)=(0,0,1)。</text>
<text x="700" y="342" class="small">互补松弛：λᵢgᵢ(z*)=0。</text>
<text x="700" y="387" class="small">平稳性：(-1,-1)+(1,1)=(0,0)。</text>
<rect x="696" y="423" width="340" height="145" rx="6" fill="#f2f6fb"/>
<text x="710" y="455" class="small">本例严格凸且满足 Slater。</text>
<text x="710" y="490" class="small">一般最优点需检查约束资格；</text>
<text x="710" y="525" class="small">活动约束也可能乘子为零。</text>
</svg>
