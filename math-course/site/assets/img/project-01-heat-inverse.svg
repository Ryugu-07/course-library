<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="970" viewBox="0 0 1100 970" role="img" aria-labelledby="title desc">
<title id="title">热衰减、正则收缩与一个可复算的第六模态</title>
<desc id="desc">左图是三个测量时刻的八个奇异值，采用以十为底的对数坐标。右图在一秒时显示三个正则参数的信号保留比例。底部用第六模态逐步核对信号、指定扰动和两种反演。</desc>
<rect width="1100" height="970" fill="#f8fafc"/>
<style>text{font-family:Arial,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#172b45;font-size:17px}</style>
<text x="40" y="47" text-anchor="start" style="font-size:27px">热扩散削弱细节，正则化决定怎样处理弱方向</text>
<text x="40" y="90" text-anchor="start" style="font-size:17px">模型：L=1 m，κ=0.01 m²/s，k=1…8。两图纵轴不同，不能直接比较线的高度。</text>
<text x="65" y="139" text-anchor="start" style="font-size:21px">A. 晚一点观测，高频衰减更多</text>
<text x="615" y="139" text-anchor="start" style="font-size:21px">B. λ 越大，信号保留比例越低</text>
