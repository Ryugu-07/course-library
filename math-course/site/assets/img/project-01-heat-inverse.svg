<text x="40" y="668" text-anchor="start" style="font-size:23px">C. 第六模态：方程解对了，仍可能把噪声当成初态</text>
<text x="50" y="718" text-anchor="start" style="font-size:17px">1. 初态系数</text>
<text x="310" y="718" text-anchor="start" style="font-size:17px">a₆ = 0.200000 K</text>
<text x="660" y="718" text-anchor="start" style="font-size:15px">仅指定这一模态的扰动；不是一次随机基准抽样。</text>
<text x="50" y="761" text-anchor="start" style="font-size:17px">2. 扩散后信号</text>
<text x="310" y="761" text-anchor="start" style="font-size:17px">s₆a₆ = 0.005727 K</text>
<text x="660" y="761" text-anchor="start" style="font-size:15px">s₆ = 0.028637，信号已小于 0.02 K。</text>
<text x="50" y="804" text-anchor="start" style="font-size:17px">3. 加入指定扰动</text>
<text x="310" y="804" text-anchor="start" style="font-size:17px">b₆ = 0.025727 K</text>
<text x="660" y="804" text-anchor="start" style="font-size:15px">η₆ = 0.020000 K，b₆ = s₆a₆ + η₆。</text>
<text x="50" y="847" text-anchor="start" style="font-size:17px">4. 直接反演</text>
<text x="310" y="847" text-anchor="start" style="font-size:17px">b₆/s₆ = 0.898399 K</text>
<text x="660" y="847" text-anchor="start" style="font-size:15px">系数误差 = 0.698399 K。</text>
<text x="50" y="890" text-anchor="start" style="font-size:17px">5. 手动正则 λ=0.001</text>
<text x="310" y="890" text-anchor="start" style="font-size:17px">估计 = 0.404793 K</text>
<text x="660" y="890" text-anchor="start" style="font-size:15px">收缩信号和噪声；改善此例不构成普遍定理。</text>
</svg>
