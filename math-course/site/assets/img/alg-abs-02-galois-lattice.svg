<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">Q(√2,√3) 的中间域与 V4 子群反序对应</title>
<desc id="desc">左侧 E 包含三个二次域，三个二次域包含 Q；右侧 V4 包含三个二阶子群，三个子群包含恒等子群。同色配对反转包含关系。下方为四个自同构在基 1、√2、√3、√6 上的精确符号。</desc>
<rect width="1200" height="1000" fill="#faf8f1"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203447} .title{font-size:23px;font-weight:700} .label{font-size:18px;font-weight:600} .small{font-size:15px} .edge{stroke:#abb5ba;stroke-width:2;fill:none}</style>
<text x="30" y="38" class="title" text-anchor="start" >Galois 对应：固定的数越多，允许的对称越少</text>
<text x="30" y="74" class="small" text-anchor="start" >E = Q(√2,√3)，σ 只翻转 √2，τ 只翻转 √3；这是有限、正规、可分扩张。</text>
<text x="310" y="114" class="label" text-anchor="middle" >中间域（大域在上）</text>
<text x="910" y="114" class="label" text-anchor="middle" >子群（大群在上）</text>
<path d="M310 217 L120 295" class="edge" data-edge="field:top:0"/>
<path d="M120 377 L310 465" class="edge" data-edge="field:bottom:0"/>
<path d="M310 217 L310 295" class="edge" data-edge="field:top:1"/>
<path d="M310 377 L310 465" class="edge" data-edge="field:bottom:1"/>
<path d="M310 217 L500 295" class="edge" data-edge="field:top:2"/>
<path d="M500 377 L310 465" class="edge" data-edge="field:bottom:2"/>
<path d="M910 217 L720 295" class="edge" data-edge="group:top:0"/>
<path d="M720 377 L910 465" class="edge" data-edge="group:bottom:0"/>
<path d="M910 217 L910 295" class="edge" data-edge="group:top:1"/>
<path d="M910 377 L910 465" class="edge" data-edge="group:bottom:1"/>
<path d="M910 217 L1100 295" class="edge" data-edge="group:top:2"/>
<path d="M1100 377 L910 465" class="edge" data-edge="group:bottom:2"/>
<rect x="225" y="135" width="170" height="82" rx="6" fill="#dbe7f5" stroke="#71818b" data-node="field:0"/>
<text x="310" y="170" class="label" text-anchor="middle" >E = Q(√2,√3)</text>
<text x="310" y="197" class="small" text-anchor="middle" >[E:Q] = 4</text>
<rect x="35" y="295" width="170" height="82" rx="6" fill="#f3e5bc" stroke="#71818b" data-node="field:1"/>
<text x="120" y="330" class="label" text-anchor="middle" >Q(√3)</text>
<text x="120" y="357" class="small" text-anchor="middle" >[K:Q] = 2</text>
<rect x="225" y="295" width="170" height="82" rx="6" fill="#d9eadb" stroke="#71818b" data-node="field:2"/>
<text x="310" y="330" class="label" text-anchor="middle" >Q(√2)</text>
<text x="310" y="357" class="small" text-anchor="middle" >[K:Q] = 2</text>
<rect x="415" y="295" width="170" height="82" rx="6" fill="#f0dcd5" stroke="#71818b" data-node="field:3"/>
<text x="500" y="330" class="label" text-anchor="middle" >Q(√6)</text>
<text x="500" y="357" class="small" text-anchor="middle" >[K:Q] = 2</text>
<rect x="225" y="465" width="170" height="82" rx="6" fill="#e1e4e7" stroke="#71818b" data-node="field:4"/>
<text x="310" y="500" class="label" text-anchor="middle" >Q</text>
<text x="310" y="527" class="small" text-anchor="middle" >[Q:Q] = 1</text>
<rect x="825" y="135" width="170" height="82" rx="6" fill="#e1e4e7" stroke="#71818b" data-node="group:4"/>
<text x="910" y="170" class="label" text-anchor="middle" >G = V₄</text>
<text x="910" y="197" class="small" text-anchor="middle" >|G| = 4</text>
<rect x="635" y="295" width="170" height="82" rx="6" fill="#f3e5bc" stroke="#71818b" data-node="group:1"/>
<text x="720" y="330" class="label" text-anchor="middle" >{e,σ}</text>
<text x="720" y="357" class="small" text-anchor="middle" >|H| = 2</text>
<rect x="825" y="295" width="170" height="82" rx="6" fill="#d9eadb" stroke="#71818b" data-node="group:2"/>
<text x="910" y="330" class="label" text-anchor="middle" >{e,τ}</text>
<text x="910" y="357" class="small" text-anchor="middle" >|H| = 2</text>
<rect x="1015" y="295" width="170" height="82" rx="6" fill="#f0dcd5" stroke="#71818b" data-node="group:3"/>
<text x="1100" y="330" class="label" text-anchor="middle" >{e,στ}</text>
<text x="1100" y="357" class="small" text-anchor="middle" >|H| = 2</text>
<rect x="825" y="465" width="170" height="82" rx="6" fill="#dbe7f5" stroke="#71818b" data-node="group:0"/>
<text x="910" y="500" class="label" text-anchor="middle" >{e}</text>
<text x="910" y="527" class="small" text-anchor="middle" >|H| = 1</text>
<text x="30" y="590" class="small" text-anchor="start" >同色为一对：K = Eᴴ；[E:K] = |H|， [K:Q] = 4/|H|。连线只表示包含，不表示配对。</text>
<text x="30" y="622" class="small" text-anchor="start" >例如固定 σ 要求 √2、√6 的系数都为零，所以 E^⟨σ⟩ = Q(√3)。</text>
<text x="30" y="678" class="label" text-anchor="start" >把抽象的“固定”化成四个系数的符号</text>
<rect x="30" y="700" width="142" height="45" fill="#e8ecec" stroke="#cbd3d5"/>
<text x="101" y="729" class="label" text-anchor="middle" >自同构</text>
<rect x="172" y="700" width="142" height="45" fill="#e8ecec" stroke="#cbd3d5"/>
<text x="243" y="729" class="label" text-anchor="middle" >1</text>
<rect x="314" y="700" width="142" height="45" fill="#e8ecec" stroke="#cbd3d5"/>
<text x="385" y="729" class="label" text-anchor="middle" >√2</text>
<rect x="456" y="700" width="142" height="45" fill="#e8ecec" stroke="#cbd3d5"/>
<text x="527" y="729" class="label" text-anchor="middle" >√3</text>
<rect x="598" y="700" width="142" height="45" fill="#e8ecec" stroke="#cbd3d5"/>
<text x="669" y="729" class="label" text-anchor="middle" >√6</text>
<rect x="30" y="745" width="142" height="45" fill="#e8ecec" stroke="#cbd3d5"/>
<text x="101" y="774" class="label" text-anchor="middle" >e</text>
<rect x="172" y="745" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="243" y="774" class="label" text-anchor="middle" data-sign="0,0">+</text>
<rect x="314" y="745" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="385" y="774" class="label" text-anchor="middle" data-sign="0,1">+</text>
<rect x="456" y="745" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="527" y="774" class="label" text-anchor="middle" data-sign="0,2">+</text>
<rect x="598" y="745" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="669" y="774" class="label" text-anchor="middle" data-sign="0,3">+</text>
<rect x="30" y="790" width="142" height="45" fill="#e8ecec" stroke="#cbd3d5"/>
<text x="101" y="819" class="label" text-anchor="middle" >σ</text>
<rect x="172" y="790" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="243" y="819" class="label" text-anchor="middle" data-sign="1,0">+</text>
<rect x="314" y="790" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="385" y="819" class="label" text-anchor="middle" data-sign="1,1">−</text>
<rect x="456" y="790" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="527" y="819" class="label" text-anchor="middle" data-sign="1,2">+</text>
<rect x="598" y="790" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="669" y="819" class="label" text-anchor="middle" data-sign="1,3">−</text>
<rect x="30" y="835" width="142" height="45" fill="#e8ecec" stroke="#cbd3d5"/>
<text x="101" y="864" class="label" text-anchor="middle" >τ</text>
<rect x="172" y="835" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="243" y="864" class="label" text-anchor="middle" data-sign="2,0">+</text>
<rect x="314" y="835" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="385" y="864" class="label" text-anchor="middle" data-sign="2,1">+</text>
<rect x="456" y="835" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="527" y="864" class="label" text-anchor="middle" data-sign="2,2">−</text>
<rect x="598" y="835" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="669" y="864" class="label" text-anchor="middle" data-sign="2,3">−</text>
<rect x="30" y="880" width="142" height="45" fill="#e8ecec" stroke="#cbd3d5"/>
<text x="101" y="909" class="label" text-anchor="middle" >στ</text>
<rect x="172" y="880" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="243" y="909" class="label" text-anchor="middle" data-sign="3,0">+</text>
<rect x="314" y="880" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="385" y="909" class="label" text-anchor="middle" data-sign="3,1">−</text>
<rect x="456" y="880" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="527" y="909" class="label" text-anchor="middle" data-sign="3,2">−</text>
<rect x="598" y="880" width="142" height="45" fill="#faf8f1" stroke="#cbd3d5"/>
<text x="669" y="909" class="label" text-anchor="middle" data-sign="3,3">+</text>
<text x="790" y="746" class="label" text-anchor="start" >σ(a+b√2+c√3+d√6)</text>
<text x="790" y="783" class="label" text-anchor="start" >= a−b√2+c√3−d√6</text>
<text x="790" y="837" class="small" text-anchor="start" >与原值相等 ⇔ b=d=0</text>
<text x="790" y="877" class="small" text-anchor="start" >基的线性独立性保证逐项比较有效。</text>
<text x="30" y="968" class="small" text-anchor="start" >边界：Q(∛2)/Q 不是正规扩张，自同构群只有恒等，不能按次数 3 套这张对应图。</text>
</svg>
