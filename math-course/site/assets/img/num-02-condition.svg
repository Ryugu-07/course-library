<line x1="1062.5" y1="421.5" x2="1062.5" y2="218.5" stroke="#3c64a4" stroke-width="2" data-a="1" data-b="0" data-rhs="1"/>
<line x1="1071.3800993478812" y1="421.5" x2="1053.6199006521188" y2="218.5" stroke="#ad762b" stroke-width="2" data-a="0.9961946980917455" data-b="0.08715574274765817" data-rhs="0.9961946980917455"/>
<line x1="1063.9472437856757" y1="421.5" x2="1063.9472437856757" y2="218.5" stroke="#3c64a4" stroke-width="2" data-a="1" data-b="0" data-rhs="1.00998099162535" stroke-dasharray="6 4"/>
<line x1="1072.832871369704" y1="421.5" x2="1055.0726726739413" y2="218.5" stroke="#ad762b" stroke-width="2" data-a="0.9961946980917455" data-b="0.08715574274765817" data-rhs="1.0061756897170955" stroke-dasharray="6 4"/>
