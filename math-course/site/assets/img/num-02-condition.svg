<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="linear-title linear-desc">
<title id="linear-title">同样的相对右端扰动，不同的解漂移</title>
<desc id="linear-desc">三个单位行法向模型，90度敏感方向、5度敏感方向、5度非敏感方向。全部直线和点按真实参数及统一尺度绘制。</desc>
<rect width="1200" height="760" fill="#faf8f0"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,sans-serif;fill:#20364b}.title{font-size:26px;font-weight:700}.label{font-size:18px}.small{font-size:15px}</style>
<text x="30" y="46" class="title" text-anchor="start">相同的 1% 右端扰动，交点可以移动得很不一样</text>
<text x="30" y="83" class="small" text-anchor="start">固定 x*=(1,0)，b=A x*，每行法向长度为1；三图横纵同单位，并使用同一放大尺度。</text>
<g data-angle="90" data-direction="min" data-scale="145" data-cx="200" data-cy="320">
<text x="200" y="135" class="label" text-anchor="middle">直角：敏感与非敏感等价</text>
<line x1="127.5" y1="218.5" x2="127.5" y2="421.5" stroke="#c6c4bc" stroke-width="1" />
<text x="127.5" y="443.5" class="small" text-anchor="middle">0</text>
<line x1="200.0" y1="218.5" x2="200.0" y2="421.5" stroke="#c6c4bc" stroke-width="1" />
<text x="200.0" y="443.5" class="small" text-anchor="middle">0.5</text>
<line x1="272.5" y1="218.5" x2="272.5" y2="421.5" stroke="#c6c4bc" stroke-width="1" />
<text x="272.5" y="443.5" class="small" text-anchor="middle">1</text>
<line x1="345.0" y1="218.5" x2="345.0" y2="421.5" stroke="#c6c4bc" stroke-width="1" />
<text x="345.0" y="443.5" class="small" text-anchor="middle">1.5</text>
<line x1="33.25" y1="392.5" x2="366.75" y2="392.5" stroke="#c6c4bc" stroke-width="1" />
<text x="29.25" y="397.5" class="small" text-anchor="end">-0.5</text>
<line x1="33.25" y1="320" x2="366.75" y2="320" stroke="#c6c4bc" stroke-width="1" />
<text x="29.25" y="325" class="small" text-anchor="end">0</text>
<line x1="33.25" y1="247.5" x2="366.75" y2="247.5" stroke="#c6c4bc" stroke-width="1" />
<text x="29.25" y="252.5" class="small" text-anchor="end">0.5</text>
<line x1="272.5" y1="421.5" x2="272.5" y2="218.5" stroke="#3c64a4" stroke-width="2" data-a="1" data-b="0" data-rhs="1"/>
<line x1="33.25" y1="320.0" x2="366.75" y2="320.0" stroke="#ad762b" stroke-width="2" data-a="0" data-b="1" data-rhs="0"/>
<line x1="271.4746951672795" y1="421.5" x2="271.4746951672795" y2="218.5" stroke="#3c64a4" stroke-width="2" data-a="1" data-b="0" data-rhs="0.9929289321881345" stroke-dasharray="6 4"/>
<line x1="33.25" y1="318.9746951672795" x2="366.75" y2="318.9746951672795" stroke="#ad762b" stroke-width="2" data-a="0" data-b="1" data-rhs="0.0070710678118654745" stroke-dasharray="6 4"/>
<line x1="272.5" y1="320" x2="271.4746951672795" y2="318.9746951672795" stroke="#b44435" stroke-width="2" />
<circle data-point="true" cx="272.5" cy="320" r="7" fill="none" stroke="#26774d" stroke-width="2"/>
<circle data-point="shifted" cx="271.4746951672795" cy="318.9746951672795" r="3.5" fill="#b44435"/>
<text x="282.5" y="340" class="small" text-anchor="start">x*</text>
<text x="281.4746951672795" y="306.9746951672795" class="small" text-anchor="start">x̂</text>
<text x="200" y="493" class="label" text-anchor="middle">θ=90°；κ₂=1</text>
<text x="200" y="529" class="label" text-anchor="middle">相对残差 ρ=1%</text>
<text x="200" y="565" class="label" text-anchor="middle">相对前向误差=1%</text>
<text x="200" y="598" class="small" text-anchor="middle">κ₂ρ 上界=1%</text>
</g>
<g data-angle="5" data-direction="min" data-scale="145" data-cx="595" data-cy="320">
