<line x1="667.5" y1="218.5" x2="667.5" y2="421.5" stroke="#c6c4bc" stroke-width="1" />
<text x="667.5" y="443.5" class="small" text-anchor="middle">1</text>
<line x1="740.0" y1="218.5" x2="740.0" y2="421.5" stroke="#c6c4bc" stroke-width="1" />
<text x="740.0" y="443.5" class="small" text-anchor="middle">1.5</text>
<line x1="428.25" y1="392.5" x2="761.75" y2="392.5" stroke="#c6c4bc" stroke-width="1" />
<text x="424.25" y="397.5" class="small" text-anchor="end">-0.5</text>
<line x1="428.25" y1="320" x2="761.75" y2="320" stroke="#c6c4bc" stroke-width="1" />
<text x="424.25" y="325" class="small" text-anchor="end">0</text>
<line x1="428.25" y1="247.5" x2="761.75" y2="247.5" stroke="#c6c4bc" stroke-width="1" />
<text x="424.25" y="252.5" class="small" text-anchor="end">0.5</text>
<line x1="667.5" y1="421.5" x2="667.5" y2="218.5" stroke="#3c64a4" stroke-width="2" data-a="1" data-b="0" data-rhs="1"/>
<line x1="676.3800993478812" y1="421.5" x2="658.6199006521188" y2="218.5" stroke="#ad762b" stroke-width="2" data-a="0.9961946980917455" data-b="0.08715574274765817" data-rhs="0.9961946980917455"/>
<line x1="666.0527562143243" y1="421.5" x2="666.0527562143243" y2="218.5" stroke="#3c64a4" stroke-width="2" data-a="1" data-b="0" data-rhs="0.9900190083746501" stroke-dasharray="6 4"/>
<line x1="677.832871369704" y1="421.5" x2="660.0726726739414" y2="218.5" stroke="#ad762b" stroke-width="2" data-a="0.9961946980917455" data-b="0.08715574274765817" data-rhs="1.0061756897170955" stroke-dasharray="6 4"/>
<line x1="667.5" y1="320" x2="666.0527562143243" y2="286.8526676414589" stroke="#b44435" stroke-width="2" />
<circle data-point="true" cx="667.5" cy="320" r="7" fill="none" stroke="#26774d" stroke-width="2"/>
<circle data-point="shifted" cx="666.0527562143243" cy="286.8526676414589" r="3.5" fill="#b44435"/>
<text x="677.5" y="340" class="small" text-anchor="start">x*</text>
<text x="676.0527562143243" y="274.8526676414589" class="small" text-anchor="start">x̂</text>
<text x="595" y="493" class="label" text-anchor="middle">θ=5°；κ₂=22.904</text>
<text x="595" y="529" class="label" text-anchor="middle">相对残差 ρ=1%</text>
<text x="595" y="565" class="label" text-anchor="middle">相对前向误差=22.882%</text>
<text x="595" y="598" class="small" text-anchor="middle">κ₂ρ 上界=22.904%</text>
</g>
<g data-angle="5" data-direction="max" data-scale="145" data-cx="990" data-cy="320">
<text x="990" y="135" class="label" text-anchor="middle">同一个 A：换非敏感方向</text>
<line x1="917.5" y1="218.5" x2="917.5" y2="421.5" stroke="#c6c4bc" stroke-width="1" />
<text x="917.5" y="443.5" class="small" text-anchor="middle">0</text>
<line x1="990.0" y1="218.5" x2="990.0" y2="421.5" stroke="#c6c4bc" stroke-width="1" />
<text x="990.0" y="443.5" class="small" text-anchor="middle">0.5</text>
<line x1="1062.5" y1="218.5" x2="1062.5" y2="421.5" stroke="#c6c4bc" stroke-width="1" />
<text x="1062.5" y="443.5" class="small" text-anchor="middle">1</text>
<line x1="1135.0" y1="218.5" x2="1135.0" y2="421.5" stroke="#c6c4bc" stroke-width="1" />
<text x="1135.0" y="443.5" class="small" text-anchor="middle">1.5</text>
<line x1="823.25" y1="392.5" x2="1156.75" y2="392.5" stroke="#c6c4bc" stroke-width="1" />
<text x="819.25" y="397.5" class="small" text-anchor="end">-0.5</text>
<line x1="823.25" y1="320" x2="1156.75" y2="320" stroke="#c6c4bc" stroke-width="1" />
