<circle data-point="shifted" cx="1063.9472437856757" cy="319.9368119716989" r="3.5" fill="#b44435"/>
<text x="1072.5" y="340" class="small" text-anchor="start">x*</text>
<text x="1073.9472437856757" y="307.9368119716989" class="small" text-anchor="start">x̂</text>
<text x="990" y="493" class="label" text-anchor="middle">θ=5°；κ₂=22.904</text>
<text x="990" y="529" class="label" text-anchor="middle">相对残差 ρ=1%</text>
<text x="990" y="565" class="label" text-anchor="middle">相对前向误差=0.99905%</text>
<text x="990" y="598" class="small" text-anchor="middle">κ₂ρ 上界=22.904%</text>
</g>
<text x="30" y="653" class="small" text-anchor="start">蓝/金实线：原方程；同色虚线：扰动方程。绿圈：原交点；红点：扰动交点。</text>
<text x="30" y="689" class="small" text-anchor="start">几何点很接近时可能重合；读下方数值。条件数给最坏方向上界，不强迫每一次扰动都达到它。</text>
<text x="30" y="725" class="small" text-anchor="start">此图展示实数扰动模型；实际计算还要另查输入舍入、消元误差，以及残差求值自身的精度。</text>
</svg>
