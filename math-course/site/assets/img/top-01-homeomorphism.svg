<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">连续双射的接缝与三种商空间</title>
<desc id="desc">参数t_n等于2π减1/n，显示n为1、4、16的三个精确位置及圆周像。像趋于(1,0)，参数却不趋于其逆像0。下方分别只粘一对边同向、只粘一对边反向、两对边同向，得到圆柱、Möbius带、环面。</desc>
<rect width="1200" height="1080" fill="#faf8f1"/>
<defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7z" fill="#5278a5"/></marker><marker id="gold" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7z" fill="#9b761b"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#203447}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px}</style>
<text x="30" y="42" class="title" text-anchor="start">连续双射为什么还不够？跟着一列点走到接缝</text>
<text x="30" y="80" class="small" text-anchor="start">f : [0,2π) → S¹，f(t) = (cos t, sin t)；蓝色实心端点被包含，空心端点被排除。</text>
<text x="300" y="125" class="label" text-anchor="middle">定义域 [0,2π)</text>
<text x="920" y="125" class="label" text-anchor="middle">目标圆周 S¹</text>
<path d="M90.000000 260.000000 L550.000000 260.000000" stroke="#5278a5" stroke-width="3" fill="none" />
<circle cx="90.000000000" cy="260.000000000" r="7" stroke="#5278a5" stroke-width="2" fill="#5278a5" />
<circle cx="550.000000000" cy="260.000000000" r="7" stroke="#5278a5" stroke-width="2" fill="#faf8f1" />
<text x="90" y="296" class="small" text-anchor="middle">0</text>
<text x="565" y="235" class="small" text-anchor="middle">2π（不含）</text>
<circle cx="920.000000000" cy="270.000000000" r="125" stroke="#91a0a9" stroke-width="2" fill="none" />
<circle cx="1045.000000000" cy="270.000000000" r="6" stroke="#5278a5" stroke-width="2" fill="#5278a5" />
<text x="1072" y="254" class="small" text-anchor="start">(1,0)</text>
<path d="M614.000000 210.000000 L726.000000 210.000000" stroke="#5278a5" stroke-width="2" fill="none" marker-end="url(#blue)" />
<text x="670" y="194" class="label" text-anchor="middle">f</text>
<circle cx="476.788726178" cy="260.000000000" r="4" stroke="#9564a1" stroke-width="2" fill="#9564a1" data-source-n="1"/>
<circle cx="987.537788234" cy="375.183873101" r="4" stroke="#9564a1" stroke-width="2" fill="#9564a1" data-image-n="1"/>
<path d="M476.788726 268.000000 L300.000000 311.000000" stroke="#9564a1" stroke-width="1" fill="none" />
<text x="300" y="330" class="small" text-anchor="middle">n=1</text>
<text x="967.5377882335174" y="383.18387310098706" class="small" text-anchor="end">n=1</text>
<circle cx="531.697181544" cy="260.000000000" r="4" stroke="#b77935" stroke-width="2" fill="#b77935" data-source-n="4"/>
<circle cx="1041.114052714" cy="300.925494907" r="4" stroke="#b77935" stroke-width="2" fill="#b77935" data-image-n="4"/>
<path d="M531.697182 268.000000 L380.000000 339.000000" stroke="#b77935" stroke-width="1" fill="none" />
<text x="380" y="358" class="small" text-anchor="middle">n=4</text>
<text x="1021.1140527138307" y="308.9254949068154" class="small" text-anchor="end">n=4</text>
<circle cx="545.424295386" cy="260.000000000" r="4" stroke="#3b846c" stroke-width="2" fill="#3b846c" data-source-n="16"/>
<circle cx="1044.755938838" cy="277.807414730" r="4" stroke="#3b846c" stroke-width="2" fill="#3b846c" data-image-n="16"/>
<path d="M545.424295 268.000000 L460.000000 367.000000" stroke="#3b846c" stroke-width="1" fill="none" />
<text x="460" y="386" class="small" text-anchor="middle">n=16</text>
<text x="1024.7559388375123" y="285.8074147302976" class="small" text-anchor="end">n=16</text>
<text x="30" y="453" class="small" text-anchor="start">tₙ = 2π−1/n 在实线中趋于 2π；在定义域内，它不趋于 0。</text>
<text x="30" y="484" class="small" text-anchor="start">f(tₙ) → (1,0)，但 f⁻¹(f(tₙ)) = tₙ ↛ 0 = f⁻¹(1,0)：逆映射在接缝处不连续。</text>
<path d="M30.000000 520.000000 L1170.000000 520.000000" stroke="#91a0a9" stroke-width="2" fill="none" />
<text x="30" y="567" class="title" text-anchor="start">粘合规则要说完整：只粘一对，还是两对？</text>
<text x="190.0" y="620" class="label" text-anchor="middle">圆柱面</text>
<path d="M55.000000 655.000000 L325.000000 655.000000" stroke="#abb5ba" stroke-width="3" fill="none" />
<path d="M55.000000 890.000000 L325.000000 890.000000" stroke="#abb5ba" stroke-width="3" fill="none" />
<path d="M55.000000 890.000000 L55.000000 655.000000" stroke="#5278a5" stroke-width="3" fill="none" data-glue="0:left"/>
<path d="M325.000000 890.000000 L325.000000 655.000000" stroke="#5278a5" stroke-width="3" fill="none" data-glue="0:right"/>
<path d="M55.000000 810.100000 L55.000000 739.600000" stroke="#5278a5" stroke-width="3" fill="none" marker-end="url(#blue)" />
<path d="M325.000000 810.100000 L325.000000 739.600000" stroke="#5278a5" stroke-width="3" fill="none" marker-end="url(#blue)" data-orientation="0:1"/>
<text x="52" y="914" class="small" text-anchor="middle">0</text>
<text x="328" y="914" class="small" text-anchor="middle">1</text>
<text x="190.0" y="766" class="label" text-anchor="middle">[0,1]²</text>
<text x="190.0" y="947" class="small" text-anchor="middle">(0,t) ~ (1,t)</text>
<text x="190.0" y="978" class="small" text-anchor="middle">上下边不粘 → 两条边界圆</text>
<text x="580.0" y="620" class="label" text-anchor="middle">Möbius 带</text>
<path d="M445.000000 655.000000 L715.000000 655.000000" stroke="#abb5ba" stroke-width="3" fill="none" />
<path d="M445.000000 890.000000 L715.000000 890.000000" stroke="#abb5ba" stroke-width="3" fill="none" />
<path d="M445.000000 890.000000 L445.000000 655.000000" stroke="#5278a5" stroke-width="3" fill="none" data-glue="1:left"/>
<path d="M715.000000 890.000000 L715.000000 655.000000" stroke="#5278a5" stroke-width="3" fill="none" data-glue="1:right"/>
<path d="M445.000000 810.100000 L445.000000 739.600000" stroke="#5278a5" stroke-width="3" fill="none" marker-end="url(#blue)" />
<path d="M715.000000 739.600000 L715.000000 810.100000" stroke="#5278a5" stroke-width="3" fill="none" marker-end="url(#blue)" data-orientation="1:-1"/>
<text x="442" y="914" class="small" text-anchor="middle">0</text>
<text x="718" y="914" class="small" text-anchor="middle">1</text>
<text x="580.0" y="766" class="label" text-anchor="middle">[0,1]²</text>
<text x="580.0" y="947" class="small" text-anchor="middle">(0,t) ~ (1,1−t)</text>
<text x="580.0" y="978" class="small" text-anchor="middle">上下边不粘 → 一条边界圆</text>
<text x="970.0" y="620" class="label" text-anchor="middle">环面</text>
<path d="M835.000000 655.000000 L1105.000000 655.000000" stroke="#9b761b" stroke-width="3" fill="none" />
<path d="M835.000000 890.000000 L1105.000000 890.000000" stroke="#9b761b" stroke-width="3" fill="none" />
<path d="M835.000000 890.000000 L835.000000 655.000000" stroke="#5278a5" stroke-width="3" fill="none" data-glue="2:left"/>
<path d="M1105.000000 890.000000 L1105.000000 655.000000" stroke="#5278a5" stroke-width="3" fill="none" data-glue="2:right"/>
<path d="M835.000000 810.100000 L835.000000 739.600000" stroke="#5278a5" stroke-width="3" fill="none" marker-end="url(#blue)" />
<path d="M1105.000000 810.100000 L1105.000000 739.600000" stroke="#5278a5" stroke-width="3" fill="none" marker-end="url(#blue)" data-orientation="2:1"/>
<path d="M932.200000 655.000000 L1013.200000 655.000000" stroke="#9b761b" stroke-width="3" fill="none" marker-end="url(#gold)" data-horizontal-pair="torus"/>
<path d="M932.200000 890.000000 L1013.200000 890.000000" stroke="#9b761b" stroke-width="3" fill="none" marker-end="url(#gold)" data-horizontal-pair="torus"/>
<text x="832" y="914" class="small" text-anchor="middle">0</text>
<text x="1108" y="914" class="small" text-anchor="middle">1</text>
<text x="970.0" y="766" class="label" text-anchor="middle">[0,1]²</text>
<text x="970.0" y="947" class="small" text-anchor="middle">两对边都同向配对</text>
<text x="970.0" y="978" class="small" text-anchor="middle">所有边都粘 → 没有边界</text>
<text x="970.0" y="1006" class="small" text-anchor="middle">(s,0) ~ (s,1)</text>
<text x="30" y="1052" class="small" text-anchor="start">同色箭头规定参数对应；灰边不配对。两对都粘且其中一对反向，得到 Klein 瓶，不是 Möbius 带。</text>
</svg>
