<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030" role="img" aria-labelledby="title desc">
<title id="title">零和矩阵的双向证书与完全信息树的逆向归纳</title>
<desc id="desc">上方矩阵三零一二的行保底在p等于四分之一时最大，列上界在q等于二分之一时最小，两边都等于二分之三。下方博弈树由B先比较三与二选择拿，A预见后比较二与一也选择拿。</desc>
<rect width="1100" height="1030" fill="#f8fafc"/>
<style>text{font-family:Arial,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#172b45;font-size:17px}</style>
<text x="40" y="46" text-anchor="start" style="font-size:27px;fill:#172b45">同时选动作：上下界接上；先后选动作：从末端倒推</text>
<text x="40" y="88" text-anchor="start" style="font-size:17px;fill:#172b45">上方行收益 A = [[3, 0], [1, 2]]，列玩家取相反收益。下方收益对先 A 后 B。</text>
<text x="65" y="137" text-anchor="start" style="font-size:21px;fill:#172b45">A. 行玩家最大化较低的一条线</text>
<text x="620" y="137" text-anchor="start" style="font-size:21px;fill:#172b45">B. 列玩家最小化较高的一条线</text>
<line x1="100" y1="425" x2="470" y2="425" stroke="#b9c9d9" stroke-width="1"/>
<text x="88" y="430" text-anchor="end" style="font-size:14px;fill:#172b45">0</text>
<line x1="100" y1="355" x2="470" y2="355" stroke="#b9c9d9" stroke-width="1"/>
<text x="88" y="360" text-anchor="end" style="font-size:14px;fill:#172b45">1</text>
<line x1="100" y1="320.0" x2="470" y2="320.0" stroke="#b9c9d9" stroke-width="1"/>
<text x="88" y="325.0" text-anchor="end" style="font-size:14px;fill:#172b45">1.5</text>
<line x1="100" y1="285" x2="470" y2="285" stroke="#b9c9d9" stroke-width="1"/>
<text x="88" y="290" text-anchor="end" style="font-size:14px;fill:#172b45">2</text>
<line x1="100" y1="215" x2="470" y2="215" stroke="#b9c9d9" stroke-width="1"/>
<text x="88" y="220" text-anchor="end" style="font-size:14px;fill:#172b45">3</text>
<text x="100" y="452" text-anchor="middle" style="font-size:13px;fill:#172b45">0</text>
<text x="192.5" y="452" text-anchor="middle" style="font-size:13px;fill:#172b45">0.25</text>
<text x="285.0" y="452" text-anchor="middle" style="font-size:13px;fill:#172b45">0.5</text>
<text x="377.5" y="452" text-anchor="middle" style="font-size:13px;fill:#172b45">0.75</text>
<text x="470" y="452" text-anchor="middle" style="font-size:13px;fill:#172b45">1</text>
<line x1="100" y1="355" x2="470" y2="215" stroke="#2867a1" stroke-width="3"/>
<line x1="100" y1="285" x2="470" y2="425" stroke="#ae7526" stroke-width="3"/>
<text x="100" y="183" text-anchor="start" style="font-size:16px;fill:#172b45">蓝：1+2p　金：2−2p</text>
<text x="100" y="495" text-anchor="start" style="font-size:18px;fill:#172b45">p=1/4 时，保底达到 3/2。</text>
<polyline points="100,355 192.5,320.0 470,425" fill="none" stroke="#247e5d" stroke-width="5"/>
<circle cx="192.5" cy="320.0" r="7" fill="#247e5d"/>
<text x="290" y="320" text-anchor="start" style="font-size:15px;fill:#172b45">(1/4, 3/2)</text>
<text x="470" y="476" text-anchor="middle" style="font-size:18px;fill:#172b45">p</text>
<line x1="650" y1="425" x2="1020" y2="425" stroke="#b9c9d9" stroke-width="1"/>
<text x="638" y="430" text-anchor="end" style="font-size:14px;fill:#172b45">0</text>
<line x1="650" y1="355" x2="1020" y2="355" stroke="#b9c9d9" stroke-width="1"/>
<text x="638" y="360" text-anchor="end" style="font-size:14px;fill:#172b45">1</text>
<line x1="650" y1="320.0" x2="1020" y2="320.0" stroke="#b9c9d9" stroke-width="1"/>
<text x="638" y="325.0" text-anchor="end" style="font-size:14px;fill:#172b45">1.5</text>
<line x1="650" y1="285" x2="1020" y2="285" stroke="#b9c9d9" stroke-width="1"/>
<text x="638" y="290" text-anchor="end" style="font-size:14px;fill:#172b45">2</text>
<line x1="650" y1="215" x2="1020" y2="215" stroke="#b9c9d9" stroke-width="1"/>
<text x="638" y="220" text-anchor="end" style="font-size:14px;fill:#172b45">3</text>
<text x="650" y="452" text-anchor="middle" style="font-size:13px;fill:#172b45">0</text>
<text x="742.5" y="452" text-anchor="middle" style="font-size:13px;fill:#172b45">0.25</text>
<text x="835.0" y="452" text-anchor="middle" style="font-size:13px;fill:#172b45">0.5</text>
<text x="927.5" y="452" text-anchor="middle" style="font-size:13px;fill:#172b45">0.75</text>
<text x="1020" y="452" text-anchor="middle" style="font-size:13px;fill:#172b45">1</text>
<line x1="650" y1="425" x2="1020" y2="215" stroke="#2867a1" stroke-width="3"/>
<line x1="650" y1="285" x2="1020" y2="355" stroke="#ae7526" stroke-width="3"/>
<text x="650" y="183" text-anchor="start" style="font-size:16px;fill:#172b45">蓝：3q　金：2−q</text>
<text x="650" y="495" text-anchor="start" style="font-size:18px;fill:#172b45">q=1/2 时，上界降到 3/2。</text>
<polyline points="650,285 835.0,320.0 1020,215" fill="none" stroke="#247e5d" stroke-width="5"/>
<circle cx="835.0" cy="320.0" r="7" fill="#247e5d"/>
<text x="850" y="385" text-anchor="start" style="font-size:15px;fill:#172b45">(1/2, 3/2)</text>
<text x="1020" y="476" text-anchor="middle" style="font-size:18px;fill:#172b45">q</text>
<text x="40" y="536" text-anchor="start" style="font-size:17px;fill:#172b45">两份可行证书的差为 0，因而同时最优。绿色线分别是下包络与上包络。</text>
<line x1="40" y1="558" x2="1060" y2="558" stroke="#b9c9d9" stroke-width="1"/>
<text x="40" y="604" text-anchor="start" style="font-size:22px;fill:#172b45">C. 两步树：每个节点比较当前行动者自己的收益</text>
<line x1="370" y1="655" x2="170" y2="790" stroke="#2867a1" stroke-width="4"/>
<line x1="370" y1="655" x2="690" y2="755" stroke="#b9c9d9" stroke-width="2"/>
<line x1="690" y1="755" x2="560" y2="905" stroke="#2867a1" stroke-width="4"/>
<line x1="690" y1="755" x2="915" y2="905" stroke="#b9c9d9" stroke-width="2"/>
<circle cx="370" cy="655" r="24" fill="#2867a1"/>
<text x="370" y="662" text-anchor="middle" style="font-size:20px;fill:#ffffff">A</text>
<circle cx="690" cy="755" r="24" fill="#2867a1"/>
<text x="690" y="762" text-anchor="middle" style="font-size:20px;fill:#ffffff">B</text>
<text x="253" y="711" text-anchor="start" style="font-size:17px;fill:#172b45">拿</text>
<text x="525" y="687" text-anchor="start" style="font-size:17px;fill:#172b45">传</text>
<text x="599" y="827" text-anchor="start" style="font-size:17px;fill:#172b45">拿</text>
<text x="816" y="827" text-anchor="start" style="font-size:17px;fill:#172b45">传</text>
<rect x="105" y="770" width="130" height="50" rx="6" fill="#e8eff7" stroke="#b9c9d9"/>
<text x="170" y="803" text-anchor="middle" style="font-size:24px;fill:#172b45">(2, 0)</text>
<rect x="495" y="885" width="130" height="50" rx="6" fill="#e8eff7" stroke="#b9c9d9"/>
<text x="560" y="918" text-anchor="middle" style="font-size:24px;fill:#172b45">(1, 3)</text>
<rect x="850" y="885" width="130" height="50" rx="6" fill="#e8eff7" stroke="#b9c9d9"/>
<text x="915" y="918" text-anchor="middle" style="font-size:24px;fill:#172b45">(3, 2)</text>
<text x="55" y="864" text-anchor="start" style="font-size:17px;fill:#172b45">先看 B：3 &gt; 2，选“拿”。</text>
<text x="55" y="905" text-anchor="start" style="font-size:17px;fill:#172b45">再看 A：2 &gt; 1，也选“拿”。</text>
<text x="40" y="982" text-anchor="start" style="font-size:17px;fill:#172b45">蓝色分支组成完整策略，实际路径在 A 处结束。B 的计划仍是子博弈完美性检查的一部分。</text>
</svg>
