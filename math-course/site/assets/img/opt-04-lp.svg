<text x="185.0" y="193.0" font-size="14" text-anchor="start">(2,6)，利润 36</text>
<text x="75" y="561" font-size="14" text-anchor="start">金虚线：3x+5y=36；蓝区：全部可行点。</text>
<text x="75" y="589" font-size="14" text-anchor="start">原始松弛 (2,0,0)，对偶 u=(0,1.5,1)。</text>
<text x="484" y="505" font-size="14" text-anchor="start">x</text>
<text x="75" y="98" font-size="14" text-anchor="start">y</text>
