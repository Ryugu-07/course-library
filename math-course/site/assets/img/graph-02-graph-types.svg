<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Graph vocabulary and three special graph families</title>
  <desc id="desc">An example graph labels vertices, edges, degree, a path, and two connected components. Separate panels show the complete graph K4, a bipartite graph, and a tree.</desc>
  <defs>
    <style>
      .title,.heading,.label,.small{font-family:Arial}.title{font-size:28px;font-weight:700;fill:#18212b}.heading{font-size:18px;font-weight:700;fill:#18212b}.label{font-size:15px;font-weight:700;fill:#18212b}.small{font-size:13px;font-weight:500;fill:#44505d}.panel{fill:#f7f9fb;stroke:#cbd5df;stroke-width:2}.edge{stroke:#667482;stroke-width:2.4}.path{stroke:#b66a22;stroke-width:5;stroke-linecap:round}.node{fill:#fff;stroke:#315f9d;stroke-width:2.3}.left{fill:#e7f0fb;stroke:#315f9d;stroke-width:2.3}.right{fill:#e8f5ec;stroke:#39734d;stroke-width:2.3}.tree{fill:#fff8e6;stroke:#9b6a12;stroke-width:2.3}
    </style>
  </defs>
  <rect width="1100" height="650" fill="#fff"/>
  <text x="48" y="48" class="title">Graph vocabulary: inspect the objects, not just the formula</text>

  <rect x="48" y="76" width="500" height="244" rx="8" class="panel"/>
  <text x="70" y="108" class="heading">Example graph</text>
  <line x1="126" y1="190" x2="228" y2="142" class="path"/><line x1="228" y1="142" x2="334" y2="194" class="path"/>
  <line x1="228" y1="142" x2="232" y2="264" class="edge"/><line x1="126" y1="190" x2="232" y2="264" class="edge"/>
  <line x1="435" y1="174" x2="490" y2="238" class="edge"/>
  <circle cx="126" cy="190" r="20" class="node"/><circle cx="228" cy="142" r="20" class="node"/><circle cx="334" cy="194" r="20" class="node"/><circle cx="232" cy="264" r="20" class="node"/><circle cx="435" cy="174" r="20" class="node"/><circle cx="490" cy="238" r="20" class="node"/>
  <text x="126" y="190" text-anchor="middle" dominant-baseline="middle" class="label">A</text><text x="228" y="142" text-anchor="middle" dominant-baseline="middle" class="label">B</text><text x="334" y="194" text-anchor="middle" dominant-baseline="middle" class="label">C</text><text x="232" y="264" text-anchor="middle" dominant-baseline="middle" class="label">D</text><text x="435" y="174" text-anchor="middle" dominant-baseline="middle" class="label">E</text><text x="490" y="238" text-anchor="middle" dominant-baseline="middle" class="label">F</text>
  <text x="70" y="294" class="small">orange path A-B-C | deg(B)=3 | 2 connected components</text>

  <rect x="574" y="76" width="478" height="244" rx="8" class="panel"/>
  <text x="596" y="108" class="heading">Complete graph K4</text>
  <line x1="704" y1="145" x2="918" y2="145" class="edge"/><line x1="704" y1="145" x2="704" y2="260" class="edge"/><line x1="704" y1="145" x2="918" y2="260" class="edge"/><line x1="918" y1="145" x2="704" y2="260" class="edge"/><line x1="918" y1="145" x2="918" y2="260" class="edge"/><line x1="704" y1="260" x2="918" y2="260" class="edge"/>
  <circle cx="704" cy="145" r="20" class="node"/><circle cx="918" cy="145" r="20" class="node"/><circle cx="704" cy="260" r="20" class="node"/><circle cx="918" cy="260" r="20" class="node"/>
  <text x="704" y="145" text-anchor="middle" dominant-baseline="middle" class="label">1</text><text x="918" y="145" text-anchor="middle" dominant-baseline="middle" class="label">2</text><text x="704" y="260" text-anchor="middle" dominant-baseline="middle" class="label">3</text><text x="918" y="260" text-anchor="middle" dominant-baseline="middle" class="label">4</text>
  <text x="596" y="294" class="small">every pair is adjacent | E = 4 choose 2 = 6</text>

  <rect x="48" y="346" width="500" height="256" rx="8" class="panel"/>
  <text x="70" y="378" class="heading">Bipartite graph</text>
  <text x="142" y="410" text-anchor="middle" class="small">set U</text><text x="430" y="410" text-anchor="middle" class="small">set W</text>
  <line x1="142" y1="445" x2="430" y2="445" class="edge"/><line x1="142" y1="445" x2="430" y2="500" class="edge"/><line x1="142" y1="500" x2="430" y2="445" class="edge"/><line x1="142" y1="550" x2="430" y2="500" class="edge"/>
  <circle cx="142" cy="445" r="20" class="left"/><circle cx="142" cy="500" r="20" class="left"/><circle cx="142" cy="550" r="20" class="left"/><circle cx="430" cy="445" r="20" class="right"/><circle cx="430" cy="500" r="20" class="right"/>
  <text x="142" y="445" text-anchor="middle" dominant-baseline="middle" class="label">u1</text><text x="142" y="500" text-anchor="middle" dominant-baseline="middle" class="label">u2</text><text x="142" y="550" text-anchor="middle" dominant-baseline="middle" class="label">u3</text><text x="430" y="445" text-anchor="middle" dominant-baseline="middle" class="label">w1</text><text x="430" y="500" text-anchor="middle" dominant-baseline="middle" class="label">w2</text>
  <text x="70" y="586" class="small">edges cross the partition; no edge stays within a side</text>

  <rect x="574" y="346" width="478" height="256" rx="8" class="panel"/>
  <text x="596" y="378" class="heading">Tree</text>
  <line x1="812" y1="425" x2="700" y2="485" class="edge"/><line x1="812" y1="425" x2="812" y2="500" class="edge"/><line x1="812" y1="425" x2="924" y2="485" class="edge"/><line x1="700" y1="485" x2="650" y2="545" class="edge"/><line x1="700" y1="485" x2="750" y2="545" class="edge"/>
  <circle cx="812" cy="425" r="20" class="tree"/><circle cx="700" cy="485" r="20" class="tree"/><circle cx="812" cy="500" r="20" class="tree"/><circle cx="924" cy="485" r="20" class="tree"/><circle cx="650" cy="545" r="20" class="tree"/><circle cx="750" cy="545" r="20" class="tree"/>
  <text x="812" y="425" text-anchor="middle" dominant-baseline="middle" class="label">r</text><text x="700" y="485" text-anchor="middle" dominant-baseline="middle" class="label">a</text><text x="812" y="500" text-anchor="middle" dominant-baseline="middle" class="label">b</text><text x="924" y="485" text-anchor="middle" dominant-baseline="middle" class="label">c</text><text x="650" y="545" text-anchor="middle" dominant-baseline="middle" class="label">d</text><text x="750" y="545" text-anchor="middle" dominant-baseline="middle" class="label">e</text>
  <text x="596" y="586" class="small">connected + acyclic | unique path | E = V - 1</text>
</svg>
