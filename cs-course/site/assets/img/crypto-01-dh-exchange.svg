<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2f6395"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#c65a5a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" rx="8" fill="#ffffff" stroke="#d9e1ea" stroke-width="1.5"/>
<text x="38" y="46" font-size="25" fill="#333333" text-anchor="start" font-weight="700">Diffie-Hellman：公开交换，私下得到同一密钥</text>
<line x1="38" y1="65" x2="922" y2="65" stroke="#d9e1ea" stroke-width="2"/>
<rect x="56" y="94" width="848" height="380" rx="8" fill="#f7fafc" stroke="#d9e1ea" stroke-width="1.5"/>
<rect x="110" y="122" width="140" height="58" rx="10" fill="#ffffff" stroke="#2f6395" stroke-width="1.5"/>
<text x="180.0" y="143.0" font-size="18" fill="#333333" text-anchor="middle" font-weight="700">Alice</text>
<text x="180.0" y="173.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">私有 a</text>
<rect x="690" y="122" width="140" height="58" rx="10" fill="#ffffff" stroke="#4f9d69" stroke-width="1.5"/>
<text x="760.0" y="143.0" font-size="18" fill="#333333" text-anchor="middle" font-weight="700">Bob</text>
<text x="760.0" y="173.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">私有 b</text>
<rect x="400" y="352" width="140" height="58" rx="10" fill="#ffffff" stroke="#c65a5a" stroke-width="1.5"/>
<text x="470.0" y="373.0" font-size="18" fill="#333333" text-anchor="middle" font-weight="700">Eve</text>
<text x="470.0" y="403.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">只看网络</text>
<line x1="180" y1="192" x2="180" y2="425" stroke="#8fb8e0" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="760" y1="192" x2="760" y2="425" stroke="#4f9d69" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="470" y1="250" x2="470" y2="342" stroke="#c65a5a" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="350" y="105" width="240" height="45" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="470.0" y="132.5" font-size="15" fill="#333333" text-anchor="middle" font-weight="700">公开参数：p, g</text>
<line x1="180" y1="235" x2="760" y2="235" stroke="#2f6395" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="470" y="222" font-size="14" fill="#2f6395" text-anchor="middle" font-weight="700">A = g^a mod p</text>
<line x1="760" y1="292" x2="180" y2="292" stroke="#4f9d69" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="470" y="280" font-size="14" fill="#4f9d69" text-anchor="middle" font-weight="700">B = g^b mod p</text>
<text x="180" y="342" font-size="15" fill="#2f6395" text-anchor="middle" font-weight="700">K = B^a = g^{ab}</text>
<text x="760" y="342" font-size="15" fill="#4f9d69" text-anchor="middle" font-weight="700">K = A^b = g^{ab}</text>
<text x="470" y="430" font-size="14" fill="#c65a5a" text-anchor="middle" font-weight="400">看到 p,g,A,B；离散对数难，算不出 a/b/K</text>
</svg>
