<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="Thread Hierarchy">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #444; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #c8d1dc; stroke-width: 2; rx: 8; }
      .soft { fill: #f8fafc; stroke: #d8e0e8; stroke-width: 2; rx: 8; }
      .accent { fill: #2f6395; stroke: #2f6395; }
      .line { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #777; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title">Thread Hierarchy</text>
<rect x="48" y="90" width="1004" height="470" fill="#e5eff8" opacity="0.45" rx="18"/>
  <rect x="178.0" y="265.0" width="150.0" height="88.0" class="box"/>
  <text x="253.0" y="309.0" class="label" text-anchor="middle" dominant-baseline="middle">Thread</text>
  <path d="M 336.0 309.0 L 368.0 309.0" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="376.0" y="265.0" width="150.0" height="88.0" class="box"/>
  <text x="451.0" y="309.0" class="label" text-anchor="middle" dominant-baseline="middle">Hierarchy</text>
  <path d="M 534.0 309.0 L 566.0 309.0" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="574.0" y="265.0" width="150.0" height="88.0" class="box"/>
  <text x="649.0" y="309.0" class="label" text-anchor="middle" dominant-baseline="middle">Input</text>
  <path d="M 732.0 309.0 L 764.0 309.0" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="772.0" y="265.0" width="150.0" height="88.0" class="box"/>
  <text x="847.0" y="309.0" class="label" text-anchor="middle" dominant-baseline="middle">Process</text>
  <text x="550.0" y="440.0" class="small" text-anchor="middle" dominant-baseline="middle">data and control move left to right</text>
</svg>
