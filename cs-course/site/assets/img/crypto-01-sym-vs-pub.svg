<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2f6395"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#c65a5a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" rx="8" fill="#ffffff" stroke="#d9e1ea" stroke-width="1.5"/>
<text x="38" y="46" font-size="25" fill="#333333" text-anchor="start" font-weight="700">对称密钥 vs 公钥密码</text>
<line x1="38" y1="65" x2="922" y2="65" stroke="#d9e1ea" stroke-width="2"/>
<rect x="60" y="100" width="390" height="360" rx="8" fill="#f7fafc" stroke="#d9e1ea" stroke-width="1.5"/>
<text x="255" y="134" font-size="17" fill="#2f6395" text-anchor="middle" font-weight="700">对称加密：同一把钥匙 K</text>
<rect x="102" y="205" width="105" height="54" rx="10" fill="#ffffff" stroke="#2f6395" stroke-width="1.5"/>
<text x="154.5" y="237.0" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">Alice</text>
<rect x="302" y="205" width="105" height="54" rx="10" fill="#ffffff" stroke="#2f6395" stroke-width="1.5"/>
<text x="354.5" y="237.0" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">Bob</text>
<line x1="210" y1="232" x2="298" y2="232" stroke="#2f6395" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="255" y="214" font-size="13" fill="#2f6395" text-anchor="middle" font-weight="700">K 加密/解密</text>
<rect x="180" y="315" width="150" height="60" rx="10" fill="#fff0d6" stroke="#d28a25" stroke-width="1.5"/>
<text x="255.0" y="337.0" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">问题</text>
<text x="255.0" y="367.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">K 怎么安全分发？</text>
<rect x="510" y="100" width="390" height="360" rx="8" fill="#f7fafc" stroke="#d9e1ea" stroke-width="1.5"/>
<text x="705" y="134" font-size="17" fill="#4f9d69" text-anchor="middle" font-weight="700">公钥加密：公钥锁，私钥开</text>
<rect x="552" y="205" width="105" height="54" rx="10" fill="#ffffff" stroke="#4f9d69" stroke-width="1.5"/>
<text x="604.5" y="237.0" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">Alice</text>
<rect x="752" y="205" width="105" height="54" rx="10" fill="#ffffff" stroke="#4f9d69" stroke-width="1.5"/>
<text x="804.5" y="237.0" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">Bob</text>
<line x1="660" y1="232" x2="748" y2="232" stroke="#4f9d69" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="705" y="214" font-size="13" fill="#4f9d69" text-anchor="middle" font-weight="700">Bob 公钥加密</text>
<text x="802" y="292" font-size="13" fill="#4f9d69" text-anchor="middle" font-weight="700">Bob 私钥解密</text>
<rect x="620" y="315" width="170" height="60" rx="10" fill="#dff1e6" stroke="#4f9d69" stroke-width="1.5"/>
<text x="705.0" y="337.0" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">公开钥匙可广播</text>
<text x="705.0" y="367.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">私钥不离开 Bob</text>
</svg>
