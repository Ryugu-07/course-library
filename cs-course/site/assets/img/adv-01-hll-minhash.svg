<text x="473.0" y="396.0" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">E[min] ≈</text>
<text x="473.0" y="416.0" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">1/(d+1)  ⇒  d</text>
<text x="473.0" y="436.0" font-size="16" fill="#333333" text-anchor="middle" font-weight="700">≈ 1/min - 1</text>
<text x="96" y="435" font-size="14" fill="#6b7280" text-anchor="start" font-weight="400">HyperLogLog 使用“前导零最大值”等价地估计哈希落得有多靠前。</text>
