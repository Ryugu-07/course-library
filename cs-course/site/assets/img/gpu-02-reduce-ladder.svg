      .thin { stroke: #777; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title">Reduce Ladder</text>
<rect x="48" y="86" width="1004" height="496" fill="#e5eff8" opacity="0.38" rx="18"/>
  <rect x="210.0" y="130.0" width="680.0" height="54" fill="#fff" stroke="#2f6395" stroke-width="2" rx="8"/>
  <text x="550.0" y="157.0" class="label" text-anchor="middle" dominant-baseline="middle">Reduce</text>
  <rect x="233.0" y="202.0" width="634.0" height="54" fill="#fff" stroke="#c8d1dc" stroke-width="2" rx="8"/>
