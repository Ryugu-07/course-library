<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">FlashAttention：分开记三种成本</title><desc id="desc">朴素路径保存NxN分数矩阵；分块路径在片上累积m,l,o。显存存储、算术和访存复杂度分别列出。</desc><style>text{font-family:system-ui,"PingFang SC",sans-serif;fill:#203638}.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:650}.s{font-size:17px}.m{font-size:16px;fill:#53686a}rect{rx:8}</style><rect width="1000" height="570" fill="#f7f6f0"/><text x="36" y="48" class="t">FlashAttention：分开记三种成本</text><text x="36" y="86" class="m">N：序列长度　d：每头维数　M：SRAM 可容纳的标量数</text>
<rect x="36" y="115" width="450" height="230" fill="#fff" stroke="#cad7d2"/><rect x="514" y="115" width="450" height="230" fill="#fff" stroke="#cad7d2"/>
<text x="62" y="154" class="h">朴素：完整分数矩阵进入 HBM</text><rect x="70" y="175" width="140" height="140" fill="#efd4a9"/>
<text x="94" y="250" class="h">N × N</text><text x="235" y="215" class="s">分数 → softmax → 加权</text><text x="235" y="250" class="s">跨显存多次读写</text><text x="235" y="285" class="s">存储含 N² 项</text>
<text x="540" y="154" class="h">分块：片上累积后只写结果</text><rect x="550" y="185" width="100" height="70" fill="#bdd9e8"/><text x="568" y="228" class="s">Q/K/V 块</text><text x="665" y="228" class="s">→</text><rect x="705" y="185" width="220" height="70" fill="#cce1d0"/><text x="723" y="215" class="s">最大值 m、归一化 l</text><text x="723" y="241" class="s">加权累积 o</text><text x="550" y="305" class="s">各块反复更新状态；不保存完整分数矩阵</text>
<text x="36" y="389" class="h">省掉的是中间矩阵，不是所有平方增长</text><text x="36" y="429" class="s">存储约 O(Nd)；稠密算术仍 Θ(N²d)。</text><text x="36" y="467" class="s">原论文模型的 HBM 访问：Θ(N²d² / M)，条件 d ≤ M ≤ Nd。</text><text x="36" y="515" class="m">固定 d、M，N 翻倍时访问量仍可能约增四倍；渐近计数不是实测加速比。</text></svg>