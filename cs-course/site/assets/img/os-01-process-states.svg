<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="Process States">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #444; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #c8d1dc; stroke-width: 2; rx: 8; }
      .soft { fill: #f8fafc; stroke: #d8e0e8; stroke-width: 2; rx: 8; }
      .accent { fill: #2f6395; stroke: #2f6395; }
      .line { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #777; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title">Process States</text>
<rect x="48" y="88" width="1004" height="486" fill="#e5eff8" opacity="0.42" rx="18"/>
  <circle cx="280.0" cy="220.0" r="58.0" fill="#fff" stroke="#2f6395" stroke-width="2"/>
  <text x="280.0" y="220.0" class="label" text-anchor="middle" dominant-baseline="middle">Ready</text>
  <circle cx="550.0" cy="155.0" r="58.0" fill="#fff" stroke="#c8d1dc" stroke-width="2"/>
  <text x="550.0" y="155.0" class="label" text-anchor="middle" dominant-baseline="middle">Running</text>
  <circle cx="820.0" cy="220.0" r="58.0" fill="#fff" stroke="#c8d1dc" stroke-width="2"/>
  <text x="820.0" y="220.0" class="label" text-anchor="middle" dominant-baseline="middle">Blocked</text>
  <path d="M 280.0 220.0 Q 550 300 550.0 155.0" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 550.0 155.0 Q 550 300 820.0 220.0" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <path d="M 820.0 220.0 Q 550 300 280.0 220.0" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="550.0" y="520.0" class="small" text-anchor="middle" dominant-baseline="middle">events trigger transitions; invariants live on edges</text>
</svg>
