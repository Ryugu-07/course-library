<rect x="56" y="94" width="848" height="380" rx="8" fill="#f7fafc" stroke="#d9e1ea" stroke-width="1.5"/>
<rect x="65" y="197" width="150" height="96" rx="10" fill="#ffffff" stroke="#2f6395" stroke-width="1.5"/>
<text x="140.0" y="237.0" font-size="17" fill="#333333" text-anchor="middle" font-weight="700">根 CA</text>
<text x="140.0" y="267.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">自签名，预置于系统/浏览器</text>
