<text x="360.0" y="267.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">由根 CA 签名</text>
<rect x="505" y="197" width="150" height="96" rx="10" fill="#ffffff" stroke="#d28a25" stroke-width="1.5"/>
<text x="580.0" y="237.0" font-size="17" fill="#333333" text-anchor="middle" font-weight="700">网站证书</text>
<text x="580.0" y="267.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">由中间 CA 签名</text>
<rect x="725" y="197" width="150" height="96" rx="10" fill="#ffffff" stroke="#c65a5a" stroke-width="1.5"/>
<text x="800.0" y="237.0" font-size="17" fill="#333333" text-anchor="middle" font-weight="700">example.com</text>
<text x="800.0" y="267.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">TLS 握手出示</text>
<line x1="218" y1="245" x2="282" y2="245" stroke="#2f6395" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="250.0" y="229" font-size="12.5" fill="#2f6395" text-anchor="middle" font-weight="700">签名验证</text>
<line x1="438" y1="245" x2="502" y2="245" stroke="#2f6395" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="470.0" y="229" font-size="12.5" fill="#2f6395" text-anchor="middle" font-weight="700">签名验证</text>
<line x1="658" y1="245" x2="722" y2="245" stroke="#2f6395" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="690.0" y="229" font-size="12.5" fill="#2f6395" text-anchor="middle" font-weight="700">签名验证</text>
<rect x="280" y="385" width="400" height="54" rx="10" fill="#dcebf8" stroke="#2f6395" stroke-width="1.5"/>
<text x="480.0" y="417.0" font-size="14" fill="#333333" text-anchor="middle" font-weight="700">信任不是“相信网站”，而是验证每一级签名是否能连回可信根。</text>
