<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2f6395"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#c65a5a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" rx="8" fill="#ffffff" stroke="#d9e1ea" stroke-width="1.5"/>
<text x="38" y="46" font-size="25" fill="#333333" text-anchor="start" font-weight="700">RSA 流程：密钥生成、加密、解密</text>
<line x1="38" y1="65" x2="922" y2="65" stroke="#d9e1ea" stroke-width="2"/>
<rect x="75" y="130" width="220" height="250" rx="12" fill="#f7fafc" stroke="#2f6395" stroke-width="1.5"/>
<text x="185" y="166" font-size="18" fill="#2f6395" text-anchor="middle" font-weight="700">密钥生成</text>
<text x="185" y="210" font-size="15" fill="#333333" text-anchor="middle" font-weight="400">选 p,q</text>
<text x="185" y="237" font-size="15" fill="#333333" text-anchor="middle" font-weight="400">n=pq</text>
<text x="185" y="264" font-size="15" fill="#333333" text-anchor="middle" font-weight="400">φ=(p-1)(q-1)</text>
<text x="185" y="291" font-size="15" fill="#333333" text-anchor="middle" font-weight="400">选 e，求 d</text>
<rect x="370" y="130" width="220" height="250" rx="12" fill="#f7fafc" stroke="#4f9d69" stroke-width="1.5"/>
<text x="480" y="166" font-size="18" fill="#4f9d69" text-anchor="middle" font-weight="700">加密</text>
<text x="480" y="210" font-size="15" fill="#333333" text-anchor="middle" font-weight="400">公钥 (n,e)</text>
<text x="480" y="237" font-size="15" fill="#333333" text-anchor="middle" font-weight="400">c = m^e mod n</text>
<rect x="665" y="130" width="220" height="250" rx="12" fill="#f7fafc" stroke="#d28a25" stroke-width="1.5"/>
<text x="775" y="166" font-size="18" fill="#d28a25" text-anchor="middle" font-weight="700">解密</text>
<text x="775" y="210" font-size="15" fill="#333333" text-anchor="middle" font-weight="400">私钥 d</text>
<text x="775" y="237" font-size="15" fill="#333333" text-anchor="middle" font-weight="400">m = c^d mod n</text>
<line x1="295" y1="255" x2="365" y2="255" stroke="#2f6395" stroke-width="3" marker-end="url(#arrow-blue)"/>
<line x1="590" y1="255" x2="660" y2="255" stroke="#4f9d69" stroke-width="3" marker-end="url(#arrow-blue)"/>
<rect x="305" y="410" width="350" height="54" rx="10" fill="#f7dddd" stroke="#c65a5a" stroke-width="1.5"/>
<text x="480.0" y="442.0" font-size="15" fill="#333333" text-anchor="middle" font-weight="700">安全直觉：知道 n</text>
<text x="480.0" y="462.0" font-size="15" fill="#333333" text-anchor="middle" font-weight="700">很容易，分解 n=pq</text>
<text x="480.0" y="482.0" font-size="15" fill="#333333" text-anchor="middle" font-weight="700">很难</text>
</svg>
