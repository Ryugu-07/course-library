<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2f6395"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#c65a5a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" rx="8" fill="#ffffff" stroke="#d9e1ea" stroke-width="1.5"/>
<text x="38" y="46" font-size="25" fill="#333333" text-anchor="start" font-weight="700">零知识洞穴：证明知道秘密，但不泄露秘密</text>
<line x1="38" y1="65" x2="922" y2="65" stroke="#d9e1ea" stroke-width="2"/>
<rect x="56" y="94" width="848" height="380" rx="8" fill="#f7fafc" stroke="#d9e1ea" stroke-width="1.5"/>
<path d="M280,395 C175,330 170,185 300,145 C430,105 485,190 480,270" fill="none" stroke="#2f6395" stroke-width="24" opacity="0.28"/>
<path d="M680,395 C785,330 790,185 660,145 C530,105 475,190 480,270" fill="none" stroke="#2f6395" stroke-width="24" opacity="0.28"/>
<path d="M480,270 L480,190" fill="none" stroke="#c65a5a" stroke-width="12"/>
<text x="480" y="180" font-size="15" fill="#c65a5a" text-anchor="middle" font-weight="700">秘密门</text>
<circle cx="480" cy="418" r="26" fill="#ffffff" stroke="#2f6395" stroke-width="3"/>
<text x="480" y="424" font-size="17" fill="#2f6395" text-anchor="middle" font-weight="700">V</text>
<text x="480" y="458" font-size="14" fill="#2f6395" text-anchor="middle" font-weight="400">验证者随机喊：左 / 右</text>
<circle cx="300" cy="248" r="24" fill="#dff1e6" stroke="#4f9d69" stroke-width="3"/>
<text x="300" y="254" font-size="16" fill="#4f9d69" text-anchor="middle" font-weight="700">P</text>
<text x="300" y="286" font-size="13" fill="#4f9d69" text-anchor="middle" font-weight="400">证明者</text>
<line x1="480" y1="395" x2="340" y2="282" stroke="#4f9d69" stroke-width="3" marker-end="url(#arrow-blue)"/>
<line x1="480" y1="395" x2="620" y2="282" stroke="#4f9d69" stroke-width="3" marker-end="url(#arrow-blue)"/>
<rect x="600" y="330" width="230" height="74" rx="10" fill="#dff1e6" stroke="#4f9d69" stroke-width="1.5"/>
<text x="715" y="360" font-size="14" fill="#333333" text-anchor="middle" font-weight="700">每轮只看到：能按要求出来</text>
<text x="715" y="384" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">重复多轮后可信度指数上升</text>
<text x="120" y="440" font-size="14" fill="#6b7280" text-anchor="start" font-weight="400">零知识：相信“你知道”，但拿不到秘密本身。</text>
</svg>
