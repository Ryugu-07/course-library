<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2f6395"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#c65a5a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" rx="8" fill="#ffffff" stroke="#d9e1ea" stroke-width="1.5"/>
<text x="38" y="46" font-size="25" fill="#333333" text-anchor="start" font-weight="700">复杂度类地图：已知包含与未知边界</text>
<line x1="38" y1="65" x2="922" y2="65" stroke="#d9e1ea" stroke-width="2"/>
<rect x="92" y="115" width="776" height="330" rx="18" fill="#f7dddd" stroke="#c65a5a" stroke-width="1.5"/>
<text x="116" y="145" font-size="19" fill="#c65a5a" text-anchor="start" font-weight="700">EXP</text>
<rect x="142" y="155" width="676" height="250" rx="18" fill="#fff0d6" stroke="#d28a25" stroke-width="1.5"/>
<text x="166" y="185" font-size="19" fill="#d28a25" text-anchor="start" font-weight="700">PSPACE</text>
<rect x="190" y="195" width="580" height="170" rx="18" fill="#eef7ef" stroke="#4f9d69" stroke-width="1.5"/>
<text x="214" y="225" font-size="19" fill="#4f9d69" text-anchor="start" font-weight="700">NP</text>
<rect x="245" y="230" width="245" height="102" rx="12" fill="#dcebf8" stroke="#2f6395" stroke-width="1.5"/>
<text x="270" y="260" font-size="19" fill="#2f6395" text-anchor="start" font-weight="700">P</text>
<rect x="292" y="272" width="160" height="44" rx="10" fill="#ffffff" stroke="#2f6395" stroke-width="1.5"/>
<text x="316" y="300" font-size="14" fill="#2f6395" text-anchor="start" font-weight="700">NL</text>
<rect x="350" y="285" width="72" height="20" rx="10" fill="#ffffff" stroke="#2f6395" stroke-width="1.5"/>
<text x="386" y="300" font-size="12" fill="#2f6395" text-anchor="middle" font-weight="700">L</text>
<rect x="525" y="225" width="145" height="82" rx="12" fill="#ffffff" stroke="#4f9d69" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="598" y="256" font-size="16" fill="#4f9d69" text-anchor="middle" font-weight="700">NPC</text>
<text x="598" y="280" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">NP 完全</text>
<ellipse cx="505" cy="285" rx="135" ry="62" fill="none" stroke="#6b7280" stroke-width="2" opacity="0.9"/>
<text x="505" y="286" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">coNP</text>
<rect x="360" y="328" width="135" height="42" rx="12" fill="#ffffff" stroke="#2f6395" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="427" y="354" font-size="15" fill="#2f6395" text-anchor="middle" font-weight="700">BPP ?</text>
<text x="692" y="365" font-size="14" fill="#d28a25" text-anchor="middle" font-weight="700">IP = PSPACE</text>
<text x="110" y="470" font-size="14" fill="#6b7280" text-anchor="start" font-weight="400">实线是已知包含；虚线/问号表示 P vs NP、NP vs coNP 等关键未知边界。</text>
