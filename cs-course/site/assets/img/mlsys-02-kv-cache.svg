<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">KV cache：复用历史，仍访问历史</title><desc id="desc">历史K与V保存在缓存；追加当前K/V，新查询对历史与当前键算权重并加权值；每步线性访问不等于整段线性。</desc><style>text{font-family:system-ui,"PingFang SC",sans-serif;fill:#203638}.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:650}.s{font-size:17px}.m{font-size:16px;fill:#53686a}rect{rx:8}</style><rect width="1000" height="570" fill="#f7f6f0"/><text x="36" y="48" class="t">KV cache：复用历史，仍访问历史</text><text x="36" y="89" class="m">以单层、单头的一个新 token 为例；N 个历史 token 已完成 prefill</text>
<rect x="36" y="130" width="450" height="235" fill="#fff" stroke="#cad7d2"/><text x="60" y="168" class="h">保留历史，不重复做投影</text><rect x="60" y="200" width="65" height="100" fill="#bdd9e8"/><text x="77" y="244" class="s">K1</text><text x="77" y="275" class="s">V1</text><rect x="138" y="200" width="65" height="100" fill="#bdd9e8"/><text x="155" y="244" class="s">K2</text><text x="155" y="275" class="s">V2</text><rect x="216" y="200" width="65" height="100" fill="#bdd9e8"/><text x="233" y="244" class="s">K3</text><text x="233" y="275" class="s">V3</text><rect x="294" y="200" width="65" height="100" fill="#bdd9e8"/><text x="311" y="244" class="s">K4</text><text x="311" y="275" class="s">V4</text><rect x="372" y="200" width="65" height="100" fill="#bdd9e8"/><text x="389" y="244" class="s">K5</text><text x="389" y="275" class="s">V5</text><text x="60" y="338" class="m">示意 5 个；实际长度 N 持续增长</text><rect x="535" y="130" width="429" height="235" fill="#fff" stroke="#cad7d2"/><text x="558" y="168" class="h">新 token</text><text x="558" y="210" class="s">生成 q、k、v，追加当前 k、v</text><text x="558" y="253" class="s">q 与历史及当前 K 做内积</text><text x="558" y="290" class="s">softmax 后对历史及当前 V 加权</text><text x="558" y="338" class="m">因果掩码允许关注当前位置</text><text x="36" y="414" class="h">历史投影可复用，历史关联仍需计算</text><text x="36" y="456" class="s">每头单步注意力约 O(Nd)；更新后缓存 2(N+1)d 个标量（单层、单头）。</text><text x="36" y="496" class="s">若从短序列连续生成到长序列，各步成本要相加，并非整段 O(N)。</text><text x="36" y="536" class="m">GQA/MQA 的 KV 头数可少于查询头数，估算显存时需使用实际结构。</text></svg>