<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2f6395"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#c65a5a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" rx="8" fill="#ffffff" stroke="#d9e1ea" stroke-width="1.5"/>
<text x="38" y="46" font-size="25" fill="#333333" text-anchor="start" font-weight="700">存储金字塔：速度、容量、成本的权衡</text>
<line x1="38" y1="65" x2="922" y2="65" stroke="#d9e1ea" stroke-width="2"/>
<polygon points="387.5,112.0 552.5,112.0 582.5,170.0 357.5,170.0" fill="#2f6395" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="141" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">寄存器</text>
<text x="470" y="164" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="400">≈0.3 ns · 几 KB</text>
<polygon points="357.5,178.0 582.5,178.0 622.5,236.0 317.5,236.0" fill="#4c7faa" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="207" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">L1 Cache</text>
<text x="470" y="230" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="400">≈1 ns · 32-64 KB</text>
<polygon points="317.5,244.0 622.5,244.0 665.0,302.0 275.0,302.0" fill="#6fa2cc" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="273" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">L2/L3 Cache</text>
<text x="470" y="296" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="400">≈4-12 ns · MB 级</text>
<polygon points="275.0,310.0 665.0,310.0 712.5,368.0 227.5,368.0" fill="#8fb8e0" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="339" font-size="18" fill="#333333" text-anchor="middle" font-weight="700">主存 DRAM</text>
<text x="470" y="362" font-size="13.5" fill="#333333" text-anchor="middle" font-weight="400">≈100 ns · GB 级</text>
<polygon points="227.5,376.0 712.5,376.0 830.0,434.0 110.0,434.0" fill="#b7d1ea" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="405" font-size="18" fill="#333333" text-anchor="middle" font-weight="700">SSD / 磁盘</text>
<text x="470" y="428" font-size="13.5" fill="#333333" text-anchor="middle" font-weight="400">≈100 µs - ms · TB 级</text>
<line x1="110" y1="112" x2="110" y2="425" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
<text x="82" y="166" font-size="14" fill="#2f6395" text-anchor="middle" font-weight="700">更快</text>
<text x="83" y="410" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">更大/更便宜</text>
<path d="M705,136 C812,190 815,250 735,312" fill="none" stroke="#c65a5a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
<rect x="715" y="310" width="175" height="76" rx="10" fill="#f7dddd" stroke="#c65a5a" stroke-width="1.5"/>
<text x="802.5" y="340.0" font-size="17" fill="#333333" text-anchor="middle" font-weight="700">L1 → DRAM</text>
<text x="802.5" y="370.0" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">约 100× 延迟断崖</text>
<text x="130" y="480" font-size="15" fill="#6b7280" text-anchor="start" font-weight="400">每一层都是下一层的缓存：命中走上层，未命中才向下取。</text>
</svg>
