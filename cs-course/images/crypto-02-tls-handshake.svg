<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2f6395"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#c65a5a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" rx="8" fill="#ffffff" stroke="#d9e1ea" stroke-width="1.5"/>
<text x="38" y="46" font-size="25" fill="#333333" text-anchor="start" font-weight="700">TLS 握手：认证后协商对称密钥</text>
<line x1="38" y1="65" x2="922" y2="65" stroke="#d9e1ea" stroke-width="2"/>
<rect x="58" y="94" width="844" height="380" rx="8" fill="#f7fafc" stroke="#d9e1ea" stroke-width="1.5"/>
<rect x="175" y="120" width="150" height="52" rx="10" fill="#ffffff" stroke="#2f6395" stroke-width="1.5"/>
<text x="250.0" y="151.0" font-size="17" fill="#333333" text-anchor="middle" font-weight="700">浏览器</text>
<rect x="635" y="120" width="150" height="52" rx="10" fill="#ffffff" stroke="#4f9d69" stroke-width="1.5"/>
<text x="710.0" y="151.0" font-size="17" fill="#333333" text-anchor="middle" font-weight="700">服务器</text>
<line x1="250" y1="180" x2="250" y2="430" stroke="#8fb8e0" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="710" y1="180" x2="710" y2="430" stroke="#4f9d69" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="260" y1="210" x2="700" y2="210" stroke="#2f6395" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
<text x="480" y="202" font-size="13.5" fill="#333333" text-anchor="middle" font-weight="400">ClientHello：版本/随机数/套件</text>
<line x1="700" y1="255" x2="260" y2="255" stroke="#4f9d69" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
<text x="480" y="247" font-size="13.5" fill="#333333" text-anchor="middle" font-weight="400">ServerHello + 证书 + ECDHE 参数</text>
<line x1="260" y1="305" x2="700" y2="305" stroke="#2f6395" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
<text x="480" y="297" font-size="13.5" fill="#333333" text-anchor="middle" font-weight="400">验证证书链，发送 ECDHE 份额</text>
<line x1="260" y1="355" x2="700" y2="355" stroke="#d28a25" stroke-width="2.6"/>
<line x1="700" y1="365" x2="260" y2="365" stroke="#d28a25" stroke-width="2.6"/>
<text x="480" y="347" font-size="13.5" fill="#333333" text-anchor="middle" font-weight="400">双方派生同一对称密钥</text>
<line x1="260" y1="405" x2="700" y2="405" stroke="#4f9d69" stroke-width="2.6"/>
<line x1="700" y1="415" x2="260" y2="415" stroke="#4f9d69" stroke-width="2.6"/>
<text x="480" y="397" font-size="13.5" fill="#333333" text-anchor="middle" font-weight="400">HTTP 数据用 AEAD 对称加密</text>
