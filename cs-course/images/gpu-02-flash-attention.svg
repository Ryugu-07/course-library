<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="Flash Attention">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #444; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #c8d1dc; stroke-width: 2; rx: 8; }
      .soft { fill: #f8fafc; stroke: #d8e0e8; stroke-width: 2; rx: 8; }
      .accent { fill: #2f6395; stroke: #2f6395; }
      .line { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #777; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="650" fill="#ffffff"/>
  <text x="48" y="52" class="title">Flash Attention</text>
<rect x="48" y="88" width="1004" height="486" fill="#e5eff8" opacity="0.42" rx="18"/>
  <rect x="180.0" y="275.0" width="125.0" height="70.0" class="box"/>
  <text x="242.5" y="310.0" class="label" text-anchor="middle" dominant-baseline="middle">Q block</text>
  <path d="M 310.0 310.0 L 320.0 310.0" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="330.0" y="275.0" width="125.0" height="70.0" class="box"/>
  <text x="392.5" y="310.0" class="label" text-anchor="middle" dominant-baseline="middle">K/V tile</text>
  <path d="M 460.0 310.0 L 470.0 310.0" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="480.0" y="275.0" width="125.0" height="70.0" class="box"/>
  <text x="542.5" y="310.0" class="label" text-anchor="middle" dominant-baseline="middle">online softmax</text>
  <path d="M 610.0 310.0 L 620.0 310.0" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="630.0" y="275.0" width="125.0" height="70.0" class="box"/>
  <text x="692.5" y="310.0" class="label" text-anchor="middle" dominant-baseline="middle">accumulator</text>
  <path d="M 760.0 310.0 L 770.0 310.0" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="780.0" y="275.0" width="125.0" height="70.0" class="box"/>
  <text x="842.5" y="310.0" class="label" text-anchor="middle" dominant-baseline="middle">output</text>
  <path d="M 392 353 C 447 420, 517 420, 572 353" stroke="#2f6395" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 692 353 C 747 420, 817 420, 872 353" stroke="#2f6395" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="550.0" y="465.0" class="small" text-anchor="middle" dominant-baseline="middle">residual paths keep signal and gradients moving</text>
