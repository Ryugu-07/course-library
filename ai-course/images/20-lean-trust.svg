<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="trustTitle trustDesc">
  <title id="trustTitle">信任鏈：普通檢查與三種不同變化</title>
  <desc id="trustDesc">策略產出的證明項由核心檢查。native_decide增加原生計算公理；implemented_by本身不改核心檢查，但與原生計算結合需額外信任；skipKernelTC跳過核心。</desc>
  <rect width="760" height="450" fill="#f8fafc"/>
  <style>text{font-family:system-ui,"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172b42} .h{font-size:22px;font-weight:700} .b{font-size:16px} .s{font-size:14px;fill:#39546d}</style>
  <text x="380" y="36" class="h" text-anchor="middle">誰被信任，誰只是在幫忙寫證明項</text>
  <rect x="150" y="64" width="460" height="78" rx="10" fill="#e6efff" stroke="#547291" stroke-width="2"/>
  <text x="380" y="96" class="b" text-anchor="middle">闡述器、策略、自動化、美化輸出</text>
  <text x="380" y="120" class="s" text-anchor="middle">項若型別不合會被拒絕；目標譯錯則仍需人工發現。</text>
  <path d="M380 142 V176" fill="none" stroke="#39546d" stroke-width="2.5" marker-end="url(#tArrow)"/>
  <rect x="210" y="184" width="340" height="78" rx="10" fill="#e2f3e9" stroke="#547291" stroke-width="2"/>
  <text x="380" y="216" class="b" text-anchor="middle">小核心</text>
  <text x="380" y="240" class="s" text-anchor="middle">只檢查證明項是否具有你寫下的型別</text>
  <rect x="40" y="300" width="210" height="100" rx="10" fill="#fff0db" stroke="#547291" stroke-width="2"/>
  <text x="145" y="334" class="b" text-anchor="middle">native_decide</text>
  <text x="145" y="358" class="s" text-anchor="middle">增加原生計算公理</text>
  <rect x="275" y="300" width="210" height="100" rx="10" fill="#fff0db" stroke="#547291" stroke-width="2"/>
  <text x="380" y="334" class="b" text-anchor="middle">implemented_by</text>
  <text x="380" y="358" class="s" text-anchor="middle">單獨不改核心檢查</text>
  <rect x="510" y="300" width="210" height="100" rx="10" fill="#fde8e8" stroke="#547291" stroke-width="2"/>
  <text x="615" y="334" class="b" text-anchor="middle">skipKernelTC</text>
  <text x="615" y="358" class="s" text-anchor="middle">乾脆不做核心檢查</text>
  <text x="145" y="380" class="s" text-anchor="middle">依事先約定決定是否接受</text>
  <text x="380" y="380" class="s" text-anchor="middle">配合原生計算另查等價性</text>
  <text x="615" y="380" class="s" text-anchor="middle">公理清單不能替代重放</text>
  <defs>
    <marker id="tArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#39546d"/>
    </marker>
  </defs>
</svg>
