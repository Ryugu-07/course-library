<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540" role="img" aria-labelledby="title desc"><title id="title">OR冗余路径的单消融与双消融</title><desc id="desc">x复制为h1和h2，max函数输出y。输入1时两条都为1；删除任意一条仍为1，删除两条才为0。</desc><rect width="440" height="540" fill="#f8fafc"/><style>text{font-family:system-ui,'Noto Sans CJK SC',sans-serif;fill:#172b42;font-size:20px}.head{font-size:24px;font-weight:700}.sub{font-size:22px;font-weight:600}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#39546d"/></marker></defs><text x="220" y="33" class="head" text-anchor="middle">冗余：单删为何没有效应</text><rect x="155" y="63" width="130" height="52" rx="9" fill="#e6efff" stroke="#547291" stroke-width="2"/><text x="220.0" y="96.0" class="" text-anchor="middle">输入 x=1</text><path d="M188,116L110,151" fill="none" stroke="#39546d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M252,116L330,151" fill="none" stroke="#39546d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="155" width="140" height="60" rx="9" fill="#e6efff" stroke="#547291" stroke-width="2"/><text x="110.0" y="192.0" class="" text-anchor="middle">h₁=1</text><rect x="260" y="155" width="140" height="60" rx="9" fill="#e2f3e9" stroke="#547291" stroke-width="2"/><text x="330.0" y="192.0" class="" text-anchor="middle">h₂=1</text><path d="M110,216L187,256" fill="none" stroke="#39546d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M330,216L253,256" fill="none" stroke="#39546d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="105" y="260" width="230" height="58" rx="9" fill="#fff0db" stroke="#547291" stroke-width="2"/><text x="220.0" y="296.0" class="" text-anchor="middle">y=max(h₁,h₂)</text><text x="28" y="362" class="sub" text-anchor="start">干预</text><text x="410" y="362" class="sub" text-anchor="end">输出 y</text><text x="28" y="399" class="" text-anchor="start">保留两条</text><text x="390" y="399" class="" text-anchor="middle">1</text><text x="28" y="431" class="" text-anchor="start">仅 h₁ 置零</text><text x="390" y="431" class="" text-anchor="middle">1</text><text x="28" y="463" class="" text-anchor="start">仅 h₂ 置零</text><text x="390" y="463" class="" text-anchor="middle">1</text><text x="28" y="495" class="" text-anchor="start">两条同时置零</text><text x="390" y="495" class="" text-anchor="middle">0</text><text x="220" y="532" class="" text-anchor="middle">玩具模型：单条不必要，仍可有作用</text></svg>