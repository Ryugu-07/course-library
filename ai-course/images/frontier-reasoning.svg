<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 650" role="img" aria-labelledby="title desc"><title id="title">奖励训练与推理时选择的区别</title><desc id="desc">训练环通过检查奖励更新策略参数；推理环固定参数，生成k个候选，由有误接收风险的验证器选择。覆盖、接收与最终正确率是不同的量。</desc><rect width="440" height="650" fill="#f8fafc"/><style>text{font-family:system-ui,'Noto Sans CJK SC',sans-serif;fill:#172b42;font-size:20px}.head{font-size:24px;font-weight:700}.sub{font-size:22px;font-weight:600}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#39546d"/></marker></defs><text x="220" y="33" class="head" text-anchor="middle">两种计算：更新与选择</text><text x="28" y="75" class="sub" text-anchor="start">训练：改变参数 θ</text><rect x="40" y="95" width="360" height="50" rx="9" fill="#e6efff" stroke="#547291" stroke-width="2"/><text x="220.0" y="127.0" class="" text-anchor="middle">题目 q → 策略采样回答 y</text><path d="M220,146V167" fill="none" stroke="#39546d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="170" width="360" height="50" rx="9" fill="#e2f3e9" stroke="#547291" stroke-width="2"/><text x="220.0" y="202.0" class="" text-anchor="middle">检查器产生奖励 R</text><path d="M220,221V242" fill="none" stroke="#39546d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="245" width="360" height="50" rx="9" fill="#e6efff" stroke="#547291" stroke-width="2"/><text x="220.0" y="277.0" class="" text-anchor="middle">策略梯度 → 更新 θ</text><path d="M401,270H420V120H403" fill="none" stroke="#39546d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M25,323H415" stroke="#9daec0" stroke-width="2" stroke-dasharray="5 5"/><text x="28" y="362" class="sub" text-anchor="start">推理：固定参数 θ</text><rect x="40" y="382" width="360" height="50" rx="9" fill="#e6efff" stroke="#547291" stroke-width="2"/><text x="220.0" y="414.0" class="" text-anchor="middle">同题独立尝试 k 次</text><path d="M220,433V454" fill="none" stroke="#39546d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="457" width="360" height="50" rx="9" fill="#fff0db" stroke="#547291" stroke-width="2"/><text x="220.0" y="489.0" class="" text-anchor="middle">验证器：错误可能被接收</text><path d="M220,508V529" fill="none" stroke="#39546d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="532" width="360" height="50" rx="9" fill="#e6efff" stroke="#547291" stroke-width="2"/><text x="220.0" y="564.0" class="" text-anchor="middle">返回首个通过者，或全部拒绝</text><text x="220" y="616" class="sub" text-anchor="middle">出现正确 ≠ 选中正确</text><text x="220" y="643" class="" text-anchor="middle">推理实验不进行参数训练</text></svg>