<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 570" role="img" aria-labelledby="title desc">
<title id="title">等变要求两条路径一致</title>
<desc id="desc">同一输入分别先旋转再映射、先映射再旋转，得到两个不同结果。这是等变失败的反例，不是前后相接的计算步骤。</desc>
<rect width="440" height="570" rx="16" fill="#f5f8fc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#57718d" stroke-width="1.5"/></marker></defs>
<g font-family="system-ui, sans-serif" font-size="20" fill="#18354d" text-anchor="middle">
<text x="220" y="38" font-weight="700">等变要求两条路径一致</text>
<rect x="20" y="65" width="400" height="75" rx="12" fill="#e3eefb" stroke="#b8c9d9"/>
<text x="220" y="95" font-weight="600">同一输入 x = (1,0)</text>
<text x="220" y="125">A = diag(1,2)，R 旋转 90°</text>
<g fill="none" stroke="#57718d" stroke-width="2.5">
<path d="M220,145 V170 H110 V199" marker-end="url(#arrow)"/>
<path d="M220,170 H330 V199" marker-end="url(#arrow)"/>
<path d="M110,278 V329" marker-end="url(#arrow)"/>
<path d="M330,278 V329" marker-end="url(#arrow)"/>
</g>
<rect x="20" y="205" width="180" height="68" rx="12" fill="#e5f3ed" stroke="#b8c9d9"/>
<text x="110" y="232">先旋转 R</text>
<text x="110" y="258">Rx = (0,1)</text>
<rect x="240" y="205" width="180" height="68" rx="12" fill="#fff0df" stroke="#b8c9d9"/>
<text x="330" y="232">先映射 A</text>
<text x="330" y="258">Ax = (1,0)</text>
<rect x="20" y="335" width="180" height="78" rx="12" fill="#e5f3ed" stroke="#b8c9d9"/>
<text x="110" y="365">再映射 A</text>
<text x="110" y="394" font-weight="600">ARx = (0,2)</text>
<rect x="240" y="335" width="180" height="78" rx="12" fill="#fff0df" stroke="#b8c9d9"/>
<text x="330" y="365">再旋转 R</text>
<text x="330" y="394" font-weight="600">RAx = (0,1)</text>
<text x="220" y="448">两条路径得到不同结果</text>
<text x="220" y="480">‖ARx − RAx‖ = 1</text>
<text x="220" y="520">对照：aI 与旋转交换</text>
<text x="220" y="551">单个角度通过不能验证全群</text>
</g>
</svg>
