<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 570" role="img" aria-labelledby="title desc">
<title id="title">自由滚动会反馈自己的误差</title>
<desc id="desc">同一个起点：x₀ = 1；真实增益 1，模型增益 1.03：各自预测，再喂给下一步；十步后的两个状态：真实 1；模型 1.343916</desc>
<rect width="440" height="570" rx="16" fill="#f5f8fc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#57718d" stroke-width="1.5"/></marker></defs>
<g font-family="system-ui, sans-serif" font-size="20" fill="#18354d" text-anchor="middle">
<text x="220" y="38" font-weight="700">自由滚动会反馈自己的误差</text>
<rect x="20" y="65" width="400" height="83" rx="12" fill="#e3eefb" stroke="#b8c9d9"/>
<text x="220" y="96" font-weight="600">同一个起点</text>
<text x="220" y="127">x₀ = 1</text>
<path d="M220,150 V171" fill="none" stroke="#57718d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="177" width="400" height="83" rx="12" fill="#e5f3ed" stroke="#b8c9d9"/>
<text x="220" y="208" font-weight="600">真实增益 1，模型增益 1.03</text>
<text x="220" y="239">各自预测，再喂给下一步</text>
<path d="M220,262 V283" fill="none" stroke="#57718d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="289" width="400" height="83" rx="12" fill="#fff0df" stroke="#b8c9d9"/>
<text x="220" y="320" font-weight="600">十步后的两个状态</text>
<text x="220" y="351">真实 1；模型 1.343916</text>
<path d="M35,405 H405" stroke="#b8c9d9"/>
<text x="220" y="445">初态上的一步误差 0.03</text>
<text x="220" y="487">十步终点误差 0.343916</text>
<text x="220" y="529">重建当前观测 ≠ 保留未来信息</text>
</g>
</svg>