<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="gatesTitle gatesDesc">
  <title id="gatesTitle">三道要分開的關</title>
  <desc id="gatesDesc">第一項檢查核心與公理，第二項核對目標語句，第三項另查原英文論證。前兩項成立支持目標定理，不自動驗收原論證。</desc>
  <rect width="760" height="300" fill="#f8fafc"/>
  <style>text{font-family:system-ui,"Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#172b42} .h{font-size:22px;font-weight:700} .b{font-size:16px} .s{font-size:14px;fill:#39546d}</style>
  <text x="380" y="36" class="h" text-anchor="middle">三個問題，各自留下檢查記錄</text>
  <rect x="24" y="70" width="200" height="120" rx="10" fill="#fff0db" stroke="#547291" stroke-width="2"/>
  <text x="124" y="108" class="b" text-anchor="middle">1. 核心與公理</text>
  <text x="124" y="136" class="s" text-anchor="middle">證明項是否經檢查</text>
  <text x="124" y="160" class="s" text-anchor="middle">公理是否在允許範圍</text>
  <rect x="280" y="70" width="200" height="120" rx="10" fill="#e6efff" stroke="#547291" stroke-width="2"/>
  <text x="380" y="108" class="b" text-anchor="middle">2. 形式化語句</text>
  <text x="380" y="136" class="s" text-anchor="middle">定義有沒有被換掉</text>
  <text x="380" y="160" class="s" text-anchor="middle">條件有沒有變弱</text>
  <rect x="536" y="70" width="200" height="120" rx="10" fill="#e2f3e9" stroke="#547291" stroke-width="2"/>
  <text x="636" y="108" class="b" text-anchor="middle">3. 原英文論證</text>
  <text x="636" y="136" class="s" text-anchor="middle">每一步推理是否成立</text>
  <text x="636" y="160" class="s" text-anchor="middle">另做原稿對照審讀</text>
  <defs>
    <marker id="gArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#39546d"/>
    </marker>
  </defs>
  <text x="380" y="230" class="b" text-anchor="middle">第 1 ＋ 2 項可靠成立：目標定理獲得相應基礎上的證明。</text>
  <text x="380" y="262" class="s" text-anchor="middle">第 3 項另問原稿的推理；無英文稿也可以有有效形式證明。</text>
</svg>
