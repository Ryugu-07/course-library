name: Course audit

on:
  push:
  pull_request:

jobs:
  generated-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Rebuild all course sites
        run: python tools/rebuild_all.py
      - name: Audit generated pages and assets
        run: python tools/course_audit.py
      - name: Assemble public hosting output
        run: python tools/build_public_site.py
