name: Course audit

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

jobs:
  generated-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Rebuild all course sites
        run: python tools/rebuild_all.py
      - name: Audit generated pages and assets
        run: python tools/course_audit.py
      - name: Audit learning-layer coverage contracts
        run: python tools/learning_coverage.py
      - name: Test Earth-system learning labs
        run: |
          for file in course-shared/labs/earth-*.js; do
            node --check "$file"
            node "$file"
          done
      - name: Test electrical-engineering learning labs
        run: |
          for file in course-shared/labs/ee-*.js; do
            node --check "$file"
            node "$file"
          done
      - name: Report fast-moving ecosystem freshness
        run: python tools/ecosystem_freshness.py --strict
      - name: Test advanced research course mechanisms
        run: |
          node tools/check_research_renderer.js
          node tools/check_research_math.js
          node tools/check_research_physics.js
          node tools/check_research_ai.js
          node tools/check_foundations.js
          node tools/check_geometry.js
          node tools/check_observables.js
          node tools/check_limits.js
          node tools/check_paths.js
          node tools/check_local.js
          node tools/check_descent.js
          node tools/check_environments.js
          node tools/check_two_site.js
          node tools/check_fibers.js
          node course-shared/labs/physics-topological-band.js
      - name: Assemble public hosting output
        run: python tools/build_public_site.py
