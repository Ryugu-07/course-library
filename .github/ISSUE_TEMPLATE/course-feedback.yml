name: 课程内容改进
description: 报告知识错误、解释问题，或提出可视化与实验建议
title: "[课程建议] "
body:
  - type: input
    id: course
    attributes:
      label: 课程与章节
      description: 请填写课程名称和章节标题。
      placeholder: 例如：地球系统与气候科学 · 风生环流与翻转环流
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: 页面链接
      description: 请粘贴对应的公网 URL 或仓库文件路径。
      placeholder: https://course.hhzi.eu.cc/...
    validations:
      required: true

  - type: dropdown
    id: feedback_type
    attributes:
      label: 建议类型
      options:
        - 事实、公式或术语错误
        - 复杂概念解释不清
        - 插图、地图或交互建议
        - 实验、练习或项目建议
        - 链接、排版或移动端问题
        - 课程结构与新增专题
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 请说明具体哪里不准确、不清楚或不便使用，以及可能造成的误解。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议修改
      description: 可以给出改写方向、图示构想、实验设计或章节安排。
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 参考资料
      description: 如有，请提供教材章节、论文、标准或官方文档；快速变化内容请注明日期。

  - type: checkboxes
    id: hygiene
    attributes:
      label: 提交确认
      options:
        - label: 我没有在内容中放入 API Key、私人信息或大段受版权保护的原文。
          required: true
