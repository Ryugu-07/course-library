<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="立体投影的坐标与切向量换算"><title>立体投影的坐标与切向量换算</title><defs><style>text{font-family:system-ui,sans-serif;fill:#24313a} .title{font-size:25px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.line{fill:none;stroke:#315f9d;stroke-width:2.5}.red{fill:none;stroke:#b64335;stroke-width:3}.green{fill:none;stroke:#39734d;stroke-width:3}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker></defs><rect width="1100" height="650" fill="#fff"/><text x="40" y="45" class="title" text-anchor="start">两张坐标卡描述同一点、同一切向量</text><circle cx="250" cy="270" r="110" fill="#edf4f8" stroke="#315f9d" stroke-width="2.5"/><path d="M70 270 L505 270" class="line"/><text x="485" y="299" class="label" text-anchor="start">x</text><path d="M250 115 L250 397" class="line"/><text x="228" y="112" class="label" text-anchor="start">y</text><path d="M250 160 L470 270" class="line" marker-end="url(#arrow)"/><path d="M305 270 L338 204" class="red"/><path d="M250 380 L305 270" class="red" marker-end="url(#arrow)"/><circle cx="338" cy="204" r="6" fill="#9b6a12"/><text x="347" y="190" class="small" text-anchor="start">p=(0.8,0.6)</text><text x="265" y="151" class="small" text-anchor="start">N=(0,1)</text><text x="265" y="398" class="small" text-anchor="start">S=(0,−1)</text><text x="446" y="321" class="label" text-anchor="start">u=2</text><text x="324" y="299" class="label" text-anchor="start">v=1/2</text><path d="M338 204 L302 156" class="green" marker-end="url(#arrow)"/><text x="56" y="429" class="small" text-anchor="start">蓝：从 N 投到 y=0，u=x/(1−y)</text><text x="56" y="456" class="small" text-anchor="start">红：从 S 投到 y=0，v=x/(1+y)</text><text x="570" y="125" class="label" text-anchor="start">同一点的两份坐标</text><text x="590" y="175" class="label" text-anchor="start">u=2   →   v=1/u=1/2</text><text x="570" y="244" class="label" text-anchor="start">同一切向量的两份分量</text><text x="590" y="289" class="label" text-anchor="start">w_N=1   →   w_S=(−1/u²)w_N=−1/4</text><text x="570" y="352" class="small" text-anchor="start">转移 Jacobian 非零，秩为 1。</text><text x="570" y="382" class="small" text-anchor="start">分量改变；方向导数这个操作不变。</text><text x="570" y="442" class="small" text-anchor="start">重叠区排除两极：u≠0。</text><text x="56" y="530" class="label" text-anchor="start">为什么不能只用一张卡？</text><text x="56" y="563" class="small" text-anchor="start">S¹ 紧致，实数轴的非空开集不紧致；它们不可能同胚。</text><text x="56" y="602" class="small" text-anchor="start">“每点附近有坐标”与“全空间有一张坐标卡”是不同的要求。</text></svg>
