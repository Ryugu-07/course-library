<svg xmlns="http://www.w3.org/2000/svg" width="440" height="525" viewBox="0 0 440 525" role="img" aria-labelledby="title desc"><title id="title">点数压缩为两个特征根</title><desc id="desc">从Frobenius固定点到特征多项式，再到幂迹递推，默认曲线在F5有9点，在F25有27点。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="context-stroke"/></marker></defs><rect width="440" height="525" fill="#faf9f5"/><g font-family="system-ui, sans-serif"><text x="220" y="34" font-size="24" fill="#253349" text-anchor="middle">点数压缩为两个特征根</text><rect x="30" y="77" width="380" height="81" rx="10" fill="#edf2f8"/><text x="220" y="108" font-size="22" fill="#253349" text-anchor="middle">π : (x, y) ↦ (xᵖ, yᵖ)</text><text x="220" y="139" font-size="20" fill="#253349" text-anchor="middle">Fₚʳ 上的点 = πʳ 的固定点</text><path d="M220,164L220,192" fill="none" stroke="#3978bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="202" width="380" height="89" rx="10" fill="#edf2f8"/><text x="220" y="235" font-size="22" fill="#253349" text-anchor="middle">特征多项式 T² − aₚT + p</text><text x="220" y="269" font-size="21" fill="#253349" text-anchor="middle">α + β = aₚ；αβ = p</text><path d="M220,298L220,326" fill="none" stroke="#3978bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="338" width="380" height="82" rx="10" fill="#edf2f8"/><text x="220" y="369" font-size="22" fill="#253349" text-anchor="middle">Aᵣ = aₚAᵣ₋₁ − pAᵣ₋₂</text><text x="220" y="404" font-size="22" fill="#253349" text-anchor="middle">Nᵣ = pʳ + 1 − Aᵣ</text><text x="220" y="457" font-size="22" fill="#b75438" text-anchor="middle">p = 5：a₅ = −3</text><text x="220" y="493" font-size="24" fill="#b75438" text-anchor="middle">N₁ = 9 → N₂ = 27</text></g></svg>