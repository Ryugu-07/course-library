<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2140" viewBox="0 0 1000 2140" role="img" aria-labelledby="title desc"><title id="title">最优传输的四份精确账本</title><desc id="desc">运输网络、三边交换、CDF面积与非唯一最优顶点。</desc><rect width="1000" height="2140" fill="#faf7ef"/><g fill="#253346" color="#253346" font-family="system-ui,sans-serif"><text x="35" y="48" font-size="28">供需守恒之后，怎样证明运输计划最优？</text><svg x="50" y="85" xmlns="http://www.w3.org/2000/svg" width="900" height="425" role="img" aria-label="逐条运输边：颜色表示正、零与负质量"><title>逐条运输边：颜色表示正、零与负质量</title><text x="25" y="32" font-size="22">逐条运输边：颜色表示正、零与负质量</text><text x="25" y="65" font-size="16">蓝为正质量，玫红为非法负质量，灰虚线为零</text><line data-edge="0-0" x1="230" y1="110" x2="670" y2="110" stroke="#268bd2" stroke-width="2.5"><title>i=0 到 j=0，质量=分子=1；分母=4；近似值=0.25</title></line><line data-edge="0-1" x1="230" y1="110" x2="670" y2="320" stroke="#268bd2" stroke-width="2.5"><title>i=0 到 j=1，质量=分子=1；分母=2；近似值=0.5</title></line><line data-edge="1-0" x1="230" y1="320" x2="670" y2="110" stroke="#87949f" stroke-width="1" stroke-dasharray="6 5"><title>i=1 到 j=0，质量=分子=0；分母=1；近似值=0</title></line><line data-edge="1-1" x1="230" y1="320" x2="670" y2="320" stroke="#268bd2" stroke-width="2.5"><title>i=1 到 j=1，质量=分子=1；分母=4；近似值=0.25</title></line><circle data-node="source-0" cx="230" cy="110" r="11" fill="#268bd2"/><text x="20" y="115" font-size="17">i=0，质量 0.75</text><circle data-node="source-1" cx="230" cy="320" r="11" fill="#268bd2"/><text x="20" y="325" font-size="17">i=1，质量 0.25</text><circle data-node="target-0" cx="670" cy="110" r="11" fill="#29966c"/><text x="695" y="115" font-size="17">j=0，质量 0.25</text><circle data-node="target-1" cx="670" cy="320" r="11" fill="#29966c"/><text x="695" y="325" font-size="17">j=1，质量 0.75</text><text x="25" y="370" font-size="16">所有非零边等宽，颜色不表示最优性；精确质量与费用见逐格表。</text><text x="450" y="405" text-anchor="middle" font-size="16">左边源标签，右边目标标签；上下顺序是输入标签顺序</text></svg><text x="35" y="540" font-size="17">源质量0.75、0.25：正质量边统一线宽；精确最优成本0.75，原子映射最低1.125。</text><svg x="50" y="595" xmlns="http://www.w3.org/2000/svg" width="900" height="425" role="img" aria-label="提交的候选质量：负数不隐藏"><title>提交的候选质量：负数不隐藏</title><text x="25" y="32" font-size="22">提交的候选质量：负数不隐藏</text><text x="25" y="65" font-size="16">行i：源标签；每格显示质量近似值</text><text x="265" y="94" text-anchor="middle">j=0</text><text x="495" y="94" text-anchor="middle">j=1</text><text x="725" y="94" text-anchor="middle">j=2</text><text x="125" y="154.16666666666666" text-anchor="end">i=0</text><rect data-cell="0-0" x="150" y="110" width="230" height="78.33333333333333" fill="#deebf7" stroke="#87949f"/><text data-value="0-0" x="265" y="155.16666666666666" text-anchor="middle" font-size="18" fill="#253346">0.5</text><rect data-cell="0-1" x="380" y="110" width="230" height="78.33333333333333" fill="#edf1f4" stroke="#87949f"/><text data-value="0-1" x="495" y="155.16666666666666" text-anchor="middle" font-size="18" fill="#253346">0</text><rect data-cell="0-2" x="610" y="110" width="230" height="78.33333333333333" fill="#edf1f4" stroke="#87949f"/><text data-value="0-2" x="725" y="155.16666666666666" text-anchor="middle" font-size="18" fill="#253346">0</text><text x="125" y="232.5" text-anchor="end">i=1</text><rect data-cell="1-0" x="150" y="188.33333333333331" width="230" height="78.33333333333333" fill="#edf1f4" stroke="#87949f"/><text data-value="1-0" x="265" y="233.49999999999997" text-anchor="middle" font-size="18" fill="#253346">0</text><rect data-cell="1-1" x="380" y="188.33333333333331" width="230" height="78.33333333333333" fill="#deebf7" stroke="#87949f"/><text data-value="1-1" x="495" y="233.49999999999997" text-anchor="middle" font-size="18" fill="#253346">0.25</text><rect data-cell="1-2" x="610" y="188.33333333333331" width="230" height="78.33333333333333" fill="#edf1f4" stroke="#87949f"/><text data-value="1-2" x="725" y="233.49999999999997" text-anchor="middle" font-size="18" fill="#253346">0</text><text x="125" y="310.8333333333333" text-anchor="end">i=2</text><rect data-cell="2-0" x="150" y="266.66666666666663" width="230" height="78.33333333333333" fill="#edf1f4" stroke="#87949f"/><text data-value="2-0" x="265" y="311.8333333333333" text-anchor="middle" font-size="18" fill="#253346">0</text><rect data-cell="2-1" x="380" y="266.66666666666663" width="230" height="78.33333333333333" fill="#edf1f4" stroke="#87949f"/><text data-value="2-1" x="495" y="311.8333333333333" text-anchor="middle" font-size="18" fill="#253346">0</text><rect data-cell="2-2" x="610" y="266.66666666666663" width="230" height="78.33333333333333" fill="#deebf7" stroke="#87949f"/><text data-value="2-2" x="725" y="311.8333333333333" text-anchor="middle" font-size="18" fill="#253346">0.25</text><text x="450" y="405" text-anchor="middle" font-size="16">列j：目标标签</text></svg><text x="35" y="1050" font-size="17">三原子候选对角计划成本2；两边交换无改进，三边循环交换可降至最优0.5。</text><svg x="50" y="1105" xmlns="http://www.w3.org/2000/svg" width="900" height="425" role="img" aria-label="CDF差的面积就是W1"><title>CDF差的面积就是W1</title><text x="25" y="32" font-size="22">CDF差的面积就是W1</text><path d="M100 335H850" stroke="currentColor" opacity=".18"/><text x="88" y="340" text-anchor="end">-0.06</text><path d="M100 272.5H850" stroke="currentColor" opacity=".18"/><text x="88" y="277.5" text-anchor="end">0.1575</text><path d="M100 210H850" stroke="currentColor" opacity=".18"/><text x="88" y="215" text-anchor="end">0.375</text><path d="M100 147.5H850" stroke="currentColor" opacity=".18"/><text x="88" y="152.5" text-anchor="end">0.5925</text><path d="M100 85H850" stroke="currentColor" opacity=".18"/><text x="88" y="90" text-anchor="end">0.81</text><text x="100" y="363" text-anchor="middle">0</text><text x="287.5" y="363" text-anchor="middle">0.3125</text><text x="475" y="363" text-anchor="middle">0.625</text><text x="662.5" y="363" text-anchor="middle">0.9375</text><text x="850" y="363" text-anchor="middle">1.25</text><line data-zero="true" x1="100" x2="850" y1="317.7586206896552" y2="317.7586206896552" stroke="currentColor" opacity=".7"/><text x="100" y="65">有符号累计质量差，绝对面积计成本</text><text x="475" y="398" text-anchor="middle">合并后的实际位置z</text><polyline data-series="difference" points="100,102.24137931034485 250,102.24137931034485 250,174.08045977011497 700,174.08045977011497 700,102.24137931034485 850,102.24137931034485" stroke="#268bd2" stroke-width="2" fill="none"/><circle data-series="difference" data-index="0" data-open="false" cx="100" cy="102.24137931034485" r="1.8" fill="#268bd2" stroke="#268bd2"/><circle data-series="difference" data-index="1" data-open="false" cx="250" cy="102.24137931034485" r="1.8" fill="#268bd2" stroke="#268bd2"/><circle data-series="difference" data-index="2" data-open="false" cx="250" cy="174.08045977011497" r="1.8" fill="#268bd2" stroke="#268bd2"/><circle data-series="difference" data-index="3" data-open="false" cx="700" cy="174.08045977011497" r="1.8" fill="#268bd2" stroke="#268bd2"/><circle data-series="difference" data-index="4" data-open="false" cx="700" cy="102.24137931034485" r="1.8" fill="#268bd2" stroke="#268bd2"/><circle data-series="difference" data-index="5" data-open="false" cx="850" cy="102.24137931034485" r="1.8" fill="#268bd2" stroke="#268bd2"/></svg><text x="35" y="1560" font-size="17">CDF差在三段上的高度0.75、0.5、0.75，宽度0.25、0.75、0.25，总面积0.75。</text><svg x="50" y="1615" xmlns="http://www.w3.org/2000/svg" width="900" height="425" role="img" aria-label="全部不同顶点的目标值"><title>全部不同顶点的目标值</title><text x="25" y="32" font-size="22">全部不同顶点的目标值</text><path d="M100 335H850" stroke="currentColor" opacity=".18"/><text x="88" y="340" text-anchor="end">-0.08</text><path d="M100 272.5H850" stroke="currentColor" opacity=".18"/><text x="88" y="277.5" text-anchor="end">0.21</text><path d="M100 210H850" stroke="currentColor" opacity=".18"/><text x="88" y="215" text-anchor="end">0.5</text><path d="M100 147.5H850" stroke="currentColor" opacity=".18"/><text x="88" y="152.5" text-anchor="end">0.79</text><path d="M100 84.99999999999997H850" stroke="currentColor" opacity=".18"/><text x="88" y="89.99999999999997" text-anchor="end">1.08</text><text x="100" y="363" text-anchor="middle">0</text><text x="850" y="363" text-anchor="middle">1</text><line data-zero="true" x1="100" x2="850" y1="317.7586206896552" y2="317.7586206896552" stroke="currentColor" opacity=".7"/><text x="100" y="65">成本；橙线为全局最优值</text><text x="475" y="398" text-anchor="middle">不同顶点编号，不是基编号</text><polyline data-series="vertices" points="100,102.24137931034485 850,102.24137931034485" stroke="#268bd2" stroke-width="2" fill="none"/><circle data-series="vertices" data-index="0" data-open="false" cx="100" cy="102.24137931034485" r="1.8" fill="#268bd2" stroke="#268bd2"/><circle data-series="vertices" data-index="1" data-open="false" cx="850" cy="102.24137931034485" r="1.8" fill="#268bd2" stroke="#268bd2"/><polyline data-series="minimum" points="100,102.24137931034485 850,102.24137931034485" stroke="#cb6a16" stroke-width="2" fill="none"/><circle data-series="minimum" data-index="0" data-open="false" cx="100" cy="102.24137931034485" r="1.8" fill="#cb6a16" stroke="#cb6a16"/><circle data-series="minimum" data-index="1" data-open="false" cx="850" cy="102.24137931034485" r="1.8" fill="#cb6a16" stroke="#cb6a16"/></svg><text x="35" y="2070" font-size="17">全部成本为1：两个不同运输顶点都最优；四棵生成树不代表四个不同顶点。</text><text x="35" y="2120" font-size="18">固定运行：2026-09-11，Node 24.14.0 / arm64；交互由当前浏览器重新计算。</text></g></svg>