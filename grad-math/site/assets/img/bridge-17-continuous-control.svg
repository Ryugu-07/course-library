<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">终端倾斜、Doob 漂移与路径熵的连续时间机制</title>
  <desc id="desc">左上从固定原点发出的参考布朗路径扩散到零均值高斯终点，右上经终端权重重新分配为受控高斯终点。中间的h函数把未来终端权重向后传播，产生状态依赖漂移，但给定同一终点后的布朗桥保持不变。底部显示路径KL等于终端KL，也等于漂移平方的积分能量。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5d6b73"/>
    </marker>
  </defs>
  <rect width="720" height="520" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#243746">
    <text x="28" y="36" font-size="23">只改终点权重，整条路径出现可计算的漂移</text>

    <rect x="24" y="55" width="292" height="173" rx="8" fill="#e9f3f6" stroke="#28758a"/>
    <text x="42" y="82" font-size="17" font-weight="600" fill="#1f6578">参考路径 R</text>
    <text x="42" y="104" font-size="13">dX = √ε dW，X₀=0</text>
    <circle cx="62" cy="161" r="5" fill="#243746"/>
    <path d="M62 161 C100 124 126 182 160 137 S226 184 273 126" fill="none" stroke="#28758a" stroke-width="2"/>
    <path d="M62 161 C101 196 132 119 171 180 S231 126 273 166" fill="none" stroke="#28758a" stroke-width="1.5" opacity="0.65"/>
    <path d="M62 161 C103 146 127 151 164 159 S226 196 273 188" fill="none" stroke="#28758a" stroke-width="1.5" opacity="0.65"/>
    <line x1="273" y1="116" x2="273" y2="199" stroke="#5d6b73" stroke-width="1"/>
    <path d="M273 195 C286 185 286 130 273 120" fill="none" stroke="#b15c2f" stroke-width="2"/>
    <text x="42" y="215" font-size="12" fill="#59666d">终点：N(0, εT)</text>

    <rect x="404" y="55" width="292" height="173" rx="8" fill="#eef1e8" stroke="#6f7d35"/>
    <text x="422" y="82" font-size="17" font-weight="600" fill="#5d6b2d">受控路径 P</text>
    <text x="422" y="104" font-size="13">dX = u(t,X)dt + √ε dWᴾ</text>
    <circle cx="442" cy="161" r="5" fill="#243746"/>
    <path d="M442 161 C477 142 507 174 539 139 S598 134 651 116" fill="none" stroke="#6f7d35" stroke-width="2"/>
    <path d="M442 161 C480 185 508 137 542 174 S604 147 651 153" fill="none" stroke="#6f7d35" stroke-width="1.5" opacity="0.7"/>
    <path d="M442 161 C480 158 509 148 544 151 S606 111 651 135" fill="none" stroke="#6f7d35" stroke-width="1.5" opacity="0.7"/>
    <line x1="651" y1="108" x2="651" y2="190" stroke="#5d6b73" stroke-width="1"/>
    <path d="M651 185 C666 174 666 126 651 113" fill="none" stroke="#b15c2f" stroke-width="2"/>
    <text x="422" y="215" font-size="12" fill="#59666d">终点：N(aεT/D₀, εT/D₀)</text>

    <line x1="325" y1="116" x2="395" y2="116" stroke="#5d6b73" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="102" text-anchor="middle" font-size="12">终端倾斜</text>
    <text x="360" y="136" text-anchor="middle" font-size="12" fill="#9a4e25">g(X_T)</text>

    <rect x="96" y="250" width="528" height="111" rx="8" fill="#fff" stroke="#c8d0d5"/>
    <text x="360" y="277" text-anchor="middle" font-size="16" font-weight="600">h(t,x) 把未来权重向后传播</text>
    <text x="360" y="304" text-anchor="middle" font-size="14">D_t = 1 + bε(T−t)</text>
    <text x="360" y="328" text-anchor="middle" font-size="14">u(t,x) = ε(a−bx) / D_t</text>
    <text x="360" y="349" text-anchor="middle" font-size="12" fill="#59666d">扩散系数不变；二次变差始终为 εt</text>
    <path d="M176 249 C190 218 221 214 253 228" fill="none" stroke="#5d6b73" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M544 249 C530 218 499 214 467 228" fill="none" stroke="#5d6b73" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="24" y="380" width="672" height="89" rx="8" fill="#f7eee8" stroke="#b15c2f"/>
    <text x="360" y="406" text-anchor="middle" font-size="16" font-weight="600" fill="#984c27">同一份重排，三种完全相同的账</text>
    <text x="360" y="435" text-anchor="middle" font-size="16">D(P ‖ R) = D(P_T ‖ R_T) = (1 / 2ε) E_P ∫₀ᵀ u(t,X_t)² dt</text>
    <text x="360" y="458" text-anchor="middle" font-size="12" fill="#59666d">给定 X_T=y 的条件路径仍是从 0 到 y 的同一条布朗桥律</text>

    <rect x="24" y="487" width="672" height="20" rx="5" fill="#fff0c9"/>
    <text x="360" y="501" text-anchor="middle" font-size="12" fill="#6d5614">改变漂移可做绝对连续换测度；改变 ε 通常使连续路径律互相奇异</text>
  </g>
</svg>
