<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-labelledby="title desc"><title id="title">同一个分解，两条检查路线</title><desc id="desc">先确定整数分解与拟同构q，再分别取锥与换系数；两条路线在张量后的锥处汇合，出现次数负二的上同调。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#576879"/></marker></defs><rect width="680" height="480" rx="12" fill="#faf9f5"/><g font-family="system-ui,sans-serif"><text x="28" y="40" font-size="25" fill="#25394a">同一个分解，两条检查路线</text><path d="M240 151L175 190" fill="none" stroke="#576879" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 151L505 190" fill="none" stroke="#576879" stroke-width="2" marker-end="url(#arrow)"/><path d="M175 298L220 339" fill="none" stroke="#576879" stroke-width="2" marker-end="url(#arrow)"/><path d="M505 298L460 339" fill="none" stroke="#576879" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="65" width="500" height="86" rx="8" fill="#fff" stroke="#667f94"/><text x="106" y="93" font-size="18" font-weight="600" fill="#34596f">起点：P = Z → Z，微分乘 4</text><text x="106" y="119" font-size="15" fill="#25394a">次数 −1、0；q：P → Z/4[0] 是拟同构</text><rect x="25" y="196" width="300" height="102" rx="8" fill="#fff" stroke="#667f94"/><text x="41" y="224" font-size="18" font-weight="600" fill="#34596f">先取锥</text><text x="41" y="250" font-size="15" fill="#25394a">Z → Z → Z/4，次数 −2、−1、0</text><text x="41" y="273" font-size="15" fill="#25394a">微分 −4、q；无环但不可缩</text><rect x="355" y="196" width="300" height="102" rx="8" fill="#fff" stroke="#667f94"/><text x="371" y="224" font-size="18" font-weight="600" fill="#34596f">先与 Z/6 张量</text><text x="371" y="250" font-size="15" fill="#25394a">Z/6 → Z/6，次数 −1、0</text><text x="371" y="273" font-size="15" fill="#25394a">核与余核均同构于 Z/2</text><rect x="70" y="345" width="540" height="82" rx="8" fill="#fff" stroke="#667f94"/><text x="86" y="373" font-size="18" font-weight="600" fill="#34596f">汇合：Cone(q) ⊗ Z/6 = Cone(q ⊗ 1)</text><text x="86" y="399" font-size="15" fill="#25394a">仅 H⁻² ≅ Z/2 非零：张量后的 q 不再是拟同构</text><text x="340" y="455" text-anchor="middle" font-size="15" fill="#8d493b">次数是计算的一部分；核是子模，余核是商模。</text></g></svg>