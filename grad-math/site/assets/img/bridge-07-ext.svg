<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">扩张类和中间模是两本不同的账</title>
  <desc id="desc">固定左端整数和右端模六，中间模由六倍x等于二倍e的关系连接。扩张类是模六中的二，中间模抽象同构于整数直和模二。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25394a"/></marker>
  </defs>
   <rect width="720" height="420" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="40" font-size="25" fill="#25394a">固定两端，改变中间的粘法</text>
    <rect x="24" y="72" width="672" height="126" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="52" y="124" font-size="24" fill="#286fa7">Z</text>
    <path d="M88 116L224 116" stroke="#286fa7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="156" y="101" font-size="17" text-anchor="middle" fill="#286fa7">i(r)=re</text>
    <text x="252" y="124" font-size="22" fill="#25394a">E₂ = Z² / ⟨(−2,6)⟩</text>
    <path d="M482 116L610 116" stroke="#237d68" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="546" y="101" font-size="17" text-anchor="middle" fill="#237d68">p(re+sx)=[s]</text>
    <text x="628" y="124" font-size="22" fill="#237d68">Z/6</text>
    <text x="252" y="169" font-size="21" fill="#a64b35">关系：6x = 2e</text>
    <text x="28" y="238" font-size="21" fill="#25394a">选取 [1] 的提升 x，乘六后落入左端：</text>
    <circle cx="122" cy="304" r="36" fill="#eef4f8" stroke="#286fa7" stroke-width="2"/>
    <text x="122" y="312" font-size="25" text-anchor="middle" fill="#286fa7">x</text>
    <path d="M162 304L326 304" stroke="#a64b35" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="244" y="288" font-size="20" text-anchor="middle" fill="#a64b35">乘 6</text>
    <circle cx="376" cy="304" r="42" fill="#fbefeb" stroke="#a64b35" stroke-width="2"/>
    <text x="376" y="312" font-size="24" text-anchor="middle" fill="#a64b35">2e</text>
    <path d="M422 304L552 304" stroke="#25394a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="488" y="288" font-size="17" text-anchor="middle" fill="#25394a">两种读法</text>
    <text x="574" y="287" font-size="20" fill="#25394a">类 [2] ∈ Z/6</text>
    <text x="574" y="322" font-size="20" fill="#25394a">E₂ ≅ Z ⊕ Z/2</text>
    <text x="28" y="390" font-size="19" fill="#5b6570">类非零，所以不分裂；抽象中间模只看到 gcd(2,6)=2。</text>
  </g>
</svg>
