<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Fourier 正交性留下独立的中心化能量</title>
  <desc id="desc">左侧是平方展开产生的同频和交叉频率项，中间的圆周平均删除交叉项，右侧只保留每个频率的二分之一乘 k 的负二 s 次乘 a 平方加 b 平方减二。底部说明剩余方差为 k 的负四 s 次之和。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#25394a"/></marker>
  </defs>
  <rect width="720" height="420" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="40" font-size="25" fill="#25394a">空间平均不是模糊，而是正交投影</text>

    <rect x="24" y="70" width="202" height="250" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="42" y="105" font-size="20" fill="#25394a">展开平方</text>
    <rect x="43" y="128" width="72" height="42" rx="6" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="79" y="155" text-anchor="middle" font-size="18" fill="#286fa7">k = l</text>
    <rect x="135" y="128" width="72" height="42" rx="6" fill="#f7e9e5" stroke="#a64b35"/>
    <text x="171" y="155" text-anchor="middle" font-size="18" fill="#a64b35">k ≠ l</text>
    <path d="M79 170L79 214" stroke="#286fa7" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M171 170L171 214" stroke="#a64b35" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="79" y="244" text-anchor="middle" font-size="17" fill="#286fa7">同频能量</text>
    <text x="171" y="244" text-anchor="middle" font-size="17" fill="#a64b35">交叉项</text>
    <text x="42" y="287" font-size="17" fill="#5b6570">两者都真实出现</text>

    <path d="M240 194L326 194" stroke="#25394a" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="283" cy="194" r="34" fill="#ffffff" stroke="#237d68" stroke-width="3"/>
    <text x="283" y="188" text-anchor="middle" font-size="17" fill="#237d68">圆周</text>
    <text x="283" y="210" text-anchor="middle" font-size="17" fill="#237d68">平均</text>
    <text x="283" y="253" text-anchor="middle" font-size="16" fill="#5b6570">正交性；减 C_N</text>
    <path d="M263 272L303 272" stroke="#a64b35" stroke-width="3"/>
    <path d="M269 262L297 282" stroke="#a64b35" stroke-width="3"/>

    <rect x="340" y="70" width="356" height="250" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="360" y="105" font-size="20" fill="#25394a">只留下独立的中心化能量</text>
    <rect x="361" y="128" width="314" height="58" rx="6" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="518" y="163" text-anchor="middle" font-size="21" fill="#286fa7">½ k⁻²ˢ (aₖ² + bₖ² − 2)</text>
    <text x="359" y="222" font-size="18" fill="#237d68">每个 k：均值 0，方差 k⁻⁴ˢ</text>
    <path d="M361 244L674 244" stroke="#c9d1d8" stroke-width="2"/>
    <text x="359" y="279" font-size="18" fill="#25394a">尾部能否求和，决定截断是否靠拢</text>

    <rect x="24" y="342" width="672" height="52" rx="8" fill="#eef4ee" stroke="#79a88f"/>
    <text x="360" y="374" text-anchor="middle" font-size="20" fill="#1f6756">L² Cauchy ⇔ s &gt; 1/4：全部方差尾和趋零</text>
  </g>
</svg>
