<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">换系数产生新的核</title><desc id="desc">上方整数乘六是单射，下方模四乘六把零和二映到零，一和三映到二。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="25" fill="#25394a" text-anchor="start">换系数后，单射可能失效</text><text x="35" y="90" font-size="28" fill="#286fa7" text-anchor="start">Z</text><path d="M90 80L265 80" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="175" y="68" font-size="20" fill="#286fa7" text-anchor="middle">×6</text><text x="290" y="90" font-size="28" fill="#286fa7" text-anchor="start">Z</text><text x="400" y="90" font-size="22" fill="#25394a" text-anchor="start">核 = {0}</text><text x="25" y="140" font-size="22" fill="#25394a" text-anchor="start">与 Z/4 张量后：</text><path d="M90 210L90 285" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="90" y="195" font-size="24" fill="#25394a" text-anchor="middle">0</text><text x="90" y="316" font-size="24" fill="#25394a" text-anchor="middle">0</text><path d="M225 210L360 285" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="225" y="195" font-size="24" fill="#25394a" text-anchor="middle">1</text><text x="225" y="316" font-size="24" fill="#25394a" text-anchor="middle">1</text><path d="M360 210L90 285" fill="none" stroke="#a64b35" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="360" y="195" font-size="24" fill="#25394a" text-anchor="middle">2</text><text x="360" y="316" font-size="24" fill="#25394a" text-anchor="middle">2</text><path d="M495 210L360 285" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="495" y="195" font-size="24" fill="#25394a" text-anchor="middle">3</text><text x="495" y="316" font-size="24" fill="#25394a" text-anchor="middle">3</text><text x="25" y="355" font-size="21" fill="#25394a" text-anchor="start">核 {0,2}；像 {0,2}；余核有两个类</text></g></svg>
