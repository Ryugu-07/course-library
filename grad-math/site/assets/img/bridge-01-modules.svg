<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">整数短正合列</title><desc id="desc">整数乘六为单射，像为六的倍数，商有六个剩余类。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="25" fill="#25394a" text-anchor="start">乘六是单射，余核却不为零</text><text x="50" y="90" font-size="30" fill="#286fa7" text-anchor="start">Z</text><path d="M100 80L245 80" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="165" y="66" font-size="20" fill="#286fa7" text-anchor="middle">×6</text><text x="265" y="90" font-size="30" fill="#286fa7" text-anchor="start">Z</text><path d="M320 80L445 80" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="380" y="65" font-size="18" fill="#286fa7" text-anchor="middle">取模六</text><text x="465" y="90" font-size="28" fill="#286fa7" text-anchor="start">Z/6Z</text><text x="25" y="145" font-size="21" fill="#25394a" text-anchor="start">中间整数轴：像只包含六的倍数</text><path d="M45 200L555 200" fill="none" stroke="#25394a" stroke-width="3" stroke-dasharray=""/><circle cx="50" cy="200" r="7" fill="#286fa7"/><text x="50" y="230" font-size="18" fill="#25394a" text-anchor="middle">-6</text><circle cx="91" cy="200" r="4" fill="#aab3ba"/><circle cx="132" cy="200" r="4" fill="#aab3ba"/><circle cx="173" cy="200" r="4" fill="#aab3ba"/><text x="173" y="230" font-size="18" fill="#25394a" text-anchor="middle">-3</text><circle cx="214" cy="200" r="4" fill="#aab3ba"/><circle cx="255" cy="200" r="4" fill="#aab3ba"/><circle cx="296" cy="200" r="7" fill="#286fa7"/><text x="296" y="230" font-size="18" fill="#25394a" text-anchor="middle">0</text><circle cx="337" cy="200" r="4" fill="#aab3ba"/><circle cx="378" cy="200" r="4" fill="#aab3ba"/><circle cx="419" cy="200" r="4" fill="#aab3ba"/><text x="419" y="230" font-size="18" fill="#25394a" text-anchor="middle">3</text><circle cx="460" cy="200" r="4" fill="#aab3ba"/><circle cx="501" cy="200" r="4" fill="#aab3ba"/><circle cx="542" cy="200" r="7" fill="#286fa7"/><text x="542" y="230" font-size="18" fill="#25394a" text-anchor="middle">6</text><text x="25" y="277" font-size="23" fill="#286fa7" text-anchor="start">核 = {0}     像 = 6Z</text><text x="25" y="318" font-size="22" fill="#25394a" text-anchor="start">商保留 0、1、2、3、4、5 六类</text><text x="25" y="352" font-size="20" fill="#a64b35" text-anchor="start">整数中不可随意除以主元。</text></g></svg>
