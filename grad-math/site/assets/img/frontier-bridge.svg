<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 510" role="img" aria-labelledby="title desc"><title id="title">端点耦合与条件桥</title><desc id="desc">端点概率重新配权，同一端点对的参考条件桥保持不变；二者混合得到路径律。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243746"/></marker></defs><rect width="440" height="510" rx="12" fill="#faf9f5"/><g font-family="system-ui,sans-serif"><text x="22" y="34" font-size="22" fill="#243746" text-anchor="start">桥的两层：端点权重＋条件路径</text><rect x="22" y="55" width="396" height="75" rx="9" fill="#deebf5"/><text x="40" y="85" font-size="22" fill="#27689b" text-anchor="start">端点联合分布：rᵢⱼ → πᵢⱼ</text><text x="40" y="115" font-size="21" fill="#27689b" text-anchor="start">行和 μ₀；列和 μT</text><path d="M65 220C135 135 310 145 375 220" fill="none" stroke="#a46615" stroke-width="3" stroke-dasharray=""/><path d="M65 220C145 250 295 175 375 220" fill="none" stroke="#a46615" stroke-width="3" stroke-dasharray=""/><path d="M65 220C145 300 290 290 375 220" fill="none" stroke="#a46615" stroke-width="3" stroke-dasharray=""/><circle cx="65" cy="220" r="7" fill="#27689b"/><text x="65" y="319" font-size="21" fill="#27689b" text-anchor="middle">起点 i</text><circle cx="375" cy="220" r="7" fill="#27689b"/><text x="375" y="319" font-size="21" fill="#27689b" text-anchor="middle">终点 j</text><text x="220" y="151" font-size="21" fill="#a46615" text-anchor="middle">固定这一对端点</text><rect x="22" y="344" width="396" height="110" rx="9" fill="#eee5d5"/><text x="40" y="376" font-size="22" fill="#a46615" text-anchor="start">沿途条件律保留 Rⁱʲ</text><text x="40" y="411" font-size="21" fill="#243746" text-anchor="start">完整路径律 P = Σᵢⱼ πᵢⱼ Rⁱʲ</text><text x="22" y="487" font-size="21" fill="#243746" text-anchor="start">结构示意；曲线不是模拟轨迹</text></g></svg>
