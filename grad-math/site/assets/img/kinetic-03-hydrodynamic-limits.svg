<svg xmlns="http://www.w3.org/2000/svg" width="440" height="548" viewBox="0 0 440 548" role="img" aria-labelledby="title desc"><title id="title">零矩扰动衰减，守恒矩留下</title><desc id="desc">四速BGK模型的当前分布与平衡条形图，三种守恒矩相同。空间输运不在本实验内。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="context-stroke"/></marker></defs><rect width="440" height="548" fill="#faf9f5"/><g font-family="system-ui, sans-serif"><text x="220" y="34" font-size="24" fill="#253349" text-anchor="middle">零矩扰动衰减，守恒矩留下</text><text x="220" y="71" font-size="20" fill="#253349" text-anchor="middle">ε = 0.5，η = 0.03，t = 0.5</text><path d="M48,98L48,327" fill="none" stroke="#657185" stroke-width="2"/><path d="M48,327L411,327" fill="none" stroke="#657185" stroke-width="2"/><text x="40" y="334" font-size="20" fill="#657185" text-anchor="end">0</text><path d="M48,327L405,327" fill="none" stroke="#dce1e7" stroke-width="1"/><text x="40" y="246.0" font-size="20" fill="#657185" text-anchor="end">0.2</text><path d="M48,239.0L405,239.0" fill="none" stroke="#dce1e7" stroke-width="1"/><text x="40" y="158.0" font-size="20" fill="#657185" text-anchor="end">0.4</text><path d="M48,151.0L405,151.0" fill="none" stroke="#dce1e7" stroke-width="1"/><rect x="65" y="282.010376156" width="19" height="44.98962384399999" fill="#3978bd"/><rect x="88" y="286.86638476400003" width="19" height="40.13361523599997" fill="#20826c"/><text x="85" y="358" font-size="21" fill="#253349" text-anchor="middle">-2</text><rect x="159" y="156.845632496" width="19" height="170.154367504" fill="#3978bd"/><rect x="182" y="147.133615236" width="19" height="179.866384764" fill="#20826c"/><text x="179" y="358" font-size="21" fill="#253349" text-anchor="middle">-1</text><rect x="253" y="137.421597976" width="19" height="189.578402024" fill="#3978bd"/><rect x="276" y="147.133615236" width="19" height="179.866384764" fill="#20826c"/><text x="273" y="358" font-size="21" fill="#253349" text-anchor="