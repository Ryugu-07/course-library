<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">自由平方族与含挠族的普通纤维和导出纤维</title>
  <desc id="desc">上方比较秩二自由平方族和含有被t杀死的平方零类的非平坦族。中间展示闭点自由分解张量后得到从A到A的两项复形，负一次同调是核，零次同调是余核。下方显示两个族在原点都有双点普通纤维，但只有含挠族具有一维Tor一。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#627682"/>
    </marker>
  </defs>
  <rect width="720" height="500" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#25394a">
    <text x="28" y="37" font-size="24">同一个普通双点，可能来自不同的族</text>

    <rect x="28" y="56" width="320" height="151" rx="8" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="48" y="83" font-size="18" font-weight="600" fill="#245f8d">自由平方族</text>
    <text x="48" y="108" font-size="15">A_free = B[u] / (u²−t)</text>
    <text x="48" y="132" font-size="15">B-模：B · 1 ⊕ B · u</text>
    <circle cx="76" cy="151" r="6" fill="#286fa7"/>
    <circle cx="130" cy="151" r="6" fill="#286fa7"/>
    <path d="M76 159L103 173L130 159" fill="none" stroke="#286fa7" stroke-width="2"/>
    <circle cx="103" cy="183" r="10" fill="#fff" stroke="#286fa7" stroke-width="3"/>
    <circle cx="103" cy="183" r="3" fill="#286fa7"/>
    <text x="174" y="158" font-size="13">a≠0：两个约化点</text>
    <text x="174" y="181" font-size="13">a=0：一个长度 2 双点</text>
    <text x="174" y="199" font-size="12" fill="#245f8d">纤维维数始终为 2</text>

    <rect x="372" y="56" width="320" height="151" rx="8" fill="#f7e9e5" stroke="#a64b35"/>
    <text x="392" y="83" font-size="18" font-weight="600" fill="#8d3f2e">含挠族</text>
    <text x="392" y="108" font-size="15">A_tor = B[x] / (x², tx)</text>
    <text x="392" y="132" font-size="15">B-模：B · 1 ⊕ C · x，且 tx=0</text>
    <circle cx="448" cy="151" r="6" fill="#a64b35"/>
    <path d="M448 159V171" fill="none" stroke="#a64b35" stroke-width="2"/>
    <circle cx="448" cy="183" r="10" fill="#fff" stroke="#a64b35" stroke-width="3"/>
    <circle cx="448" cy="183" r="3" fill="#a64b35"/>
    <text x="519" y="158" font-size="13">a≠0：一个约化点</text>
    <text x="519" y="181" font-size="13">a=0：一个长度 2 双点</text>
    <text x="519" y="199" font-size="12" fill="#8d3f2e">纤维维数从 1 跳到 2</text>

    <rect x="28" y="225" width="664" height="111" rx="8" fill="#fff" stroke="#c9d1d8"/>
    <text x="48" y="251" font-size="17" font-weight="600">导出张量的两项账本</text>
    <rect x="57" y="270" width="92" height="42" rx="6" fill="#f7f8f8" stroke="#627682"/>
    <text x="103" y="296" text-anchor="middle" font-size="16">B（−1 次）</text>
    <path d="M155 291H222" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="188" y="280" text-anchor="middle" font-size="13">t−a</text>
    <rect x="229" y="270" width="84" height="42" rx="6" fill="#f7f8f8" stroke="#627682"/>
    <text x="271" y="296" text-anchor="middle" font-size="16">B（0 次）</text>
    <path d="M328 291H383" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="356" y="280" text-anchor="middle" font-size="12">张量 A</text>
    <rect x="396" y="270" width="72" height="42" rx="6" fill="#eef4ee" stroke="#237d68"/>
    <text x="432" y="296" text-anchor="middle" font-size="17">A</text>
    <path d="M474 291H526" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="280" text-anchor="middle" font-size="13">t−a</text>
    <rect x="533" y="270" width="72" height="42" rx="6" fill="#eef4ee" stroke="#237d68"/>
    <text x="569" y="296" text-anchor="middle" font-size="17">A</text>
    <text x="624" y="280" font-size="12" fill="#8d3f2e">核 = H⁻¹</text>
    <text x="624" y="301" font-size="12" fill="#245f8d">余核 = H⁰</text>
    <text x="360" y="328" text-anchor="middle" font-size="12" fill="#66727c">普通纤维只取余核；导出纤维还保留张量后出现的核</text>

    <rect x="28" y="354" width="664" height="112" rx="8" fill="#fff" stroke="#c9d1d8"/>
    <text x="48" y="380" font-size="17" font-weight="600">只比较 a=0：普通纤维相同，负一次同调不同</text>

    <circle cx="117" cy="419" r="13" fill="#fff" stroke="#286fa7" stroke-width="4"/>
    <circle cx="117" cy="419" r="4" fill="#286fa7"/>
    <text x="147" y="412" font-size="14">自由族 H⁰：双点</text>
    <text x="147" y="434" font-size="14" fill="#237d68">H⁻¹ = 0</text>

    <line x1="323" y1="393" x2="323" y2="449" stroke="#c9d1d8" stroke-width="1.5"/>
    <text x="360" y="414" font-size="13" fill="#66727c">相同余核</text>
    <text x="360" y="436" font-size="13" fill="#8d3f2e">不同的核</text>

    <circle cx="497" cy="419" r="13" fill="#fff" stroke="#a64b35" stroke-width="4"/>
    <circle cx="497" cy="419" r="4" fill="#a64b35"/>
    <text x="527" y="412" font-size="14">含挠族 H⁰：双点</text>
    <text x="527" y="434" font-size="14" fill="#a64b35">H⁻¹ = C · x</text>

    <rect x="28" y="478" width="664" height="14" rx="4" fill="#fff2cc"/>
    <text x="360" y="489" text-anchor="middle" font-size="11" fill="#6f5712">Tor 记录张量丢掉的单射性，不是额外的普通拓扑点</text>
  </g>
</svg>
