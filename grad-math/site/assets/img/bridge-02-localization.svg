<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">模十二反演二</title><desc id="desc">中国剩余分解的模四分量被反演二杀死，模三分量保留。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="24" fill="#25394a" text-anchor="start">反演二：十二个类变成三个类</text><rect x="180" y="62" width="240" height="64" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="300" y="103" font-size="28" fill="#286fa7" text-anchor="middle">Z/12Z</text><path d="M220 128L140 175" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M380 128L460 175" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="30" y="180" width="220" height="65" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="140" y="222" font-size="27" fill="#286fa7" text-anchor="middle">Z/4Z</text><rect x="350" y="180" width="220" height="65" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="460" y="222" font-size="27" fill="#286fa7" text-anchor="middle">Z/3Z</text><text x="140" y="272" font-size="22" fill="#a64b35" text-anchor="middle">2²=0 → 1=0</text><text x="460" y="272" font-size="20" fill="#237d68" text-anchor="middle">2×2=1，已可逆</text><text x="140" y="315" font-size="21" fill="#a64b35" text-anchor="middle">零环（一个元素）</text><text x="460" y="315" font-size="24" fill="#237d68" text-anchor="middle">保留 Z/3Z</text><text x="25" y="355" font-size="22" fill="#25394a" text-anchor="start">自然映射的核：0、3、6、9</text></g></svg>
