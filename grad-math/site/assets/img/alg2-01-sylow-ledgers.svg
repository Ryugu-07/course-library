<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2140" viewBox="0 0 1000 2140" role="img" aria-labelledby="title desc"><title id="title">群作用、Sylow固定点与可解性</title><desc id="desc">S₃陪集、A₄的Sylow作用、S₄导出列和A₅共轭类四个固定对照。</desc><rect width="1000" height="2140" fill="#faf7ef"/><g fill="#253346" color="#253346" font-family="system-ui,sans-serif"><text x="35" y="48" font-size="28">同一套计数规则，作用在不同对象上</text><svg x="50" y="85" xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img"><title>当前作用：完整轨道与固定点</title><rect width="900" height="425" fill="var(--bg,#faf7ef)"/><text x="25" y="30" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" font-weight="700">当前作用：完整轨道与固定点</text><text x="25" y="60" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >作用者阶 6；所选轨道 3 × 稳定子 2；轨道总数 1</text><circle data-point="0" data-orbit="0" cx="80" cy="99" r="11" fill="#268bd2" fill-opacity=".22" stroke="currentColor" stroke-width="3"/><text x="80" y="103" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="middle" font-size="11">0</text><circle data-point="1" data-orbit="0" cx="142" cy="99" r="11" fill="#268bd2" fill-opacity=".22" stroke="currentColor" stroke-width="1"/><text x="142" y="103" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="middle" font-size="11">1</text><circle data-point="2" data-orbit="0" cx="204" cy="99" r="11" fill="#268bd2" fill-opacity=".22" stroke="currentColor" stroke-width="1"/><text x="204" y="103" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="middle" font-size="11">2</text><text x="25" y="385" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >圆内是作用点编号；同轨道循环用色，完整归属见表。金边=全部作用者固定，粗边=所选点。</text><text x="25" y="409" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >编号排布不表示几何距离；颜色超过六类后重复，不能仅凭颜色判断同一轨道。</text></svg><text x="35" y="540" font-size="17">S₃对非正规二阶H的三个左陪集作用：轨道3、稳定子2；陪集尚不是商群。</text><svg x="50" y="595" xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img"><title>当前作用：完整轨道与固定点</title><rect width="900" height="425" fill="var(--bg,#faf7ef)"/><text x="25" y="30" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" font-weight="700">当前作用：完整轨道与固定点</text><text x="25" y="60" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >作用者阶 3；所选轨道 1 × 稳定子 3；轨道总数 2</text><circle data-point="0" data-orbit="0" cx="80" cy="99" r="11" fill="#268bd2" fill-opacity=".22" stroke="#c17a18" stroke-width="3"/><text x="80" y="103" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="middle" font-size="11">0</text><circle data-point="1" data-orbit="1" cx="142" cy="99" r="11" fill="#b44a72" fill-opacity=".22" stroke="currentColor" stroke-width="1"/><text x="142" y="103" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="middle" font-size="11">1</text><circle data-point="2" data-orbit="1" cx="204" cy="99" r="11" fill="#b44a72" fill-opacity=".22" stroke="currentColor" stroke-width="1"/><text x="204" y="103" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="middle" font-size="11">2</text><circle data-point="3" data-orbit="1" cx="266" cy="99" r="11" fill="#b44a72" fill-opacity=".22" stroke="currentColor" stroke-width="1"/><text x="266" y="103" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="middle" font-size="11">3</text><text x="25" y="385" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >圆内是作用点编号；同轨道循环用色，完整归属见表。金边=全部作用者固定，粗边=所选点。</text><text x="25" y="409" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >编号排布不表示几何距离；颜色超过六类后重复，不能仅凭颜色判断同一轨道。</text></svg><text x="35" y="1050" font-size="17">A₄中一个Sylow 3子群作用：只固定自己，另外三个子群形成一个轨道。</text><svg x="50" y="1105" xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img"><title>导出列：下降到1，或在非平凡群稳定</title><rect width="900" height="425" fill="var(--bg,#faf7ef)"/><text x="25" y="30" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" font-weight="700">导出列：下降到1，或在非平凡群稳定</text><line x1="100" y1="335" x2="820" y2="335" stroke="currentColor" opacity=".15"/><text x="85" y="339" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">0</text><line x1="100" y1="276.25" x2="820" y2="276.25" stroke="currentColor" opacity=".15"/><text x="85" y="280.25" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">6</text><line x1="100" y1="217.5" x2="820" y2="217.5" stroke="currentColor" opacity=".15"/><text x="85" y="221.5" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">12</text><line x1="100" y1="158.75" x2="820" y2="158.75" stroke="currentColor" opacity=".15"/><text x="85" y="162.75" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">18</text><line x1="100" y1="100" x2="820" y2="100" stroke="currentColor" opacity=".15"/><text x="85" y="104" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">24</text><text x="25" y="60" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >全群G：24 → 12 → 4 → 1；到达平凡群</text><polyline data-series="group" points="100,100 340,217.5 580,295.8333333333333 820,325.2083333333333" fill="none" stroke="#268bd2" stroke-width="2"/><circle data-series="group" data-step="0" cx="100" cy="100" r="5" fill="#268bd2"/><text x="92" y="91" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="end" font-size="12" data-value="group-0">24</text><circle data-series="group" data-step="1" cx="340" cy="217.5" r="5" fill="#268bd2"/><text x="332" y="208.5" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="end" font-size="12" data-value="group-1">12</text><circle data-series="group" data-step="2" cx="580" cy="295.8333333333333" r="5" fill="#268bd2"/><text x="572" y="286.8333333333333" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="end" font-size="12" data-value="group-2">4</text><circle data-series="group" data-step="3" cx="820" cy="325.2083333333333" r="5" fill="#268bd2"/><text x="812" y="316.2083333333333" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="end" font-size="12" data-value="group-3">1</text><text x="455" y="60" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >所选H：2 → 1；到达平凡群</text><polyline data-series="subgroup" points="100,315.4166666666667 340,325.2083333333333" fill="none" stroke="#b44a72" stroke-width="2"/><circle data-series="subgroup" data-step="0" cx="100" cy="315.4166666666667" r="3" fill="#b44a72"/><text x="108" y="306.4166666666667" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="start" font-size="12" data-value="subgroup-0">2</text><circle data-series="subgroup" data-step="1" cx="340" cy="325.2083333333333" r="3" fill="#b44a72"/><text x="348" y="316.2083333333333" fill="currentColor" font-family="system-ui,sans-serif" text-anchor="start" font-size="12" data-value="subgroup-1">1</text><text x="100" y="360" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">0</text><text x="340" y="360" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">1</text><text x="580" y="360" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">2</text><text x="820" y="360" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">3</text><text x="25" y="403" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >横轴为导出次数，纵轴为群阶；相同点可能重叠，完整链及交换子生成词见表。</text></svg><text x="35" y="1560" font-size="17">S₄的导出列24→12→4→1；图中所选H为二阶子群，导出列2→1。</text><svg x="50" y="1615" xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img"><title>共轭类大小：单点类组成中心</title><rect width="900" height="425" fill="var(--bg,#faf7ef)"/><text x="25" y="30" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" font-weight="700">共轭类大小：单点类组成中心</text><line x1="80" y1="335" x2="850" y2="335" stroke="currentColor" opacity=".15"/><text x="66" y="339" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">0</text><line x1="80" y1="275" x2="850" y2="275" stroke="currentColor" opacity=".15"/><text x="66" y="279" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">5</text><line x1="80" y1="215" x2="850" y2="215" stroke="currentColor" opacity=".15"/><text x="66" y="219" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">10</text><line x1="80" y1="155" x2="850" y2="155" stroke="currentColor" opacity=".15"/><text x="66" y="159" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">15</text><line x1="80" y1="95" x2="850" y2="95" stroke="currentColor" opacity=".15"/><text x="66" y="99" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="end">20</text><rect data-bar="total" data-index="0" x="134" y="323" width="42" height="12" fill="#c17a18"/><text x="155" y="316" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">1</text><text x="155" y="359" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">0</text><rect data-bar="total" data-index="1" x="284" y="95" width="42" height="240" fill="#268bd2"/><text x="305" y="88" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">20</text><text x="305" y="359" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">1</text><rect data-bar="total" data-index="2" x="434" y="155" width="42" height="180" fill="#268bd2"/><text x="455" y="148" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">15</text><text x="455" y="359" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">2</text><rect data-bar="total" data-index="3" x="584" y="191" width="42" height="144" fill="#268bd2"/><text x="605" y="184" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">12</text><text x="605" y="359" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">3</text><rect data-bar="total" data-index="4" x="734" y="191" width="42" height="144" fill="#268bd2"/><text x="755" y="184" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">12</text><text x="755" y="359" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">4</text><text x="25" y="60" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >总计 60 个群元素；横轴共轭类编号，金色为单点类。</text><text x="25" y="402" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" >类成员与中心化子在完整表中；柱宽没有群论含义。</text></svg><text x="35" y="2070" font-size="17">A₅类方程60=1+20+15+12+12；这些类的并只有平凡及全群能给正规子群。</text><text x="35" y="2120" font-size="18">固定运行：2026-09-11，Node 24.14.0 / arm64；完整编号与生成词见下载记录。</text></g></svg>