<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">三角形边框和填面</title><desc id="desc">边方向均依编号递增，回路系数为一一负一；填面令同调类成为边界。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="24" fill="#25394a" text-anchor="start">闭链相同，允许的边界不同</text><path d="M55 245L240 245" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M240 245L150 105" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M55 245L150 105" fill="none" stroke="#a64b35" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="45" y="275" font-size="20" fill="#25394a" text-anchor="start">v₀</text><text x="240" y="275" font-size="20" fill="#25394a" text-anchor="start">v₁</text><text x="140" y="92" font-size="20" fill="#25394a" text-anchor="start">v₂</text><text x="150" y="190" font-size="23" fill="#25394a" text-anchor="middle">无面</text><text x="150" y="315" font-size="24" fill="#286fa7" text-anchor="middle">H₁ ≅ R</text><path d="M355 245L540 245L450 105z" fill="#dfede7"/><path d="M355 245L540 245" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M540 245L450 105" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M355 245L450 105" fill="none" stroke="#a64b35" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="345" y="275" font-size="20" fill="#25394a" text-anchor="start">v₀</text><text x="540" y="275" font-size="20" fill="#25394a" text-anchor="start">v₁</text><text x="440" y="92" font-size="20" fill="#25394a" text-anchor="start">v₂</text><text x="450" y="190" font-size="23" fill="#237d68" text-anchor="middle">有面</text><text x="450" y="315" font-size="24" fill="#286fa7" text-anchor="middle">H₁ = 0</text><text x="25" y="355" font-size="21" fill="#25394a" text-anchor="start">回路 e₀₁ + e₁₂ − e₀₂；两侧都闭合</text></g></svg>
