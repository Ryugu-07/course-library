<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">映射锥的移位、负号与标量模型</title>
  <desc id="desc">上半部分把锥在相邻次数的B分量和左移后的A分量画成两层，A分量沿负dA移动并通过f进入B分量，使二次微分中的两个混合项抵消。下半部分比较标量a非零时的可收缩锥与a等于零时两个非零上同调群。</desc>
  <rect width="720" height="440" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="38" font-size="25" fill="#25394a">映射的失败，变成一个可以取上同调的锥</text>

    <rect x="28" y="58" width="664" height="198" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="48" y="87" font-size="18" font-weight="600" fill="#25394a">一般锥：Cone(f)ⁿ = Bⁿ ⊕ Aⁿ⁺¹</text>
    <text x="252" y="111" text-anchor="middle" font-size="14" fill="#66727c">次数 n</text>
    <text x="512" y="111" text-anchor="middle" font-size="14" fill="#66727c">次数 n + 1</text>

    <rect x="184" y="123" width="136" height="40" rx="6" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="252" y="149" text-anchor="middle" font-size="19" fill="#245f8d">Bⁿ</text>
    <rect x="444" y="123" width="136" height="40" rx="6" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="512" y="149" text-anchor="middle" font-size="19" fill="#245f8d">Bⁿ⁺¹</text>
    <path d="M324 143H432M432 143L419 135M432 143L419 151" fill="none" stroke="#286fa7" stroke-width="3"/>
    <text x="378" y="134" text-anchor="middle" font-size="15" fill="#286fa7">d<tspan baseline-shift="sub" font-size="11">B</tspan></text>

    <rect x="184" y="187" width="136" height="40" rx="6" fill="#f7e9e5" stroke="#a64b35"/>
    <text x="252" y="213" text-anchor="middle" font-size="19" fill="#8d3f2e">Aⁿ⁺¹</text>
    <rect x="444" y="187" width="136" height="40" rx="6" fill="#f7e9e5" stroke="#a64b35"/>
    <text x="512" y="213" text-anchor="middle" font-size="19" fill="#8d3f2e">Aⁿ⁺²</text>
    <path d="M324 207H432M432 207L419 199M432 207L419 215" fill="none" stroke="#a64b35" stroke-width="3"/>
    <text x="378" y="198" text-anchor="middle" font-size="15" fill="#a64b35">−d<tspan baseline-shift="sub" font-size="11">A</tspan></text>

    <path d="M320 198C362 184 399 162 438 149M438 149L423 148M438 149L428 160" fill="none" stroke="#237d68" stroke-width="3"/>
    <text x="376" y="169" text-anchor="middle" font-size="15" fill="#237d68">f</text>

    <path d="M170 119V231M170 119H179M170 231H179" fill="none" stroke="#66727c" stroke-width="2"/>
    <path d="M334 119V231M334 119H325M334 231H325" fill="none" stroke="#66727c" stroke-width="2"/>
    <path d="M430 119V231M430 119H439M430 231H439" fill="none" stroke="#66727c" stroke-width="2"/>
    <path d="M594 119V231M594 119H585M594 231H585" fill="none" stroke="#66727c" stroke-width="2"/>

    <rect x="46" y="232" width="628" height="18" rx="4" fill="#eef4ee"/>
    <text x="360" y="246" text-anchor="middle" font-size="13" fill="#237d68">再走一步：d<tspan baseline-shift="sub" font-size="10">B</tspan> f(x) − f d<tspan baseline-shift="sub" font-size="10">A</tspan>(x) = 0，负号让两条混合路径抵消</text>

    <rect x="28" y="274" width="322" height="126" rx="8" fill="#ffffff" stroke="#237d68" stroke-width="1.5"/>
    <text x="48" y="304" font-size="19" font-weight="600" fill="#237d68">a ≠ 0：可逆，所以可缩</text>
    <rect x="61" y="322" width="72" height="34" rx="5" fill="#eef4ee" stroke="#237d68"/>
    <text x="97" y="345" text-anchor="middle" font-size="12" fill="#25394a">k（−1 次）</text>
    <path d="M141 339H224M224 339L212 332M224 339L212 346" fill="none" stroke="#237d68" stroke-width="3"/>
    <text x="182" y="330" text-anchor="middle" font-size="14" fill="#237d68">× a</text>
    <rect x="232" y="322" width="72" height="34" rx="5" fill="#eef4ee" stroke="#237d68"/>
    <text x="268" y="345" text-anchor="middle" font-size="12" fill="#25394a">k（0 次）</text>
    <text x="48" y="381" font-size="15" fill="#25394a">rank = 1，H⁻¹ = H⁰ = 0，s(y) = y/a</text>

    <rect x="370" y="274" width="322" height="126" rx="8" fill="#ffffff" stroke="#a64b35" stroke-width="1.5"/>
    <text x="390" y="304" font-size="19" font-weight="600" fill="#a64b35">a = 0：核与余核同时留下</text>
    <rect x="403" y="322" width="72" height="34" rx="5" fill="#f7e9e5" stroke="#a64b35"/>
    <text x="439" y="345" text-anchor="middle" font-size="12" fill="#25394a">k（−1 次）</text>
    <path d="M483 339H566M566 339L554 332M566 339L554 346" fill="none" stroke="#a64b35" stroke-width="3"/>
    <text x="524" y="330" text-anchor="middle" font-size="14" fill="#a64b35">× 0</text>
    <rect x="574" y="322" width="72" height="34" rx="5" fill="#f7e9e5" stroke="#a64b35"/>
    <text x="610" y="345" text-anchor="middle" font-size="12" fill="#25394a">k（0 次）</text>
    <text x="390" y="381" font-size="15" fill="#25394a">rank = 0，dim H⁻¹ = dim H⁰ = 1</text>

    <rect x="28" y="412" width="664" height="18" rx="4" fill="#fff2cc"/>
    <text x="360" y="426" text-anchor="middle" font-size="13" fill="#6f5712">维数只在精确的 a = 0 跳变；两个次数之间的连线不表示中间还有次数</text>
  </g>
</svg>
