<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">随机 Fourier 场的热核过滤与 Sobolev 收敛阈值</title>
  <desc id="desc">上方左侧画出延伸到高频的原始随机Fourier谱，经过乘子e的负epsilon k平方后，右侧高频被压低形成光滑场。中部Sobolev刻度标明s小于alpha减二分之一时在L2概率H s收敛，临界处倍增壳层趋于二倍log2。下方比较只观察一个测试函数投影与控制全部频率的Sobolev范数。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5e6c73"/>
    </marker>
  </defs>
  <rect width="720" height="520" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#243746">
    <text x="28" y="36" font-size="23">热核压低高频；Sobolev 范数决定极限在哪</text>

    <rect x="24" y="56" width="286" height="178" rx="8" fill="#e9f3f6" stroke="#28758a"/>
    <text x="42" y="82" font-size="17" font-weight="600" fill="#1f6578">原始系数幅度（示意）</text>
    <line x1="48" y1="196" x2="286" y2="196" stroke="#66747b"/>
    <line x1="48" y1="101" x2="48" y2="196" stroke="#66747b"/>
    <g fill="#28758a">
      <rect x="61" y="118" width="12" height="78"/><rect x="81" y="132" width="12" height="64"/>
      <rect x="101" y="111" width="12" height="85"/><rect x="121" y="145" width="12" height="51"/>
      <rect x="141" y="126" width="12" height="70"/><rect x="161" y="153" width="12" height="43"/>
      <rect x="181" y="137" width="12" height="59"/><rect x="201" y="157" width="12" height="39"/>
      <rect x="221" y="145" width="12" height="51"/><rect x="241" y="162" width="12" height="34"/>
      <rect x="261" y="151" width="12" height="45"/>
    </g>
    <text x="42" y="219" font-size="12" fill="#59666d">横轴 k →；高度仅示意，非采样数据</text>

    <rect x="410" y="56" width="286" height="178" rx="8" fill="#eef1e8" stroke="#6f7d35"/>
    <text x="428" y="82" font-size="17" font-weight="600" fill="#5d6b2d">热平滑 Xε</text>
    <line x1="434" y1="196" x2="672" y2="196" stroke="#66747b"/>
    <line x1="434" y1="101" x2="434" y2="196" stroke="#66747b"/>
    <g fill="#6f7d35">
      <rect x="447" y="120" width="12" height="76"/><rect x="467" y="140" width="12" height="56"/>
      <rect x="487" y="136" width="12" height="60"/><rect x="507" y="168" width="12" height="28"/>
      <rect x="527" y="166" width="12" height="30"/><rect x="547" y="184" width="12" height="12"/>
      <rect x="567" y="185" width="12" height="11"/><rect x="587" y="191" width="12" height="5"/>
      <rect x="607" y="192" width="12" height="4"/><rect x="627" y="194" width="12" height="2"/>
      <rect x="647" y="195" width="12" height="1"/>
    </g>
    <text x="428" y="219" font-size="12" fill="#59666d">横轴 k →；固定 ε&gt;0：几乎必然光滑</text>

    <line x1="320" y1="129" x2="400" y2="129" stroke="#5e6c73" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="112" text-anchor="middle" font-size="12">频率乘子</text>
    <text x="360" y="150" text-anchor="middle" font-size="14" fill="#a34f2b">e^(−ε k²)</text>
    <text x="360" y="174" text-anchor="middle" font-size="11" fill="#59666d">k 越大，压得越快</text>

    <rect x="24" y="253" width="672" height="113" rx="8" fill="#fff" stroke="#c8d0d5"/>
    <text x="44" y="280" font-size="16" font-weight="600">随机场的 Sobolev 正则性刻度</text>
    <line x1="68" y1="325" x2="650" y2="325" stroke="#5e6c73" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="424" y1="302" x2="424" y2="348" stroke="#b05233" stroke-width="3"/>
    <rect x="68" y="309" width="356" height="16" fill="#dceee7"/>
    <text x="221" y="306" text-anchor="middle" font-size="13" fill="#29705f">s &lt; α−1/2：L²(Ω;Hˢ) 收敛</text>
    <text x="424" y="360" text-anchor="middle" font-size="12" fill="#a1462d">临界壳层 → 2 log 2</text>
    <text x="542" y="306" text-anchor="middle" font-size="13" fill="#8e3f2c">不收敛</text>

    <rect x="24" y="385" width="318" height="83" rx="8" fill="#f7eee8" stroke="#b15c2f"/>
    <text x="42" y="411" font-size="15" font-weight="600" fill="#984c27">一只测试探针</text>
    <text x="42" y="436" font-size="13">φ=cos x 只读取 k=1</text>
    <text x="42" y="457" font-size="12" fill="#59666d">标量稳定，也可能漏掉全部高频</text>

    <rect x="378" y="385" width="318" height="83" rx="8" fill="#eef4f6" stroke="#28758a"/>
    <text x="396" y="411" font-size="15" font-weight="600" fill="#1f6578">完整 Hˢ 账本</text>
    <text x="396" y="436" font-size="13">2 Σ(1+k²)ˢ k⁻²ᵅ</text>
    <text x="396" y="457" font-size="12" fill="#59666d">一次控制所有 Fourier 方向</text>

    <rect x="24" y="487" width="672" height="20" rx="5" fill="#fff0c9"/>
    <text x="360" y="501" text-anchor="middle" font-size="12" fill="#6d5614">ε→0 必须沿用同一组噪声；独立重采样不能给出均方差收敛</text>
  </g>
</svg>
