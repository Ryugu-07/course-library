<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1560" viewBox="0 0 1100 1560" role="img" aria-labelledby="title desc"><title id="title">有限点集与连续方向的不同保证</title><desc id="desc">固定12点的66个距离、同一矩阵全部31个前缀、二维协方差的181个曲线节点和16方向覆盖网。图形节点不是随机定理的证明。</desc><rect width="1100" height="1560" fill="#faf7ef"/><g font-family="system-ui, sans-serif" fill="#253346">
