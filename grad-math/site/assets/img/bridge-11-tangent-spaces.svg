<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">双数提升把多项式关系化成 Jacobian 核</title>
  <desc id="desc">上方从普通点p经过双数提升p加epsilon乘v，代入方程后只留下epsilon乘Jacobian乘v。下方比较抛物线原点的一维切空间和尖点原点的二维Zariski切空间，并提醒尖点曲线本身仍是一维。两幅曲线均按真实参数方程绘制实点切片，坐标轴缩放不同。</desc>
  <rect width="720" height="420" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="40" font-size="25" fill="#25394a">双数探针只让一阶项留下来</text>

    <rect x="28" y="72" width="150" height="72" rx="7" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="103" y="101" text-anchor="middle" font-size="18" fill="#5b6570">普通点</text>
    <text x="103" y="128" text-anchor="middle" font-size="22" fill="#25394a">p = (x,y)</text>

    <path d="M190 108H250M250 108L237 100M250 108L237 116" fill="none" stroke="#286fa7" stroke-width="3"/>
    <text x="220" y="92" text-anchor="middle" font-size="16" fill="#286fa7">提升</text>

    <rect x="262" y="72" width="196" height="72" rx="7" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="360" y="101" text-anchor="middle" font-size="18" fill="#286fa7">双数点</text>
    <text x="360" y="128" text-anchor="middle" font-size="21" fill="#286fa7">p + εv，ε² = 0</text>

    <path d="M470 108H530M530 108L517 100M530 108L517 116" fill="none" stroke="#237d68" stroke-width="3"/>
    <text x="500" y="92" text-anchor="middle" font-size="16" fill="#237d68">代入 F</text>

    <rect x="542" y="72" width="150" height="72" rx="7" fill="#eef4ee" stroke="#237d68"/>
    <text x="617" y="101" text-anchor="middle" font-size="18" fill="#237d68">一阶关系</text>
    <text x="617" y="128" text-anchor="middle" font-size="21" fill="#237d68">J(p)v = 0</text>

    <rect x="28" y="170" width="316" height="207" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="48" y="204" font-size="20" fill="#25394a">抛物线 y = x²，p = 0</text>
    <line x1="66" y1="322" x2="307" y2="322" stroke="#aab4bd" stroke-width="2"/>
    <line x1="186" y1="348" x2="186" y2="230" stroke="#aab4bd" stroke-width="2"/>
    <polyline points="94.000,238.000 96.300,242.148 98.600,246.190 100.900,250.127 103.200,253.960 105.500,257.688 107.800,261.310 110.100,264.827 112.400,268.240 114.700,271.548 117.000,274.750 119.300,277.848 121.600,280.840 123.900,283.727 126.200,286.510 128.500,289.188 130.800,291.760 133.100,294.228 135.400,296.590 137.700,298.847 140.000,301.000 142.300,303.048 144.600,304.990 146.900,306.827 149.200,308.560 151.500,310.188 153.800,311.710 156.100,313.127 158.400,314.440 160.700,315.647 163.000,316.750 165.300,317.748 167.600,318.640 169.900,319.428 172.200,320.110 174.500,320.688 176.800,321.160 179.100,321.527 181.400,321.790 183.700,321.947 186.000,322.000 188.300,321.947 190.600,321.790 192.900,321.527 195.200,321.160 197.500,320.688 199.800,320.110 202.100,319.428 204.400,318.640 206.700,317.748 209.000,316.750 211.300,315.647 213.600,314.440 215.900,313.127 218.200,311.710 220.500,310.188 222.800,308.560 225.100,306.827 227.400,304.990 229.700,303.048 232.000,301.000 234.300,298.848 236.600,296.590 238.900,294.228 241.200,291.760 243.500,289.188 245.800,286.510 248.100,283.727 250.400,280.840 252.700,277.847 255.000,274.750 257.300,271.548 259.600,268.240 261.900,264.827 264.200,261.310 266.500,257.688 268.800,253.960 271.100,250.127 273.400,246.190 275.700,242.147 278.000,238.000" fill="none" stroke="#286fa7" stroke-width="4"/>
    <line x1="78" y1="322" x2="294" y2="322" stroke="#a64b35" stroke-width="4"/>
    <text x="310" y="337" font-size="14" fill="#5b6570">x</text><text x="195" y="242" font-size="14" fill="#5b6570">y</text>
    <circle cx="186" cy="322" r="6" fill="#25394a"/>
    <text x="48" y="361" font-size="17" fill="#a64b35">∇F = (0,1)：b = 0，切维 1</text>

    <rect x="376" y="170" width="316" height="207" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="396" y="204" font-size="20" fill="#25394a">尖点 y² = x³，p = 0</text>
    <rect x="397" y="224" width="274" height="112" rx="6" fill="#f7e9e5" opacity="0.75"/>
    <line x1="414" y1="280" x2="654" y2="280" stroke="#aab4bd" stroke-width="2"/>
    <line x1="436" y1="326" x2="436" y2="236" stroke="#aab4bd" stroke-width="2"/>
    <path d="M436.000 280.000 L436.041 280.000 L436.164 279.998 L436.370 279.994 L436.658 279.986 L437.028 279.973 L437.480 279.954 L438.014 279.927 L438.631 279.891 L439.330 279.845 L440.111 279.787 L440.974 279.717 L441.920 279.632 L442.948 279.532 L444.058 279.416 L445.250 279.281 L446.524 279.128 L447.881 278.954 L449.320 278.758 L450.841 278.539 L452.444 278.296 L454.130 278.028 L455.898 277.732 L457.748 277.409 L459.680 277.056 L461.694 276.672 L463.791 276.257 L465.970 275.808 L468.231 275.325 L470.574 274.806 L473.000 274.250 L475.508 273.656 L478.098 273.022 L480.770 272.347 L483.524 271.630 L486.361 270.869 L489.280 270.064 L492.281 269.213 L495.364 268.314 L498.530 267.367 L501.778 266.370 L505.108 265.322 L508.520 264.222 L512.014 263.068 L515.591 261.859 L519.250 260.594 L522.991 259.271 L526.814 257.890 L530.720 256.448 L534.708 254.945 L538.778 253.380 L542.930 251.750 L547.164 250.056 L551.481 248.295 L555.880 246.466 L560.361 244.568 L564.924 242.600 L569.570 240.561 L574.298 238.448 L579.108 236.262 L584.000 234.000 M436.000 280.000 L436.041 280.000 L436.164 280.002 L436.370 280.006 L436.658 280.014 L437.028 280.027 L437.480 280.046 L438.014 280.073 L438.631 280.109 L439.330 280.155 L440.111 280.213 L440.974 280.283 L441.920 280.368 L442.948 280.468 L444.058 280.584 L445.250 280.719 L446.524 280.872 L447.881 281.046 L449.320 281.242 L450.841 281.461 L452.444 281.704 L454.130 281.972 L455.898 282.268 L457.748 282.591 L459.680 282.944 L461.694 283.328 L463.791 283.743 L465.970 284.192 L468.231 284.675 L470.574 285.194 L473.000 285.750 L475.508 286.344 L478.098 286.978 L480.770 287.653 L483.524 288.370 L486.361 289.131 L489.280 289.936 L492.281 290.787 L495.364 291.686 L498.530 292.633 L501.778 293.630 L505.108 294.678 L508.520 295.778 L512.014 296.932 L515.591 298.141 L519.250 299.406 L522.991 300.729 L526.814 302.110 L530.720 303.552 L534.708 305.055 L538.778 306.620 L542.930 308.250 L547.164 309.944 L551.481 311.705 L555.880 313.534 L560.361 315.432 L564.924 317.400 L569.570 319.439 L574.298 321.552 L579.108 323.738 L584.000 326.000" fill="none" stroke="#286fa7" stroke-width="4"/>
    <text x="657" y="298" font-size="14" fill="#5b6570">x</text><text x="445" y="245" font-size="14" fill="#5b6570">y</text>
    <circle cx="436" cy="280" r="6" fill="#25394a"/>
    <text x="396" y="361" font-size="17" fill="#a64b35">∇F = (0,0)：Tₚ = C²，但曲线维数 1</text>

    <text x="360" y="407" text-anchor="middle" font-size="17" fill="#5b6570">Jacobian 核只读取一阶约束；高阶厚度与奇点结构还需要更多信息。</text>
  </g>
</svg>
