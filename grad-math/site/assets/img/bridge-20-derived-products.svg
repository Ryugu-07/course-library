<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">导出纤维积中的Koszul微分与乘法</title>
  <desc id="desc">顶部显示普通张量只取零次商环，导出张量先用自由代数分解再保留完整交换微分分次代数。下方三栏比较横截直线、原点自交和直线包含原点。横截时微分消去负次数；原点自交时微分为零，两个负一次类相乘生成负二次类；包含情形留下一个平方为零的负一次类但没有负二次同调。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#58676f"/>
    </marker>
  </defs>
  <rect width="720" height="560" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#223640">
    <text x="28" y="36" font-size="22">Tor 类不是散装数字：微分决定谁留下，乘法决定怎样组合</text>

    <rect x="24" y="57" width="204" height="112" rx="7" fill="#eef3f4" stroke="#64757d"/>
    <text x="42" y="84" font-size="15" font-weight="700">普通纤维积</text>
    <text x="42" y="112" font-size="15">A tensor_R B</text>
    <text x="42" y="138" font-size="12" fill="#59666d">只保留 H<tspan baseline-shift="super" font-size="10">0</tspan>：普通交点环</text>

    <line x1="240" y1="113" x2="286" y2="113" stroke="#58676f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="263" y="99" text-anchor="middle" font-size="11">保留分解</text>

    <rect x="297" y="57" width="399" height="112" rx="7" fill="#e7f1f5" stroke="#28758a"/>
    <text x="315" y="84" font-size="15" font-weight="700" fill="#1f6578">正则序列商 B 的导出相交</text>
    <text x="315" y="111" font-size="15">A tensor^L_R B  ~  K_A(fi|A)</text>
    <text x="315" y="137" font-size="12">d(εi)=fi|A　·　分次交换　·　Leibniz</text>

    <text x="28" y="204" font-size="16" font-weight="700">同一机制，三种结果</text>

    <rect x="24" y="220" width="210" height="283" rx="7" fill="#edf3e8" stroke="#6f7d35"/>
    <text x="42" y="248" font-size="16" font-weight="700" fill="#5d6b2d">横截直线</text>
    <text x="42" y="274" font-size="13">V(x) 与 V(y)</text>
    <rect x="42" y="294" width="174" height="54" rx="5" fill="#ffffff" stroke="#aeb9a0"/>
    <text x="129" y="316" text-anchor="middle" font-size="13">A εy  →  A</text>
    <text x="129" y="338" text-anchor="middle" font-size="12">d(εy) = y（单射）</text>
    <text x="42" y="380" font-size="13">H<tspan baseline-shift="super" font-size="10">0</tspan> = k</text>
    <text x="42" y="405" font-size="13">H<tspan baseline-shift="super" font-size="10">−1</tspan> = 0</text>
    <line x1="42" y1="426" x2="216" y2="426" stroke="#bac4b1"/>
    <text x="42" y="451" font-size="12" fill="#59666d">微分消掉负次数</text>
    <text x="42" y="475" font-size="12" fill="#59666d">乘法只剩单位</text>

    <rect x="255" y="220" width="210" height="283" rx="7" fill="#f7ebe6" stroke="#b15c2f"/>
    <text x="273" y="248" font-size="16" font-weight="700" fill="#984c27">原点自交</text>
    <text x="273" y="274" font-size="13">P 在平面中与自身相交</text>
    <rect x="273" y="294" width="174" height="54" rx="5" fill="#ffffff" stroke="#d7b7a7"/>
    <text x="360" y="316" text-anchor="middle" font-size="13">Λ(εx, εy)</text>
    <text x="360" y="338" text-anchor="middle" font-size="12">d(εx)=d(εy)=0</text>
    <text x="273" y="380" font-size="13">H<tspan baseline-shift="super" font-size="10">0</tspan> = k　H<tspan baseline-shift="super" font-size="10">−1</tspan> = k<tspan baseline-shift="super" font-size="10">2</tspan></text>
    <text x="273" y="405" font-size="13">H<tspan baseline-shift="super" font-size="10">−2</tspan> = k·ω</text>
    <rect x="273" y="426" width="174" height="50" rx="5" fill="#fff5cf" stroke="#c59525"/>
    <text x="360" y="447" text-anchor="middle" font-size="13" font-weight="700">εx εy = ω ≠ 0</text>
    <text x="360" y="467" text-anchor="middle" font-size="12">εy εx = −ω</text>

    <rect x="486" y="220" width="210" height="283" rx="7" fill="#e9f2f6" stroke="#28758a"/>
    <text x="504" y="248" font-size="16" font-weight="700" fill="#1f6578">拉回后冗余</text>
    <text x="504" y="274" font-size="13">V(y) 与原点 P</text>
    <rect x="504" y="294" width="174" height="54" rx="5" fill="#ffffff" stroke="#aac4cf"/>
    <text x="591" y="316" text-anchor="middle" font-size="13">K_A(x, 0)</text>
    <text x="591" y="338" text-anchor="middle" font-size="12">d(εx)=x　d(εy)=0</text>
    <text x="504" y="380" font-size="13">H<tspan baseline-shift="super" font-size="10">0</tspan> = k</text>
    <text x="504" y="405" font-size="13">H<tspan baseline-shift="super" font-size="10">−1</tspan> = k·εy</text>
    <text x="504" y="430" font-size="13">H<tspan baseline-shift="super" font-size="10">−2</tspan> = 0</text>
    <line x1="504" y1="451" x2="678" y2="451" stroke="#b5cbd4"/>
    <text x="504" y="475" font-size="12" fill="#59666d">一个方程已在 X 上为零</text>

    <rect x="24" y="521" width="672" height="22" rx="5" fill="#fff0c9"/>
    <text x="360" y="536" text-anchor="middle" font-size="12" fill="#6d5614">先确认分解合法，再算微分、同调与乘法；不能用一串 Tor 维数代替 dg 代数</text>
  </g>
</svg>
