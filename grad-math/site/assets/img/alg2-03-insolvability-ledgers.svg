<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2300" viewBox="0 0 1000 2300" role="img" aria-labelledby="title desc"><title id="title">五次方程：从证据不足到可解性证明</title><desc id="desc">候选筛选、精确实根隔离、根式构造与A5反例的四份固定记录。</desc><rect width="1000" height="2300" fill="#faf7ef"/><g fill="#253346" font-family="system-ui,sans-serif"><text x="35" y="48" font-size="28">每一条证据，都要说明它排除了什么</text><svg x="50" y="85" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="证据逐行加入：还剩哪些传递五次群？"><title>证据逐行加入：还剩哪些传递五次群？</title><desc>蓝色表示仍相容；灰色表示已排除。没有观察到某型，不构成排除证据。</desc><rect width="900" height="460" fill="#ffffff"/><text x="25" y="30" fill="#283b46" font-size="19" font-family="system-ui,sans-serif">证据逐行加入：还剩哪些传递五次群？</text><text x="25" y="439" fill="#283b46" font-size="13" font-family="system-ui,sans-serif">蓝色表示仍相容；灰色表示已排除。没有观察到某型，不构成排除证据。</text><text x="365" y="67" fill="#283b46" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif">C5</text><text x="472" y="67" fill="#283b46" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif">D5</text><text x="579" y="67" fill="#283b46" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif">F20</text><text x="686" y="67" fill="#283b46" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif">A5</text><text x="793" y="67" fill="#283b46" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif">S5</text><text x="25" y="110.12" fill="#283b46" font-size="13" font-family="system-ui,sans-serif">开始：五种候选</text><rect x="320" y="87" width="90" height="31" fill="#deedf4" stroke="#256c91" stroke-width="1"></rect><text x="365" y="110.12" fill="#283b46" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">保留</text><rect x="427" y="87" width="90" height="31" fill="#deedf4" stroke="#256c91" stroke-width="1"></rect><text x="472" y="110.12" fill="#283b46" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">保留</text><rect x="534" y="87" width="90" height="31" fill="#deedf4" stroke="#256c91" stroke-width="1"></rect><text x="579" y="110.12" fill="#283b46" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">保留</text><rect x="641" y="87" width="90" height="31" fill="#deedf4" stroke="#256c91" stroke-width="1"></rect><text x="686" y="110.12" fill="#283b46" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">保留</text><rect x="748" y="87" width="90" height="31" fill="#deedf4" stroke="#256c91" stroke-width="1"></rect><text x="793" y="110.12" fill="#283b46" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">保留</text><text x="25" y="144.12" fill="#283b46" font-size="13" font-family="system-ui,sans-serif">p=2：1,4</text><rect x="320" y="121" width="90" height="31" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1"></rect><text x="365" y="144.12" fill="#283b46" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">排除</text><rect x="427" y="121" width="90" height="31" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1"></rect><text x="472" y="144.12" fill="#283b46" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">排除</text><rect x="534" y="121" width="90" height="31" fill="#deedf4" stroke="#256c91" stroke-width="1"></rect><text x="579" y="144.12" fill="#283b46" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">保留</text><rect x="641" y="121" width="90" height="31" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1"></rect><text x="686" y="144.12" fill="#283b46" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">排除</text><rect x="748" y="121" width="90" height="31" fill="#deedf4" stroke="#256c91" stroke-width="1"></rect><text x="793" y="144.12" fill="#283b46" font-size="12" text-anchor="middle" font-family="system-ui,sans-serif">保留</text></svg><text x="35" y="575" font-size="17">只启用p=2：四循环无法区分可解F₂₀与不可解S₅。</text><svg x="50" y="640" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="每条短轴只放大一个实根隔离区间"><title>每条短轴只放大一个实根隔离区间</title><desc>每行独立放大；左端空心不含，右端实心包含；宽度比较请读精确分数。</desc><rect width="900" height="460" fill="#ffffff"/><text x="25" y="30" fill="#283b46" font-size="19" font-family="system-ui,sans-serif">每条短轴只放大一个实根隔离区间</text><text x="25" y="439" fill="#283b46" font-size="13" font-family="system-ui,sans-serif">每行独立放大；左端空心不含，右端实心包含；宽度比较请读精确分数。</text><text x="25" y="66" fill="#283b46" font-size="16" font-family="system-ui,sans-serif">不同实根 3；V(−∞)=3，V(+∞)=0；宽度≤2的−8次方</text><text x="25" y="118" fill="#283b46" font-size="14" font-family="system-ui,sans-serif">根 1：(-3423/2048, -427/256]</text><line x1="505" y1="113" x2="800" y2="113" stroke="#256c91" stroke-width="3"></line><circle cx="505" cy="113" r="6" fill="#ffffff" stroke="#256c91" stroke-width="2"></circle><circle cx="800" cy="113" r="6" fill="#256c91" stroke="#256c91" stroke-width="2"></circle><text x="650" y="139" fill="#283b46" font-size="13" text-anchor="middle" font-family="system-ui,sans-serif">V：3 → 2；恰有1根</text><text x="25" y="179" fill="#283b46" font-size="14" font-family="system-ui,sans-serif">根 2：(1029/2048, 259/512]</text><line x1="505" y1="174" x2="800" y2="174" stroke="#256c91" stroke-width="3"></line><circle cx="505" cy="174" r="6" fill="#ffffff" stroke="#256c91" stroke-width="2"></circle><circle cx="800" cy="174" r="6" fill="#256c91" stroke="#256c91" stroke-width="2"></circle><text x="650" y="200" fill="#283b46" font-size="13" text-anchor="middle" font-family="system-ui,sans-serif">V：2 → 1；恰有1根</text><text x="25" y="240" fill="#283b46" font-size="14" font-family="system-ui,sans-serif">根 3：(1435/1024, 2877/2048]</text><line x1="505" y1="235" x2="800" y2="235" stroke="#256c91" stroke-width="3"></line><circle cx="505" cy="235" r="6" fill="#ffffff" stroke="#256c91" stroke-width="2"></circle><circle cx="800" cy="235" r="6" fill="#256c91" stroke="#256c91" stroke-width="2"></circle><text x="650" y="261" fill="#283b46" font-size="13" text-anchor="middle" font-family="system-ui,sans-serif">V：1 → 0；恰有1根</text></svg><text x="35" y="1130" font-size="17">精确隔离出三个实根：复共轭为对换，结合不可约性推出S₅。</text><svg x="50" y="1195" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="根式可解性：导出群最终能否降到1？"><title>根式可解性：导出群最终能否降到1？</title><desc>节点数字是导出群阶。稳定在非平凡群时不可解；高亮为当前剩余候选。</desc><rect width="900" height="460" fill="#ffffff"/><text x="25" y="30" fill="#283b46" font-size="19" font-family="system-ui,sans-serif">根式可解性：导出群最终能否降到1？</text><text x="25" y="439" fill="#283b46" font-size="13" font-family="system-ui,sans-serif">节点数字是导出群阶。稳定在非平凡群时不可解；高亮为当前剩余候选。</text><text x="25" y="65" fill="#283b46" font-size="14" font-family="system-ui,sans-serif">已计算根所在域：二项式根式域，次数 20</text><text x="100" y="120" fill="#283b46" font-size="17" text-anchor="end" font-family="system-ui,sans-serif">C5</text><rect x="186" y="97" width="58" height="36" rx="5" fill="#eaf2f5" stroke="#256c91" stroke-width="2"></rect><text x="215" y="120" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">5</text><line x1="244" y1="115" x2="331" y2="115" stroke="#283b46" stroke-width="2"></line><rect x="331" y="97" width="58" height="36" rx="5" fill="#eaf2f5" stroke="#256c91" stroke-width="2"></rect><text x="360" y="120" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">1</text><text x="685" y="120" fill="#26705b" font-size="16" font-family="system-ui,sans-serif">到1：可解</text><text x="100" y="181" fill="#283b46" font-size="17" text-anchor="end" font-family="system-ui,sans-serif">D5</text><rect x="186" y="158" width="58" height="36" rx="5" fill="#eaf2f5" stroke="#256c91" stroke-width="2"></rect><text x="215" y="181" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">10</text><line x1="244" y1="176" x2="331" y2="176" stroke="#283b46" stroke-width="2"></line><rect x="331" y="158" width="58" height="36" rx="5" fill="#eaf2f5" stroke="#256c91" stroke-width="2"></rect><text x="360" y="181" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">5</text><line x1="389" y1="176" x2="476" y2="176" stroke="#283b46" stroke-width="2"></line><rect x="476" y="158" width="58" height="36" rx="5" fill="#eaf2f5" stroke="#256c91" stroke-width="2"></rect><text x="505" y="181" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">1</text><text x="685" y="181" fill="#26705b" font-size="16" font-family="system-ui,sans-serif">到1：可解</text><text x="100" y="242" fill="#283b46" font-size="17" text-anchor="end" font-family="system-ui,sans-serif">F20</text><rect x="186" y="219" width="58" height="36" rx="5" fill="#fff0d4" stroke="#ad6015" stroke-width="2"></rect><text x="215" y="242" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">20</text><line x1="244" y1="237" x2="331" y2="237" stroke="#283b46" stroke-width="2"></line><rect x="331" y="219" width="58" height="36" rx="5" fill="#fff0d4" stroke="#ad6015" stroke-width="2"></rect><text x="360" y="242" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">5</text><line x1="389" y1="237" x2="476" y2="237" stroke="#283b46" stroke-width="2"></line><rect x="476" y="219" width="58" height="36" rx="5" fill="#fff0d4" stroke="#ad6015" stroke-width="2"></rect><text x="505" y="242" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">1</text><text x="685" y="242" fill="#26705b" font-size="16" font-family="system-ui,sans-serif">到1：可解</text><text x="100" y="303" fill="#283b46" font-size="17" text-anchor="end" font-family="system-ui,sans-serif">A5</text><rect x="186" y="280" width="58" height="36" rx="5" fill="#eaf2f5" stroke="#256c91" stroke-width="2"></rect><text x="215" y="303" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">60</text><text x="685" y="303" fill="#ad6015" font-size="16" font-family="system-ui,sans-serif">稳定：不可解</text><text x="100" y="364" fill="#283b46" font-size="17" text-anchor="end" font-family="system-ui,sans-serif">S5</text><rect x="186" y="341" width="58" height="36" rx="5" fill="#eaf2f5" stroke="#256c91" stroke-width="2"></rect><text x="215" y="364" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">120</text><line x1="244" y1="359" x2="331" y2="359" stroke="#283b46" stroke-width="2"></line><rect x="331" y="341" width="58" height="36" rx="5" fill="#eaf2f5" stroke="#256c91" stroke-width="2"></rect><text x="360" y="364" fill="#283b46" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif">60</text><text x="685" y="364" fill="#ad6015" font-size="16" font-family="system-ui,sans-serif">稳定：不可解</text></svg><text x="35" y="1685" font-size="17">x⁵−2的五根在二十次根式域中；实际自同构群为可解F₂₀。</text><svg x="50" y="1750" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="模素数因子次数 → 一个可能的根置换"><title>模素数因子次数 → 一个可能的根置换</title><desc>各圆点是抽象根编号；循环型确定，不给出复平面位置或全群。</desc><rect width="900" height="460" fill="#ffffff"/><text x="25" y="30" fill="#283b46" font-size="19" font-family="system-ui,sans-serif">模素数因子次数 → 一个可能的根置换</text><text x="25" y="439" fill="#283b46" font-size="13" font-family="system-ui,sans-serif">各圆点是抽象根编号；循环型确定，不给出复平面位置或全群。</text><text x="25" y="65" fill="#283b46" font-size="16" font-family="system-ui,sans-serif">p=7；x⁵ + 6x + 2；gcd(f,f′)=1</text><circle cx="160" cy="210" r="16" fill="#deedf4" stroke="#256c91" stroke-width="2"></circle><text x="160" y="215" fill="#283b46" font-size="14" text-anchor="middle" font-family="system-ui,sans-serif">1</text><text x="160" y="310" fill="#283b46" font-size="14" text-anchor="middle" font-family="system-ui,sans-serif">因子 1：次数 1</text><text x="160" y="338" fill="#283b46" font-size="13" text-anchor="middle" font-family="system-ui,sans-serif">x + 2</text><circle cx="300" cy="210" r="16" fill="#deedf4" stroke="#256c91" stroke-width="2"></circle><text x="300" y="215" fill="#283b46" font-size="14" text-anchor="middle" font-family="system-ui,sans-serif">2</text><text x="300" y="310" fill="#283b46" font-size="14" text-anchor="middle" font-family="system-ui,sans-serif">因子 2：次数 1</text><text x="300" y="338" fill="#283b46" font-size="13" text-anchor="middle" font-family="system-ui,sans-serif">x + 3</text><line x1="580" y1="161" x2="622.4352447854375" y2="234.5" stroke="#256c91" stroke-width="2"></line><line x1="622.4352447854375" y1="234.5" x2="537.5647552145625" y2="234.50000000000003" stroke="#256c91" stroke-width="2"></line><line x1="537.5647552145625" y1="234.50000000000003" x2="580" y2="161" stroke="#256c91" stroke-width="2"></line><circle cx="580" cy="161" r="16" fill="#deedf4" stroke="#256c91" stroke-width="2"></circle><text x="580" y="166" fill="#283b46" font-size="14" text-anchor="middle" font-family="system-ui,sans-serif">3</text><circle cx="622.4352447854375" cy="234.5" r="16" fill="#deedf4" stroke="#256c91" stroke-width="2"></circle><text x="622.4352447854375" y="239.5" fill="#283b46" font-size="14" text-anchor="middle" font-family="system-ui,sans-serif">4</text><circle cx="537.5647552145625" cy="234.50000000000003" r="16" fill="#deedf4" stroke="#256c91" stroke-width="2"></circle><text x="537.5647552145625" y="239.50000000000003" fill="#283b46" font-size="14" text-anchor="middle" font-family="system-ui,sans-serif">5</text><text x="580" y="310" fill="#283b46" font-size="14" text-anchor="middle" font-family="system-ui,sans-serif">因子 3：次数 3</text><text x="580" y="338" fill="#283b46" font-size="13" text-anchor="middle" font-family="system-ui,sans-serif">x³ + 2x² + 5x + 5</text></svg><text x="35" y="2240" font-size="17">x⁵+20x+16：判别式为平方且出现三循环，群为不可解A₅。</text><text x="35" y="2280" font-size="18">固定运行：2026-09-11，Node 24.14.0 / arm64；全部分数、因子与群运算可下载。</text></g></svg>