<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="分片边界抵消与环域诱导定向"><title>分片边界抵消与环域诱导定向</title><defs><style>text{font-family:system-ui,sans-serif;fill:#24313a} .title{font-size:25px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.line{fill:none;stroke:#315f9d;stroke-width:2.5}.red{fill:none;stroke:#b64335;stroke-width:3}.green{fill:none;stroke:#39734d;stroke-width:3}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker></defs><rect width="1100" height="650" fill="#fff"/><text x="40" y="45" class="title" text-anchor="start">Stokes 的机制：内部边界两两抵消</text><text x="60" y="92" class="label" text-anchor="start">把正向方形拆成两片</text><rect x="70" y="130" width="340" height="250" fill="#edf4f8" stroke="#aaa"/><path d="M70 380 L240 380 L240 130 L70 130 L70 380" class="red"/><path d="M240 380 L410 380 L410 130 L240 130 L240 380" class="line"/><path d="M70 380 L165 380" class="red" marker-end="url(#arrow)"/><path d="M410 380 L410 235" class="line" marker-end="url(#arrow)"/><path d="M410 130 L315 130" class="line" marker-end="url(#arrow)"/><path d="M70 130 L70 275" class="red" marker-end="url(#arrow)"/><path d="M233 310 L233 200" class="red" marker-end="url(#arrow)"/><path d="M247 200 L247 310" class="line" marker-end="url(#arrow)"/><text x="90" y="418" class="small" text-anchor="start">共同边：一片向上、另一片向下。</text><text x="90" y="448" class="small" text-anchor="start">两条积分相加为零，只剩外边界。</text><text x="535" y="92" class="label" text-anchor="start">环域也可以用 Stokes</text><circle cx="775" cy="255" r="125" fill="#edf4f8" stroke="#315f9d" stroke-width="2"/><circle cx="775" cy="255" r="62" fill="#fff" stroke="#b64335" stroke-width="2"/><path d="M900 255 A125 125 0 0 0 775 130" class="line" marker-end="url(#arrow)"/><path d="M775 193 A62 62 0 0 1 837 255" class="red" marker-end="url(#arrow)"/><text x="775" y="260" class="label" text-anchor="middle">孔</text><text x="535" y="418" class="small" text-anchor="start">外圈逆时针 +2π；内圈顺时针 −2π。</text><text x="535" y="448" class="small" text-anchor="start">角度形式 α 在环域光滑，dα=0。</text><text x="60" y="517" class="label" text-anchor="start">∫∂M α = 2π − 2π = 0 = ∫M dα</text><text x="60" y="557" class="small" text-anchor="start">遗漏内边界会得到假矛盾；把整个圆盘填满则会碰到原点奇点。</text><text x="60" y="600" class="small" text-anchor="start">反转区域定向，所有诱导边界同时反转，等式两边一起变号。</text></svg>
