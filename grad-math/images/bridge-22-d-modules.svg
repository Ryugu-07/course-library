<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Weyl代数中的函数模、点支撑模与两类奇点</title>
  <desc id="desc">顶部显示乘坐标与求导满足交换子等于一。中部比较模掉偏导的函数模和模掉x的点支撑模，并显示它们的特征簇分别是余切零截面和原点余切纤维。底部比较x偏导减α的正则奇点与解为e负一除x的不规则奇点，说明普通单值化不能检测方向指数增长。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#596870"/>
    </marker>
  </defs>
  <rect width="720" height="560" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#223640">
    <text x="28" y="36" font-size="22">D-模：方程、支撑与奇点是三本互相校验的账</text>

    <rect x="24" y="56" width="672" height="82" rx="7" fill="#eef3f4" stroke="#6b7c84"/>
    <text x="43" y="82" font-size="14" font-weight="700">Weyl 代数 A₁</text>
    <text x="43" y="111" font-size="17">∂(x f) − x ∂(f) = f</text>
    <line x1="282" y1="101" x2="343" y2="101" stroke="#596870" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="365" y="107" font-size="18" font-weight="700" fill="#1f6578">[∂, x] = 1</text>
    <text x="541" y="107" font-size="12" fill="#59666d">Leibniz 规则</text>

    <text x="28" y="170" font-size="16" font-weight="700">两个循环商模：都 holonomic，几何支撑却完全不同</text>

    <rect x="24" y="187" width="324" height="185" rx="7" fill="#edf3e8" stroke="#6f7d35"/>
    <text x="42" y="214" font-size="16" font-weight="700" fill="#5d6b2d">函数模　A₁ / A₁ ∂</text>
    <text x="42" y="241" font-size="13">e = [1]，∂ e = 0</text>
    <text x="42" y="266" font-size="13">作为 C[x]-模的基：e</text>
    <text x="42" y="291" font-size="13">∂(f e) = f' e</text>
    <rect x="42" y="311" width="288" height="43" rx="5" fill="#ffffff" stroke="#b7c5aa"/>
    <line x1="62" y1="333" x2="310" y2="333" stroke="#6f7d35" stroke-width="3"/>
    <text x="186" y="327" text-anchor="middle" font-size="11">ξ = 0：余切零截面</text>
    <text x="186" y="367" text-anchor="middle" font-size="11">底层 O模局部自由秩 1</text>

    <rect x="372" y="187" width="324" height="185" rx="7" fill="#f7ebe6" stroke="#b15c2f"/>
    <text x="390" y="214" font-size="16" font-weight="700" fill="#984c27">点支撑模　A₁ / A₁ x</text>
    <text x="390" y="241" font-size="13">δ = [1]，x δ = 0</text>
    <text x="390" y="266" font-size="13">δ, ∂ δ, ∂² δ, ...</text>
    <text x="390" y="291" font-size="13">x ∂^j δ = -j ∂^(j-1) δ</text>
    <rect x="390" y="311" width="288" height="43" rx="5" fill="#ffffff" stroke="#d7b7a7"/>
    <line x1="534" y1="316" x2="534" y2="349" stroke="#b15c2f" stroke-width="3"/>
    <text x="545" y="331" font-size="11">x = 0：整条余切纤维</text>
    <text x="534" y="367" text-anchor="middle" font-size="11">不是有限生成 O 模；仍是循环 D 模</text>

    <text x="28" y="405" font-size="16" font-weight="700">正则性不是特征簇维数，也不是“绕一圈是否返回”</text>

    <rect x="24" y="422" width="324" height="111" rx="7" fill="#e7f1f5" stroke="#28758a"/>
    <text x="42" y="449" font-size="15" font-weight="700" fill="#1f6578">正则奇点　(x ∂ − α) u = 0</text>
    <text x="42" y="476" font-size="13">u = x^α</text>
    <text x="42" y="500" font-size="13">单值化 = exp(2 π i α)</text>
    <text x="42" y="520" font-size="11" fill="#59666d">系数 α/x 至多一阶极点</text>

    <rect x="372" y="422" width="324" height="111" rx="7" fill="#fff0c9" stroke="#c59525"/>
    <text x="390" y="449" font-size="15" font-weight="700" fill="#6d5614">不规则奇点　(∂ − 1/x²) u = 0</text>
    <text x="390" y="476" font-size="13">u = exp(-1/x)，普通 单值化 = 1</text>
    <text x="390" y="500" font-size="13">θ = 0 衰减；θ = π 增长</text>
    <text x="390" y="520" font-size="11" fill="#59666d">方向指数增长；本例无非平凡 Stokes 矩阵</text>

    <rect x="24" y="543" width="672" height="7" rx="3" fill="#dce9ed"/>
  </g>
</svg>
