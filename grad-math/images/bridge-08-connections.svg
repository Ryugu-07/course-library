<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">二分之一参数联络的单值化</title>
  <desc id="desc">复平面去掉原点，一条正向回路使局部水平解从C变为负C；第二圈才回到C。右侧显示整数规范改变参数代表但不改变一次单值化。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#25394a"/></marker>
  </defs>
  <rect width="720" height="420" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="40" font-size="25" fill="#25394a">局部有解，不代表绕孔后仍对得上</text>
    <rect x="25" y="70" width="390" height="300" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <circle cx="215" cy="218" r="18" fill="#ffffff" stroke="#a64b35" stroke-width="4"/>
    <text x="215" y="224" font-size="18" text-anchor="middle" fill="#a64b35">0</text>
    <path d="M330 218A115 115 0 1 1 296 137" fill="none" stroke="#286fa7" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="330" cy="218" r="7" fill="#286fa7"/>
    <text x="58" y="103" font-size="20" fill="#25394a">α = 1/2</text>
    <text x="58" y="136" font-size="20" fill="#25394a">一次：C → −C</text>
    <text x="58" y="338" font-size="20" fill="#25394a">两次：C → C</text>
    <rect x="443" y="70" width="252" height="300" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="465" y="111" font-size="21" fill="#25394a">整数规范</text>
    <text x="465" y="154" font-size="22" fill="#286fa7">e′ = zᵐe</text>
    <text x="465" y="198" font-size="22" fill="#286fa7">α′ = α − m</text>
    <path d="M476 231L661 231" stroke="#237d68" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="568" y="259" font-size="18" text-anchor="middle" fill="#237d68">一次单值化不变</text>
    <text x="465" y="305" font-size="20" fill="#a64b35">M₁ = exp(2πiα)</text>
    <text x="465" y="341" font-size="20" fill="#a64b35">= exp(2πiα′)</text>
    <text x="28" y="399" font-size="18" fill="#5b6570">全局水平截面看一次生成回路，不看某个多圈路径是否偶然返回。</text>
  </g>
</svg>
