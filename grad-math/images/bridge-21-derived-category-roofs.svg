<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">从复形范畴到导出范畴的三层结构与roof计算</title>
  <desc id="desc">顶部依次展示复形范畴、同伦范畴和导出范畴，分别对应严格链映射、模掉链同伦和把拟同构变成可逆。中部展示整数模的自由分解到模M是拟同构但没有链同伦逆，而在导出范畴中其逆由一张roof表示。底部展示Ext一次类的roof和乘n映射产生的锥三角。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#596870"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#28758a"/>
    </marker>
  </defs>

  <rect width="720" height="560" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#223640">
    <text x="28" y="36" font-size="22">导出范畴：形式求逆，但保留一条可计算的路</text>

    <rect x="24" y="58" width="194" height="118" rx="7" fill="#eef3f4" stroke="#6b7c84"/>
    <text x="121" y="87" text-anchor="middle" font-size="18" font-weight="700">C(R)</text>
    <text x="121" y="114" text-anchor="middle" font-size="13">严格链映射</text>
    <text x="121" y="139" text-anchor="middle" font-size="12" fill="#59666d">保留全部链级数据</text>

    <line x1="221" y1="117" x2="257" y2="117" stroke="#596870" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="239" y="102" text-anchor="middle" font-size="10">模同伦</text>

    <rect x="263" y="58" width="194" height="118" rx="7" fill="#edf3e8" stroke="#6f7d35"/>
    <text x="360" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#5d6b2d">K(R)</text>
    <text x="360" y="114" text-anchor="middle" font-size="13">链映射 / 链同伦</text>
    <text x="360" y="139" text-anchor="middle" font-size="12" fill="#59666d">可缩往返变成相同</text>

    <line x1="460" y1="117" x2="496" y2="117" stroke="#596870" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="478" y="102" text-anchor="middle" font-size="10">逆拟同构</text>

    <rect x="502" y="58" width="194" height="118" rx="7" fill="#e7f1f5" stroke="#28758a" stroke-width="1.5"/>
    <text x="599" y="87" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6578">D(R)</text>
    <text x="599" y="114" text-anchor="middle" font-size="13">K(R)[Qis⁻¹]</text>
    <text x="599" y="139" text-anchor="middle" font-size="12" fill="#59666d">拟同构成为可逆</text>

    <text x="28" y="211" font-size="16" font-weight="700">同一支增广：在 K 中没有逆，在 D 中用 roof 表示逆</text>

    <rect x="24" y="228" width="300" height="128" rx="7" fill="#f7ebe6" stroke="#b15c2f"/>
    <text x="42" y="254" font-size="14" font-weight="700" fill="#984c27">K(Z)：拟同构不等于同伦等价</text>
    <rect x="45" y="278" width="108" height="48" rx="5" fill="#ffffff" stroke="#d7b7a7"/>
    <text x="99" y="298" text-anchor="middle" font-size="12">P: Z —ⁿ→ Z</text>
    <text x="99" y="316" text-anchor="middle" font-size="10">次数 −1, 0</text>
    <line x1="161" y1="302" x2="226" y2="302" stroke="#596870" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="194" y="289" text-anchor="middle" font-size="11">ε，拟同构</text>
    <rect x="234" y="278" width="69" height="48" rx="5" fill="#ffffff" stroke="#d7b7a7"/>
    <text x="269" y="307" text-anchor="middle" font-size="13">M=Z/n</text>
    <text x="174" y="345" text-anchor="middle" font-size="11" fill="#7b3d20">没有链同伦逆</text>

    <rect x="344" y="228" width="352" height="128" rx="7" fill="#e9f2f6" stroke="#28758a"/>
    <text x="362" y="254" font-size="14" font-weight="700" fill="#1f6578">D(Z)：左腿负责形式求逆</text>
    <rect x="366" y="278" width="76" height="48" rx="5" fill="#ffffff" stroke="#aac4cf"/>
    <text x="404" y="307" text-anchor="middle" font-size="13">M=Z/n</text>
    <rect x="493" y="278" width="76" height="48" rx="5" fill="#ffffff" stroke="#aac4cf"/>
    <text x="531" y="307" text-anchor="middle" font-size="13">P</text>
    <rect x="620" y="278" width="54" height="48" rx="5" fill="#ffffff" stroke="#aac4cf"/>
    <text x="647" y="307" text-anchor="middle" font-size="13">P</text>
    <line x1="490" y1="302" x2="447" y2="302" stroke="#28758a" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="469" y="288" text-anchor="middle" font-size="11">ε</text>
    <line x1="572" y1="302" x2="614" y2="302" stroke="#28758a" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="593" y="288" text-anchor="middle" font-size="11">id</text>
    <text x="520" y="345" text-anchor="middle" font-size="11" fill="#1f6578">roof 表示 ε⁻¹ : M → P</text>

    <text x="28" y="393" font-size="16" font-weight="700">两种落点：roof 算 Ext，cone 组织三角</text>

    <rect x="24" y="410" width="324" height="116" rx="7" fill="#fff0c9" stroke="#c59525"/>
    <text x="42" y="436" font-size="14" font-weight="700" fill="#6d5614">Ext¹(M,N) 的一个元素</text>
    <rect x="43" y="458" width="69" height="42" rx="5" fill="#ffffff" stroke="#d4bd79"/>
    <text x="78" y="484" text-anchor="middle" font-size="13">M</text>
    <rect x="155" y="458" width="69" height="42" rx="5" fill="#ffffff" stroke="#d4bd79"/>
    <text x="190" y="484" text-anchor="middle" font-size="13">P</text>
    <rect x="268" y="458" width="61" height="42" rx="5" fill="#ffffff" stroke="#d4bd79"/>
    <text x="299" y="484" text-anchor="middle" font-size="13">N[1]</text>
    <line x1="152" y1="479" x2="117" y2="479" stroke="#596870" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="135" y="466" text-anchor="middle" font-size="10">拟同构</text>
    <line x1="227" y1="479" x2="262" y2="479" stroke="#596870" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="245" y="466" text-anchor="middle" font-size="10">fₐ</text>
    <text x="186" y="516" text-anchor="middle" font-size="11">陪集 [a] ∈ N / nN</text>

    <rect x="368" y="410" width="328" height="116" rx="7" fill="#edf3e8" stroke="#6f7d35"/>
    <text x="386" y="436" font-size="14" font-weight="700" fill="#5d6b2d">乘 n 映射与锥三角</text>
    <text x="532" y="470" text-anchor="middle" font-size="14">P = Cone(n)</text>
    <text x="532" y="497" text-anchor="middle" font-size="14">Z —ⁿ→ Z → Z/n → Z[1]</text>
    <text x="532" y="518" text-anchor="middle" font-size="11" fill="#59666d">Cone(n) = [Z —ⁿ→ Z] 与 Z/n 拟同构</text>

    <rect x="24" y="538" width="672" height="10" rx="5" fill="#dce9ed"/>
  </g>
</svg>
