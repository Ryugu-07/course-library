<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">A cycle becomes a boundary when a face is added</title>
  <desc id="desc">Over F2, the same three-edge loop is a nontrivial homology class in a hollow triangle and the boundary of the two-simplex in a filled triangle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#555d68"/>
    </marker>
    <style>
      .title{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242a}
      .head{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242a}
      .label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242a}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4f5864}
      .mono{font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#20242a}
      .panel{fill:#f8fafc;stroke:#ccd4de;stroke-width:2}
      .vertex{fill:#fff;stroke:#3d4652;stroke-width:2.5}
      .edge{fill:none;stroke:#6a4c93;stroke-width:9;stroke-linecap:round}
      .face{fill:#d9c8eb;stroke:none;opacity:.86}
      .flow{fill:none;stroke:#555d68;stroke-width:2.2;marker-end:url(#arrow)}
      .ok{fill:#39734d}
      .accent{fill:#6a4c93}
      .muted{fill:#eef2f6;stroke:#ccd4de;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1100" height="650" fill="#fff"/>
  <text x="48" y="48" class="title">Homology over F2: closed is not the same as filled</text>

  <rect x="48" y="78" width="430" height="372" rx="8" class="panel"/>
  <text x="72" y="112" class="head">Boundary only</text>
  <text x="72" y="137" class="small">The selected 1-chain closes, but no face fills it.</text>
  <path d="M263 174L133 374L393 374Z" class="edge"/>
  <circle cx="263" cy="174" r="12" class="vertex"/>
  <circle cx="133" cy="374" r="12" class="vertex"/>
  <circle cx="393" cy="374" r="12" class="vertex"/>
  <text x="263" y="158" text-anchor="middle" class="label">A</text>
  <text x="112" y="382" text-anchor="end" class="label">B</text>
  <text x="414" y="382" class="label">C</text>
  <text x="263" y="413" text-anchor="middle" class="mono">d1(z) = 0</text>
  <text x="263" y="437" text-anchor="middle" class="mono accent">z not in im(d2), beta1 = 1</text>

  <path d="M494 264H594" class="flow"/>
  <text x="544" y="238" text-anchor="middle" class="label">add [ABC]</text>
  <text x="544" y="286" text-anchor="middle" class="small">one 2-simplex</text>

  <rect x="612" y="78" width="440" height="372" rx="8" class="panel"/>
  <text x="636" y="112" class="head">Filled triangle</text>
  <text x="636" y="137" class="small">The same 1-chain is now the boundary of a face.</text>
  <path d="M832 174L702 374L962 374Z" class="face"/>
  <path d="M832 174L702 374L962 374Z" class="edge"/>
  <circle cx="832" cy="174" r="12" class="vertex"/>
  <circle cx="702" cy="374" r="12" class="vertex"/>
  <circle cx="962" cy="374" r="12" class="vertex"/>
  <text x="832" y="158" text-anchor="middle" class="label">A</text>
  <text x="681" y="382" text-anchor="end" class="label">B</text>
  <text x="983" y="382" class="label">C</text>
  <text x="832" y="272" text-anchor="middle" class="mono">[ABC]</text>
  <text x="832" y="413" text-anchor="middle" class="mono">d1(z) = 0</text>
  <text x="832" y="437" text-anchor="middle" class="mono ok">z = d2[ABC], beta1 = 0</text>

  <rect x="48" y="474" width="1004" height="128" rx="8" class="muted"/>
  <text x="72" y="507" class="head">Boundary ledger</text>
  <text x="120" y="555" text-anchor="middle" class="mono">C2</text>
  <path d="M151 550H265" class="flow"/>
  <text x="208" y="540" text-anchor="middle" class="mono">d2</text>
  <text x="306" y="555" text-anchor="middle" class="mono">C1</text>
  <path d="M337 550H451" class="flow"/>
  <text x="394" y="540" text-anchor="middle" class="mono">d1</text>
  <text x="492" y="555" text-anchor="middle" class="mono">C0</text>
  <text x="606" y="535" class="mono">d1 &#x2218; d2 = 0</text>
  <text x="606" y="563" class="mono">H1 = ker(d1) / im(d2)</text>
  <text x="606" y="588" class="small">Betti numbers record dimensions over F2; torsion is not visible here.</text>
</svg>
