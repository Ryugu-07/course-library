<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">横截、相切与自交的普通相交环和 Tor 比较</title>
  <desc id="desc">上方三栏依次画出横轴与竖轴横截、横轴与抛物线相切、横轴与自身重合。中间显示统一的两项复形A乘y到A。下方列出横截的普通交点为C且Tor一为零，相切阶m的普通交点为C[x]模x的m次方且Tor一仍为零，自交的零次和负一次同调都为C[x]。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5f6f78"/>
    </marker>
  </defs>
  <rect width="720" height="520" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#243746">
    <text x="28" y="36" font-size="23">相交的两本账：普通厚度与 Tor 核</text>

    <rect x="24" y="54" width="208" height="176" rx="8" fill="#e9f3f6" stroke="#28758a"/>
    <text x="40" y="80" font-size="17" font-weight="600" fill="#1f6578">横截</text>
    <line x1="48" y1="151" x2="208" y2="151" stroke="#297c69" stroke-width="3"/>
    <line x1="128" y1="96" x2="128" y2="206" stroke="#b54d3a" stroke-width="3"/>
    <circle cx="128" cy="151" r="5" fill="#243746"/>
    <text x="194" y="143" font-size="12" fill="#297c69">Y</text>
    <text x="136" y="106" font-size="12" fill="#a53f30">X</text>
    <text x="40" y="217" font-size="13">不同切向；交点长度 1</text>

    <rect x="256" y="54" width="208" height="176" rx="8" fill="#f8eee6" stroke="#b65f2e"/>
    <text x="272" y="80" font-size="17" font-weight="600" fill="#995021">相切阶 m（图示 2）</text>
    <line x1="280" y1="166" x2="440" y2="166" stroke="#297c69" stroke-width="3"/>
    <path d="M280 96 Q360 236 440 96" fill="none" stroke="#b54d3a" stroke-width="3"/>
    <circle cx="360" cy="166" r="5" fill="#243746"/>
    <text x="426" y="158" font-size="12" fill="#297c69">Y</text>
    <text x="405" y="109" font-size="12" fill="#a53f30">y=x²</text>
    <text x="272" y="217" font-size="13">共用切线；交点长度 m</text>

    <rect x="488" y="54" width="208" height="176" rx="8" fill="#eef1e8" stroke="#6f7d35"/>
    <text x="504" y="80" font-size="17" font-weight="600" fill="#5d6b2d">自交</text>
    <line x1="512" y1="151" x2="672" y2="151" stroke="#297c69" stroke-width="6" opacity="0.75"/>
    <line x1="512" y1="151" x2="672" y2="151" stroke="#b54d3a" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="516" y="137" font-size="12" fill="#297c69">Y</text>
    <text x="652" y="137" font-size="12" fill="#a53f30">X=Y</text>
    <text x="504" y="184" font-size="13">两方程重合</text>
    <text x="504" y="217" font-size="13">共享一整条直线</text>

    <rect x="24" y="248" width="672" height="93" rx="8" fill="#fff" stroke="#c8d0d5"/>
    <text x="44" y="274" font-size="16" font-weight="600">三例共用同一份自由分解账本</text>
    <rect x="177" y="291" width="112" height="34" rx="6" fill="#f4f6f6" stroke="#5f6f78"/>
    <text x="233" y="313" text-anchor="middle" font-size="15">A（−1 次）</text>
    <line x1="298" y1="308" x2="408" y2="308" stroke="#5f6f78" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="353" y="298" text-anchor="middle" font-size="13">乘 y</text>
    <rect x="418" y="291" width="104" height="34" rx="6" fill="#f4f6f6" stroke="#5f6f78"/>
    <text x="470" y="313" text-anchor="middle" font-size="15">A（0 次）</text>
    <text x="545" y="299" font-size="12" fill="#a53f30">核 = H⁻¹</text>
    <text x="545" y="320" font-size="12" fill="#1f6578">余核 = H⁰</text>

    <rect x="24" y="359" width="208" height="111" rx="8" fill="#fff" stroke="#28758a"/>
    <text x="40" y="385" font-size="15" font-weight="600" fill="#1f6578">横截：y 仍是非零因子</text>
    <text x="40" y="413" font-size="14">H⁰ = C</text>
    <text x="40" y="438" font-size="14">H⁻¹ = Tor₁ = 0</text>
    <text x="40" y="459" font-size="12" fill="#59666d">普通长度 1</text>

    <rect x="256" y="359" width="208" height="111" rx="8" fill="#fff" stroke="#b65f2e"/>
    <text x="272" y="385" font-size="15" font-weight="600" fill="#995021">相切：y 变成 xᵐ</text>
    <text x="272" y="413" font-size="14">H⁰ = C[x] / (xᵐ)</text>
    <text x="272" y="438" font-size="14">H⁻¹ = Tor₁ = 0</text>
    <text x="272" y="459" font-size="12" fill="#59666d">普通长度 m，不靠 Tor 增厚</text>

    <rect x="488" y="359" width="208" height="111" rx="8" fill="#fff" stroke="#6f7d35"/>
    <text x="504" y="385" font-size="15" font-weight="600" fill="#5d6b2d">自交：y 变成零</text>
    <text x="504" y="413" font-size="14">H⁰ = C[x]</text>
    <text x="504" y="438" font-size="14">H⁻¹ = C[x]</text>
    <text x="504" y="459" font-size="12" fill="#59666d">在 H⁰ 上秩 1；C-维无限</text>

    <rect x="24" y="487" width="672" height="20" rx="5" fill="#fff0c9"/>
    <text x="360" y="501" text-anchor="middle" font-size="12" fill="#6d5614">相切可只增大 H⁰ 的长度；Tor 非零不是“多出几个普通点”</text>
  </g>
</svg>
