<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">射影直线上的下降、拉回与族自同构</title>
  <desc id="desc">上部显示射影直线的两张仿射图通过过渡函数粘出线丛。中部显示沿m次映射拉回后过渡次数由d变成md。下部比较O(1)配零截面与配X0平方截面，前者全局自同构为复乘法群，后者为mu二；但X0平方在无穷远纤维值为零，所以该纤维稳定子跳为复乘法群。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#56656c"/>
    </marker>
  </defs>

  <rect width="720" height="560" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#223640">
    <text x="28" y="37" font-size="22">把非平凡族与自同构放在同一张图里</text>

    <rect x="24" y="56" width="672" height="150" rx="7" fill="#eef3f4" stroke="#75858c"/>
    <text x="42" y="82" font-size="15" font-weight="700">1. 用重叠数据粘出 O(d)</text>

    <rect x="45" y="101" width="154" height="76" rx="5" fill="#ffffff" stroke="#28758a"/>
    <text x="122" y="126" text-anchor="middle" font-size="14">U₀ ≅ A¹</text>
    <text x="122" y="151" text-anchor="middle" font-size="12">局部基 e₀</text>

    <rect x="258" y="101" width="204" height="76" rx="5" fill="#fff0c9" stroke="#bd8d22"/>
    <text x="360" y="126" text-anchor="middle" font-size="14">U₀ ∩ U₁ ≅ Gm</text>
    <text x="360" y="151" text-anchor="middle" font-size="13">e₁ = zᵈ e₀</text>

    <rect x="521" y="101" width="154" height="76" rx="5" fill="#ffffff" stroke="#28758a"/>
    <text x="598" y="126" text-anchor="middle" font-size="14">U₁ ≅ A¹</text>
    <text x="598" y="151" text-anchor="middle" font-size="12">局部基 e₁</text>

    <line x1="200" y1="139" x2="249" y2="139" stroke="#56656c" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="139" x2="471" y2="139" stroke="#56656c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="194" text-anchor="middle" font-size="12" fill="#53636a">过渡函数在重叠 Gm 上可逆；d ≠ 0 时全局线丛仍不平凡</text>

    <rect x="24" y="224" width="672" height="105" rx="7" fill="#e8f2ec" stroke="#4d8064"/>
    <text x="42" y="250" font-size="15" font-weight="700">2. 基变换必须拉回过渡函数与截面</text>
    <rect x="60" y="268" width="202" height="42" rx="5" fill="#ffffff" stroke="#77a086"/>
    <text x="161" y="294" text-anchor="middle" font-size="14">zᵈ ，O(d)</text>
    <line x1="278" y1="289" x2="434" y2="289" stroke="#56656c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="356" y="279" text-anchor="middle" font-size="12">沿 Fₘ 拉回：z ↦ zᵐ</text>
    <rect x="450" y="268" width="208" height="42" rx="5" fill="#ffffff" stroke="#77a086"/>
    <text x="554" y="294" text-anchor="middle" font-size="14">(zᵐ)ᵈ = zᵐᵈ ，O(md)</text>

    <text x="28" y="363" font-size="16" font-weight="700">3. 整族自同构与单个纤维稳定子不是同一个问题</text>

    <rect x="24" y="380" width="324" height="148" rx="7" fill="#f1eee8" stroke="#897a68"/>
    <text x="42" y="407" font-size="15" font-weight="700">对象 A：(O(1), 0)</text>
    <text x="42" y="437" font-size="13">全局条件：a² · 0 = 0</text>
    <text x="42" y="463" font-size="13">整族 Aut = C×</text>
    <line x1="42" y1="478" x2="328" y2="478" stroke="#c8beb1"/>
    <circle cx="65" cy="501" r="8" fill="#b15c2f"/>
    <text x="83" y="506" font-size="12">每个纤维值都为 0，稳定子都是 Gm</text>

    <rect x="372" y="380" width="324" height="148" rx="7" fill="#edf3e8" stroke="#6f7d35"/>
    <text x="390" y="407" font-size="15" font-weight="700">对象 B：(O(1), X₀²)</text>
    <text x="390" y="437" font-size="13">全局条件：a²X₀² = X₀²</text>
    <text x="390" y="463" font-size="13">整族 Aut = μ₂ = {1, −1}</text>
    <line x1="390" y1="478" x2="676" y2="478" stroke="#bac4a0"/>
    <circle cx="413" cy="501" r="8" fill="#b15c2f"/>
    <text x="431" y="497" font-size="12">∞ = [0:1] 处 X₀² = 0</text>
    <text x="431" y="515" font-size="12">该纤维稳定子跳为 Gm</text>

    <rect x="24" y="541" width="672" height="9" rx="4" fill="#dce9ed"/>
  </g>
</svg>
