<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 605" role="img" aria-labelledby="title desc"><title id="title">三阶循环移位的Fourier对角化</title><desc id="desc">按j加1取值的循环移位；Fourier变换后分别乘1、omega、omega平方。此图仅为有限群类比。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243746"/></marker></defs><rect width="440" height="605" rx="12" fill="#faf9f5"/><g font-family="system-ui,sans-serif"><text x="22" y="34" font-size="22" fill="#243746" text-anchor="start">有限类比：循环移位的谱分解</text><circle cx="85" cy="95" r="25" fill="#deebf5" stroke="#27689b" stroke-width="2"/><text x="85" y="103" font-size="23" fill="#27689b" text-anchor="middle">0</text><circle cx="355" cy="95" r="25" fill="#deebf5" stroke="#27689b" stroke-width="2"/><text x="355" y="103" font-size="23" fill="#27689b" text-anchor="middle">1</text><circle cx="220" cy="213" r="25" fill="#deebf5" stroke="#27689b" stroke-width="2"/><text x="220" y="221" font-size="23" fill="#27689b" text-anchor="middle">2</text><path d="M115 95H323" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M339 120L246 190" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M194 191L103 122" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="220" y="269" font-size="21" fill="#243746" text-anchor="middle">取值规则：Tf(j) = f(j+1)</text><path d="M220 288V321" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="40" y="332" width="360" height="69" rx="9" fill="#eee5d5"/><text x="220" y="360" font-size="22" fill="#a46615" text-anchor="middle">Fourier：位置 → 特征标</text><text x="220" y="390" font-size="22" fill="#a46615" text-anchor="middle">φₖ(j) = ωᵏʲ / √3</text><path d="M220 410V438" fill="none" stroke="#243746" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="85" y="468" font-size="21" fill="#27689b" text-anchor="middle">k = 0</text><text x="85" y="503" font-size="23" fill="#27689b" text-anchor="middle">乘 1</text><text x="220" y="468" font-size="21" fill="#27689b" text-anchor="middle">k = 1</text><text x="220" y="503" font-size="23" fill="#27689b" text-anchor="middle">乘 ω</text><text x="355" y="468" font-size="21" fill="#27689b" text-anchor="middle">k = 2</text><text x="355" y="503" font-size="23" fill="#27689b" text-anchor="middle">乘 ω²</text><text x="220" y="544" font-size="22" fill="#243746" text-anchor="middle">FTF* = diag(1, ω, ω²)</text><text x="22" y="580" font-size="21" fill="#243746" text-anchor="start">不是几何 Langlands 本身</text></g></svg>
