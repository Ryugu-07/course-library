<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">常值预层的粘合失败</title><desc id="desc">不相交区间分别取零和一，局部常值层可粘合，常值预层不能。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="23" fill="#25394a" text-anchor="start">局部常值可以粘合，全局单值常数不行</text><path d="M55 140L235 140" fill="none" stroke="#286fa7" stroke-width="3" stroke-dasharray=""/><path d="M365 140L545 140" fill="none" stroke="#237d68" stroke-width="3" stroke-dasharray=""/><circle cx="55" cy="140" r="6" fill="#faf9f5" stroke="#25394a" stroke-width="2"/><circle cx="235" cy="140" r="6" fill="#faf9f5" stroke="#25394a" stroke-width="2"/><circle cx="365" cy="140" r="6" fill="#faf9f5" stroke="#25394a" stroke-width="2"/><circle cx="545" cy="140" r="6" fill="#faf9f5" stroke="#25394a" stroke-width="2"/><text x="145" y="115" font-size="24" fill="#286fa7" text-anchor="middle">U：取值 0</text><text x="455" y="115" font-size="24" fill="#237d68" text-anchor="middle">V：取值 1</text><text x="300" y="189" font-size="22" fill="#25394a" text-anchor="middle">U ∩ V = ∅，重叠条件自动满足</text><rect x="35" y="217" width="530" height="106" rx="12" fill="white" stroke="#286fa7" stroke-width="2"/><text x="55" y="251" font-size="22" fill="#a64b35" text-anchor="start">单一常数：无法兼顾 0 和 1</text><text x="55" y="293" font-size="22" fill="#237d68" text-anchor="start">局部常值：在两个分支上分别取值</text><text x="25" y="358" font-size="21" fill="#25394a" text-anchor="start">图示开集由两个不相交区间组成。</text></g></svg>
