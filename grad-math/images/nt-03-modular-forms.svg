<svg xmlns="http://www.w3.org/2000/svg" width="440" height="550" viewBox="0 0 440 550" role="img" aria-labelledby="title desc"><title id="title">换基怎样约束函数</title><desc id="desc">格子的1和τ两基，替换τ为τ加1仍生成相同格子。一般整数换基给模形式的权重变换。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="context-stroke"/></marker></defs><rect width="440" height="550" fill="#faf9f5"/><g font-family="system-ui, sans-serif"><text x="220" y="34" font-size="24" fill="#253349" text-anchor="middle">换基怎样约束函数</text><text x="220" y="70" font-size="21" fill="#253349" text-anchor="middle">同一格子，可以换整数基</text><circle cx="65" cy="130" r="3" fill="#c0cad5"/><circle cx="65" cy="300" r="3" fill="#c0cad5"/><circle cx="105" cy="215" r="3" fill="#c0cad5"/><circle cx="145" cy="130" r="3" fill="#c0cad5"/><circle cx="145" cy="300" r="3" fill="#c0cad5"/><circle cx="185" cy="215" r="3" fill="#c0cad5"/><circle cx="225" cy="130" r="3" fill="#c0cad5"/><circle cx="225" cy="300" r="3" fill="#c0cad5"/><circle cx="265" cy="215" r="3" fill="#c0cad5"/><circle cx="305" cy="130" r="3" fill="#c0cad5"/><circle cx="305" cy="300" r="3" fill="#c0cad5"/><circle cx="345" cy="215" r="3" fill="#c0cad5"/><circle cx="385" cy="130" r="3" fill="#c0cad5"/><path d="M65,300L145,300" fill="none" stroke="#3978bd" stroke-width="3" marker-end="url(#arrow)"/><path d="M65,300L105,215" fill="none" stroke="#3978bd" stroke-width="3" marker-end="url(#arrow)"/><path d="M65,300L185,215" fill="none" stroke="#b75438" stroke-width="3" marker-end="url(#arrow)"/><text x="135" y="328" font-size="22" fill="#3978bd" text-anchor="start">1</text><text x="76" y="204" font-size="22" fill="#3978bd" text-anchor="start">τ</text><text x="190" y="211" font-size="22" fill="#b75438" text-anchor="start">τ + 1</text><rect x="25" y="348" width="390" height="62" rx="10" fill="#edf2f8"/><text x="220" y="374" font-size="21" fill="#253349" text-anchor="middle">τ ↦ (aτ + b)/(cτ + d)</text><text x="220" y="399" font-size="20" fill="#657185" text-anchor="middle">ad − bc = 1</text><path d="M220,416L220,449" fill="none" stroke="#3978bd" stroke-width="3" marker-end="url(#arrow)"/><text x="220" y="482" font-size="22" fill="#253349" text-anchor="middle">f(γτ) = (cτ + d)ᵏ f(τ)</text><text x="220" y="521" font-size="20" fill="#253349" text-anchor="middle">周期性 → q = exp(2πiτ)</text></g></svg>