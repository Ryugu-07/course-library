<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">模问题、商叠与权作用稳定子的机制图</title>
  <desc id="desc">顶部显示模问题把测试概形送到对象和同构组成的群胚，并沿基变换拉回。中部显示商叠的一个T点由G torsor和到X的等变映射组成。底部比较乘法群在仿射直线上的权一和权二作用，两者轨道与不变量环相同，但非零点稳定子分别平凡和mu二。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#596870"/>
    </marker>
  </defs>
  <rect width="720" height="560" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#223640">
    <text x="28" y="36" font-size="22">模叠：不仅记录对象在哪，还记录它怎样对称</text>

    <rect x="24" y="56" width="672" height="92" rx="7" fill="#eef3f4" stroke="#6b7c84"/>
    <text x="43" y="82" font-size="14" font-weight="700">函子点与基变换</text>
    <rect x="45" y="96" width="95" height="35" rx="5" fill="#ffffff" stroke="#aab8bf"/>
    <text x="93" y="119" text-anchor="middle" font-size="13">T′ → T（f）</text>
    <line x1="153" y1="113" x2="210" y2="113" stroke="#596870" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="222" y="92" width="181" height="43" rx="5" fill="#edf3e8" stroke="#6f7d35"/>
    <text x="313" y="110" text-anchor="middle" font-size="12">M(T)：T上的族</text>
    <text x="313" y="127" text-anchor="middle" font-size="11">对象 + 同构</text>
    <line x1="416" y1="113" x2="468" y2="113" stroke="#596870" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="480" y="92" width="194" height="43" rx="5" fill="#e7f1f5" stroke="#28758a"/>
    <text x="577" y="110" text-anchor="middle" font-size="12">f*E ∈ M(T′)</text>
    <text x="577" y="127" text-anchor="middle" font-size="11">族、箭头与相容性一起拉回</text>

    <text x="28" y="181" font-size="16" font-weight="700">商叠的 T 点不是一条轨道，而是一份可下降的数据</text>
    <rect x="24" y="198" width="672" height="128" rx="7" fill="#e9f2f6" stroke="#28758a"/>
    <rect x="48" y="232" width="146" height="58" rx="5" fill="#ffffff" stroke="#aac4cf"/>
    <text x="121" y="255" text-anchor="middle" font-size="13">P → T</text>
    <text x="121" y="277" text-anchor="middle" font-size="11">右 G-torsor</text>
    <text x="219" y="266" text-anchor="middle" font-size="20">+</text>
    <rect x="245" y="232" width="168" height="58" rx="5" fill="#ffffff" stroke="#aac4cf"/>
    <text x="329" y="255" text-anchor="middle" font-size="13">u: P → X</text>
    <text x="329" y="277" text-anchor="middle" font-size="11">u(p g) = g⁻¹ u(p)</text>
    <line x1="428" y1="261" x2="473" y2="261" stroke="#596870" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="486" y="224" width="186" height="74" rx="5" fill="#fff0c9" stroke="#c59525"/>
    <text x="579" y="248" text-anchor="middle" font-size="13">Gm，权 w</text>
    <text x="579" y="270" text-anchor="middle" font-size="12">线丛 L</text>
    <text x="579" y="288" text-anchor="middle" font-size="12">L^w 的截面 s</text>
    <text x="360" y="316" text-anchor="middle" font-size="11" fill="#59666d">沿 T′ → T 拉回为 (P ×_T T′, u′)，或 (f*L, f*s)</text>

    <text x="28" y="359" font-size="16" font-weight="700">同样的轨道与不变量，不同的群胚</text>

    <rect x="24" y="376" width="324" height="150" rx="7" fill="#edf3e8" stroke="#6f7d35"/>
    <text x="42" y="403" font-size="15" font-weight="700" fill="#5d6b2d">权 1：λ·x = λx</text>
    <circle cx="76" cy="443" r="9" fill="#b15c2f"/>
    <text x="95" y="448" font-size="12">x = 0：稳定子 Gm</text>
    <line x1="58" y1="474" x2="310" y2="474" stroke="#6f7d35" stroke-width="3"/>
    <circle cx="182" cy="474" r="6" fill="#ffffff" stroke="#6f7d35" stroke-width="2"/>
    <text x="182" y="496" text-anchor="middle" font-size="11">x ≠ 0：稳定子 {1}</text>
    <text x="186" y="517" text-anchor="middle" font-size="11">轨道：{0}、C×；不变量环：C</text>

    <rect x="372" y="376" width="324" height="150" rx="7" fill="#f7ebe6" stroke="#b15c2f"/>
    <text x="390" y="403" font-size="15" font-weight="700" fill="#984c27">权 2：λ·x = λ²x</text>
    <circle cx="424" cy="443" r="9" fill="#b15c2f"/>
    <text x="443" y="448" font-size="12">x = 0：稳定子 Gm</text>
    <line x1="406" y1="474" x2="658" y2="474" stroke="#b15c2f" stroke-width="3"/>
    <circle cx="530" cy="474" r="6" fill="#ffffff" stroke="#b15c2f" stroke-width="2"/>
    <text x="530" y="496" text-anchor="middle" font-size="11">x ≠ 0：稳定子 μ₂={1,−1}</text>
    <text x="534" y="517" text-anchor="middle" font-size="11">轨道：{0}、C×；不变量环：C</text>

    <rect x="24" y="539" width="672" height="11" rx="4" fill="#dce9ed"/>
  </g>
</svg>
