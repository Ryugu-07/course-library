<svg xmlns="http://www.w3.org/2000/svg" width="440" height="530" viewBox="0 0 440 530" role="img" aria-labelledby="title desc"><title id="title">先数每列，再加无穷远点</title><desc id="desc">模5非奇异曲线共有8个仿射点。x为1时没有根，其他列各2个根，加O后共9个。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="context-stroke"/></marker></defs><rect width="440" height="530" fill="#faf9f5"/><g font-family="system-ui, sans-serif"><text x="220" y="34" font-size="24" fill="#253349" text-anchor="middle">先数每列，再加无穷远点</text><text x="220" y="70" font-size="20" fill="#253349" text-anchor="middle">E / F₅：y² = x³ + x + 1</text><path d="M64,332L390,332" fill="none" stroke="#dce1e7" stroke-width="1"/><text x="50" y="339" font-size="20" fill="#657185" text-anchor="end">0</text><path d="M64,280L390,280" fill="none" stroke="#dce1e7" stroke-width="1"/><text x="50" y="287" font-size="20" fill="#657185" text-anchor="end">1</text><path d="M64,228L390,228" fill="none" stroke="#dce1e7" stroke-width="1"/><text x="50" y="235" font-size="20" fill="#657185" text-anchor="end">2</text><path d="M64,176L390,176" fill="none" stroke="#dce1e7" stroke-width="1"/><text x="50" y="183" font-size="20" fill="#657185" text-anchor="end">3</text><path d="M64,124L390,124" fill="none" stroke="#dce1e7" stroke-width="1"/><text x="50" y="131" font-size="20" fill="#657185" text-anchor="end">4</text><text x="70" y="367" font-size="20" fill="#253349" text-anchor="middle">0</text><circle cx="70" cy="280" r="6" fill="#3978bd"/><circle cx="70" cy="124" r="6" fill="#3978bd"/><text x="70" y="410" font-size="20" fill="#b75438" text-anchor="middle">2</text><text x="147" y="367" font-size="20" fill="#253349" text-anchor="middle">1</text><text x="147" y="410" font-size="20" fill="#b75438" text-anchor="middle">0</text><text x="224" y="367" font-size="20" fill="#253349" text-anchor="middle">2</text><circle cx="224" cy="280" r="6" fill="#3978bd"/><circle cx="224" cy="124" r="6" fill="#3978bd"/><text x="224" y="410" font-size="20" fill="#b75438" text-anchor="middle">2</text><text x="301" y="367" font-size="20" fill="#253349" text-anchor="middle">3</text><circle cx="301" cy="280" r="6" fill="#3978bd"/><circle cx="301" cy="124" r="6" fill="#3978bd"/><text x="301" y="410" font-size="20" fill="#b75438" text-anchor="middle">2</text><text x="378" y="367" font-size="20" fill="#253349" text-anchor="middle">4</text><circle cx="378" cy="228" r="6" fill="#3978bd"/><circle cx="378" cy="176" r="6" fill="#3978bd"/><text x="378" y="410" font-size="20" fill="#b75438" text-anchor="middle">2</text><text x="406" y="368" font-size="20" fill="#253349" text-anchor="start">x</text><text x="26" y="99" font-size="20" fill="#253349" text-anchor="start">y</text><text x="220" y="444" font-size="20" fill="#253349" text-anchor="middle">每列根数：2 + 0 + 2 + 2 + 2</text><rect x="35" y="460" width="370" height="44" rx="10" fill="#edf2f8"/><text x="220" y="489" font-size="21" fill="#253349" text-anchor="middle">8 个仿射点 + O = 9 个点</text></g></svg>