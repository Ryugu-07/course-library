<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">射影直线、双原点直线与局部态射的粘合</title>
  <desc id="desc">上方显示射影直线的两个仿射图沿非零部分以倒数关系粘合，点映射向右而坐标环拉回向左。左下显示恒等粘合保留两个原点，并用环映射不满射标记非分离性。右下显示d次幂态射在两个射影图上的局部公式组成交换方块。</desc>
  <rect width="720" height="500" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="38" font-size="25" fill="#25394a">过渡映射决定两张仿射图怎样成为一个空间</text>

    <rect x="28" y="58" width="664" height="178" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="48" y="86" font-size="18" font-weight="600" fill="#25394a">射影直线：沿非零部分做倒数粘合</text>

    <rect x="48" y="102" width="234" height="76" rx="6" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="165" y="124" text-anchor="middle" font-size="16" fill="#245f8d">U₀ = Spec C[z]</text>
    <circle cx="77" cy="151" r="7" fill="#a64b35"/>
    <text x="77" y="170" text-anchor="middle" font-size="11" fill="#8d3f2e">z=0</text>
    <rect x="112" y="137" width="150" height="28" rx="5" fill="#ffffff" stroke="#237d68"/>
    <text x="187" y="156" text-anchor="middle" font-size="14" fill="#237d68">D(z)：z 可逆</text>

    <rect x="438" y="102" width="234" height="76" rx="6" fill="#f7e9e5" stroke="#a64b35"/>
    <text x="555" y="124" text-anchor="middle" font-size="16" fill="#8d3f2e">U₁ = Spec C[w]</text>
    <rect x="458" y="137" width="150" height="28" rx="5" fill="#ffffff" stroke="#237d68"/>
    <text x="533" y="156" text-anchor="middle" font-size="14" fill="#237d68">D(w)：w 可逆</text>
    <circle cx="643" cy="151" r="7" fill="#a64b35"/>
    <text x="643" y="170" text-anchor="middle" font-size="11" fill="#8d3f2e">w=0</text>

    <path d="M288 125H426M426 125L414 118M426 125L414 132" fill="none" stroke="#286fa7" stroke-width="2.5"/>
    <text x="357" y="116" text-anchor="middle" font-size="13" fill="#286fa7">点：w = 1/z</text>
    <path d="M432 164H294M294 164L306 157M294 164L306 171" fill="none" stroke="#237d68" stroke-width="2.5"/>
    <text x="363" y="188" text-anchor="middle" font-size="13" fill="#237d68">函数拉回：w ↦ z⁻¹</text>
    <text x="360" y="220" text-anchor="middle" font-size="15" fill="#25394a">Γ(P¹,O) = C，但 z=0 与 w=0 仍是不同闭点</text>

    <rect x="28" y="252" width="322" height="210" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="48" y="281" font-size="18" font-weight="600" fill="#25394a">双原点直线：改成 w = z</text>
    <line x1="69" y1="326" x2="291" y2="326" stroke="#286fa7" stroke-width="3"/>
    <circle cx="69" cy="326" r="8" fill="#a64b35"/>
    <text x="69" y="350" text-anchor="middle" font-size="12" fill="#8d3f2e">0₀</text>
    <text x="180" y="316" text-anchor="middle" font-size="13" fill="#286fa7">第一张 A¹</text>
    <line x1="69" y1="379" x2="291" y2="379" stroke="#237d68" stroke-width="3"/>
    <circle cx="69" cy="379" r="8" fill="#a64b35"/>
    <text x="69" y="403" text-anchor="middle" font-size="12" fill="#8d3f2e">0₁</text>
    <text x="180" y="369" text-anchor="middle" font-size="13" fill="#237d68">第二张 A¹</text>
    <path d="M116 338C145 356 216 356 246 338" fill="none" stroke="#66727c" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="181" y="355" text-anchor="middle" font-size="12" fill="#66727c">非零部分同坐标识别</text>
    <rect x="48" y="416" width="282" height="31" rx="5" fill="#fff2cc"/>
    <text x="189" y="429" text-anchor="middle" font-size="12" fill="#6f5712">C[z,w] → C[t,t⁻¹] 的像仅 C[t]</text>
    <text x="189" y="442" text-anchor="middle" font-size="12" fill="#6f5712">缺少 t⁻¹，所以分离性判据失败</text>

    <rect x="370" y="252" width="322" height="210" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="390" y="281" font-size="18" font-weight="600" fill="#25394a">F<tspan baseline-shift="sub" font-size="12">d</tspan>：两张局部公式必须相容</text>

    <rect x="397" y="301" width="92" height="38" rx="5" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="443" y="325" text-anchor="middle" font-size="15" fill="#245f8d">D(z)：z</text>
    <rect x="573" y="301" width="92" height="38" rx="5" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="619" y="325" text-anchor="middle" font-size="15" fill="#245f8d">D(w)：w</text>
    <path d="M497 320H565M565 320L554 314M565 320L554 326" fill="none" stroke="#66727c" stroke-width="2"/>
    <text x="531" y="310" text-anchor="middle" font-size="12" fill="#66727c">w=1/z</text>

    <rect x="397" y="382" width="92" height="38" rx="5" fill="#eef4ee" stroke="#237d68"/>
    <text x="443" y="406" text-anchor="middle" font-size="15" fill="#237d68">D(u)：u</text>
    <rect x="573" y="382" width="92" height="38" rx="5" fill="#eef4ee" stroke="#237d68"/>
    <text x="619" y="406" text-anchor="middle" font-size="15" fill="#237d68">D(v)：v</text>
    <path d="M497 401H565M565 401L554 395M565 401L554 407" fill="none" stroke="#66727c" stroke-width="2"/>
    <text x="531" y="391" text-anchor="middle" font-size="12" fill="#66727c">v=1/u</text>

    <path d="M443 345V373M443 373L437 362M443 373L449 362" fill="none" stroke="#286fa7" stroke-width="2.5"/>
    <text x="414" y="364" text-anchor="middle" font-size="13" fill="#286fa7">u=zᵈ</text>
    <path d="M619 345V373M619 373L613 362M619 373L625 362" fill="none" stroke="#a64b35" stroke-width="2.5"/>
    <text x="650" y="364" text-anchor="middle" font-size="13" fill="#a64b35">v=wᵈ</text>
    <text x="531" y="445" text-anchor="middle" font-size="14" fill="#25394a">wᵈ = z⁻ᵈ = (zᵈ)⁻¹</text>

    <text x="360" y="486" text-anchor="middle" font-size="13" fill="#66727c">闭点示意只帮助定位；粘合、态射与分离性都由坐标环检验</text>
  </g>
</svg>
