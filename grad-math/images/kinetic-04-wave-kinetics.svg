<svg xmlns="http://www.w3.org/2000/svg" width="440" height="525" viewBox="0 0 440 525" role="img" aria-labelledby="title desc"><title id="title">共振通道同时配平两种量</title><desc id="desc">矩形四模波矢满足对角和相等，频率分别为1、2、3、4。共振通道保持谱占据总和与频率加权能量。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="context-stroke"/></marker></defs><rect width="440" height="525" fill="#faf9f5"/><g font-family="system-ui, sans-serif"><text x="220" y="34" font-size="24" fill="#253349" text-anchor="middle">共振通道同时配平两种量</text><text x="220" y="72" font-size="21" fill="#253349" text-anchor="middle">ω(k) = 1 + kₓ² + 2kᵧ²</text><path d="M85,155L350,155" fill="none" stroke="#c2cbd6" stroke-width="2"/><path d="M85,335L350,335" fill="none" stroke="#c2cbd6" stroke-width="2"/><path d="M85,155L85,335" fill="none" stroke="#c2cbd6" stroke-width="2"/><path d="M350,155L350,335" fill="none" stroke="#c2cbd6" stroke-width="2"/><path d="M85,335L350,155" fill="none" stroke="#3978bd" stroke-width="3"/><path d="M350,335L85,155" fill="none" stroke="#b75438" stroke-width="3" stroke-dasharray="7 5"/><circle cx="85" cy="335" r="7" fill="#3978bd"/><circle cx="350" cy="335" r="7" fill="#b75438"/><circle cx="85" cy="155" r="7" fill="#b75438"/><circle cx="350" cy="155" r="7" fill="#3978bd"/><text x="35" y="371" font-size="20" fill="#3978bd" text-anchor="start">1：(0,0)</text><text x="281" y="371" font-size="20" fill="#b75438" text-anchor="start">2：(1,0)</text><text x="35" y="126" font-size="20" fill="#b75438" text-anchor="start">3：(0,1)</text><text x="281" y="126" font-size="20" fill="#3978bd" text-anchor="start">4：(1,1)</text><rect x="140" y="219" width="155" height="57" rx="10" fill="#edf2f8"/><text x="218" y="254" font-size="20" fill="#253349" text-anchor="middle">1 + 4 ↔ 2 + 3</text><text x="220" y="418" font-size="21" fill="#253349" text-anchor="middle">频率配平：1 + 4 = 2 + 3</text><text x="220" y="453" font-size="20" fill="#253349" text-anchor="middle">dn₁ = dn₄ = −dn₂ = −dn₃</text><text x="220" y="492" font-size="22" fill="#253349" text-anchor="middle">Σn 与 Σωn 守恒</text></g></svg>