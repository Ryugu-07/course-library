<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">高频共振、重整化与重建的分层机制</title>
  <desc id="desc">上方两条各含正负N方向的实余弦相乘，异号频率配对产生零频，同号配对产生正负二N，说明各自趋零的分布仍可留下非零乘积；这不是离散采样混叠。中部以Bony分解区分低高、高高和高低频，标出正则性和大于零时经典乘积可定义。下方先经模型和重整化保存联合信息，再由重建算子把相容局部展开变成实际分布。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5e6c73"/>
    </marker>
  </defs>
  <rect width="720" height="520" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#243746">
    <text x="28" y="36" font-size="23">异号高频配对产生零频：乘积需要额外账本</text>

    <rect x="24" y="56" width="196" height="145" rx="8" fill="#e9f3f6" stroke="#28758a"/>
    <text x="42" y="82" font-size="16" font-weight="600" fill="#1f6578">两个输入</text>
    <path d="M42 124 C54 91 66 157 78 124 S102 91 114 124 S138 157 150 124 S174 91 198 124" fill="none" stroke="#28758a" stroke-width="2"/>
    <path d="M42 156 C54 123 66 189 78 156 S102 123 114 156 S138 189 150 156 S174 123 198 156" fill="none" stroke="#b15c2f" stroke-width="2"/>
    <text x="42" y="188" font-size="12" fill="#59666d">示意：N→∞，各自→0分布</text>

    <line x1="230" y1="128" x2="282" y2="128" stroke="#5e6c73" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="256" y="115" text-anchor="middle" font-size="12">相乘</text>

    <rect x="292" y="56" width="404" height="145" rx="8" fill="#f7eee8" stroke="#b15c2f"/>
    <text x="310" y="82" font-size="16" font-weight="600" fill="#984c27">输出拆成两条频率路径</text>
    <rect x="310" y="95" width="368" height="44" rx="5" fill="#f0dcd0"/>
    <text x="326" y="113" font-size="13">(+N) + (−N) → 0</text>
    <text x="326" y="132" font-size="12">异号配对：零频可能留下非零常数</text>
    <rect x="310" y="146" width="368" height="44" rx="5" fill="#f5e7c8"/>
    <text x="326" y="164" font-size="13">(+N) + (+N) → +2N；负频率同理</text>
    <text x="326" y="183" font-size="12">同号配对：固定光滑探针下，高频趋零</text>

    <rect x="24" y="220" width="672" height="113" rx="8" fill="#fff" stroke="#c8d0d5"/>
    <text x="44" y="247" font-size="16" font-weight="600">Bony 频率账本</text>
    <rect x="55" y="267" width="156" height="38" rx="6" fill="#e8f2f5" stroke="#28758a"/>
    <text x="133" y="291" text-anchor="middle" font-size="14">低 × 高：f ≺ g</text>
    <rect x="282" y="267" width="156" height="38" rx="6" fill="#f7e9e4" stroke="#b15c2f"/>
    <text x="360" y="291" text-anchor="middle" font-size="14">高 × 高：f ∘ g</text>
    <rect x="509" y="267" width="156" height="38" rx="6" fill="#eef1e8" stroke="#6f7d35"/>
    <text x="587" y="291" text-anchor="middle" font-size="14">高 × 低：f ≻ g</text>
    <text x="360" y="323" text-anchor="middle" font-size="12" fill="#984c27">共振层可求和的经典门槛：α + β &gt; 0</text>

    <rect x="24" y="352" width="203" height="116" rx="8" fill="#eef1e8" stroke="#6f7d35"/>
    <text x="42" y="379" font-size="15" font-weight="600" fill="#5d6b2d">模型数据</text>
    <text x="42" y="405" font-size="13">局部抽象符号</text>
    <text x="42" y="428" font-size="13">基点变换 Γ</text>
    <text x="42" y="451" font-size="12" fill="#59666d">保存联合高频信息</text>

    <line x1="237" y1="410" x2="280" y2="410" stroke="#5e6c73" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="259" y="397" text-anchor="middle" font-size="11">必要时</text>

    <rect x="290" y="352" width="140" height="116" rx="8" fill="#f7eee8" stroke="#b15c2f"/>
    <text x="360" y="379" text-anchor="middle" font-size="15" font-weight="600" fill="#984c27">重整化</text>
    <text x="360" y="407" text-anchor="middle" font-size="13">调整模型</text>
    <text x="360" y="430" text-anchor="middle" font-size="13">加入反项</text>
    <text x="360" y="451" text-anchor="middle" font-size="12" fill="#59666d">先证明模型收敛</text>

    <line x1="440" y1="410" x2="483" y2="410" stroke="#5e6c73" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="493" y="352" width="203" height="116" rx="8" fill="#e9f3f6" stroke="#28758a"/>
    <text x="511" y="379" font-size="15" font-weight="600" fill="#1f6578">重建 R</text>
    <text x="511" y="405" font-size="13">相容局部展开</text>
    <text x="511" y="428" font-size="13">→ 实际分布</text>
    <text x="511" y="451" font-size="12" fill="#59666d">误差尺度 λ^γ</text>

    <rect x="24" y="487" width="672" height="20" rx="5" fill="#fff0c9"/>
    <text x="360" y="501" text-anchor="middle" font-size="12" fill="#6d5614">重建合成已有的相容描述；它不替任意分布自动定义乘积</text>
  </g>
</svg>
