<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">Laurent 指数缺口</title><desc id="desc">指数小于等于负三由第一侧消去，大于等于零由另一侧消去，只剩负二和负一两个独立类。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="380" rx="12" fill="#faf9f5"/>
<g font-family="system-ui, sans-serif"><text x="25" y="38" font-size="24" fill="#25394a" text-anchor="start">O(−3)：两端可消去，中间留下类</text><text x="25" y="90" font-size="22" fill="#286fa7" text-anchor="start">U₁ 提供 j≤−3</text><text x="350" y="90" font-size="22" fill="#237d68" text-anchor="start">U₀ 提供 j≥0</text><path d="M35 170L565 170" fill="none" stroke="#25394a" stroke-width="3" stroke-dasharray=""/><circle cx="50" cy="170" r="9" fill="#286fa7"/><text x="50" y="207" font-size="20" fill="#25394a" text-anchor="middle">-5</text><circle cx="112" cy="170" r="9" fill="#286fa7"/><text x="112" y="207" font-size="20" fill="#25394a" text-anchor="middle">-4</text><circle cx="174" cy="170" r="9" fill="#286fa7"/><text x="174" y="207" font-size="20" fill="#25394a" text-anchor="middle">-3</text><circle cx="236" cy="170" r="9" fill="#a64b35"/><text x="236" y="207" font-size="20" fill="#25394a" text-anchor="middle">-2</text><circle cx="298" cy="170" r="9" fill="#a64b35"/><text x="298" y="207" font-size="20" fill="#25394a" text-anchor="middle">-1</text><circle cx="360" cy="170" r="9" fill="#237d68"/><text x="360" y="207" font-size="20" fill="#25394a" text-anchor="middle">0</text><circle cx="422" cy="170" r="9" fill="#237d68"/><text x="422" y="207" font-size="20" fill="#25394a" text-anchor="middle">1</text><circle cx="484" cy="170" r="9" fill="#237d68"/><text x="484" y="207" font-size="20" fill="#25394a" text-anchor="middle">2</text><circle cx="546" cy="170" r="9" fill="#237d68"/><text x="546" y="207" font-size="20" fill="#25394a" text-anchor="middle">3</text><rect x="170" y="240" width="265" height="65" rx="12" fill="white" stroke="#a64b35" stroke-width="2"/><text x="302" y="282" font-size="25" fill="#a64b35" text-anchor="middle">[z⁻²] 与 [z⁻¹]</text><text x="25" y="345" font-size="21" fill="#25394a" text-anchor="start">h⁰ = 0；h¹ = 2。图上的轴标是指数 j。</text></g></svg>
