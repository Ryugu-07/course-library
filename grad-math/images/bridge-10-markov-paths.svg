<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">终端势向后传播，桥概率向前流动</title>
  <desc id="desc">三个时刻从左到右排列。上方绿色势函数从终点g2经K向左递推为g1和g0；下方蓝色概率从初始mu经两个Doob扭转转移向右流到中间边缘和终边缘nu。中央公式说明扭转转移使用相邻势函数之比且行和为一。</desc>
  <rect width="720" height="420" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="40" font-size="25" fill="#25394a">同一座桥上的两股信息流</text>
    <text x="123" y="76" text-anchor="middle" font-size="17" fill="#5b6570">t = 0</text>
    <text x="360" y="76" text-anchor="middle" font-size="17" fill="#5b6570">t = 1</text>
    <text x="597" y="76" text-anchor="middle" font-size="17" fill="#5b6570">t = 2</text>

    <text x="26" y="116" font-size="18" fill="#237d68">势向后传</text>
    <rect x="72" y="132" width="102" height="54" rx="7" fill="#eef4ee" stroke="#237d68"/>
    <text x="123" y="166" text-anchor="middle" font-size="21" fill="#237d68">g₀ = Kg₁</text>
    <rect x="309" y="132" width="102" height="54" rx="7" fill="#eef4ee" stroke="#237d68"/>
    <text x="360" y="166" text-anchor="middle" font-size="21" fill="#237d68">g₁ = Kg₂</text>
    <rect x="537" y="132" width="120" height="54" rx="7" fill="#eef4ee" stroke="#237d68"/>
    <text x="597" y="166" text-anchor="middle" font-size="21" fill="#237d68">g₂ = (1,w)</text>
    <path d="M532 159H426M426 159L440 150M426 159L440 168" fill="none" stroke="#237d68" stroke-width="3"/>
    <path d="M302 159H189M189 159L203 150M189 159L203 168" fill="none" stroke="#237d68" stroke-width="3"/>

    <rect x="153" y="207" width="414" height="58" rx="7" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="360" y="232" text-anchor="middle" font-size="19" fill="#25394a">K*ₜ(i,j) = Kᵢⱼ gₜ₊₁(j) / gₜ(i)</text>
    <text x="360" y="255" text-anchor="middle" font-size="17" fill="#a64b35">gₜ = Kgₜ₊₁　保证每一行之和为 1</text>

    <text x="26" y="308" font-size="18" fill="#286fa7">概率向前流</text>
    <rect x="72" y="326" width="102" height="54" rx="7" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="123" y="360" text-anchor="middle" font-size="21" fill="#286fa7">P₀ = μ</text>
    <rect x="309" y="326" width="102" height="54" rx="7" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="360" y="360" text-anchor="middle" font-size="21" fill="#286fa7">P₁</text>
    <rect x="537" y="326" width="120" height="54" rx="7" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="597" y="360" text-anchor="middle" font-size="21" fill="#286fa7">P₂ = ν</text>
    <path d="M181 353H294M294 353L280 344M294 353L280 362" fill="none" stroke="#286fa7" stroke-width="3"/>
    <path d="M418 353H522M522 353L508 344M522 353L508 362" fill="none" stroke="#286fa7" stroke-width="3"/>
    <text x="241" y="338" text-anchor="middle" font-size="16" fill="#286fa7">K*₀</text>
    <text x="474" y="338" text-anchor="middle" font-size="16" fill="#286fa7">K*₁</text>
    <path d="M123 320L123 193" fill="none" stroke="#c9d1d8" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M360 320L360 272" fill="none" stroke="#c9d1d8" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M597 320L597 193" fill="none" stroke="#c9d1d8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="360" y="406" text-anchor="middle" font-size="17" fill="#5b6570">向后势改变转移，向前演化给出终边缘；两者不是同一次矩阵乘法。</text>
  </g>
</svg>
