5" r="6" fill="#24313a"/><circle cx="260" cy="120" r="6" fill="#24313a"/><text x="419" y="275" class="">p=(1,0)</text><text x="188" y="104" class="">q=(0,1)</text><text x="420" y="160" class="small">短弧 π/2</text><text x="76" y="423" class="small">长弧 3π/2</text><text x="66" y="473" class="small">俯视单位大圆；两条弧都可常速走过。</text><text x="545" y="116" class="">仿射方程：加速度只有球面法向分量</text><text x="565" y="160" class="">γ̈ + |γ̇|² γ = 0</text><text x="545" y="222" class="">端点距离另算：d(p,q)=arccos(p·q)=π/2</text><text x="545" y="295" class="">直线也可能用了非仿射参数</text><text x="565" y="339" class="">η(τ)=(τ²,0)，1 ≤ τ ≤ 2</text><text x="565" y="381" class="small">η̈=(2,0) ≠ 0，但轨迹仍是最短线段。</text><text x="545" y="441" class="small">坐标是否可用？参数是否仿射？是否全局最短？</text><text x="545" y="477" class="small">这三个问题分别计算，不能只看路径形状。</text></svg>
