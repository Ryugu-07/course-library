<svg xmlns="http://www.w3.org/2000/svg" width="440" height="510" viewBox="0 0 440 510" role="img" aria-labelledby="title desc"><title id="title">散射改变分配，守恒总量</title><desc id="desc">速度矢量图。入射v=(2,0)，另一球静止；45度法向碰撞后v=(1,-1)、w=(1,1)。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="context-stroke"/></marker></defs><rect width="440" height="510" fill="#faf9f5"/><g font-family="system-ui, sans-serif"><text x="220" y="34" font-size="24" fill="#253349" text-anchor="middle">散射改变分配，守恒总量</text><text x="220" y="70" font-size="21" fill="#253349" text-anchor="middle">u = 2，法向 θ = 45°</text><path d="M65,245L405,245" fill="none" stroke="#ccd4de" stroke-width="1"/><path d="M180,100L180,382" fill="none" stroke="#ccd4de" stroke-width="1"/><path d="M180,245L360,245" fill="none" stroke="#b75438" stroke-width="3" marker-end="url(#arrow)"/><text x="245" y="274" font-size="20" fill="#b75438" text-anchor="start">入射 (2, 0)</text><path d="M180,245L270,335" fill="none" stroke="#3978bd" stroke-width="3" marker-end="url(#arrow)"/><text x="229" y="367" font-size="20" fill="#3978bd" text-anchor="start">v′ = (1, −1)</text><path d="M180,245L270,155" fill="none" stroke="#20826c" stroke-width="3" marker-end="url(#arrow)"/><text x="222" y="136" font-size="20" fill="#20826c" text-anchor="start">w′ = (1, 1)</text><path d="M90,335L270,155" fill="none" stroke="#9a80af" stroke-width="2" stroke-dasharray="6 5"/><text x="31" y="337" font-size="20" fill="#8057a0" text-anchor="start">法向 n</text><circle cx="180" cy="245" r="5" fill="#253349"/><rect x="30" y="400" width="380" height="77" rx="10" fill="#edf2f8"/><text x="220" y="431" font-size="21" fill="#253349" text-anchor="middle">动量：(2, 0) → (2, 0)</text><text x="220" y="462" font-size="22" fill="#253349" text-anchor="middle">动能：2 → 1 + 1</text></g></svg>