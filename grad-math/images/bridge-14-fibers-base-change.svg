<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">平方映射的闭纤维与平方根基变换</title>
  <desc id="desc">上方比较实参数负一、零、正一在复数底域上的纤维。负一和正一各有两个不同根，零只有一个支撑点但带平方零无穷小。下方显示基变换后x等于s与x等于负s两条分支在原点相交，只有删去s等于零后坐标环才分裂为直积。</desc>
  <rect width="720" height="500" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="38" font-size="25" fill="#25394a">点会合并，纤维的代数长度不必消失</text>

    <rect x="28" y="58" width="664" height="205" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="48" y="86" font-size="18" font-weight="600" fill="#25394a">闭纤维：C[x] / (x² − a)</text>
    <text x="672" y="86" text-anchor="end" font-size="14" fill="#66727c">每个坐标环的 C-维数都是 2</text>

    <rect x="52" y="102" width="184" height="139" rx="7" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="144" y="124" text-anchor="middle" font-size="16" fill="#245f8d">a = −1</text>
    <line x1="88" y1="180" x2="200" y2="180" stroke="#aab4bd" stroke-width="1.5"/>
    <line x1="144" y1="139" x2="144" y2="221" stroke="#aab4bd" stroke-width="1.5"/>
    <text x="204" y="185" font-size="11" fill="#66727c">Re</text>
    <text x="150" y="145" font-size="11" fill="#66727c">Im</text>
    <circle cx="144" cy="151" r="7" fill="#286fa7"/>
    <circle cx="144" cy="209" r="7" fill="#286fa7"/>
    <text x="159" y="155" font-size="13" fill="#245f8d">+i</text>
    <text x="159" y="214" font-size="13" fill="#245f8d">−i</text>
    <text x="144" y="234" text-anchor="middle" font-size="13" fill="#25394a">两个约化复点</text>

    <rect x="268" y="102" width="184" height="139" rx="7" fill="#f7e9e5" stroke="#a64b35"/>
    <text x="360" y="124" text-anchor="middle" font-size="16" fill="#8d3f2e">a = 0</text>
    <line x1="304" y1="180" x2="416" y2="180" stroke="#aab4bd" stroke-width="1.5"/>
    <line x1="360" y1="139" x2="360" y2="221" stroke="#aab4bd" stroke-width="1.5"/>
    <circle cx="360" cy="180" r="14" fill="#ffffff" stroke="#a64b35" stroke-width="5"/>
    <circle cx="360" cy="180" r="4" fill="#a64b35"/>
    <text x="380" y="171" font-size="12" fill="#8d3f2e">环中 x̄ ≠ 0</text>
    <text x="380" y="189" font-size="12" fill="#8d3f2e">x̄² = 0</text>
    <text x="360" y="234" text-anchor="middle" font-size="13" fill="#25394a">一个支撑点，长度 2</text>

    <rect x="484" y="102" width="184" height="139" rx="7" fill="#eef4ee" stroke="#237d68"/>
    <text x="576" y="124" text-anchor="middle" font-size="16" fill="#237d68">a = 1</text>
    <line x1="520" y1="180" x2="632" y2="180" stroke="#aab4bd" stroke-width="1.5"/>
    <line x1="576" y1="139" x2="576" y2="221" stroke="#aab4bd" stroke-width="1.5"/>
    <circle cx="539" cy="180" r="7" fill="#237d68"/>
    <circle cx="613" cy="180" r="7" fill="#237d68"/>
    <text x="532" y="166" text-anchor="middle" font-size="13" fill="#237d68">−1</text>
    <text x="620" y="166" text-anchor="middle" font-size="13" fill="#237d68">+1</text>
    <text x="576" y="234" text-anchor="middle" font-size="13" fill="#25394a">两个约化复点</text>

    <rect x="28" y="280" width="664" height="184" rx="8" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="48" y="309" font-size="18" font-weight="600" fill="#25394a">基变换 t = s²：平方根变成两条分支</text>

    <rect x="48" y="326" width="284" height="119" rx="6" fill="#f7f8f8" stroke="#c9d1d8"/>
    <line x1="74" y1="390" x2="307" y2="390" stroke="#66727c" stroke-width="1.5"/>
    <line x1="190" y1="430" x2="190" y2="340" stroke="#66727c" stroke-width="1.5"/>
    <text x="308" y="405" font-size="12" fill="#66727c">s</text>
    <text x="199" y="347" font-size="12" fill="#66727c">x</text>
    <line x1="102" y1="430" x2="278" y2="350" stroke="#286fa7" stroke-width="4"/>
    <line x1="102" y1="350" x2="278" y2="430" stroke="#a64b35" stroke-width="4"/>
    <circle cx="190" cy="390" r="7" fill="#25394a"/>
    <text x="254" y="342" font-size="13" fill="#245f8d">x = s</text>
    <text x="252" y="441" font-size="13" fill="#8d3f2e">x = −s</text>
    <text x="87" y="443" font-size="12" fill="#66727c">两支在原点相交</text>

    <rect x="354" y="326" width="318" height="119" rx="6" fill="#ffffff" stroke="#c9d1d8"/>
    <text x="372" y="350" font-size="14" fill="#25394a">总环：C[s,x] / ((x−s)(x+s))</text>
    <text x="372" y="376" font-size="14" fill="#a64b35">在 s=0：两理想不互素，不能写成直积</text>
    <text x="372" y="402" font-size="14" fill="#237d68">在 s≠0：2s 可逆，CRT 分裂成两份</text>
    <text x="372" y="428" font-size="14" fill="#286fa7">特殊纤维：C[x]/(x²)，仍是长度 2 双点</text>

    <rect x="28" y="476" width="664" height="16" rx="4" fill="#fff2cc"/>
    <text x="360" y="488" text-anchor="middle" font-size="12" fill="#6f5712">根轨迹只画闭点支撑；幂零元、泛点与局部环必须从坐标环读取</text>
  </g>
</svg>
