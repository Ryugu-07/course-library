<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1330" viewBox="0 0 1100 1330" role="img" aria-labelledby="title desc"><title id="title">尾部量词、终点联合账与上穿策略</title><desc id="desc">尖峰模型四个时刻的高度概率和固定阈值尾部；B等于2的全部非零当前终点联合概率；五点路径的可预测持仓与上穿收益。</desc><rect width="1100" height="1330" fill="#faf7ef"/><style>text{font-family:system-ui,sans-serif;fill:#253345}.h{font-size:24px;font-weight:650}.l{font-size:18px}.s{font-size:16px}.grid{stroke:#cdd3d7;stroke-width:1}</style>
<text x="40" y="40" class="h" text-anchor="start">① 尖峰越高、概率越小：两个因子的乘积仍为 1</text>
<text x="40" y="77" class="l" text-anchor="start">固定阈值 K=256，严格使用 Xₙ&gt;K。每一列保留自己的单位与含义。</text>
<text x="120" y="126" class="l" text-anchor="middle">时刻 n</text>
<text x="320" y="126" class="l" text-anchor="middle">尖峰高度 2ⁿ</text>
<text x="540" y="126" class="l" text-anchor="middle">尖峰概率 2⁻ⁿ</text>
<text x="740" y="126" class="l" text-anchor="middle">期望 EXₙ</text>
<text x="930" y="126" class="l" text-anchor="middle">尾部期望</text>
<g data-spike-row="0">
<text x="120" y="172" class="l" text-anchor="middle">0</text>
<text x="320" y="172" class="l" text-anchor="middle">1</text>
<text x="540" y="172" class="l" text-anchor="middle">1</text>
<text x="740" y="172" class="l" text-anchor="middle">1</text>
<text x="930" y="172" class="l" text-anchor="middle">0</text>
</g>
<line x1="65" x2="1035" y1="189" y2="189" class="grid"/>
<g data-spike-row="4">
<text x="120" y="220" class="l" text-anchor="middle">4</text>
<text x="320" y="220" class="l" text-anchor="middle">16</text>
<text x="540" y="220" class="l" text-anchor="middle">1/16</text>
<text x="740" y="220" class="l" text-anchor="middle">1</text>
<text x="930" y="220" class="l" text-anchor="middle">0</text>
</g>
<line x1="65" x2="1035" y1="237" y2="237" class="grid"/>
<g data-spike-row="8">
<text x="120" y="268" class="l" text-anchor="middle">8</text>
<text x="320" y="268" class="l" text-anchor="middle">256</text>
<text x="540" y="268" class="l" text-anchor="middle">1/256</text>
<text x="740" y="268" class="l" text-anchor="middle">1</text>
<text x="930" y="268" class="l" text-anchor="middle">0</text>
</g>
<line x1="65" x2="1035" y1="285" y2="285" class="grid"/>
<g data-spike-row="12">
<text x="120" y="316" class="l" text-anchor="middle">12</text>
<text x="320" y="316" class="l" text-anchor="middle">4096</text>
<text x="540" y="316" class="l" text-anchor="middle">1/4096</text>
<text x="740" y="316" class="l" text-anchor="middle">1</text>
<text x="930" y="316" class="l" text-anchor="middle">1</text>
</g>
<line x1="65" x2="1035" y1="333" y2="333" class="grid"/>
<text x="40" y="366" class="l" text-anchor="start">截至 n=8 的尾部最大值为 0；但对所有时刻取上确界，仍是 1。</text>
<text x="40" y="398" class="s" text-anchor="start">UI 要求同一个 K 同时控制所有 n，不是让 K 追着当前尖峰跑。</text>
<text x="40" y="461" class="h" text-anchor="start">② B=2，n=2：当前状态与未来终点的全部非零联合质量</text>
<rect x="45" y="495" width="230" height="70" rx="8" fill="#eaf0f6"/>
<text x="160" y="523" class="l" text-anchor="middle">当前 X₂=-2</text>
<text x="160" y="550" class="s" text-anchor="middle">概率 1/4</text>
<rect x="435" y="495" width="230" height="70" rx="8" fill="#eaf0f6"/>
<text x="550" y="523" class="l" text-anchor="middle">当前 X₂=0</text>
<text x="550" y="550" class="s" text-anchor="middle">概率 1/2</text>
<rect x="825" y="495" width="230" height="70" rx="8" fill="#eaf0f6"/>
<text x="940" y="523" class="l" text-anchor="middle">当前 X₂=2</text>
<text x="940" y="550" class="s" text-anchor="middle">概率 1/4</text>
<rect x="240" y="713" width="220" height="70" rx="8" fill="#f3ecdb"/>
<text x="350" y="742" class="l" text-anchor="middle">终点 Z=-2</text>
<text x="350" y="769" class="s" text-anchor="middle">总概率 1/2</text>
<rect x="640" y="713" width="220" height="70" rx="8" fill="#f3ecdb"/>
<text x="750" y="742" class="l" text-anchor="middle">终点 Z=2</text>
<text x="750" y="769" class="s" text-anchor="middle">总概率 1/2</text>
<line data-joint="-2,-2" x1="160" x2="350" y1="565" y2="713" stroke="#3979b8" stroke-width="2.5"/>
<rect x="197.0" y="612" width="116" height="44" rx="5" fill="#faf7ef"/>
<text x="255.0" y="632" class="s" text-anchor="middle">联合概率 1/4</text>
<text x="255.0" y="653" class="s" text-anchor="middle">距离 0</text>
<line data-joint="0,-2" x1="550" x2="350" y1="565" y2="713" stroke="#3979b8" stroke-width="2.5"/>
<rect x="392.0" y="612" width="116" height="44" rx="5" fill="#faf7ef"/>
<text x="450.0" y="632" class="s" text-anchor="middle">联合概率 1/4</text>
<text x="450.0" y="653" class="s" text-anchor="middle">距离 2</text>
<line data-joint="0,2" x1="550" x2="750" y1="565" y2="713" stroke="#3979b8" stroke-width="2.5"/>
<rect x="592.0" y="612" width="116" height="44" rx="5" fill="#faf7ef"/>
<text x="650.0" y="632" class="s" text-anchor="middle">联合概率 1/4</text>
<text x="650.0" y="653" class="s" text-anchor="middle">距离 2</text>
<line data-joint="2,2" x1="940" x2="750" y1="565" y2="713" stroke="#3979b8" stroke-width="2.5"/>
<rect x="787.0" y="612" width="116" height="44" rx="5" fill="#faf7ef"/>
<text x="845.0" y="632" class="s" text-anchor="middle">联合概率 1/4</text>
<text x="845.0" y="653" class="s" text-anchor="middle">距离 0</text>
<text x="40" y="823" class="l" text-anchor="start">L¹ 距离 = (0+2+2+0)/4 = 1；未吸收概率 = 1/2。</text>
<text x="40" y="854" class="s" text-anchor="start">当前 0 的两个终点条件概率各 1/2；联合概率还要乘当前质量 1/2。</text>
<text x="40" y="913" class="h" text-anchor="start">③ 先决定持仓，再看下一步：a=0，b=2</text>
<line x1="145" x2="945" y1="1165" y2="1165" class="grid"/>
<text x="125" y="1170" class="s" text-anchor="end">-1</text>
<line x1="145" x2="945" y1="1100" y2="1100" class="grid"/>
<text x="125" y="1105" class="s" text-anchor="end">0</text>
<line x1="145" x2="945" y1="1035" y2="1035" class="grid"/>
<text x="125" y="1040" class="s" text-anchor="end">1</text>
<line x1="145" x2="945" y1="970" y2="970" class="grid"/>
<text x="125" y="975" class="s" text-anchor="end">2</text>
<polyline id="crossing-path" points="145,1100 345,970 545,1100 745,970 945,1165" fill="none" stroke="#3979b8" stroke-width="2.5"/>
<line data-held="1" x1="145" y1="1100" x2="345" y2="970" stroke="#af731a" stroke-width="5"/>
<line data-held="3" x1="545" y1="1100" x2="745" y2="970" stroke="#af731a" stroke-width="5"/>
<circle data-path="0" cx="145" cy="1100" r="4" fill="#3979b8"/>
<text x="145" y="1200" class="s" text-anchor="middle">0</text>
<circle data-path="1" cx="345" cy="970" r="4" fill="#3979b8"/>
<text x="345" y="1200" class="s" text-anchor="middle">1</text>
<circle data-path="2" cx="545" cy="1100" r="4" fill="#3979b8"/>
<text x="545" y="1200" class="s" text-anchor="middle">2</text>
<circle data-path="3" cx="745" cy="970" r="4" fill="#3979b8"/>
<text x="745" y="1200" class="s" text-anchor="middle">3</text>
<circle data-path="4" cx="945" cy="1165" r="4" fill="#3979b8"/>
<text x="945" y="1200" class="s" text-anchor="middle">4</text>
<text x="1000" y="1200" class="s" text-anchor="start">时刻</text>
<text x="40" y="1241" class="s" text-anchor="start">本段 H：</text>
<text x="40" y="1272" class="s" text-anchor="start">收益 G：</text>
<text x="145" y="1241" class="s" text-anchor="middle">—</text>
<text x="145" y="1272" class="s" text-anchor="middle">0</text>
<text x="345" y="1241" class="s" text-anchor="middle">1</text>
<text x="345" y="1272" class="s" text-anchor="middle">2</text>
