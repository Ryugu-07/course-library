<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1220" viewBox="0 0 1100 1220" role="img" aria-labelledby="title desc"><title id="title">信息分组、有限停止与公平策略的风险</title><desc id="desc">四个等概率目标的分组平均；首达加一在T等于6时的全部终点概率；固定与封顶倍增策略的理论方差。</desc><rect width="1100" height="1220" fill="#faf7ef"/><style>text{font-family:system-ui,sans-serif;fill:#253345}.h{font-size:24px;font-weight:650}.l{font-size:18px}.s{font-size:16px}.grid{stroke:#cdd3d7;stroke-width:1}</style>
<text x="40" y="40" class="h" text-anchor="start">① 信息把结果分组：每组使用概率加权平均</text>
<text x="40" y="75" class="l" text-anchor="start">四种结果各有概率 1/4。X 为蓝柱，给定组后的预测 Z 为金色横线。</text>
<rect x="65" y="102" width="130" height="236" rx="8" fill="#eaf0f6"/>
<rect data-x="0" x="105" y="290" width="50" height="0" fill="#3979b8"/>
<line data-z="0" x1="82" x2="178" y1="265" y2="265" stroke="#af731a" stroke-width="3"/>
<text x="130" y="322" class="s" text-anchor="middle">X=0，Z=1</text>
<rect x="315" y="102" width="130" height="236" rx="8" fill="#eaf0f6"/>
<rect data-x="1" x="355" y="240" width="50" height="50" fill="#3979b8"/>
<line data-z="1" x1="332" x2="428" y1="265" y2="265" stroke="#af731a" stroke-width="3"/>
<text x="380" y="322" class="s" text-anchor="middle">X=2，Z=1</text>
<rect x="565" y="102" width="130" height="236" rx="8" fill="#f3ecdb"/>
<rect data-x="2" x="605" y="190" width="50" height="100" fill="#3979b8"/>
<line data-z="2" x1="582" x2="678" y1="165" y2="165" stroke="#af731a" stroke-width="3"/>
<text x="630" y="322" class="s" text-anchor="middle">X=4，Z=5</text>
<rect x="815" y="102" width="130" height="236" rx="8" fill="#f3ecdb"/>
<rect data-x="3" x="855" y="140" width="50" height="150" fill="#3979b8"/>
<line data-z="3" x1="832" x2="928" y1="165" y2="165" stroke="#af731a" stroke-width="3"/>
<text x="880" y="322" class="s" text-anchor="middle">X=6，Z=5</text>
<text x="255" y="370" class="l" text-anchor="middle">组 A：平均 1</text>
<text x="755" y="370" class="l" text-anchor="middle">组 B：平均 5</text>
<text x="45" y="410" class="l" text-anchor="start">不知分组：均方误差 5   →   知道分组：均方误差 1   →   知道结果：均方误差 0</text>
<text x="40" y="465" class="h" text-anchor="start">② 首达 +1，在 T=6 截断：全部终点的精确分布</text>
<line x1="100" x2="970" y1="755" y2="755" class="grid"/>
<text x="85" y="760" class="s" text-anchor="end">0</text>
<line x1="100" x2="970" y1="687.5" y2="687.5" class="grid"/>
<text x="85" y="692.5" class="s" text-anchor="end">0.25</text>
<line x1="100" x2="970" y1="620.0" y2="620.0" class="grid"/>
<text x="85" y="625.0" class="s" text-anchor="end">0.5</text>
<line x1="100" x2="970" y1="552.5" y2="552.5" class="grid"/>
<text x="85" y="557.5" class="s" text-anchor="end">0.75</text>
<rect data-terminal="-6" x="126" y="750.78125" width="38" height="4.21875" fill="#3979b8"/>
<text x="145" y="738.78125" class="s" text-anchor="middle">1/64</text>
<text x="145" y="784" class="s" text-anchor="middle">-6</text>
<rect data-terminal="-4" x="336" y="733.90625" width="38" height="21.09375" fill="#3979b8"/>
<text x="355" y="721.90625" class="s" text-anchor="middle">5/64</text>
<text x="355" y="784" class="s" text-anchor="middle">-4</text>
<rect data-terminal="-2" x="546" y="717.03125" width="38" height="37.96875" fill="#3979b8"/>
<text x="565" y="705.03125" class="s" text-anchor="middle">9/64</text>
<text x="565" y="784" class="s" text-anchor="middle">-2</text>
<rect data-terminal="0" x="756" y="733.90625" width="38" height="21.09375" fill="#3979b8"/>
<text x="775" y="721.90625" class="s" text-anchor="middle">5/64</text>
<text x="775" y="784" class="s" text-anchor="middle">0</text>
<rect data-terminal="1" x="861" y="569.375" width="38" height="185.625" fill="#af731a"/>
<text x="880" y="557.375" class="s" text-anchor="middle">11/16</text>
<text x="880" y="784" class="s" text-anchor="middle">1</text>
<text x="970" y="814" class="s" text-anchor="end">停止位置</text>
<text x="40" y="850" class="l" text-anchor="start">已停：44/64 × 1 = 11/16；未停：−11/16。全体均值严格等于 0。</text>
<text x="40" y="880" class="s" text-anchor="start">未停概率 5/16，未停条件均值 −11/5 = −2.2；筛掉未停样本会改变问题。</text>
<text x="40" y="930" class="h" text-anchor="start">③ 公平策略均值都为 0，但方差可以不同</text>
<line x1="145" x2="945" y1="1130.0" y2="1130.0" class="grid"/>
<text x="130" y="1135.0" class="s" text-anchor="end">0</text>
<line x1="145" x2="945" y1="1090.0" y2="1090.0" class="grid"/>
<text x="130" y="1095.0" class="s" text-anchor="end">250</text>
<line x1="145" x2="945" y1="1050.0" y2="1050.0" class="grid"/>
<text x="130" y="1055.0" class="s" text-anchor="end">500</text>
<line x1="145" x2="945" y1="1010.0" y2="1010.0" class="grid"/>
<text x="130" y="1015.0" class="s" text-anchor="end">750</text>
<line x1="145" x2="945" y1="970.0" y2="970.0" class="grid"/>
<text x="130" y="975.0" class="s" text-anchor="end">1000</text>
