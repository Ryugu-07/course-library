<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">路径熵与 Wick 极限的双支学习路线</title>
  <desc id="desc">入口诊断分向两条互不依赖的路线。左侧先枚举八条Markov路径，再用保持端点联合分布但修改条件桥的反例计算KL增量。右侧先用Fourier正交性化简Wick平均，再用尾和判定L2收敛。两支最终汇合为一份写明对象、条件、数值和边界的答案。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#627682"/>
    </marker>
  </defs>
  <rect width="720" height="500" rx="8" fill="#faf9f5"/>
  <g font-family="system-ui, sans-serif" fill="#25394a">
    <text x="28" y="37" font-size="24">两条独立支线，一套可核验的随机推理</text>

    <rect x="224" y="55" width="272" height="53" rx="8" fill="#fff" stroke="#627682"/>
    <text x="360" y="78" text-anchor="middle" font-size="17" font-weight="600">入口诊断</text>
    <text x="360" y="98" text-anchor="middle" font-size="13">先写对象、条件与等式，再选择支线</text>

    <path d="M307 109V127H180V143" fill="none" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M413 109V127H540V143" fill="none" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="38" y="153" width="284" height="90" rx="8" fill="#e8f1f8" stroke="#286fa7"/>
    <text x="56" y="178" font-size="16" font-weight="600" fill="#245f8d">站 1 · 八条路径账本</text>
    <text x="56" y="201" font-size="13">输入：r=1/4，u=1/2，w=2</text>
    <text x="56" y="222" font-size="13">输出：g₀、K*、P(i,j,k)、μ 与 ν</text>

    <rect x="398" y="153" width="284" height="90" rx="8" fill="#eef4ee" stroke="#237d68"/>
    <text x="416" y="178" font-size="16" font-weight="600" fill="#237d68">站 3 · Fourier 正交投影</text>
    <text x="416" y="201" font-size="13">输入：s=1/2，N=2，M=4</text>
    <text x="416" y="222" font-size="12">Wick 点方差 9/2；均方差 25/144</text>

    <path d="M180 246V266" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M540 246V266" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="38" y="274" width="284" height="94" rx="8" fill="#f7e9e5" stroke="#a64b35"/>
    <text x="56" y="299" font-size="16" font-weight="600" fill="#8d3f2e">站 2 · 条件桥反例</text>
    <text x="56" y="322" font-size="13">保持端点表 π，只改 q(j | 0,0)</text>
    <text x="56" y="343" font-size="13">KL 增量：0.116096733</text>
    <text x="56" y="361" font-size="12" fill="#8d3f2e">端点相同不等于路径代价相同</text>

    <rect x="398" y="274" width="284" height="94" rx="8" fill="#fff2cc" stroke="#9a7b22"/>
    <text x="416" y="299" font-size="16" font-weight="600" fill="#6f5712">站 4 · 尾和 Cauchy 判据</text>
    <text x="416" y="322" font-size="12">E|Y_M−Y_N|² = Σ(N&lt;k≤M) k⁻⁴ˢ</text>
    <text x="416" y="343" font-size="13">s &gt; 1/4 当且仅当存在 L² 极限</text>
    <text x="416" y="361" font-size="12" fill="#6f5712">收敛的是标量配对，不是点值</text>

    <rect x="329" y="168" width="62" height="54" rx="7" fill="#fff" stroke="#c9d1d8"/>
    <text x="360" y="190" text-anchor="middle" font-size="11" fill="#66727c">两支独立</text>
    <text x="360" y="209" text-anchor="middle" font-size="11" fill="#66727c">互不先修</text>

    <path d="M180 371V391H311V407" fill="none" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M540 371V391H409V407" fill="none" stroke="#627682" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="118" y="414" width="484" height="56" rx="8" fill="#fff" stroke="#627682"/>
    <text x="360" y="438" text-anchor="middle" font-size="16" font-weight="600">退出答案：对象 + 条件 + 中间账本 + 边界</text>
    <text x="360" y="459" text-anchor="middle" font-size="13">换输入后重算；隔两三天再做一次延迟复测</text>

    <rect x="28" y="480" width="664" height="12" rx="4" fill="#e8ecef"/>
    <text x="360" y="490" text-anchor="middle" font-size="10" fill="#66727c">有限模型提供证据，不替代连续路径理论、随机分布收敛或奇异 SPDE 解理论</text>
  </g>
</svg>
